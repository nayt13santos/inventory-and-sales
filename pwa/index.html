  // date, backgrounding the app or a reload must not cost her the numbers she
  // has already read out of the notebook.
  applyBentaDraft(drafts[d]);
}

// Put a stashed draft back on the form. Rows/items are matched BY NAME, and a
// name the form does not have (a sku or picklist item removed since) is
// appended, so nothing typed is ever dropped on the floor.
function applyBentaDraft(dr){
  if (!isObj(dr)) return;
  benta.closed = !!dr.closed;
  benta.staff = txt(dr.staff) || benta.staff;
  benta.custom = dr.custom;
  benta.customGcash = dr.customGcash;
  benta.notes = txt(dr.notes);
  for (const d of asArr(dr.rows)){
    const row = benta.rows.find(r => r.sku === d.sku);
    if (row){ row.sod = d.sod; row.eod = d.eod; row.cheese = d.cheese; row.gcash = d.gcash; row.gcashCheese = d.gcashCheese; }
    else benta.rows.push({ sku:d.sku, sod:d.sod, eod:d.eod, cheese:d.cheese, gcash:d.gcash, gcashCheese:d.gcashCheese });
  }
  for (const d of asArr(dr.supplies)){
    const row = benta.supplies.find(r => r.item === d.item);
    if (row) row.amount = d.amount;
    else benta.supplies.push({ item:d.item, amount:d.amount });
  }
  for (const d of asArr(dr.stock)){
    const row = benta.stock.find(r => r.product === d.product);
    if (row) row.qty = d.qty;
    else benta.stock.push({ product:d.product, unit:d.unit, qty:d.qty });
  }
  if (benta.supplies.some(s => num(s.amount) > 0)) benta.suppliesOpen = true;
  if (benta.stock.some(s => num(s.qty) > 0)) benta.stockOpen = true;
  benta.dirty = true;      // it is still unsent work
  benta.fromDraft = true;
}

// Keep whatever is half-typed for the date currently on the form. Called before
// the date changes, and when the app is backgrounded or closed.
function stashBentaDraft(){
  if (!isObj(benta) || !benta.dirty || !isDateStr(benta.date)) return;
  drafts[benta.date] = {
    date: benta.date, closed: !!benta.closed, staff: txt(benta.staff),
    custom: raw1(benta.custom), customGcash: raw1(benta.customGcash), notes: txt(benta.notes),
    rows: asArr(benta.rows).map(r => ({
      sku: txt(r.sku), sod: raw1(r.sod), eod: raw1(r.eod),
      cheese: raw1(r.cheese), gcash: raw1(r.gcash), gcashCheese: raw1(r.gcashCheese)
    })),
    supplies: asArr(benta.supplies).map(s => ({ item: txt(s.item), amount: raw1(s.amount) })),
    stock: asArr(benta.stock).map(s => ({ product: txt(s.product), unit: txt(s.unit), qty: raw1(s.qty) }))
  };
  persistDrafts();
}
function clearBentaDraft(date){
  if (drafts[date] != null){ delete drafts[date]; persistDrafts(); }
}

// Both picklists follow the SKU rule: every active item, plus any item this
// date already has a figure for, so editing an old day cannot silently erase
// an entry whose picklist row was later deactivated or renamed.
// A blank (not 0) amount means "nothing entered" — nicer to read than a wall
// of zeroes, and it is what keeps the row out of the payload entirely.
function bentaSupplyRows(d){
  const saved = asArr(asObj(state.dailySupplies)[d]).filter(isObj);
  const rows = [], seen = {};
  for (const it of activeSupplyItems()){
    if (seen[it.item]) continue;
    seen[it.item] = true;
    const hit = saved.find(r => r.item === it.item);
    rows.push({ item:it.item, amount: hit ? num(hit.amount) : '' });
  }
  for (const r of saved){
    if (!r.item || seen[r.item]) continue;
    seen[r.item] = true;
    rows.push({ item:r.item, amount:num(r.amount) });
  }
  return rows;
}
function bentaStockRows(d){
  const saved = asArr(asObj(state.stockUsage)[d]).filter(isObj);
  const rows = [], seen = {};
  for (const it of activeStockItems()){
    if (seen[it.product]) continue;
    seen[it.product] = true;
    const hit = saved.find(r => r.product === it.product);
    rows.push({ product:it.product, unit:txt(it.unit), qty: hit ? num(hit.qty) : '' });
  }
  for (const r of saved){
    if (!r.product || seen[r.product]) continue;
    seen[r.product] = true;
    const it = asArr(state.stockItems).find(x => isObj(x) && x.product === r.product);
    rows.push({ product:r.product, unit:txt(it && it.unit), qty:num(r.qty) });
  }
  return rows;
}

function bentaPayload(){
  const closed = !!benta.closed;
  // Clamp here so the queued payload always matches what applyLocalDay /
  // computeDay stored locally — and so it can never breach a server rule.
  const custom = closed ? 0 : Math.max(0, num(benta.custom));
  return {
    date: benta.date,
    closed,
    staff: benta.staff,
    customAmount: custom,
    customGcash: closed ? 0 : Math.min(custom, Math.max(0, num(benta.customGcash))),
    notes: benta.notes,
    // REQUEST keys are camelCase. `gcash` is deliberately NOT sent: the server
    // computes it from these buckets and ignores a typed figure.
    counts: closed ? [] : asArr(benta.rows).map(r => ({
      sku:r.sku, sod:num(r.sod), eod:num(r.eod),
      cheeseQty:num(r.cheese), gcashQty:num(r.gcash), gcashCheeseQty:num(r.gcashCheese)
    })),
    // Only what was actually spent/used travels: the server writes non-zero
    // rows only, and a 0 for an item that has since left the sheet's picklist
    // would be rejected as an unknown item for no reason.
    supplies: closed ? [] : asArr(benta.supplies)
      .filter(s => num(s.amount) > 0).map(s => ({ item:s.item, amount:num(s.amount) })),
    stock: closed ? [] : asArr(benta.stock)
      .filter(s => num(s.qty) > 0).map(s => ({ product:s.product, qty:num(s.qty) }))
  };
}

// SKU list to render: active prices plus any SKU already on the form
// (deactivated-but-recorded, or activated after the form was loaded).
function bentaSkuList(){
  const list = activePrices().slice();
  const seen = {};
  for (const pr of list) seen[pr.sku] = true;
  for (const r of asArr(benta.rows)){
    if (seen[r.sku]) continue;
    seen[r.sku] = true;
    const pr = asArr(state.prices).find(p => p.sku === r.sku);
    // A sku that has LEFT the Prices tab still has to render every figure it
    // already holds, so the placeholder is group:'box' — otherwise no cheese
    // stepper appears while a loaded cheese count still fails validation, and
    // the day can never be saved again. It cannot be priced, so the server
    // drops it (and says so); the card says that too.
    list.push(pr || { sku:r.sku, label:skuLabel(r.sku), group:'box', size:'', price:0, cheese_price:'', active:false, missing:true });
  }
  return list;
}

// Plain-English breakdown of one sku row: how the boxes that sold split across
// the four buckets, and what the row is worth. Every bucket is a SUBSET of sold
// (same container — a dearer filling, or a different way of paying), so raising
// one only ever moves a box from one bucket to another. Spelling all of them out
// is what stops a stepper looking like it did nothing.
function skuSplitText(pr, row){
  const sold = Math.max(0, num(row.sod) - num(row.eod));
  if (!sold) return 'Enter the start and end counts to see the total.';
  const isBox = pr.group === 'box';
  const price = num(pr.price), cheesePrice = num(pr.cheese_price);
  const cheese = isBox ? clampQty(row.cheese, sold) : 0;
  const gcash = clampQty(row.gcash, sold);
  const gcashCheese = isBox ? clampQty(row.gcashCheese, sold) : 0;
  const regular = Math.max(0, sold - cheese - gcash - gcashCheese);
  const amount = (regular + gcash) * price + (cheese + gcashCheese) * cheesePrice;
  const parts = [];
  if (regular) parts.push(regular + ' regular × ' + peso(price));
  if (cheese) parts.push(cheese + ' cheese × ' + peso(cheesePrice));
  if (gcash) parts.push(gcash + ' GCash × ' + peso(price));
  if (gcashCheese) parts.push(gcashCheese + ' GCash cheese × ' + peso(cheesePrice));
  return (parts.length ? parts.join('  +  ') + '  =  ' : '') + peso(amount);
}

// The row fields a stepper may write. A whitelist rather than free indexing,
// so a sku or a stray data attribute can never reach the prototype.
const ROW_FIELDS = { sod:'sod', eod:'eod', cheese:'cheese', gcash:'gcash', gcashCheese:'gcashCheese' };
// The three ENTERED buckets, with the label each one shows.
const BUCKETS = [
  { field:'cheese',      label:'Cheese',       gcash:false, boxOnly:true },
  { field:'gcash',       label:'GCash',        gcash:true,  boxOnly:false },
  { field:'gcashCheese', label:'GCash cheese', gcash:true,  boxOnly:true }
];
/** How many of `sold` are still unlabelled, ignoring one bucket. `isBox` is
 *  passed through because a group=simple sku has no cheese buckets at all —
 *  same rule computeDay applies, so the figures cannot disagree. */
function bucketRoom(row, sold, exceptField, isBox){
  let used = 0;
  for (const b of BUCKETS){
    if (b.field === exceptField) continue;
    if (b.boxOnly && !isBox) continue;
    used += Math.max(0, num(row[b.field]));
  }
  return Math.max(0, sold - used);
}
/** The derived fourth bucket: whatever is left is regular, paid in cash. */
function rowRegular(row, isBox){
  const sold = Math.max(0, num(row.sod) - num(row.eod));
  return bucketRoom(row, sold, null, isBox);
}
/** group=box for a sku still on the form (a deactivated sku keeps its group).
 *  A sku that is no longer in Prices at all counts as a box, so its cheese
 *  buckets render and validate instead of becoming an unfixable complaint. */
function isBoxSku(sku){
  const pr = asArr(state.prices).find(p => isObj(p) && p.sku === sku);
  return pr ? pr.group === 'box' : true;
}

// Every place it lands in markup — attributes and ids alike — must be
// escaped, or the tag breaks apart and the steppers stop working.
function stepperHTML(sku, field, value, label, small){
  const s = esc(sku);
  return '<div class="stepper" data-sku="' + s + '" data-field="' + field + '">' +
    '<button type="button" class="step-btn" data-act="step" data-dir="-1" aria-label="Subtract one: ' + esc(label) + '">−</button>' +
    '<input class="step-val" id="in-' + s + '-' + field + '" inputmode="numeric" autocomplete="off" value="' + value + '" aria-label="' + esc(label) + '">' +
    '<button type="button" class="step-btn" data-act="step" data-dir="1" aria-label="Add one: ' + esc(label) + '">+</button>' +
  '</div>';
}

/* ---- The needs-attention card. Shown on BOTH the Sales screen and More, so
   whichever screen she is on, a day the sheet does not have is impossible to
   miss — with its date, the server's own words, and what to do next. ---- */
function attnCopy(a){
  const when = isDateStr(a.date) ? fmtLong(a.date) : 'One entry';
  if (a.kind === 'gcash') return {
    when,
    why: 'GCash for this day needs re-entering. It was typed as one total before the app was updated, so the sheet could not tell which boxes were paid by GCash.',
    help: 'Open this day, put the GCash boxes in, then tap Save day. Until then this day counts as all cash.'
  };
  if (a.kind === 'dropped') return {
    when,
    why: a.message,
    help: 'Everything else on this day was saved. Add the box size back in the Prices tab if you still sell it.'
  };
  if (a.action === 'saveDay') return {
    when,
    why: 'This day is NOT in the Google Sheet. The server would not take it: ' + a.message,
    help: 'Open this day, fix what that message says, then tap Save day again.'
  };
  return {
    when: when + ' — expense',
    why: 'This expense is NOT in the Google Sheet. The server would not take it: ' + a.message,
    help: 'Tap Try again. If it keeps failing, add it again from the Expenses screen.'
  };
}
function attentionCardHTML(){
  ensureShape();
  if (!attention.length && !storageFull) return '';
  let h = '<div class="card attn-card">';
  if (attention.length){
    h += '<p class="attn-head">' + (attention.length === 1
      ? '1 entry needs your attention' : attention.length + ' entries need your attention') + '</p>';
    attention.forEach((a, i) => {
      const key = esc(attnKey(a));
      const c = attnCopy(a);
      h += '<div class="attn-item' + (i === 0 ? ' first' : '') + '">' +
        '<div class="attn-when">' + esc(c.when) + '</div>' +
        '<div class="attn-why">' + esc(c.why) + '</div>' +
        '<div class="attn-help">' + esc(c.help) + '</div>' +
        '<div class="attn-acts">' +
          (a.action === 'saveDay' && isDateStr(a.date)
            ? '<button type="button" class="btn small" data-act="attn-open" data-key="' + key + '">Open this day</button>' : '') +
          (a.kind === 'rejected'
            ? '<button type="button" class="btn small primary" data-act="attn-retry" data-key="' + key + '">Try again</button>' : '') +
          '<button type="button" class="btn small" data-act="attn-dismiss" data-key="' + key + '">' +
            (a.kind === 'rejected' ? 'Hide this' : 'Got it') + '</button>' +
        '</div>' +
      '</div>';
    });
  }
  if (storageFull){
    h += '<p class="err">This phone has run out of storage. Work waiting to be sent may be lost if the app is closed — tap Sync now in More as soon as you have signal.</p>';
  }
  return h + '</div>';
}

function openAttentionEntry(key){
  const a = findAttention(key);
  if (!a || !isDateStr(a.date)) return;
  stashBentaDraft();
  loadBentaForm(a.date);
  showTab('benta');
  toast('Opened ' + fmtShort(a.date) + '. Fix it, then tap Save day.');
}
function retryAttention(key){
  const a = findAttention(key);
  if (!a) return;
  enqueue(a.action, a.payload);      // clears this entry: it is being re-sent
  renderPanel(activeTab);
  toast('Sending it again…');
  drainQueue();
}
function dismissAttention(key){
  const a = findAttention(key);
  if (!a) return;
  if (a.kind === 'rejected' &&
      !confirm('This is still not in the Google Sheet. Hide the warning anyway?')) return;
  attention = attention.filter(x => attnKey(x) !== key);
  persistAttention();
  updateStatus();
  renderPanel(activeTab);
}

function renderBenta(){
  if (!benta) loadBentaForm(todayStr());
  const isToday = benta.date === todayStr();
  const staff = staffList();
  let h = '';

  // Anything that did not reach the sheet comes FIRST — before the day's entry.
  h += attentionCardHTML();

  // Date header (tap to backfill)
  h += '<div class="card date-card">' +
    '<div>' +
      '<div class="date-kicker' + (isToday ? '' : ' backfill') + '">' + (isToday ? 'Today' : 'Earlier day') + '</div>' +
      '<div class="date-big">' + fmtLong(benta.date) + '</div>' +
      '<div class="date-hint">Tap to change the date</div>' +
    '</div>' +
    '<svg class="cal-ico" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>' +
    '<input type="date" id="bentaDate" class="date-cover" value="' + benta.date + '" max="' + todayStr() + '" aria-label="Choose the date">' +
  '</div>';

  // Never claim a day is saved while it is sitting on the needs-attention list:
  // the sheet does not have it.
  const dayAttn = attentionForDate(benta.date).filter(a => a.kind !== 'dropped');
  if (benta.fromDraft){
    h += '<p class="saved-hint" style="color:var(--accent);">Your unsent numbers for this day were kept. Tap Save day when it is complete.</p>';
  } else if (benta.saved && !dayAttn.length){
    h += '<p class="saved-hint">✓ This day is already saved. You are editing it.</p>';
  }

  // Closed-day toggle. The whole row is the label, so tapping the words works
  // too — this switch blanks a whole day.
  h += '<div class="card"><label class="switch-row" for="closedToggle">' +
    '<span><span class="sw-label" style="display:block;">Closed today</span><span class="sw-sub" style="display:block;">No sales on this day</span></span>' +
    '<span class="switch"><input type="checkbox" id="closedToggle"' + (benta.closed ? ' checked' : '') + ' aria-label="Closed today — no sales">' +
    '<span class="track"></span><span class="knob"></span></span>' +
  '</label></div>';

  // Staff chips
  if (staff.length){
    h += '<div class="section-title">Who minded the stall?</div><div class="chips" role="group" aria-label="Staff">';
    for (const s of staff){
      h += '<button type="button" class="chip" data-act="staff" data-staff="' + esc(s) + '" aria-pressed="' + String(benta.staff === s) + '">' + esc(s) + '</button>';
    }
    h += '</div>';
  }

  if (!benta.closed){
    // Count rows: active skus + skus already on the form (union) —
    // a mid-session bootstrap can activate/deactivate skus, so create a
    // placeholder row for any sku the form doesn't know yet.
    h += '<div class="section-title">Container counts</div>';
    const skus = bentaSkuList();
    if (!skus.length){
      h += '<div class="card"><p class="hint">No box sizes to count yet. Add them in the Prices tab of the Google Sheet, then sync.</p></div>';
    }
    h += '<p class="hint" style="margin:-4px 0 12px;">Cheese and GCash boxes are part of what sold. Whatever is left over is regular, paid in cash.</p>';
    for (const pr of skus){
      let row = asArr(benta.rows).find(r => r.sku === pr.sku);
      if (!row){ row = { sku:pr.sku, sod:0, eod:0, cheese:0, gcash:0, gcashCheese:0 }; benta.rows.push(row); }
      const sold = Math.max(0, num(row.sod) - num(row.eod));
      const isBox = pr.group === 'box';
      const sk = esc(pr.sku);   // sku is sheet data — escape it everywhere it enters markup
      // The three entered buckets, then the derived remainder. A group=simple
      // sku has no cheese version, so it only gets the GCash bucket.
      let buckets = '';
      for (const b of BUCKETS){
        if (b.boxOnly && !isBox) continue;
        buckets += '<div class="count-cell' + (b.gcash ? ' gc' : '') + '">' +
          '<label for="in-' + sk + '-' + b.field + '">' + b.label + '</label>' +
          stepperHTML(pr.sku, b.field, num(row[b.field]), b.label + ', ' + pr.label) +
        '</div>';
      }
      // Not a <label for>: the remainder is derived, so there is no input to
      // label — and a label pointing at a div would be inert markup.
      buckets += '<div class="count-cell"><div class="cell-label">Regular (cash)</div>' +
        '<div class="derived" id="reg-' + sk + '" aria-label="Regular boxes paid in cash, ' + esc(pr.label) + '">' +
          rowRegular(row, isBox) + '</div></div>';
      h += '<div class="card sku-card" data-skucard="' + sk + '">' +
        '<div class="sku-head"><strong>' + esc(pr.label) + '</strong>' +
          '<span class="sku-price">' + (pr.missing ? 'Not in the Prices tab'
            : peso(pr.price) + (isBox ? ' · Cheese ' + peso(pr.cheese_price) : '') +
              (truthy(pr.active) ? '' : ' · no longer active')) + '</span></div>' +
        // It cannot be priced any more, so the server drops these counts when
        // the day is saved. Say so here rather than letting it surprise her.
        (pr.missing ? '<p class="hint" style="margin:-4px 0 10px;">' + esc(pr.label) +
          ' is not in the Prices tab any more, so it has no price. Saving this day will remove its counts.</p>' : '') +
        '<div class="count-grid">' +
          '<div class="count-cell"><label for="in-' + sk + '-sod">Start of day</label>' + stepperHTML(pr.sku, 'sod', num(row.sod), 'Start of day, ' + pr.label) + '</div>' +
          '<div class="count-cell"><label for="in-' + sk + '-eod">End of day</label>' + stepperHTML(pr.sku, 'eod', num(row.eod), 'End of day, ' + pr.label) + '</div>' +
        '</div>' +
        '<div class="sold-row">' +
          '<div class="sold-badge" id="soldbadge-' + sk + '">Sold: <b id="sold-' + sk + '">' + sold + '</b></div>' +
        '</div>' +
        '<div class="count-grid buckets">' + buckets + '</div>' +
        // Every bucket is a SUBSET of what sold — a dearer filling, or a
        // different way of paying — so raising one only moves a box from one
        // bucket to another. Spelling all four out per row stops a stepper
        // reading as "that button didn't add anything".
        '<div class="sku-split" id="split-' + sk + '">' + skuSplitText(pr, row) + '</div>' +
        '<p class="err" id="err-sku-' + sk + '" hidden></p>' +
      '</div>';
    }

    // Custom order (+ how much of it was GCash) and the day note. There is NO
    // typed GCash total any more: it is computed and shown on the receipt.
    h += '<div class="section-title">Other sales and payments</div>';
    h += '<div class="card">' +
      '<div class="field"><label for="customAmount">Custom order (₱)</label>' +
        '<input class="input money" id="customAmount" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(benta.custom || '') + '">' +
        '<p class="err" id="err-custom" hidden></p></div>' +
      '<div class="field"><label for="customGcash">How much of that was GCash? (₱)</label>' +
        '<input class="input money gcash-in" id="customGcash" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(benta.customGcash || '') + '">' +
        '<p class="hint" style="margin-top:6px;">Leave it empty if the custom order was paid in cash.</p>' +
        '<p class="err" id="err-customGcash" hidden></p></div>' +
      '<div class="field"><label for="dayNotes">Note (optional)</label>' +
        '<input class="input" id="dayNotes" autocomplete="off" placeholder="e.g. 30 pcs party order" value="' + esc(benta.notes) + '"></div>' +
    '</div>';

    // Saved by the same "Save day" button as everything above.
    topUpPicklistRows();
    h += suppliesCardHTML() + stockCardHTML();
  }

  // Live receipt strip
  h += '<div class="receipt-wrap" id="receiptWrap">' +
    '<div class="receipt" id="receipt"></div>' +
    '<div class="r-tear" aria-hidden="true"></div>' +
  '</div>';

  // GCash is no longer typed in, so say where the figure comes from — it is
  // still the number to check against the GCash app history.
  if (!benta.closed){
    h += '<p class="hint" style="margin:2px 4px 12px;">The GCash total is added up from what you entered above. Check it against your GCash app.</p>';
  }

  h += '<button type="button" class="btn primary block" data-act="save-day" style="margin-bottom:10px;">Save day</button>';

  $('panel-benta').innerHTML = h;
  updateReceipt();
  validateBentaLive();
}

/* ---- The two collapsible cards, saved by the same "Save day" action ---- */
const CHEV = '<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

function collapseCardHTML(key, title, summary, open, body){
  const bodyId = key + 'Body';
  return '<div class="card collapse">' +
    '<button type="button" class="collapse-head" data-act="toggle-' + key + '" aria-expanded="' + String(!!open) + '" aria-controls="' + bodyId + '">' +
      '<span class="ch-title">' + title + '</span>' +
      '<span class="ch-sum">' + summary + '</span>' + CHEV +
    '</button>' +
    '<div class="collapse-body" id="' + bodyId + '"' + (open ? '' : ' hidden') + '>' + body + '</div>' +
  '</div>';
}

function suppliesTotal(){ return asArr(benta.supplies).reduce((s, r) => s + Math.max(0, num(r.amount)), 0); }
function stockUsedCount(){ return asArr(benta.stock).filter(r => num(r.qty) > 0).length; }

// The two picklists are ADVISORY, not referential integrity: a row whose name
// has left the sheet's list must still save (the day has to stay re-saveable),
// so all this answers is whether to show the quiet note next to the row.
function supplyListed(name){ return activeSupplyItems().some(s => s.item === name); }
function stockListed(name){ return activeStockItems().some(s => s.product === name); }

// A mid-session sync can add an item to either picklist. Top the form up the
// same way the SKU list does — appended at the end, so nothing already typed
// moves and every row index stays valid.
function topUpPicklistRows(){
  const sup = asArr(benta.supplies);
  for (const it of activeSupplyItems()){
    if (!sup.some(r => r.item === it.item)) sup.push({ item:it.item, amount:'' });
  }
  const stk = asArr(benta.stock);
  for (const it of activeStockItems()){
    if (!stk.some(r => r.product === it.product)) stk.push({ product:it.product, unit:txt(it.unit), qty:'' });
  }
}

function suppliesCardHTML(){
  // Both places a supply purchase can be logged land on the SAME Supplies line
  // of the cutoff note, so the hint has to say which one to use.
  let body = '<p class="hint">Small things you bought for today. Big or bulk buys go under Expenses instead, so nothing is counted twice.</p>';
  const rows = asArr(benta.supplies);
  if (!rows.length){
    body += '<p class="hint" style="margin-top:10px;">No items yet. Add them in the SupplyItems tab of the Google Sheet, then sync.</p>';
  }
  rows.forEach((r, i) => {
    const nm = esc(r.item);
    body += '<div class="line-row">' +
        '<label class="ln-name" for="in-sup-' + i + '">' + nm + '</label>' +
        '<input class="input money" id="in-sup-' + i + '" data-sup="' + i + '" inputmode="decimal" autocomplete="off" ' +
          'placeholder="0" value="' + esc(r.amount) + '" aria-label="Pesos spent on ' + nm + '">' +
      '</div>' +
      // The picklist is a convenience, not a rule: a name the sheet no longer
      // lists still saves, so this note is quiet and never blocks anything.
      (supplyListed(r.item) ? '' : '<p class="ln-note">Not on the sheet’s list any more. It still saves.</p>') +

  body += '<div class="sum-row"><span>Total supplies today</span><b id="supTotal">' + peso(suppliesTotal()) + '</b></div>';
  return collapseCardHTML('supplies', 'Supplies bought today', peso(suppliesTotal()), benta.suppliesOpen, body);
}

function stockCardHTML(){

    'The amounts are saved so stock can be tracked; seeing how much is left is coming in a later update.</p>';

    body += '<p class="hint" style="margin-top:10px;">No products yet. Add them in the StockItems tab of the Google Sheet, then sync.</p>';
  }

        '<label class="ln-name" for="in-stk-' + i + '">' + nm + '</label>' +

function toggleCollapse(key){

  benta[flag] = !benta[flag];

}

function updateSuppliesCard(){
  const t = peso(suppliesTotal());
  const sum = $('supTotal');
  if (sum) sum.textContent = t;
  const head = document.querySelector('#panel-benta [data-act="toggle-supplies"] .ch-sum');

function updateStockCard(){

  const head = document.querySelector('#panel-benta [data-act="toggle-stock"] .ch-sum');
  if (head) head.textContent = n ? n + (n === 1 ? ' item' : ' items') : '';

function updateReceipt(){
  if (!isObj(benta)) return;
  const c = computeDay(bentaPayload());
  updateDayStrip(c);                     // the sticky line at the top of the screen
  const el = $('receipt');
  if (!el) return;
  let h = '<div class="r-brand">Octogo ★ ' + esc(asObj(state.settings).branch || '') + '</div>' +
          '<div class="r-date">' + fmtLong(benta.date) + '</div>' +
          '<div class="r-sep" role="presentation"></div>';
  if (benta.closed){
    h += '<div class="r-closed">CLOSED</div>';
  } else {
    // One line per bucket that has something in it, so the receipt adds up the
    // same way the cards do and the GCash total below can be traced back.
    let any = false;
    for (const l of c.lines){
      if (l.regular_qty > 0){ any = true; h += rLine(l.label + ' ×' + l.regular_qty, l.regular_qty * l.price); }
      if (l.cheese_qty > 0){ any = true; h += rLine(l.label + ' cheese ×' + l.cheese_qty, l.cheese_qty * l.cheese_price); }
      if (l.gcash_qty > 0){ any = true; h += rLine(l.label + ' GCash ×' + l.gcash_qty, l.gcash_qty * l.price); }
      if (l.gcash_cheese_qty > 0){ any = true; h += rLine(l.label + ' GCash cheese ×' + l.gcash_cheese_qty, l.gcash_cheese_qty * l.cheese_price); }
    }
    if (c.custom > 0){ any = true; h += rLine('Custom order', c.custom); }
    if (!any) h += '<div class="r-empty">Nothing yet — enter the container counts.</div>';
    h += '<div class="r-sep" role="presentation"></div>' +
      '<div class="r-total"><span class="lbl">TOTAL</span><span class="amt">' + peso(c.total) + '</span></div>' +
      '<div class="r-sub gcash"><span>GCash</span><span class="r-amt">' + peso(c.gcash) + '</span></div>' +
      '<div class="r-sub"><span>Cash</span><span class="r-amt">' + peso(c.cash) + '</span></div>';
  }
  el.innerHTML = h;
}
function rLine(label, amt){
  return '<div class="r-line"><span>' + esc(label) + '</span><span class="r-amt">' + fmt(amt) + '</span></div>';
}

// The day TOTAL, pinned. The receipt strip is a long way down a phone screen by
// the time the boxes, the buckets, the supplies and the stock are on it, and the
// total is the one figure she checks against the cash in the tin WHILE counting.
// Same numbers as the receipt, same order — this is a mirror, not a second sum.
function updateDayStrip(c){
  const strip = $('dayStrip');
  if (!strip) return;
  if (activeTab !== 'benta' || !isObj(benta)){ strip.hidden = true; strip.innerHTML = ''; return; }
  strip.hidden = false;
  if (benta.closed){
    strip.innerHTML = '<div class="ds-total"><span class="ds-lbl">CLOSED</span><span class="ds-amt">' + peso(0) + '</span></div>' +
      '<div class="ds-sub"><span>No sales on this day</span></div>';
    return;
  }
  const d = isObj(c) ? c : computeDay(bentaPayload());
  strip.innerHTML =
    '<div class="ds-total"><span class="ds-lbl">TOTAL</span><span class="ds-amt">' + peso(d.total) + '</span></div>' +
    '<div class="ds-sub"><span>Cash <b>' + peso(d.cash) + '</b></span>' +
      '<span class="gc">GCash <b>' + peso(d.gcash) + '</b></span></div>';
}

function isWhole(v){ const n = num(v); return isFinite(n) && Math.floor(n) === n; }

/* Every rule apiSaveDay() enforces is mirrored here, in the same order and with
   the same plain-English wording, so the phone never queues work the server will
   refuse. Error keys are NAMESPACED ('sku:', 'supply:', 'stock:') so a sku or an
   item literally named 'custom' cannot collide with a fixed slot — and a name
   like '__proto__' cannot touch the prototype (the accumulator has none). */
function validateBenta(){
  const errs = Object.create(null);
  if (benta.closed) return errs;   // a closed day sends nothing to validate

  for (const r of asArr(benta.rows)){
    const pr = asArr(state.prices).find(p => isObj(p) && p.sku === r.sku);
    const label = txt(pr && pr.label) || r.sku;
    // A sku that has left the Prices tab counts as a box here, exactly as it
    // renders: otherwise a loaded cheese count produces a complaint with no
    // stepper to fix it, and the day can never be saved again.
    const isBox = isBoxSku(r.sku);
    const key = 'sku:' + r.sku;
    const sod = num(r.sod), eod = num(r.eod);
    const cheese = num(r.cheese), gcash = num(r.gcash), gcashCheese = num(r.gcashCheese);
    const sold = sod - eod;
    if (!isWhole(sod) || !isWhole(eod) || !isWhole(cheese) || !isWhole(gcash) || !isWhole(gcashCheese)){
      errs[key] = 'Use whole numbers only — half a box cannot be sold.';
    } else if (sod < 0 || eod < 0){
      errs[key] = 'The counts cannot be less than zero.';
    } else if (sold < 0){
      errs[key] = 'End of day is bigger than start of day. Please check.';
    } else if (cheese < 0 || gcash < 0 || gcashCheese < 0){
      errs[key] = 'The cheese and GCash counts cannot be less than zero.';
    } else if (!isBox && (cheese > 0 || gcashCheese > 0)){
      errs[key] = label + ' has no cheese version, so leave the cheese counts at 0.';
    } else if (sold === 0 && (cheese > 0 || gcash > 0 || gcashCheese > 0)){
      // Nothing sold yet, so there is nothing to split. Blaming the buckets
      // ("can only go up to 0") points at the wrong field entirely.
      errs[key] = 'Enter Start of day and End of day first, then split the boxes.';
    } else if (cheese + gcash + gcashCheese > sold){
      errs[key] = 'Cheese (' + cheese + ') + GCash (' + gcash + ') + GCash cheese (' + gcashCheese +
        ') adds up to ' + (cheese + gcash + gcashCheese) + ', but only ' + sold + ' were sold. Lower one of them.';
    }
  }

  const custom = num(benta.custom), customGcash = num(benta.customGcash);
  if (custom < 0) errs.custom = 'The custom order cannot be less than zero.';
  if (customGcash < 0) errs.customGcash = 'The GCash part cannot be less than zero.';
  else if (customGcash > custom){
    errs.customGcash = 'The GCash part (' + peso(customGcash) +
      ') cannot be more than the custom order (' + peso(custom) + ').';
  }

  for (const s of asArr(benta.supplies)){
    if (num(s.amount) < 0) errs['supply:' + s.item] = 'This cannot be less than zero.';
  }
  for (const s of asArr(benta.stock)){
    if (num(s.qty) < 0) errs['stock:' + s.product] = 'This cannot be less than zero.';
  }
  return errs;
}

/** 'sku:box4' -> 'err-sku-box4'; 'customGcash' -> 'err-customGcash'. One place,
 *  so the inline slots and the scroll-to-first-error always agree. */
function errSlotId(key){
  const i = String(key).indexOf(':');
  return i === -1 ? 'err-' + key : 'err-' + key.slice(0, i) + '-' + key.slice(i + 1);
}
function setErr(id, msg){
  const el = $(id);
  if (!el) return;
  if (msg){ el.textContent = msg; el.hidden = false; }
  else { el.hidden = true; }
}

function validateBentaLive(){
  const errs = validateBenta();
  for (const r of asArr(benta.rows)){
    setErr('err-sku-' + r.sku, errs['sku:' + r.sku]);
    const sold = num(r.sod) - num(r.eod);
    const badge = $('soldbadge-' + r.sku);
    if (badge) badge.classList.toggle('neg', sold < 0);
    const isBox = isBoxSku(r.sku);
    const reg = $('reg-' + r.sku);
    if (reg) reg.textContent = rowRegular(r, isBox);
    const split = $('split-' + r.sku);
    if (split){
      // Fall back to the same placeholder renderBenta drew the card from, so a
      // sku that has left the Prices tab keeps a line consistent with its own
      // Sold and Regular figures instead of freezing at stale numbers.
      const pr = asArr(state.prices).find(p => isObj(p) && p.sku === r.sku)
        || { sku: r.sku, label: r.sku, group: isBox ? 'box' : 'simple', price: 0, cheese_price: 0 };
      split.textContent = skuSplitText(pr, r);
    }
  }
  setErr('err-custom', errs.custom);
  setErr('err-customGcash', errs.customGcash);
  for (const s of asArr(benta.supplies)) setErr('err-supply-' + s.item, errs['supply:' + s.item]);
  for (const s of asArr(benta.stock)) setErr('err-stock-' + s.product, errs['stock:' + s.product]);
  return errs;
}

function saveBenta(){
  const errs = validateBentaLive();
  if (Object.keys(errs).length){
    toast('Please fix the errors first.');
    const firstKey = Object.keys(errs)[0];
    // An error inside a collapsed card would otherwise be invisible: open the
    // card first, then scroll to the message.
    if (firstKey.indexOf('supply:') === 0 && !benta.suppliesOpen) toggleCollapse('supplies');
    if (firstKey.indexOf('stock:') === 0 && !benta.stockOpen) toggleCollapse('stock');
    const el = $(errSlotId(firstKey));
    if (el) el.scrollIntoView({ block:'center', behavior: prefersReduced() ? 'auto' : 'smooth' });
    return;
  }
  const p = bentaPayload();
  p.entryId = uuid();
  applyLocalDay(p);
  enqueue('saveDay', p);
  // The typed work is in the queue now, so the draft for this date has done its
  // job. (If the server refuses it, the needs-attention list takes over.)
  clearBentaDraft(p.date);
  persistState();
  const savedDate = p.date;
  tearReceipt(() => {
    loadBentaForm(savedDate);
    renderBenta();
    toast('Saved ' + fmtShort(savedDate) + '.');
  });
  drainQueue().then(() => {
    // The day is safely away — a held-back update can go in now.
    if (typeof applyUpdateIfSafe === 'function') applyUpdateIfSafe();
  });
}

function prefersReduced(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function tearReceipt(done){
  const wrap = $('receiptWrap');
  if (!wrap || prefersReduced()){ done(); return; }
  let fired = false;
  const fin = () => { if (fired) return; fired = true; done(); };
  wrap.classList.add('tearing');
  wrap.addEventListener('animationend', fin, { once:true });
  setTimeout(fin, 650);
}

function bentaStep(sku, field, dir){
  const r = benta.rows.find(x => x.sku === sku);
  const key = ROW_FIELDS[field];
  if (!r || !key) return;
  let v = num(r[key]) + dir;
  if (v < 0) v = 0;
  const bucket = BUCKETS.find(b => b.field === key);
  if (bucket){
    // A bucket can never claim more boxes than are still unlabelled: the three
    // of them plus the derived regular remainder must add up to sold, which is
    // exactly what the server enforces.
    const sold = Math.max(0, num(r.sod) - num(r.eod));
    const room = bucketRoom(r, sold, key, isBoxSku(sku));
    if (sold === 0){
      // The stepper looks broken here because nothing has sold yet. Say what to
      // do instead of blaming the bucket for a limit of 0.
      toast('Enter Start of day and End of day first, then split the boxes.');
      v = 0;
    } else if (v > room){
      toast(room === sold
        ? bucket.label + ' can only go up to ' + sold + ' — that is how many were sold.'
        : bucket.label + ' can only go up to ' + room + ' — the other ' + (sold - room) + ' of the ' + sold + ' sold are already counted.');
      v = room;
    }
  }
  r[key] = v;
  benta.dirty = true;
  const input = $('in-' + sku + '-' + field);
  if (input) input.value = v;
  afterCountChange(sku);
}

function afterCountChange(sku){
  const r = benta.rows.find(x => x.sku === sku);
  const soldEl = $('sold-' + sku);
  if (soldEl && r) soldEl.textContent = Math.max(0, num(r.sod) - num(r.eod));
  updateReceipt();
  validateBentaLive();   // also refreshes the derived "Regular (cash)" figure
}

function submitGasto(){

/* ============================================================
   CUTOFF — period preview + note generation (API or demo-local)
   ============================================================ */
let cutoffPer = null;
let lastNote = null; // { key, text, demo }

function periodKey(per){ return per.start + '_' + per.end; }

// Days in this period that this phone has but the SHEET does not. The preview
// below counts them (they are real money she entered); a note generated by the
// server would not. Say so rather than letting the two disagree in silence.
function cutoffMissingDays(per){
  return asArr(attention).filter(a => a.kind !== 'dropped' && isDateStr(a.date) && inPeriod(a.date, per));
}

function renderCutoff(){
  if (!cutoffPer) cutoffPer = currentPeriod(todayStr());
  const per = cutoffPer;
  const f = computeCutoff(per);
  const s = d2parts(per.start), e = d2parts(per.end);
  const isCurrent = periodKey(per) === periodKey(currentPeriod(todayStr()));
  let h = '';
  const missingDays = cutoffMissingDays(per);
  if (missingDays.length){
    h += '<div class="card attn-card"><p class="attn-head">' +
      (missingDays.length === 1 ? '1 day is not in the sheet yet' : missingDays.length + ' days are not in the sheet yet') +
      '</p><p>' + esc(missingDays.map(a => fmtShort(a.date)).join(', ')) +
      '. The figures below include ' + (missingDays.length === 1 ? 'it' : 'them') +
      ', but the sheet does not — so fix ' + (missingDays.length === 1 ? 'it' : 'them') +
      ' on the Sales screen before you make the note.</p></div>';
  }

  h += '<div class="card"><div class="period-nav">' +
    '<button type="button" class="nav-btn" data-act="cutoff-prev" aria-label="Previous cutoff">‹</button>' +
    '<div class="p-label">' + monthName(per.start) + ' ' + s.d + ' – ' + e.d +
      '<span class="p-sub">' + (isCurrent ? 'This cutoff' : s.y) + '</span></div>' +
    '<button type="button" class="nav-btn" data-act="cutoff-next" aria-label="Next cutoff">›</button>' +
  '</div></div>';

  // Live local preview
  h += '<div class="card">' +
    '<div class="co-row big"><span>Total</span><span class="v">' + peso(f.total) + '</span></div>' +
    '<div class="co-sub">' + f.daysWithSales + (f.daysWithSales === 1 ? ' day with sales' : ' days with sales') + '</div>' +
    '<div class="r-sep" role="presentation"></div>' +
    '<div class="co-row"><span>Cash</span><span class="v">' + peso(f.cash) + '</span></div>' +
    '<div class="co-row gcash"><span>GCash</span><span class="v">' + peso(f.gcash) + '</span></div>' +
    '<div class="r-sep" role="presentation"></div>' +
    '<div class="co-row"><span>Mama</span><span class="v">' + peso(f.mama) + '</span></div>' +
    '<div class="co-row"><span>Supplies</span><span class="v">' + peso(f.supplies) + '</span></div>' +
    '<div class="co-row"><span>Octopus</span><span class="v">' + peso(f.octopus) + '</span></div>' +
    '<div class="co-row"><span>Other payments</span><span class="v">' + peso(f.other) + '</span></div>' +
    '<div class="co-row"><span>Electric bill</span><span class="v">' + peso(f.electric) + '</span></div>' +
    '<div class="r-sep" role="presentation"></div>' +
    '<div class="co-row split' + (f.split < 0 ? ' neg' : '') + '"><span>Split</span><span class="v">' + peso(f.split) + '</span></div>' +
    '<div class="co-sub">' + peso(f.perPartner) + ' each partner' + (f.split < 0 ? ' — this cutoff came up short' : '') + '</div>' +
  '</div>';

  // Suggested fixed expenses (one tap)
  const mamaAmt = num(asObj(state.settings).mama_per_cutoff);
  const elecAmt = num(asObj(state.settings).electric_per_cutoff);
  const sugg = [];
  if (f.mama === 0 && mamaAmt > 0) sugg.push({ cat:'Mama', item:'Mama', amount:mamaAmt });
  if (f.electric === 0 && elecAmt > 0) sugg.push({ cat:'Electric', item:'Electric bill', amount:elecAmt });
  if (sugg.length){
    h += '<div class="card"><p style="font-weight:600; margin-bottom:10px;">These fixed expenses are not logged yet:</p><div class="chips">';
    for (const sg of sugg){
      h += '<button type="button" class="chip" data-act="cutoff-suggest" data-cat="' + sg.cat + '" data-item="' + esc(sg.item) + '" data-amt="' + sg.amount + '">+ ' + sg.cat + ' ' + peso(sg.amount) + '</button>';
    }
    h += '</div></div>';
  }

  h += '<button type="button" class="btn primary block" data-act="cutoff-generate" id="genBtn">Generate cutoff note</button>';

  if (lastNote && lastNote.key === periodKey(per)){

      (lastNote.demo ? '<p class="hint" style="margin-bottom:8px;">Demo — this was not saved to the sheet.</p>'
                     : '<p class="ok-note" style="margin-bottom:8px;">✓ Saved to the Cutoffs tab of the sheet.</p>') +
      '<pre class="note-pre" id="notePre">' + esc(lastNote.text) + '</pre>' +
      '<div class="btn-row">' +
        '<button type="button" class="btn" data-act="copy-note">Copy</button>' +
        (navigator.share ? '<button type="button" class="btn" data-act="share-note">Share</button>' : '') +
      '</div>' +

  }

  $('panel-cutoff').innerHTML = h;
}

async function generateNote(){
  const per = cutoffPer;
  const btn = $('genBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'Generating…'; }
  if (config.apiUrl && navigator.onLine){
    try{
      await drainQueue(); // make sure the note covers everything we've entered
      // drainQueue no-ops when a drain is already running and leaves items
      // queued after a failure — never archive an incomplete note.
      if (queue.length || syncing){
        toast('Some entries are not synced yet. Sync first, then make the note.');
        renderCutoff(); // restores the Generate button
        return;
      }
      // A day the server REFUSED is not in the queue any more, so the queue
      // check above cannot see it — and the note the server builds would be
      // short by that whole day. Never archive money that is missing.
      const missing = cutoffMissingDays(per);
      if (missing.length){
        toast(fmtShort(missing[0].date) + ' is not in the sheet, so the note would be short. Fix it on the Sales screen first.');
        renderCutoff();
        return;
      }
      // Request keys stay camelCase (dryRun); the reply is snake_case
      // (note_text) — older deployments answered noteText, so accept both.
      const data = await api('cutoff', { start:per.start, end:per.end, dryRun:false });
      const served = isObj(data) ? txt(pick(data, 'note_text', 'noteText')) : '';
      lastNote = { key:periodKey(per), text: served || buildNote(computeCutoff(per), per), demo:false };
      renderCutoff();
      return;
    }catch(err){
      console.error(err);
      toast(friendlyError(err, 'Please try again in a moment.') + ' Showing the copy from this phone.');
    }
  }
  lastNote = { key:periodKey(per), text:buildNote(computeCutoff(per), per), demo:true };
  renderCutoff();
}

async function copyNote(){
  if (!lastNote) return;
  try{
    await navigator.clipboard.writeText(lastNote.text);
    toast('Note copied.');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = lastNote.text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); toast('Note copied.'); }
    catch(e2){ toast('Could not copy. Select the text instead.'); }
    ta.remove();
  }
}
async function shareNote(){
  if (!lastNote || !navigator.share) return;
  try{ await navigator.share({ text:lastNote.text }); }catch(e){ /* user cancelled */ }
}

function addSuggestedExpense(cat, item, amount){
  const t = todayStr();
  const per = cutoffPer;
  const date = inPeriod(t, per) ? t : per.end;
  const payload = { date, category:cat, item, amount:num(amount), backlogRef:'', notes:'', entryId:uuid() };
  applyLocalExpense(payload);
  enqueue('saveExpense', payload);
  persistState();
  renderCutoff();
  toast('Added: ' + cat + ' ' + peso(amount));
  drainQueue();
}

    '<div class="kv"><span class="k">Status</span><span class="v">' + status + '</span></div>' +
    '<div class="kv"><span class="k">Waiting to send</span><span class="v">' + queue.length + '</span></div>' +
    '<div class="kv"><span class="k">Not saved to the sheet</span><span class="v">' + missing + '</span></div>' +
    (lastSyncError ? '<p class="err">' + esc(lastSyncError) + '</p>' : '') +
    '<button type="button" class="btn block" data-act="sync-now" style="margin-top:10px;">Sync now</button>' +
  '</div>';

  // API setup
  h += '<div class="section-title">API setup</div><div class="card">' +
    '<div class="field"><label for="cfgUrl">Apps Script Web App URL</label>' +
      '<input class="input" id="cfgUrl" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(config.apiUrl) + '"></div>' +
    '<div class="field"><label for="cfgToken">Token (from the Settings tab of the sheet)</label>' +
      '<input class="input" id="cfgToken" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(config.token) + '"></div>' +
    '<div class="field"><label for="cfgSheet">Google Sheet link (optional)</label>' +
      '<input class="input" id="cfgSheet" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url" placeholder="https://docs.google.com/spreadsheets/…" value="' + esc(config.sheetUrl) + '"></div>' +
    '<button type="button" class="btn block" data-act="test-conn" id="testBtn">Test connection</button>' +
    '<p id="testResult" class="hint" style="margin-top:8px;" aria-live="polite"></p>' +
  '</div>';

  // Backlogs
  h += '<div class="section-title">Backlogs</div><div class="card">';
  const bls = asArr(state.backlogs).filter(b => isObj(b) && truthy(b.active));
  if (!bls.length){
    h += '<p class="hint">No active backlogs. Add them in the Backlogs tab of the Google Sheet.</p>';
  } else {
    const owed = bls.reduce((s, b) => s + backlogBalance(b), 0);
    h += '<div class="bl-total"><span>Total remaining</span><strong>' + peso(owed) + '</strong></div>';
    for (const b of bls){
      const bal = backlogBalance(b);
      const total = num(b.total_amount);
      const paidPct = total > 0 ? Math.min(100, Math.max(0, (total - bal) / total * 100)) : 0;
      h += '<div class="bl-item">' +
        '<div class="bl-top"><span class="bl-name">' + esc(b.name) + '</span><span class="bl-bal">' + peso(bal) + '</span></div>' +
        '<div class="bl-meter" role="img" aria-label="' + Math.round(paidPct) + '% paid"><i style="width:' + paidPct + '%"></i></div>' +
        '<div class="bl-sub">' + (b.description ? esc(b.description) + ' · ' : '') +
          (total - bal > 0 ? peso(total - bal) + ' paid of ' + peso(total) : peso(total) + ' — nothing paid yet') + '</div>' +
      '</div>';
    }
  }
  h += '</div>';

  // Staff (from Settings)
  h += '<div class="section-title">Staff</div><div class="card"><div class="chips">';
  for (const s of staffList()) h += '<span class="chip" aria-disabled="true" style="cursor:default;">' + esc(s) + '</span>';
  h += '</div><p class="hint" style="margin-top:10px;">From the Settings tab of the sheet (key: staff).</p></div>';

  // About
  h += '<div class="section-title">About</div><div class="card">' +
    '<div class="kv"><span class="k">App</span><span class="v">Octogo Tracker v' + APP_VERSION + '</span></div>' +
    '<div class="kv"><span class="k">Branch</span><span class="v">' + esc(asObj(state.settings).branch || '—') + '</span></div>' +
    (config.sheetUrl ? '<a class="btn block" style="margin-top:10px; text-decoration:none;" href="' + esc(config.sheetUrl) + '" target="_blank" rel="noopener">Open the Google Sheet</a>' : '') +
  '</div>';

  $('panel-ibapa').innerHTML = h;
}

async function testConnection(){
  const btn = $('testBtn'), out = $('testResult');
  if (!config.apiUrl){ out.textContent = 'Enter the URL first.'; return; }
  btn.disabled = true; out.textContent = 'Testing…';
  try{
    const data = await api('ping', {});
    out.innerHTML = '<span class="ok-note">✓ Connected. API version ' + esc((data && data.version) || '?') + '</span>';
    toast('Connected to the API.');
    await drainQueue();
    await doBootstrap();
  }catch(err){
    console.error(err);
    const msg = friendlyError(err, 'Check the internet connection and the URL above, then try again.');
    out.innerHTML = '<span style="color:var(--alert); font-weight:600;">✗ ' + esc(msg) + '</span>';
  }finally{
    const b = $('testBtn');
    if (b) b.disabled = false;
    updateStatus();
  }
}

/* ============================================================
   Event wiring — delegated clicks/inputs per panel + globals
   ============================================================ */
document.addEventListener('click', (ev) => {
  // A tap anywhere means she is no longer typing, so any re-render that was
  // held back for the keyboard's sake can land now.
  setTimeout(flushBentaRender, 0);
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'goto-ibapa') showTab('ibapa');

  // Needs attention
  else if (act === 'attn-open') openAttentionEntry(el.dataset.key);
  else if (act === 'attn-retry') retryAttention(el.dataset.key);
  else if (act === 'attn-dismiss') dismissAttention(el.dataset.key);

  // Sales
  else if (act === 'step'){
    const st = el.closest('.stepper');
    bentaStep(st.dataset.sku, st.dataset.field, Number(el.dataset.dir));
  }
  else if (act === 'staff'){
    benta.staff = el.dataset.staff;
    benta.dirty = true;
    document.querySelectorAll('#panel-benta [data-act="staff"]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.staff === benta.staff)));
  }
  else if (act === 'toggle-supplies') toggleCollapse('supplies');
  else if (act === 'toggle-stock') toggleCollapse('stock');
  else if (act === 'save-day') saveBenta();

  // Expenses
  else if (act === 'gastos-open'){ gx.open = true; gx.date = todayStr(); renderGastos(); const f = $('gxItem'); if (f) f.focus(); }
  else if (act === 'gastos-cancel'){ gx.open = false; gxElsewhere = null; renderGastos(); }
  else if (act === 'gastos-cat'){ gx.category = el.dataset.cat; renderGastos(); }
  else if (act === 'gastos-submit') submitGasto();
  else if (act === 'gastos-del') deleteGasto(el.dataset.id);

  // Cutoff
  else if (act === 'cutoff-prev'){ cutoffPer = shiftPeriod(cutoffPer, -1); renderCutoff(); }
  else if (act === 'cutoff-next'){ cutoffPer = shiftPeriod(cutoffPer, 1); renderCutoff(); }
  else if (act === 'cutoff-suggest') addSuggestedExpense(el.dataset.cat, el.dataset.item, el.dataset.amt);
  else if (act === 'cutoff-generate') generateNote();
  else if (act === 'copy-note') copyNote();
  else if (act === 'share-note') shareNote();

  // More tab
  else if (act === 'sync-now'){
    // Drain FIRST so the bootstrap snapshot reflects our mutations —
    // the reverse order can overwrite local edits with pre-edit rows.
    (async () => {
      await drainQueue();
      await doBootstrap();
      if (activeTab === 'ibapa') renderIbapa();
    })();
  }
  else if (act === 'test-conn') testConnection();
});

document.querySelector('.tabbar').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-tab]');
  if (b) showTab(b.dataset.tab);
});

document.addEventListener('input', (ev) => {
  // The supplies/stock rows are addressed by their row INDEX in a data
  // attribute: an item name is sheet data and would make an id ambiguous.
  const ds = ev.target.dataset || {};
  if (ds.sup != null){
    const r = asArr(benta.supplies)[num(ds.sup)];
    if (r){ r.amount = ev.target.value; benta.dirty = true; updateSuppliesCard(); validateBentaLive(); }
    return;
  }
  if (ds.stk != null){
    const r = asArr(benta.stock)[num(ds.stk)];
    if (r){ r.qty = ev.target.value; benta.dirty = true; updateStockCard(); validateBentaLive(); }
    return;
  }

  const id = ev.target.id;
  if (!id) return;

  // Sales fields. There is no typed GCash total any more — it is computed.
  if (id === 'customAmount'){ benta.custom = ev.target.value; benta.dirty = true; updateReceipt(); validateBentaLive(); }
  else if (id === 'customGcash'){ benta.customGcash = ev.target.value; benta.dirty = true; updateReceipt(); validateBentaLive(); }
  else if (id === 'dayNotes'){ benta.notes = ev.target.value; benta.dirty = true; }
  else if (id.startsWith('in-')){
    // Take the sku/field from the stepper's data attributes rather than
    // parsing them back out of the id — a sku is sheet data and may contain
    // dashes or other characters that make the id ambiguous.
    const st = ev.target.closest('.stepper');
    if (st){
      const sku = st.dataset.sku, field = ROW_FIELDS[st.dataset.field];
      const r = field ? benta.rows.find(x => x.sku === sku) : null;
      if (r){ r[field] = Math.max(0, num(ev.target.value)); benta.dirty = true; afterCountChange(sku); }
    }
  }

  // Expenses fields
  else if (id === 'gxItem') gx.item = ev.target.value;
  else if (id === 'gxAmount') gx.amount = ev.target.value;
  else if (id === 'gxDate') gx.date = ev.target.value || todayStr();
  else if (id === 'gxBacklog') gx.backlogRef = ev.target.value;

  // Config fields (auto-saved)
  else if (id === 'cfgUrl'){ config.apiUrl = ev.target.value.trim(); persistConfig(); updateStatus(); }
  else if (id === 'cfgToken'){ config.token = ev.target.value.trim(); persistConfig(); }
  else if (id === 'cfgSheet'){ config.sheetUrl = ev.target.value.trim(); persistConfig(); }
});

document.addEventListener('change', (ev) => {
  const id = ev.target.id;
  if (id === 'bentaDate'){
    const v = ev.target.value;
    if (v && v !== benta.date){
      // Changing the date used to throw away everything typed, with no warning.
      // Keep it as a draft for the date it belongs to, say so, and put it back
      // the moment that date is opened again.
      const from = benta.date, wasDirty = !!benta.dirty;
      stashBentaDraft();
      loadBentaForm(v);
      renderBenta();
      if (wasDirty) toast('Your numbers for ' + fmtShort(from) + ' were kept. Pick that date again to finish them.');
    } else if (v){
      loadBentaForm(v); renderBenta();
    }
  }
  else if (id === 'closedToggle'){
    benta.closed = ev.target.checked;
    benta.dirty = true;
    renderBenta();
  }
});

// A held-back Sales re-render lands as soon as she is out of the field. Both
// events are wired (blur does not bubble, so it is taken in the capture phase)
// and any tap elsewhere flushes too, so a deferred render can never be stranded.
document.addEventListener('focusout', () => { setTimeout(flushBentaRender, 0); });
document.addEventListener('blur', () => { setTimeout(flushBentaRender, 0); }, true);

window.addEventListener('online', () => { drainQueue(); });
window.addEventListener('offline', () => { updateStatus(); });

// The calendar day this page last saw. Only a form that is still showing THAT
// day may be advanced to the new today — see onAppResume.
let lastSeenToday = todayStr();

// App resume (installed PWAs stay alive across days). Auto-advance ONLY when
// the form is still showing the today it was loaded with: picking an earlier
// date and then reading the notebook (app backgrounded in between) is the
// natural order of work, and snapping back to Today would land her numbers on
// the wrong day. Always re-render so the "Today" kicker, the date-input max and
// the current-period displays recompute. Then sync.
function onAppResume(){
  const t = todayStr();
  if (benta && !benta.dirty && benta.date !== t && benta.date === lastSeenToday){
    loadBentaForm(t);
  }
  lastSeenToday = t;
  const di = $('bentaDate');
  if (di) di.max = t;
  renderPanel(activeTab);
  updateDayStrip();
  drainQueue();
  // Reopening the app is the safest moment to swap in a downloaded update.
  if (typeof applyUpdateIfSafe === 'function') applyUpdateIfSafe();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') onAppResume();
  else stashBentaDraft();      // backgrounded mid-entry: keep what is typed
});
window.addEventListener('pagehide', () => { stashBentaDraft(); });
window.addEventListener('pageshow', () => { onAppResume(); });

/* ============================================================
   Boot
   ============================================================ */
// A partial or truncated state_v1 can lose rows that are still sitting in
// the queue. Replay the queue over whatever survived so unsent work shows
// up on screen instead of quietly disappearing. (Idempotent: the appliers
// recompute the same rows from the same payloads.)
try{ reapplyQueue(); }catch(err){ console.error(err); }

try{
  loadBentaForm(todayStr());
}catch(err){
  console.error(err);
  state = freshState();
  loadBentaForm(todayStr());
}
// A day queued before v2.1 loses its cash/GCash split when it replays. Flag
// those dates now, so the warning is on screen even offline.
try{ flagLegacyGcashQueue(); }catch(err){ console.error(err); }
// Bound the stored history on the way in, not only on the way out.
try{ pruneState(); persistState(); persistDrafts(); }catch(err){ console.error(err); }
updateStatus();
showTab('benta');
(async () => {
  // Drain BEFORE bootstrap so the snapshot can't clobber queued edits.
  await drainQueue();
  await doBootstrap();
})();

/* ============================================================
   Self-updating. The service worker caches the app so it runs offline, which
   means a freshly uploaded version would otherwise only appear on the SECOND
   open: the first open quietly downloads it, the second renders it. Nobody
   should have to know that. So when a new version takes over we reload for
   them — but only at a moment where nothing can be lost.
   ============================================================ */
let updateWaiting = false;
let reloadingForUpdate = false;

// sw.js uses clientsClaim, so on a FIRST install controllerchange also fires
// when the brand-new worker claims this uncontrolled page — reloading for that
// would be a pointless flash. So skip exactly that one initial claim, and treat
// every later controllerchange as a real new version. (If a worker was already
// driving the page at load — the normal case once installed — there is no
// initial claim to skip and the very next change is an update.)
let sawInitialClaim = !!(navigator.serviceWorker && navigator.serviceWorker.controller);

// Never reload while the day is half-entered or work is still unsent; hold the
// update until it is safe (after a save, or the next time the app is opened).
function applyUpdateIfSafe(){
  if (!updateWaiting || reloadingForUpdate) return;
  if (typeof benta === 'object' && benta && benta.dirty) return;      // half-typed day
  if (typeof syncing !== 'undefined' && syncing) return;              // request in flight
  // NOT blocked by a non-empty queue: queued mutations live in localStorage and
  // replay after the reload. Blocking on them would strand the app on an old
  // version forever in demo mode, or whenever the server is unreachable.
  reloadingForUpdate = true;   // one reload per page load — never a loop
  updateWaiting = false;
  location.reload();
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* file:// or unsupported — app still works */ });
  });
  // Fires once a newly installed worker claims this page (sw.js does
  // skipWaiting + clientsClaim), i.e. the new files are cached and ready.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!sawInitialClaim){ sawInitialClaim = true; return; }  // first install, not an update
    updateWaiting = true;
    applyUpdateIfSafe();
  });
}
</script>

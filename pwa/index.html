  applyLocalExpense(payload);
  enqueue('saveExpense', payload);
  persistState();
  const here = currentPeriod(todayStr());
  const itsPeriod = currentPeriod(payload.date);
  const elsewhere = !inPeriod(payload.date, here);
  // An earlier date belongs to an earlier cutoff, so it will not appear in the
  // list on this screen. Say exactly where it went instead of leaving her with
  // "No expenses yet this cutoff".
  gxElsewhere = elsewhere
    ? { label: periodLabel(itsPeriod), item: payload.item || payload.category, amount: payload.amount, date: payload.date }
    : null;
  // `pick` clears so the next tap is a fresh choice; the date is remembered so
  // a run of same-day entries types it once.
  gx = { open:true, pick:'', amount:'', date:gx.date };
  renderGastos();
  toast(elsewhere ? 'Saved to ' + periodLabel(itsPeriod) + '.' : 'Expense added.');
  drainQueue();
}

function deleteGasto(id){
  const e = asObj(state.expenses)[id];
  if (!e) return;
  if (!confirm('Delete "' + (e.item || e.category) + '" (' + peso(e.amount) + ')?')) return;
  applyLocalDeleteExpense({ entryId:id });
  enqueue('deleteExpense', { entryId:id });
  persistState();
  renderGastos();
  toast('Expense deleted.');
  drainQueue();
}

/* ============================================================
   CUTOFF — period preview + note generation (API or demo-local)
   ============================================================ */
let cutoffPer = null;
let lastNote = null; // { key, text, demo }
// A backlog payment being entered on this screen: { ref, amount }.
let payBl = { ref:'', amount:'' };
// periodKey(), splitEdits, splitFieldAmount(), liveCutoff() and pendingSplit()
// all live with the period maths above — the cutoff FIGURES need them to find
// the split entered for a period, not just this screen.

// Days in this period that this phone has but the SHEET does not. The preview
// below counts them (they are real money she entered); a note generated by the
// server would not. Say so rather than letting the two disagree in silence.
// ONLY a refused saveDay counts: a 'gcash' entry is a day the sheet HOLDS whose
// split needs re-entering — informational, so it neither claims "not in the
// sheet" nor blocks the note — 'dropped' is a note about one sku, and a
// refused expense/stocktake/delivery is not a day at all (v2.6.0: a refused
// DELIVERY carries no money, yet it blocked the note with "the note would be
// short" while the server's own dryRun matched the preview to the peso).
function cutoffMissingDays(per){
  return asArr(attention).filter(a => a.kind === 'rejected' && a.action === 'saveDay' &&
    isDateStr(a.date) && inPeriod(a.date, per));
}
// MONEY in this period the phone and the sheet disagree about: a refused
// expense (the preview shows money the sheet lacks) or a refused deletion
// (the sheet still holds money the preview dropped). Either way the server's
// note and the figures above it would tell two stories, so the note waits.
// Stock actions are NEVER here — a delivery or a stocktake carries no money,
// so its refusal cannot make the note wrong; its red card is the whole story.
function cutoffMissingMoney(per){
  return asArr(attention).filter(a => a.kind === 'rejected' &&
    (a.action === 'saveExpense' || a.action === 'deleteExpense') &&
    isDateStr(a.date) && inPeriod(a.date, per));
}

/** Whether this phone can even SEE the whole of a period. The bootstrap
 *  snapshot covers a stated window; a period that starts before it may have
 *  days this phone has never held (or pruned), so the preview cannot promise
 *  to be the whole story — the note the SERVER generates always is, because it
 *  is computed from the full sheet. Demo mode has no window: the phone is the
 *  whole archive there. */
function previewIncomplete(per){
  const ws = txt(asObj(state).window_start);
  return !!config.apiUrl && isDateStr(ws) && txt(asObj(per).start) < ws;
}

/** The date a Cutoff-screen expense (a one-tap chip, a backlog payment) lands
 *  on: today when today is inside the period shown, the period's LAST day for
 *  an earlier cutoff — and NOTHING for a future one, because that would date
 *  real money into a day that has not happened and the server refuses it. */
function cutoffExpenseDate(per){
  const t = todayStr();
  if (inPeriod(t, per)) return t;
  if (txt(asObj(per).end) < t) return asObj(per).end;
  return '';
}

/** What the line under the Split field says. Saying plainly that the figure on
 *  screen is not the one saved is the whole reason the note refuses to be made
 *  while it differs — the user should never have to guess which figure counts. */
function splitHintText(per, f){
  if (pendingSplit(per)) return 'Not saved yet. Tap “Save this split” — the note is made from the saved amount.';
  return asObj(f).splitEntered
    ? 'Saved for this cutoff.'
    : 'The usual amount (' + peso(splitDefault()) + '). Change it for this cutoff only.';
}
/** What the residual MEANS, in words, under the figure. */
function residualNote(remaining){
  const r = num(remaining);
  if (r < 0) return 'This cutoff came up short. Nothing is left for the backlogs.';
  if (r === 0) return 'Nothing left over this cutoff.';
  return 'Left in the business — this is what backlog payments come out of.';
}

function renderCutoff(){
  if (!cutoffPer) cutoffPer = currentPeriod(todayStr());
  const per = cutoffPer;
  const f = computeCutoff(per);
  const s = d2parts(per.start), e = d2parts(per.end);
  const isCurrent = periodKey(per) === periodKey(currentPeriod(todayStr()));
  let h = '';
  const missingDays = cutoffMissingDays(per);
  if (missingDays.length){
    h += '<div class="card attn-card"><p class="attn-head">' +
      (missingDays.length === 1 ? '1 day is not in the sheet yet' : missingDays.length + ' days are not in the sheet yet') +
      '</p><p>' + esc(missingDays.map(a => fmtShort(a.date)).join(', ')) +
      '. The figures below include ' + (missingDays.length === 1 ? 'it' : 'them') +
      ', but the sheet does not — so fix ' + (missingDays.length === 1 ? 'it' : 'them') +
      ' on the Sales screen before you make the note.</p></div>';
  }
  const missingMoney = cutoffMissingMoney(per);
  if (missingMoney.length){
    const one = missingMoney.length === 1;
    h += '<div class="card attn-card"><p class="attn-head">' +
      (one ? 'An expense needs attention first' : missingMoney.length + ' expenses need attention first') +
      '</p><p>' + esc(missingMoney.map(a => fmtShort(a.date)).join(', ')) +
      '. The figures below and the sheet do not agree about ' + (one ? 'it' : 'them') +
      ' — fix ' + (one ? 'it' : 'them') + ' from the red card under More before you make the note.</p></div>';
  }

  h += '<div class="card"><div class="period-nav">' +
    '<button type="button" class="nav-btn" data-act="cutoff-prev" aria-label="Previous cutoff">‹</button>' +
    '<div class="p-label">' + monthName(per.start) + ' ' + s.d + ' – ' + e.d +
      '<span class="p-sub">' + (isCurrent ? 'This cutoff' : s.y) + '</span></div>' +
    '<button type="button" class="nav-btn" data-act="cutoff-next" aria-label="Next cutoff">›</button>' +
  '</div></div>';

  // A period that reaches further back than this phone can see. The preview
  // below is built from the days on this phone, so it may be missing money —
  // say so plainly, and say which figure to trust: the generated note is
  // computed by the server from the whole sheet, so it is the complete one.
  if (previewIncomplete(per)){
    h += '<div class="card" style="border-color:var(--accent);">' +
      '<p style="font-weight:600;">This phone cannot see the whole of this cutoff.</p>' +
      '<p class="hint" style="margin-top:4px;">It only keeps days from ' + esc(fmtShort(state.window_start)) +
        ', so the figures below may be missing earlier days. The note made with “Generate cutoff note” is ' +
        'worked out from the whole Google Sheet, so it is the complete one.</p>' +
    '</div>';
  }

  // The SPLIT is an entered amount now, so it gets a field of its own — pre-filled
  // with this period's saved figure, or the usual one when nothing is saved yet.
  // The residual below updates as it is typed.
  const key = periodKey(per);
  // What the field shows: whatever is being typed for this period, else the saved
  // figure. What the FIGURES show: liveCutoff, which reads a blank field as the
  // usual amount exactly as saveSplit() does — never as ₱0, which would swing
  // the residual by the whole split and flip its label.
  const typed = Object.prototype.hasOwnProperty.call(splitEdits, key) ? splitEdits[key] : null;
  const splitVal = typed == null ? f.split : typed;
  const live = liveCutoff(per);

  // Live local preview
  h += '<div class="card">' +
    '<div class="co-row big"><span>Total</span><span class="v">' + peso(f.total) + '</span></div>' +
    '<div class="co-sub">' + f.daysWithSales + (f.daysWithSales === 1 ? ' day with sales' : ' days with sales') +
      ' · ' + f.openDays + (f.openDays === 1 ? ' day open' : ' days open') + '</div>' +
    '<div class="r-sep" role="presentation"></div>' +
    '<div class="co-row"><span>Cash</span><span class="v">' + peso(f.cash) + '</span></div>' +
    '<div class="co-row gcash"><span>GCash</span><span class="v">' + peso(f.gcash) + '</span></div>' +
    '<div class="r-sep" role="presentation"></div>' +
    '<div class="co-row"><span>Mama</span><span class="v">' + peso(f.mama) + '</span></div>' +
    '<div class="co-row"><span>Split</span><span class="v" id="coSplit">' + peso(live.split) + '</span></div>' +
    '<div class="co-row"><span>Supplies</span><span class="v">' + peso(f.supplies) + '</span></div>' +
    '<div class="co-row"><span>Octopus</span><span class="v">' + peso(f.octopus) + '</span></div>' +
    '<div class="co-row"><span>Salary</span><span class="v">' + peso(f.salary) + '</span></div>' +
    '<div class="co-row"><span>Other payments</span><span class="v">' + peso(f.other) + '</span></div>' +
    '<div class="co-row"><span>Electric bill</span><span class="v">' + peso(f.electric) + '</span></div>' +
    '<div class="r-sep" role="presentation"></div>' +
    // The RESIDUAL: what is left in the business after everything, and what
    // backlog payments are paid out of. Its LABEL carries the sign, exactly like
    // the note — "Remaining" when there is something left, "Short" when there is
    // not. Never clamped to zero.
    '<div class="co-row split' + (live.remaining < 0 ? ' neg' : '') + '" id="coResidualRow">' +
      '<span id="coResidualLabel">' + (live.remaining < 0 ? 'Short' : 'Remaining') + '</span>' +
      '<span class="v" id="coResidual">' + peso(Math.abs(live.remaining)) + '</span></div>' +
    '<div class="co-sub" id="coResidualNote">' + esc(residualNote(live.remaining)) + '</div>' +
  '</div>';

  // The editable Split.
  h += '<div class="card">' +
    '<div class="field" style="margin-bottom:0;">' +
      '<label for="coSplitIn">Split for this cutoff (₱)</label>' +
      '<div class="split-row">' +
        '<input class="input money" id="coSplitIn" inputmode="decimal" autocomplete="off" placeholder="' +
          esc(fmt(splitDefault())) + '" value="' + esc(splitVal === '' ? '' : splitVal) + '">' +
        '<span class="split-each" id="coEach">' + peso(live.perPartner) + ' each</span>' +
      '</div>' +
      '<p class="hint" style="margin-top:8px;" id="coSplitHint">' + esc(splitHintText(per, f)) + '</p>' +
      '<p class="err" id="err-split" hidden></p>' +
      '<button type="button" class="btn block" data-act="split-save" id="splitBtn" style="margin-top:10px;">Save this split</button>' +
    '</div>' +
  '</div>';

  // Paying a backlog out of what is left. It is an ordinary Backlog expense —
  // that is what "Other payments" on the note is made of — but it belongs here,
  // beside the figure it comes out of.
  const activeBl = asArr(state.backlogs).filter(b => isObj(b) && truthy(b.active));
  h += '<div class="section-title">Pay a backlog</div><div class="card">';
  if (!activeBl.length){
    h += '<p class="hint">No active backlogs. Add them in the Backlogs tab of the Google Sheet.</p>';
  } else {
    h += '<p class="hint" style="margin-bottom:12px;">Paid out of what is left (' +
      esc(live.remaining < 0 ? 'nothing this cutoff — it is short ' + peso(-live.remaining)
                             : peso(live.remaining) + ' remaining') +
      '). It is logged as an expense and shows on the note under “Other payments”.</p>' +
      '<div class="field"><label for="payBlRef">Which backlog?</label><select class="input" id="payBlRef">' +
        '<option value=""' + (payBl.ref === '' ? ' selected' : '') + '>Choose…</option>' +
        activeBl.map(b => '<option value="' + esc(b.name) + '"' + (payBl.ref === b.name ? ' selected' : '') + '>' +
          esc(b.name) + ' — balance ' + peso(backlogBalance(b)) + '</option>').join('') +
      '</select></div>' +
      '<div class="field"><label for="payBlAmount">How much? (₱)</label>' +
        '<input class="input money" id="payBlAmount" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(payBl.amount) + '">' +
        '<p class="err" id="err-paybl" hidden></p></div>' +
      '<button type="button" class="btn block" data-act="pay-backlog">Log this payment</button>';
  }
  h += '</div>';

  // Suggested fixed expenses (one tap)
  const mamaAmt = num(asObj(state.settings).mama_per_cutoff);
  const elecAmt = num(asObj(state.settings).electric_per_cutoff);
  const sugg = [];
  if (f.mama === 0 && mamaAmt > 0) sugg.push({ cat:'Mama', item:'Mama', amount:mamaAmt });
  if (f.electric === 0 && elecAmt > 0) sugg.push({ cat:'Electric', item:'Electric bill', amount:elecAmt });
  if (sugg.length){
    h += '<div class="card"><p style="font-weight:600; margin-bottom:10px;">These fixed expenses are not logged yet:</p><div class="chips">';
    for (const sg of sugg){
      h += '<button type="button" class="chip" data-act="cutoff-suggest" data-cat="' + sg.cat + '" data-item="' + esc(sg.item) + '" data-amt="' + sg.amount + '">+ ' + sg.cat + ' ' + peso(sg.amount) + '</button>';
    }
    h += '</div></div>';
  }

  h += '<button type="button" class="btn primary block" data-act="cutoff-generate" id="genBtn">Generate cutoff note</button>';

  if (lastNote && lastNote.key === periodKey(per)){
    // Hidden the moment the Split field stops agreeing with what is saved: this
    // note was built from the SAVED figure, so leaving it on screen under a
    // preview that now says something else is the same contradiction generateNote
    // refuses to create. updateSplitLive un-hides it if she types the figure back.
    h += '<div id="noteBlock" style="margin-top:14px;"' + (pendingSplit(per) ? ' hidden' : '') + '>' +
      (lastNote.demo ? '<p class="hint" style="margin-bottom:8px;">Demo — this was not saved to the sheet.</p>'
                     : '<p class="ok-note" style="margin-bottom:8px;">✓ Saved to the Cutoffs tab of the sheet.</p>') +
      '<pre class="note-pre" id="notePre">' + esc(lastNote.text) + '</pre>' +
      '<div class="btn-row">' +
        '<button type="button" class="btn" data-act="copy-note">Copy</button>' +
        (navigator.share ? '<button type="button" class="btn" data-act="share-note">Share</button>' : '') +
      '</div>' +
    '</div>';
  }

  // BELOW the note, and outside it in every sense: the money this cutoff does not
  // count. Nothing above depends on it and the note does not mention it.
  h += excludedBlockHTML(f);

  // And the period's stock movements — the owner's paper "Last Cutoff supplies
  // count", computed instead of counted by hand (v2.7.4). No money, no figure
  // above depends on it.
  h += stockCutoffHTML(per);

  $('panel-cutoff').innerHTML = h;
}

/** The period's stock story, per product: what came in, what was opened, and
 *  the latest stocktake inside the period — all from rows this phone holds
 *  (deliveries, legacy expense-attached arrivals, usage, counts). Display
 *  only. A period this phone cannot fully see (older than window_start) shows
 *  NOTHING rather than partial sums dressed as truth — same rule the money
 *  preview follows. Products with no movement are left out, not zero-padded. */
function stockCutoffHTML(per){
  if (previewIncomplete(per)) return '';
  const items = activeStockItems();
  if (!items.length) return '';
  const rows = [];
  for (const it of items){
    const product = txt(asObj(it).product);
    let arrived = 0, opened = 0, counted = null;
    const dlv = asObj(state.stockDeliveries);
    for (const d in dlv){
      if (!inPeriod(d, per)) continue;
      for (const r of asArr(dlv[d])) if (txt(asObj(r).product) === product) arrived += num(asObj(r).qty);
    }
    const exps = asObj(state.expenses);
    for (const id in exps){
      const e = asObj(exps[id]);
      if (txt(e.stock_product) === product && inPeriod(txt(e.date), per)) arrived += num(e.stock_qty);
    }
    const usage = asObj(state.stockUsage);
    for (const d in usage){
      if (!inPeriod(d, per)) continue;
      for (const r of asArr(usage[d])) if (txt(asObj(r).product) === product) opened += num(asObj(r).qty);
    }
    const cnts = asObj(state.stockCounts);
    for (const d in cnts){
      if (!inPeriod(d, per)) continue;
      for (const r of asArr(cnts[d])){
        const c = asObj(r);
        if (txt(c.product) !== product) continue;
        if (!counted || d > counted.date ||
            (d === counted.date && txt(c.updated_at) >= counted.updated_at)){
          counted = { date: d, qty: num(c.counted_qty), updated_at: txt(c.updated_at) };
        }
      }
    }
    if (arrived || opened || counted) rows.push({ product, unit: txt(asObj(it).unit), arrived, opened, counted });
  }
  if (!rows.length) return '';
  let h = '<div class="section-title">Stock this cutoff</div><div class="card">' +
    '<p class="hint" style="margin-bottom:10px;">Counted from what was logged — the paper supplies count, done for you. No money in it, and it is in no figure above.</p>';
  for (const r of rows){
    const bits = [];
    if (r.arrived) bits.push(qtyWithUnit(r.arrived, r.unit) + ' came in');
    if (r.opened) bits.push(qtyWithUnit(r.opened, r.unit) + ' opened');
    h += '<div class="co-row"><span>' + esc(r.product) +
      (r.counted ? '<span class="hint"> · counted ' + esc(qtyWithUnit(r.counted.qty, r.unit)) +
        ' on ' + esc(fmtShort(r.counted.date)) + '</span>' : '') + '</span>' +
      '<span class="v">' + esc(bits.join(', ') || '—') + '</span></div>';
  }
  return h + '</div>';
}

/** The period's EXCLUDED money — nori, and anything else the owner keeps out of
 *  the cutoff. Its own block, below the note, labelled so it cannot be mistaken
 *  for part of either: it is in NO figure above it and in NO line of the note.
 *  Nothing sold, nothing shown — a block of zeroes would only be noise. */
function excludedBlockHTML(f){
  const lines = asArr(asObj(f).excludedLines);
  if (!lines.length) return '';
  let h = '<div class="section-title">Not part of this cutoff</div>' +
    '<div class="card excl-card">' +
    '<p class="hint" style="margin-bottom:10px;">This money is NOT in the figures above and NOT in the note. ' +
      'It is sold and counted, and you settle it yourself.</p>';
  for (const l of lines){
    h += '<div class="co-row"><span>' + esc(txt(l.label) || txt(l.sku)) + ' × ' + num(l.qty) +
      '</span><span class="v">' + peso(l.amount) + '</span></div>';
  }
  h += '<div class="sum-row"><span>Total kept out</span><b>' + peso(asObj(f).excluded) + '</b></div>' +
  '</div>';
  return h;
}

async function generateNote(){
  const per = cutoffPer;
  const btn = $('genBtn');
  // A Split typed but not saved is NOT in the note: the note is built from the
  // saved figure (the server reads CutoffInputs, and buildNote reads the same
  // row), so generating one now would print a Split — and a residual — that
  // contradict the figures printed directly above it. Refuse, and say what to
  // tap. Checked before either path: the offline copy is built the same way.
  const pend = pendingSplit(per);
  if (pend){
    setErr('err-split', 'This split is not saved yet. Tap “Save this split”, then make the note.');
    toast('Save the split first (' + peso(pend.amount) + '), then make the note.');
    const el = $('err-split');
    if (el) el.scrollIntoView({ block:'center', behavior: prefersReduced() ? 'auto' : 'smooth' });
    return;
  }
  if (btn){ btn.disabled = true; btn.textContent = 'Generating…'; }
  if (config.apiUrl && navigator.onLine){
    try{
      await drainQueue(); // make sure the note covers everything we've entered
      // drainQueue no-ops when a drain is already running and leaves items
      // queued after a failure — never archive an incomplete note.
      if (queue.length || syncing){
        toast('Some entries are not synced yet. Sync first, then make the note.');
        renderCutoff(); // restores the Generate button
        return;
      }
      // A day the server REFUSED is not in the queue any more, so the queue
      // check above cannot see it — and the note the server builds would be
      // short by that whole day. Never archive money that is missing.
      const missing = cutoffMissingDays(per);
      if (missing.length){
        toast(fmtShort(missing[0].date) + ' is not in the sheet, so the note would be short. Fix it on the Sales screen first.');
        renderCutoff();
        return;
      }
      // Same stop for money the sheet and the preview disagree about — a
      // refused expense or deletion. NOT for refused stock work: a delivery
      // or a stocktake carries no money, so the note is provably unaffected.
      const missingMoney = cutoffMissingMoney(per);
      if (missingMoney.length){
        toast('An expense from ' + fmtShort(missingMoney[0].date) + ' has not reached the sheet, so the note would be wrong. Fix it from the red card under More first.');
        renderCutoff();
        return;
      }
      // Request keys stay camelCase (dryRun); the reply is snake_case
      // (note_text) — older deployments answered noteText, so accept both.
      const data = await api('cutoff', { start:per.start, end:per.end, dryRun:false });
      const served = isObj(data) ? txt(pick(data, 'note_text', 'noteText')) : '';
      lastNote = { key:periodKey(per), text: served || buildNote(computeCutoff(per), per), demo:false };
      renderCutoff();
      return;
    }catch(err){
      console.error(err);
      // The server REFUSED the note (a negative category, an unsaved split —
      // things that make the note itself a lie). Show its sentence and STOP
      // (v2.5.1): the phone's own copy would contain exactly the line the
      // refusal exists to prevent, so "falling back" to it converts the
      // refusal into the bad artifact. No note, no Copy, no Share.
      if (err && err.server){
        toast(err.message);
        renderCutoff();
        return;
      }
      // The phone's own copy of a period it cannot fully see would be SHORT —
      // real money missing from a note that looks finished. Refuse it; only the
      // server can build this one.
      if (previewIncomplete(per)){
        toast(friendlyError(err, 'Please try again in a moment.') +
          ' This phone cannot see the whole of this cutoff, so the note must come from the sheet.');
        renderCutoff();
        return;
      }
      toast(friendlyError(err, 'Please try again in a moment.') + ' Showing the copy from this phone.');
    }
  }
  // Offline (or no API yet) with an incomplete view: same refusal, same reason.
  if (previewIncomplete(per)){
    toast('This phone cannot see the whole of this cutoff. Connect to the internet and try again — the note must be made from the whole sheet.');
    renderCutoff();
    return;
  }
  // Every locally-built note — demo mode, or the copy shown after a network
  // failure — applies the refusals the server would apply, in its words
  // (v2.5.1). A negative category refuses the local note exactly as it refuses
  // the real one; without this, demo mode happily printed "Supplies - -400".
  const refused = noteRefusal(per);
  if (refused){
    toast(refused);
    renderCutoff();
    return;
  }
  lastNote = { key:periodKey(per), text:buildNote(computeCutoff(per), per), demo:true };
  renderCutoff();
}

async function copyNote(){
  if (!lastNote) return;
  try{
    await navigator.clipboard.writeText(lastNote.text);
    toast('Note copied.');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = lastNote.text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); toast('Note copied.'); }
    catch(e2){ toast('Could not copy. Select the text instead.'); }
    ta.remove();
  }
}
async function shareNote(){
  if (!lastNote || !navigator.share) return;
  try{ await navigator.share({ text:lastNote.text }); }catch(e){ /* user cancelled */ }
}

/* ---- The editable Split: live residual, then a queued save ---- */
// Only the four figures the split moves are touched, so the keyboard stays up
// and nothing else on the screen flickers while she types.
function updateSplitLive(){
  if (!cutoffPer) return;
  const key = periodKey(cutoffPer);
  const raw = Object.prototype.hasOwnProperty.call(splitEdits, key) ? splitEdits[key] : '';
  // The one reading of the field, shared with renderCutoff and the note guard:
  // blank means the usual amount, so what is shown is what a save would write.
  const f = computeCutoff(cutoffPer);
  const live = liveCutoff(cutoffPer);
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set('coSplit', peso(live.split));
  set('coEach', peso(live.perPartner) + ' each');
  set('coResidualLabel', live.remaining < 0 ? 'Short' : 'Remaining');
  set('coResidual', peso(Math.abs(live.remaining)));
  set('coResidualNote', residualNote(live.remaining));
  set('coSplitHint', splitHintText(cutoffPer, f));
  const row = $('coResidualRow');
  if (row) row.classList.toggle('neg', live.remaining < 0);
  // A note already on screen was built from the SAVED split. While the field
  // disagrees with it, take it off the screen rather than let it sit under
  // figures that now say something else. (Hidden, not re-rendered: a re-render
  // here would close the keyboard mid-figure.)
  const block = $('noteBlock');
  if (block) block.hidden = !!pendingSplit(cutoffPer);
  setErr('err-split', num(raw) < 0 ? 'The split cannot be less than zero.' : '');
}

function saveSplit(){
  const per = cutoffPer;
  const key = periodKey(per);
  const raw = Object.prototype.hasOwnProperty.call(splitEdits, key) ? splitEdits[key] : '';
  // The same reading the preview uses, so the figure saved is the figure shown.
  const amount = splitFieldAmount(raw);
  if (amount < 0){ setErr('err-split', 'The split cannot be less than zero.'); return; }
  // Re-use the entry_id of the row already saved for this period, so re-entering
  // the figure rewrites ONE row (the sheet upserts by (start, end) as well) and
  // the queue keeps just one item for it.
  const existing = asObj(state.cutoffInputs)[key];
  const payload = {
    start: per.start, end: per.end, amount: r2(amount),
    entryId: txt(asObj(existing).entry_id) || uuid()
  };
  applyLocalCutoffSplit(payload);
  enqueue('saveCutoffSplit', payload);
  delete splitEdits[key];
  persistState();
  renderCutoff();
  toast('Split saved: ' + peso(amount) + ' (' + peso(r2(amount / 2)) + ' each).');
  drainQueue();
}

/* ---- Paying a backlog, from the screen that shows what is left to pay it with.
   It is an ordinary Expenses row of category Backlog — the same thing the
   Expenses screen writes — so "Other payments" on the note picks it up. ---- */
function payBacklog(){
  const amount = num(payBl.amount);
  const err = $('err-paybl');
  if (!payBl.ref){
    if (err){ err.textContent = 'Choose which backlog you paid.'; err.hidden = false; }
    return;
  }
  if (!(amount > 0)){
    if (err){ err.textContent = 'Enter how much you paid.'; err.hidden = false; }
    return;
  }
  const bl = asArr(state.backlogs).find(b => isObj(b) && b.name === payBl.ref);
  const balance = bl ? backlogBalance(bl) : 0;
  if (bl && amount > balance &&
      !confirm('That is more than the ' + peso(balance) + ' still owed on ' + payBl.ref + '. Log it anyway?')) return;
  if (err) err.hidden = true;
  // Dated today when today is inside the period being shown, else the period's
  // last day, so the payment lands in the cutoff it is being paid for. A FUTURE
  // cutoff has no valid day yet — dating money into a day that has not happened
  // is exactly what the server refuses.
  const date = cutoffExpenseDate(cutoffPer);
  if (!date){
    toast('This cutoff has not started yet, so a payment cannot be dated into it. Go back to the current cutoff first.');
    return;
  }
  const payload = { date, category:'Backlog', item:'Backlog payment', amount:r2(amount),
    backlogRef: payBl.ref, notes:'', entryId: uuid() };
  applyLocalExpense(payload);
  enqueue('saveExpense', payload);
  persistState();
  const name = payBl.ref;
  payBl = { ref:'', amount:'' };
  renderCutoff();
  toast('Paid ' + peso(amount) + ' on ' + name + '.');
  drainQueue();
}

function addSuggestedExpense(cat, item, amount){
  // Same date rule as payBacklog: today inside the period, the last day of an
  // earlier one — and NEVER a day that has not happened yet. The one-tap chip
  // used to date Mama/Electric into the future when the arrows sat on a
  // not-yet-started cutoff, and the server refuses a future date outright.
  const date = cutoffExpenseDate(cutoffPer);
  if (!date){
    toast('This cutoff has not started yet, so this cannot be added to it now.');
    return;
  }
  const payload = { date, category:cat, item, amount:num(amount), backlogRef:'', notes:'',
    entryId:uuid() };
  applyLocalExpense(payload);
  enqueue('saveExpense', payload);
  persistState();
  renderCutoff();
  toast('Added: ' + cat + ' ' + peso(amount));
  drainQueue();
}

/* ---- Stock on hand. Every figure here is COMPUTED (see stockStatusOf) and the
   card says where it comes from, because a number nobody can explain is a number
   nobody trusts. "Correct the count" is the one action that moves the baseline.
   "Stock came in" is the one action that records a delivery (v2.6.0): quantity
   only, no money anywhere near it — the supplier delivers on credit, and paying
   him later is an ordinary Supplies expense. ---- */
let countingProduct = '';   // the product whose count field is open
let countDraft = '';        // what is typed in it
let arriving = false;       // whether the "Stock came in" form is open
// One row per ACTIVE product, SNAPSHOTTED when the form opens — each row
// carries its own {product, unit, qty}, exactly like the Sales screen's stock
// card, so a stock-list change while the form is open (a Maintenance save, a
// background sync) can never shift a typed quantity onto a different product
// or drop it. Rows are still ADDRESSED by index (a name is sheet data), but
// they RESOLVE by the name they carry. A row whose product was renamed or
// deactivated mid-form saves under its stored name; if the sheet no longer
// knows it, the server refuses in its plain sentence and the red card says so
// — misdirected stock is silent, a refusal is not. (Owner, 2026-08-19: "dont
// let me choose, just present all the stocks with + button".)
let arrival = { rows: [], date: todayStr() };

function stockOnHandHTML(){
  let list = [];
  try{ list = stockStatusList(); }catch(err){ console.error(err); }
  let h = '<div class="section-title">Stock on hand</div><div class="card">';
  if (!list.length){
    h += '<p class="hint">No products yet. Add them under Maintenance below.</p></div>';
    return h;
  }
  const anyLow = list.some(s => s.low);
  h += '<p class="hint" style="margin-bottom:6px;">Worked out from what has arrived and what has been opened since the last count. ' +
    'A count is an END-OF-DAY figure and becomes the new starting point.</p>';
  if (anyLow) h += '<p class="hint" style="color:var(--alert); font-weight:600;">Time to buy what is marked LOW.</p>';

  // "Stock came in" — record a DELIVERY: what arrived and how many whole units.
  // No money field on purpose: it is not paid yet. Paying the supplier later is
  // a normal Supplies expense, whenever that happens.
  if (!arriving){
    h += '<button type="button" class="btn block" data-act="arrive-open" style="margin:6px 0 14px;">Stock came in</button>';
  } else {
    // Every product listed with its own stepper — the list is constant, so
    // there is nothing to choose, only counts to tap in. The rows are the
    // SNAPSHOT taken when the form opened (see `arrival`), never the live
    // list: typed work must not move because the list did (v2.7.4).
    h += '<div style="margin:6px 0 14px;">' +
      '<p class="hint" style="margin-bottom:6px;">Tap + on what arrived — whole units only, the same way you count what you open. No money here: paying for it is a normal expense, whenever you pay.</p>';
    asArr(arrival.rows).forEach((s, i) => {
      const label = 'Units of ' + txt(s.product) + ' that arrived';
      h += '<div class="stk-row">' +
        '<div class="stk-what"><span class="stk-name">' + esc(s.product) + '</span>' +
          (s.unit ? '<span class="stk-unit">by the ' + esc(s.unit) + '</span>' : '') + '</div>' +
        '<div class="stepper sm" data-arrstep="' + i + '">' +
          '<button type="button" class="step-btn" data-act="arrive-step" data-dir="-1" aria-label="One less: ' + esc(label) + '">−</button>' +
          '<input class="step-val" id="in-arr-' + i + '" inputmode="numeric" autocomplete="off" ' +
            'value="' + esc(txt(s.qty)) + '" aria-label="' + esc(label) + '">' +
          '<button type="button" class="step-btn" data-act="arrive-step" data-dir="1" aria-label="One more: ' + esc(label) + '">+</button>' +
        '</div>' +
      '</div>';
    });
    h += '<div class="field" style="margin-top:10px;"><label for="arrDate">When did it arrive?</label>' +
        '<input class="input" type="date" id="arrDate" value="' + esc(arrival.date) + '" max="' + todayStr() + '"></div>' +
      '<p class="err" id="err-arrive" hidden></p>' +
      '<div class="btn-row"><button type="button" class="btn" data-act="arrive-cancel">Close</button>' +
        '<button type="button" class="btn primary" data-act="arrive-save">Add to stock</button></div>' +
    '</div>';
  }

  for (const s of list){
    const nm = esc(s.product);
    const isCounting = countingProduct === s.product;
    h += '<div class="st-item">' +
      '<div class="st-top">' +
        '<span class="st-name">' + nm + '</span>' +
        (s.low ? '<span class="badge-low">Low</span>' : '') +
        '<span class="st-qty' + (s.on_hand < 0 ? ' neg' : '') + '">' + esc(qtyWithUnit(s.on_hand, s.unit)) + '</span>' +
      '</div>' +
      '<div class="st-sub">' + esc(stockExplain(s)) + '</div>' +
      // A negative figure is honest information, not an error to hide: it means
      // more has been opened than the count and the deliveries account for.
      (s.on_hand < 0
        ? '<div class="st-sub" style="color:var(--alert);">Below zero, so the starting figure is out of date. Count what is really there and tap “Correct the count”.</div>'
        : '') +
      (s.reorder_at > 0 ? '<div class="st-sub">Buy more at ' + esc(qtyWithUnit(s.reorder_at, s.unit)) + ' or less.</div>' : '') +
      (isCounting
        ? '<div class="st-count">' +
            '<div><label for="stCountIn">Counted today</label>' +
              '<input class="input money" id="stCountIn" inputmode="numeric" autocomplete="off" placeholder="0" value="' + esc(countDraft) + '"></div>' +
            '<button type="button" class="btn small primary" data-act="count-save" data-product="' + nm + '">Save count</button>' +
            '<button type="button" class="btn small" data-act="count-cancel">Cancel</button>' +
          '</div>' +
          '<p class="hint" style="margin-top:8px;">Count what is on the shelf at closing time today. From now on, on hand is this figure plus what arrives and minus what is opened.</p>' +
          '<p class="err" id="err-count" hidden></p>'
        : '<div class="st-acts"><button type="button" class="btn small" data-act="count-open" data-product="' + nm + '">Correct the count</button></div>') +
    '</div>';
  }
  return h + '</div>';
}

/** Where the figure comes from, in one plain sentence. */
function stockExplain(s){
  const from = s.baseline_date
    ? 'Counted ' + qtyWithUnit(s.baseline_qty, s.unit) + ' on ' + fmtShort(s.baseline_date)
    : 'Started at ' + qtyWithUnit(s.baseline_qty, s.unit);
  const bits = [];
  if (s.delivered_since) bits.push(qtyWithUnit(s.delivered_since, s.unit) + ' arrived');
  if (s.used_since) bits.push(qtyWithUnit(s.used_since, s.unit) + ' opened');
  return from + (bits.length ? ', then ' + bits.join(' and ') : ', nothing since') + '.';
}

function openCount(product){
  countingProduct = txt(product);
  const s = stockStatusList().find(x => x.product === countingProduct);
  // Pre-filled with the figure the app thinks is there, so a count that only
  // confirms it is one tap. A negative one starts blank — there is nothing
  // sensible to confirm.
  countDraft = s && s.on_hand > 0 ? String(s.on_hand) : '';
  renderIbapa();
  const f = $('stCountIn');
  if (f) f.focus();
}
function saveStockCountNow(product){
  const p = txt(product);
  const err = $('err-count');
  const qty = num(countDraft);
  if (countDraft === '' || qty < 0 || !isWhole(qty)){
    if (err){
      err.textContent = countDraft === ''
        ? 'Enter how many there are.'
        : 'Count whole units (1, 2, 3) — “' + txt(countDraft) + '” is not a whole unit.';
      err.hidden = false;
    }
    return;
  }
  // Dated TODAY: a stocktake is what you can see now, and the server reads it as
  // an end-of-day figure that already includes today's deliveries and usage.
  const payload = { date: todayStr(), product: p, qty, entryId: uuid() };
  applyLocalStockCount(payload);
  enqueue('saveStockCount', payload);
  persistState();
  countingProduct = ''; countDraft = '';
  renderIbapa();
  toast(p + ': counted ' + qtyWithUnit(qty, stockUnitOf(p)) + '. That is the new starting figure.');
  drainQueue();
}

/** One press of the arrival stepper. Clamped at 0 (the validator asks for at
 *  least 1) and always a whole number — the buttons can only ever step by one. */
function arriveStep(i, dir){
  const row = asArr(arrival.rows)[num(i)];
  if (!row) return;
  const q = Math.max(0, Math.floor(num(row.qty)) + (num(dir) > 0 ? 1 : -1));
  row.qty = String(q);
  const f = $('in-arr-' + num(i));
  if (f) f.value = String(q);
}

/** Save the deliveries: one row per product with a quantity, no money anywhere
 *  near any of them (v2.6.0). The same clamps the server applies — at least 1
 *  whole unit per named row, an event date (no future, no pre-2020) — refused
 *  here in the server's own words so the phone never queues a row the sheet
 *  will bounce. Each product is its own saveStockDelivery (its own entryId),
 *  so a replay converges per product. On-hand rises the moment this returns. */
function saveArrival(){
  const err = $('err-arrive');
  const dateBad = entryDateError(arrival.date);
  let bad = '';
  const rows = [];
  if (dateBad) bad = dateBad;
  else {
    // Each row resolves by the NAME it has carried since the form opened —
    // never by position in the live list, which may have changed underneath
    // (v2.7.4: an index resolved at save time silently booked a quantity
    // typed on one product against a different one).
    for (const s of asArr(arrival.rows)){
      if (bad) break;
      const raw = txt(asObj(s).qty);
      if (raw === '' || num(raw) === 0) continue;    // untouched row: nothing arrived
      const qty = num(raw);
      if (!isWhole(qty) || qty < 1){
        bad = txt(s.product) + ': count whole units (1, 2, 3) — “' + raw + '” is not a whole unit.';
      } else {
        rows.push({ product: txt(s.product), unit: txt(s.unit), qty });
      }
    }
    if (!bad && !rows.length) bad = 'Tap + on what arrived — at least one product.';
  }
  if (bad){
    if (err){ err.textContent = bad; err.hidden = false; }
    return;
  }
  const date = arrival.date || todayStr();
  const said = [];
  for (const r of rows){
    const payload = { date, product: r.product, qty: r.qty, entryId: uuid() };
    applyLocalStockDelivery(payload);
    enqueue('saveStockDelivery', payload);
    said.push(qtyWithUnit(r.qty, r.unit) + ' of ' + r.product);
  }
  persistState();
  arriving = false;
  arrival = { rows: [], date: todayStr() };
  renderIbapa();
  toast('Added to your stock: ' + said.join(', ') +
    '. Paying for it goes under Expenses as usual, whenever you pay.');
  drainQueue();
}

/* ---- Maintenance. One place to change the prices, the constants and the stock
   list without opening the sheet on a phone. Every save goes through the offline
   queue like any other mutation. The API token is never shown or sent here. ---- */
let maintOpen = false;
let maintPrices = null;   // sku -> { price, cheesePrice, active, inCutoff }
let maintConst = null;    // the six settings, as typed
let maintStock = null;    // product -> { unit, reorderAt, active }

/** Load the forms from the current state. Called when the section is opened, so
 *  it always starts from what the sheet last said. */
function maintLoad(){
  // Keyed by sku / product name — sheet data, so both maps are prototype-free:
  // a sku spelled "__proto__" must land in the map, never on its prototype.
  maintPrices = Object.create(null);
  for (const p of asArr(state.prices)){
    if (!isObj(p) || !txt(p.sku)) continue;
    maintPrices[p.sku] = { price: num(p.price), cheesePrice: num(p.cheese_price),
      active: truthy(p.active), inCutoff: inCutoffFlag(p.in_cutoff) };
  }
  const st = asObj(state.settings);
  maintConst = {
    daily_salary: dailySalary(), split_default: splitDefault(),
    mama_per_cutoff: num(st.mama_per_cutoff), electric_per_cutoff: num(st.electric_per_cutoff),
    branch: txt(st.branch), staff: txt(st.staff),
    supply_picklist: txt(st.supply_picklist)
  };
  maintStock = Object.create(null);
  for (const s of asArr(state.stockItems)){
    if (!isObj(s) || !txt(s.product)) continue;
    maintStock[s.product] = { unit: txt(s.unit), reorderAt: s.reorder_at === '' ? '' : num(s.reorder_at), active: truthy(s.active) };
  }
}

/** A sync in the middle of editing can add a price or a product, or take one
 *  away. Top the forms up (never overwriting what is already typed) and drop what
 *  has gone, so the fields on screen are exactly the rows that will be saved —
 *  a row rendered from a missing entry would otherwise save a ₱0 price. */
function maintTopUp(){
  if (!maintPrices) return maintLoad();
  const keepP = Object.create(null);
  for (const p of asArr(state.prices)){
    if (!isObj(p) || !txt(p.sku)) continue;
    keepP[p.sku] = true;
    if (!maintPrices[p.sku]){
      maintPrices[p.sku] = { price: num(p.price), cheesePrice: num(p.cheese_price),
        active: truthy(p.active), inCutoff: inCutoffFlag(p.in_cutoff) };
    }
  }
  for (const sku in maintPrices) if (!keepP[sku]) delete maintPrices[sku];
  const keepS = Object.create(null);
  for (const s of asArr(state.stockItems)){
    if (!isObj(s) || !txt(s.product)) continue;
    keepS[s.product] = true;
    if (!maintStock[s.product]){
      maintStock[s.product] = { unit: txt(s.unit), reorderAt: s.reorder_at === '' ? '' : num(s.reorder_at), active: truthy(s.active) };
    }
  }
  for (const p in maintStock) if (!keepS[p]) delete maintStock[p];
}

/** What is wrong with one price row — or '' when it is fine. `pr` is the sheet's
 *  own row (for the name, and whether it has a cheese version); `m` is what is
 *  typed in the fields. Every rule apiSavePrices() enforces is mirrored here, in
 *  the same order, so the phone never queues a price change the server refuses.
 *
 *  A CLEARED field reads as 0, and a ₱0 price on something still marked "Still
 *  selling this" gives it away all night: the Sales card read "₱0 · Cheese ₱60"
 *  and every box counted for free, with nothing anywhere saying why. So a price
 *  is required while a sku is being sold — turning it off is how you stop
 *  selling it. An inactive sku may keep a 0: it sells nothing. */
function priceRowError(pr, m){
  const label = txt(asObj(pr).label) || txt(asObj(pr).sku);
  const price = num(asObj(m).price), cheese = num(asObj(m).cheesePrice);
  const isBox = asObj(pr).group === 'box';
  if (price < 0 || cheese < 0) return 'A price cannot be less than zero.';
  if (asObj(m).active){
    if (!(price > 0)){
      return label + ' is still being sold, so it needs a price. At ₱0 every box would ' +
        'count as free. Type a price, or turn “Still selling this” off.';
    }
    // Only a box sku has a cheese version at all; group=simple keeps its 0.
    if (isBox && !(cheese > 0)){
      return label + ' is still being sold, so it needs a cheese price too. At ₱0 every ' +
        'cheese box would count as free. Type a price, or turn “Still selling this” off.';
    }
  }
  // Keeping money out of the cutoff means ONE plain quantity at ONE price: no cheese
  // variant and no cash/GCash split. A box sku cannot be that, so apiSavePrices
  // REFUSES the batch — and this refusal has to happen before the toggle is applied
  // locally, or the phone starts hiding that sku's cheese steppers (and zeroing its
  // cheese counts) while the sheet still has it counting in the cutoff with a cheese
  // price. Checked whether or not the sku is still being sold, exactly as the server
  // checks it: an inactive box cannot be kept out of the cutoff either.
  // Only an EXPLICIT false is refused, and for the same reason the server only
  // WRITES an explicit value: a row that says nothing about the flag (an older
  // build's queued batch) means "leave it exactly as it is", so treating a missing
  // field as false would refuse every ordinary price edit ever queued.
  const flagGiven = !(asObj(m).inCutoff === null || asObj(m).inCutoff === undefined || asObj(m).inCutoff === '');
  if (flagGiven && !inCutoffFlag(asObj(m).inCutoff) && isBox){
    return label + ' is a box with a cheese version, so it cannot be kept out of the cutoff. ' +
      'An item kept out is a simple item: one price and no cheese. Leave “Counts in the cutoff” ' +
      'on for it, or change its group to simple in the Prices tab of the sheet.';
  }
  return '';
}

/**
 * The Settings payload the "Standing amounts" card sends — built from what is
 * TYPED, with every BLANK field left out entirely (v2.5.1).
 *
 * Blank means "unchanged", never ₱0: a wage field swiped clear and saved used
 * to travel as 0 (num('') is 0), write daily_salary = 0 to the sheet, and every
 * later day snapshotted a ₱0 wage — the note's Salary line went blank and
 * Remaining was overstated by a day's wage at a time. An explicit 0 ("nobody is
 * paid") must be TYPED. The server reads a blank the same way, but it never
 * gets to see one from this screen unless the key is omitted — which is what
 * this does. Branch/staff follow the same rule (a blank branch is separately
 * refused before this is called: it heads the note).
 */
function maintSettingsPayload(mc){
  const m = asObj(mc);
  const settings = {};
  const branch = txt(m.branch).trim();
  if (branch) settings.branch = branch;
  const staff = txt(m.staff).trim();
  if (staff) settings.staff = staff;
  // Same blank-omission rule: a cleared picklist field means "leave the sheet's
  // list alone", never "wipe the chips off the expense form".
  const picklist = txt(m.supply_picklist).trim();
  if (picklist) settings.supply_picklist = picklist;
  for (const k of ['daily_salary','split_default','mama_per_cutoff','electric_per_cutoff']){
    const raw = m[k];
    if (raw === '' || raw == null) continue;   // blank = leave the sheet's figure alone
    settings[k] = r2(Math.max(0, num(raw)));
  }
  return settings;
}

function saveMaintPrices(){
  maintTopUp();
  const rows = [];
  for (const sku in maintPrices){
    const m = maintPrices[sku];
    const bad = priceRowError(asArr(state.prices).find(p => isObj(p) && p.sku === sku) || { sku }, m);
    if (bad){ setErr('err-maint-prices', bad); return; }
    // `inCutoff` travels because this screen KNOWS the flag — it is showing the
    // toggle. (The server writes that cell only when a payload carries it, so a
    // batch queued by an older build still leaves every flag exactly as it is.)
    rows.push({ sku, price: r2(m.price), cheesePrice: r2(m.cheesePrice),
      active: !!m.active, inCutoff: !!m.inCutoff });
  }
  setErr('err-maint-prices', '');
  const payload = { rows, entryId: uuid() };
  applyLocalPrices(payload);
  enqueue('savePrices', payload);
  persistState();
  maintLoad();
  renderIbapa();
  toast('Prices saved. They count for the days you save from now on.');
  drainQueue();
}

function saveMaintSettings(){
  if (!txt(maintConst.branch).trim()){
    setErr('err-maint-set', 'The branch name cannot be empty — it is the first line of the note.');
    return;
  }
  for (const k of ['daily_salary','split_default','mama_per_cutoff','electric_per_cutoff']){
    const raw = maintConst[k];
    if (raw !== '' && raw != null && num(raw) < 0){
      setErr('err-maint-set', 'These amounts cannot be less than zero.'); return;
    }
  }
  setErr('err-maint-set', '');
  // Only the whitelisted keys travel, and `token` is not one of them — it is
  // never read from here, never sent, never editable on this screen. A BLANK
  // field is OMITTED from the payload entirely (v2.5.1): blank means
  // "unchanged", and an explicit ₱0 must be typed — see maintSettingsPayload.
  const settings = maintSettingsPayload(maintConst);
  const payload = { settings, entryId: uuid() };
  applyLocalSettings(payload);
  enqueue('saveSettings', payload);
  persistState();
  maintLoad();
  updateStatus();
  renderIbapa();
  toast('Saved.');
  drainQueue();
}

function saveMaintStock(){
  maintTopUp();
  const rows = [];
  for (const product in maintStock){
    const m = maintStock[product];
    if (m.reorderAt !== '' && (num(m.reorderAt) < 0 || !isWhole(num(m.reorderAt)))){
      setErr('err-maint-stock', 'Use whole units for “Buy more at”, or leave it empty.');
      return;
    }
    rows.push({ product, unit: txt(m.unit).trim(), reorderAt: m.reorderAt === '' ? '' : num(m.reorderAt), active: !!m.active });
  }
  setErr('err-maint-stock', '');
  const payload = { rows, entryId: uuid() };
  applyLocalStockItems(payload);
  enqueue('saveStockItems', payload);
  persistState();
  maintLoad();
  renderIbapa();
  toast('Stock list saved.');
  drainQueue();
}

async function testConnection(){
  const btn = $('testBtn'), out = $('testResult');
  if (!config.apiUrl){ out.textContent = 'Enter the URL first.'; return; }
  btn.disabled = true; out.textContent = 'Testing…';
  try{
    const data = await api('ping', {});
    out.innerHTML = '<span class="ok-note">✓ Connected. API version ' + esc((data && data.version) || '?') + '</span>';
    toast('Connected to the API.');
    await drainQueue();
    await doBootstrap();
  }catch(err){
    console.error(err);
    const msg = friendlyError(err, 'Check the internet connection and the URL above, then try again.');
    out.innerHTML = '<span style="color:var(--alert); font-weight:600;">✗ ' + esc(msg) + '</span>';
  }finally{
    const b = $('testBtn');
    if (b) b.disabled = false;
    updateStatus();
  }
}

/* ============================================================
   Event wiring — delegated clicks/inputs per panel + globals
   ============================================================ */
document.addEventListener('click', (ev) => {
  // A tap anywhere means she is no longer typing, so any re-render that was
  // held back for the keyboard's sake can land now.
  setTimeout(flushBentaRender, 0);
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'goto-ibapa') showTab('ibapa');

  // Needs attention
  else if (act === 'attn-open') openAttentionEntry(el.dataset.key);
  else if (act === 'attn-retry') retryAttention(el.dataset.key);
  else if (act === 'attn-dismiss') dismissAttention(el.dataset.key);

  // Sales
  else if (act === 'step'){
    const st = el.closest('.stepper');
    bentaStep(st.dataset.sku, st.dataset.field, Number(el.dataset.dir));
  }
  else if (act === 'staff'){
    benta.staff = el.dataset.staff;
    benta.dirty = true;
    document.querySelectorAll('#panel-benta [data-act="staff"]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.staff === benta.staff)));
  }
  else if (act === 'toggle-stock') toggleCollapse('stock');
  else if (act === 'toggle-wage') toggleCollapse('wage');
  else if (act === 'toggle-gcash') toggleCollapse('gcash');
  else if (act === 'lid-step') lidStep(Number(el.dataset.dir));
  else if (act === 'stock-step'){
    const st = el.closest('[data-stkstep]');
    if (st) stockStep(st.dataset.stkstep, Number(el.dataset.dir));
  }
  // The conversion's direction (v2.7.3): a chip, so the amount never carries a
  // sign. Changing it is a real edit of the day — it moves the split.
  else if (act === 'conv-dir'){
    benta.convDir = el.dataset.dir === 'in' ? 'in' : 'out';
    benta.dirty = true;
    renderBenta();
    validateBentaLive();
  }
  else if (act === 'save-day') saveBenta();
  else if (act === 'goto-stock') showTab('ibapa');

  // Expenses
  else if (act === 'gastos-open'){ gx.open = true; gx.date = todayStr(); renderGastos(); }
  else if (act === 'gastos-cancel'){ gx.open = false; gxElsewhere = null; renderGastos(); }
  // The bucket IS the whole choice (v2.7.1): Octopus/Other file as those
  // categories, a picklist name files as Supplies with that name as the item.
  else if (act === 'gastos-pick'){
    gx.pick = txt(el.dataset.pick);
    renderGastos();
    const f = $('gxAmount'); if (f) f.focus();
  }
  else if (act === 'gastos-submit') submitGasto();
  else if (act === 'gastos-del') deleteGasto(el.dataset.id);

  // Cutoff
  else if (act === 'cutoff-prev'){ cutoffPer = shiftPeriod(cutoffPer, -1); renderCutoff(); }
  else if (act === 'cutoff-next'){ cutoffPer = shiftPeriod(cutoffPer, 1); renderCutoff(); }
  else if (act === 'cutoff-suggest') addSuggestedExpense(el.dataset.cat, el.dataset.item, el.dataset.amt);
  else if (act === 'cutoff-generate') generateNote();
  else if (act === 'copy-note') copyNote();
  else if (act === 'share-note') shareNote();
  else if (act === 'split-save') saveSplit();
  else if (act === 'pay-backlog') payBacklog();

  // More tab
  else if (act === 'sync-now'){
    // Drain FIRST so the bootstrap snapshot reflects our mutations —
    // the reverse order can overwrite local edits with pre-edit rows.
    (async () => {
      await drainQueue();
      await doBootstrap();
      if (activeTab === 'ibapa') renderIbapa();
    })();
  }
  else if (act === 'test-conn') testConnection();

  // Stock on hand
  else if (act === 'count-open') openCount(el.dataset.product);
  else if (act === 'count-cancel'){ countingProduct = ''; countDraft = ''; renderIbapa(); }
  else if (act === 'count-save') saveStockCountNow(el.dataset.product);
  else if (act === 'arrive-open'){
    arriving = true;
    // SNAPSHOT the list now: each row owns its product name from here on.
    arrival = { rows: activeStockItems().map(s => ({
      product: txt(asObj(s).product), unit: txt(asObj(s).unit), qty: '' })), date: todayStr() };
    renderIbapa();
  }
  else if (act === 'arrive-cancel'){ arriving = false; renderIbapa(); }
  else if (act === 'arrive-step'){
    const st = el.closest('[data-arrstep]');
    if (st) arriveStep(st.dataset.arrstep, Number(el.dataset.dir));
  }
  else if (act === 'arrive-save') saveArrival();

  // Maintenance
  else if (act === 'maint-open'){ maintOpen = true; maintLoad(); renderIbapa(); }
  else if (act === 'maint-close'){ maintOpen = false; renderIbapa(); }
  else if (act === 'maint-save-prices') saveMaintPrices();
  else if (act === 'maint-save-set') saveMaintSettings();
  else if (act === 'maint-save-stock') saveMaintStock();
});

document.querySelector('.tabbar').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-tab]');
  if (b) showTab(b.dataset.tab);
});

document.addEventListener('input', (ev) => {
  // The stock rows are addressed by their row INDEX in a data attribute: a
  // product name is sheet data and would make an id ambiguous.
  const ds = ev.target.dataset || {};
  if (ds.stk != null){
    const r = asArr(benta.stock)[num(ds.stk)];
    if (r){ r.qty = ev.target.value; benta.dirty = true; updateStockCard(); validateBentaLive(); }
    return;
  }
  // Maintenance fields, all keyed by the row they belong to (sku or product).
  if (ds.mprice != null){ if (maintPrices[ds.mprice]) maintPrices[ds.mprice].price = ev.target.value; return; }
  if (ds.mcheese != null){ if (maintPrices[ds.mcheese]) maintPrices[ds.mcheese].cheesePrice = ev.target.value; return; }
  if (ds.munit != null){ if (maintStock[ds.munit]) maintStock[ds.munit].unit = ev.target.value; return; }
  if (ds.mreorder != null){ if (maintStock[ds.mreorder]) maintStock[ds.mreorder].reorderAt = ev.target.value; return; }
  if (ds.mset != null){
    if (maintConst && Object.prototype.hasOwnProperty.call(SETTABLE_SETTINGS, ds.mset)) maintConst[ds.mset] = ev.target.value;
    return;
  }

  const id = ev.target.id;
  if (!id) return;

  // Sales fields. There is no typed GCash total any more — it is computed.
  if (id === 'customAmount'){ benta.custom = ev.target.value; benta.dirty = true; updateReceipt(); validateBentaLive(); }
  else if (id === 'customGcash'){ benta.customGcash = ev.target.value; benta.dirty = true; updateReceipt(); validateBentaLive(); }
  else if (id === 'gcashConverted'){ benta.gcashConverted = ev.target.value; benta.dirty = true; updateReceipt(); validateBentaLive(); }
  else if (id === 'lidBoxesIn'){ benta.lidBoxes = ev.target.value; benta.dirty = true; updateReceipt(); validateBentaLive(); }
  else if (id === 'daySalary'){ benta.salary = ev.target.value; benta.dirty = true; updateWageCard(); validateBentaLive(); }
  else if (id === 'dayNotes'){ benta.notes = ev.target.value; benta.dirty = true; }
  else if (id.startsWith('in-')){
    // Take the sku/field from the stepper's data attributes rather than
    // parsing them back out of the id — a sku is sheet data and may contain
    // dashes or other characters that make the id ambiguous.
    const st = ev.target.closest('.stepper');
    if (st){
      const sku = st.dataset.sku;
      // A v2.7.0 presentation field writes the buckets through its own map.
      if (UI_FIELDS[st.dataset.field]){
        const r = benta.rows.find(x => x.sku === sku);
        if (r){ uiTyped(r, st.dataset.field, ev.target.value); benta.dirty = true; afterCountChange(sku); }
      } else {
        const field = ROW_FIELDS[st.dataset.field];
        const r = field ? benta.rows.find(x => x.sku === sku) : null;
        if (r){ r[field] = Math.max(0, num(ev.target.value)); benta.dirty = true; afterCountChange(sku); }
      }
    }
  }

  // Expenses fields
  else if (id === 'gxAmount') gx.amount = ev.target.value;
  else if (id === 'gxDate'){
    // Kept as typed, judged live — a half-edited year ("0002-…") shows the
    // server's own complaint at once, and submitGasto refuses to commit it.
    gx.date = ev.target.value || todayStr();
    setErr('err-gx-date', ev.target.value ? entryDateError(ev.target.value) : '');
  }

  // More: the "Stock came in" fields (the quantity types like any stepper's box)
  else if (id.startsWith('in-arr-')){ const r = asArr(arrival.rows)[num(id.slice(7))]; if (r) r.qty = ev.target.value; }

  // Cutoff fields. The split's residual follows the field as it is typed; only
  // the four figures it moves are rewritten, so the keyboard stays put.
  else if (id === 'coSplitIn'){
    if (cutoffPer) splitEdits[periodKey(cutoffPer)] = ev.target.value;
    updateSplitLive();
  }
  else if (id === 'payBlAmount') payBl.amount = ev.target.value;

  // More: the stocktake field
  else if (id === 'stCountIn') countDraft = ev.target.value;

  // Config fields (auto-saved)
  else if (id === 'cfgUrl'){ config.apiUrl = ev.target.value.trim(); persistConfig(); updateStatus(); }
  else if (id === 'cfgToken'){ config.token = ev.target.value.trim(); persistConfig(); }
  else if (id === 'cfgSheet'){ config.sheetUrl = ev.target.value.trim(); persistConfig(); }
});

document.addEventListener('change', (ev) => {
  const id = ev.target.id;
  const ds = ev.target.dataset || {};
  // Checkboxes and selects report through `change` on every phone, so the
  // maintenance toggles and the two pickers are wired here rather than on input.
  if (ds.mactive != null){ if (maintPrices[ds.mactive]) maintPrices[ds.mactive].active = ev.target.checked; return; }
  if (ds.mcutoff != null){ if (maintPrices[ds.mcutoff]) maintPrices[ds.mcutoff].inCutoff = ev.target.checked; return; }
  if (ds.mstockactive != null){ if (maintStock[ds.mstockactive]) maintStock[ds.mstockactive].active = ev.target.checked; return; }
  if (id === 'arrDate'){
    // The same clamps every event date gets: kept as typed, judged live in the
    // server's own words, and never committed while it is wrong (saveArrival
    // checks again). A cleared field falls back to today.
    arrival.date = ev.target.value || todayStr();
    setErr('err-arrive', ev.target.value ? entryDateError(ev.target.value) : '');
    return;
  }
  if (id === 'payBlRef'){ payBl.ref = ev.target.value; return; }
  if (id === 'bentaDate'){
    const v = ev.target.value;
    // The form NEVER moves onto a date the server would refuse: a future day, a
    // half-edited year ("0002-…"), or a cleared field. The picker snaps back to
    // the day it was on and the complaint uses the server's own words — checked
    // here on change AND again in validateBenta on save, so a partial state
    // cannot be committed from either direction.
    const bad = v ? entryDateError(v) : 'That date is not complete. Pick the day from the calendar.';
    if (bad){
      ev.target.value = benta.date;
      toast(bad);
      return;
    }
    if (v !== benta.date){
      // Changing the date used to throw away everything typed, with no warning.
      // Keep it as a draft for the date it belongs to, say so, and put it back
      // the moment that date is opened again.
      const from = benta.date, wasDirty = !!benta.dirty;
      stashBentaDraft();
      loadBentaForm(v);
      renderBenta();
      if (wasDirty) toast('Your numbers for ' + fmtShort(from) + ' were kept. Pick that date again to finish them.');
    } else {
      loadBentaForm(v); renderBenta();
    }
  }
  else if (id === 'closedToggle'){
    // Marking a day closed BLANKS it: counts, custom order, wage — everything.
    // With sales already on the form that is a whole night's money going, so it
    // asks once, naming the amount, before anything is touched.
    if (ev.target.checked && !benta.closed){
      const c = computeDay(bentaPayload());   // benta.closed is still false here
      const money = r2(num(c.total) + num(c.excluded));
      if (money > 0 &&
          !confirm('This day has ' + peso(money) + ' of sales entered. “Closed today” removes all of it. Mark the day closed anyway?')){
        ev.target.checked = false;
        return;
      }
    }
    benta.closed = ev.target.checked;
    benta.dirty = true;
    renderBenta();
  }
});

// A held-back Sales re-render lands as soon as she is out of the field. Both
// events are wired (blur does not bubble, so it is taken in the capture phase)
// and any tap elsewhere flushes too, so a deferred render can never be stranded.
document.addEventListener('focusout', () => { setTimeout(flushBentaRender, 0); });
document.addEventListener('blur', () => { setTimeout(flushBentaRender, 0); }, true);

window.addEventListener('online', () => { drainQueue(); });
window.addEventListener('offline', () => { updateStatus(); });

// The calendar day this page last saw. Only a form that is still showing THAT
// day may be advanced to the new today — see onAppResume.
let lastSeenToday = todayStr();

// App resume (installed PWAs stay alive across days). Auto-advance ONLY when
// the form is still showing the today it was loaded with: picking an earlier
// date and then reading the notebook (app backgrounded in between) is the
// natural order of work, and snapping back to Today would land her numbers on
// the wrong day. Always re-render so the "Today" kicker, the date-input max and
// the current-period displays recompute. Then sync.
function onAppResume(){
  const t = todayStr();
  if (benta && !benta.dirty && benta.date !== t && benta.date === lastSeenToday){
    loadBentaForm(t);
  }
  lastSeenToday = t;
  const di = $('bentaDate');
  if (di) di.max = t;
  renderPanel(activeTab);
  updateDayStrip();
  drainQueue();
  // Reopening the app is the safest moment to swap in a downloaded update.
  if (typeof applyUpdateIfSafe === 'function') applyUpdateIfSafe();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') onAppResume();
  else stashBentaDraft();      // backgrounded mid-entry: keep what is typed
});
window.addEventListener('pagehide', () => { stashBentaDraft(); });
window.addEventListener('pageshow', () => { onAppResume(); });

/* ============================================================
   Boot
   ============================================================ */
// A partial or truncated state_v1 can lose rows that are still sitting in
// the queue. Replay the queue over whatever survived so unsent work shows
// up on screen instead of quietly disappearing. (Idempotent: the appliers
// recompute the same rows from the same payloads.)
try{ reapplyQueue(); }catch(err){ console.error(err); }

try{
  loadBentaForm(todayStr());
}catch(err){
  console.error(err);
  state = freshState();
  loadBentaForm(todayStr());
}
// A day queued before v2.1 loses its cash/GCash split when it replays. Flag
// those dates now, so the warning is on screen even offline.
try{ flagLegacyGcashQueue(); }catch(err){ console.error(err); }
// Bound the stored history on the way in, not only on the way out.
try{ pruneState(); persistState(); persistDrafts(); }catch(err){ console.error(err); }
updateStatus();
showTab('benta');
(async () => {
  // Drain BEFORE bootstrap so the snapshot can't clobber queued edits.
  await drainQueue();
  await doBootstrap();
})();

/* ============================================================
   Self-updating. The service worker caches the app so it runs offline, which
   means a freshly uploaded version would otherwise only appear on the SECOND
   open: the first open quietly downloads it, the second renders it. Nobody
   should have to know that. So when a new version takes over we reload for
   them — but only at a moment where nothing can be lost.
   ============================================================ */
let updateWaiting = false;
let reloadingForUpdate = false;

// sw.js uses clientsClaim, so on a FIRST install controllerchange also fires
// when the brand-new worker claims this uncontrolled page — reloading for that
// would be a pointless flash. So skip exactly that one initial claim, and treat
// every later controllerchange as a real new version. (If a worker was already
// driving the page at load — the normal case once installed — there is no
// initial claim to skip and the very next change is an update.)
let sawInitialClaim = !!(navigator.serviceWorker && navigator.serviceWorker.controller);

// Never reload while the day is half-entered or work is still unsent; hold the
// update until it is safe (after a save, or the next time the app is opened).
function applyUpdateIfSafe(){
  if (!updateWaiting || reloadingForUpdate) return;
  if (typeof benta === 'object' && benta && benta.dirty) return;      // half-typed day
  if (typeof syncing !== 'undefined' && syncing) return;              // request in flight
  // NOT blocked by a non-empty queue: queued mutations live in localStorage and
  // replay after the reload. Blocking on them would strand the app on an old
  // version forever in demo mode, or whenever the server is unreachable.
  reloadingForUpdate = true;   // one reload per page load — never a loop
  updateWaiting = false;
  location.reload();
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* file:// or unsupported — app still works */ });
  });
  // Fires once a newly installed worker claims this page (sw.js does
  // skipWaiting + clientsClaim), i.e. the new files are cached and ready.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!sawInitialClaim){ sawInitialClaim = true; return; }  // first install, not an update
    updateWaiting = true;
    applyUpdateIfSafe();
  });
}
</script>

<!doctype html>
<html lang="en-PH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Octogo Tracker</title>
<meta name="description" content="Daily sales and expenses tracker for Octogo Takoyaki.">
<meta name="theme-color" content="#C25E0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Octogo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Octogo Tracker — styles
   Palette: rice-paper / soy ink / takoyaki-sauce / deep sear /
   nori / GCash blue / alert. Type: Baloo 2 display + system body.
   ============================================================ */
:root{
  --bg:#FBF8F2;
  --ink:#2B1D12;
  --accent:#C25E0A;
  --deep:#8F3D0C;
  --ok:#3E5C3A;
  --gcash:#1B6DE0;
  --alert:#B3402E;
  --paper:#FFFFFF;
  --line:#E8DFD0;
  --soft:#F3ECDF;
  --muted:#7A6A58;
  --radius:16px;
  --display:'Baloo 2', ui-rounded, 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
  --body:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.45;
  min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; border-radius:6px; }
button{ font:inherit; color:inherit; }
[hidden]{ display:none !important; }

/* Header. The whole top region is one sticky block: brand + status, the demo
   banner, and (on Sales) the day's running TOTAL — see .day-strip. */
.topbar{ position:sticky; top:0; z-index:20; background:var(--bg); }
.app-header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--bg); border-bottom:1px solid var(--line);
}
.brand-lockup{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark{ width:40px; height:34px; object-fit:contain; flex:none; }
.brand{ font-family:var(--display); font-weight:800; font-size:22px; color:var(--deep); line-height:1.1; }
.brand small{ display:block; font-family:var(--body); font-weight:600; font-size:12px; color:var(--muted); letter-spacing:.04em; }
.pill{
  font-family:var(--display); font-weight:700; font-size:14px;
  padding:7px 14px; border-radius:999px; white-space:nowrap;
}
.pill.ok{ background:var(--ok); color:#fff; }
.pill.pending{ background:var(--accent); color:#fff; }
.pill.off, .pill.demo{ background:var(--soft); color:var(--muted); }
/* Something did NOT reach the sheet — never green, never quiet. */
.pill.attn{ background:var(--alert); color:#fff; }

/* Sticky day total — the figure to check against the cash in the tin while
   counting. It mirrors the receipt strip, which stays the signature element. */
.day-strip{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:6px 16px 7px; background:var(--bg); border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
.day-strip .ds-total{ display:flex; align-items:baseline; gap:8px; min-width:0; }
.day-strip .ds-lbl{ font-family:var(--display); font-weight:700; font-size:12px; letter-spacing:.1em; color:var(--muted); }
.day-strip .ds-amt{ font-family:var(--display); font-weight:800; font-size:23px; line-height:1.1; }
.day-strip .ds-sub{ display:flex; gap:10px; font-size:13px; color:var(--muted); white-space:nowrap; }
.day-strip .ds-sub b{ font-family:var(--display); font-size:15px; color:var(--ink); }
.day-strip .ds-sub .gc b{ color:var(--gcash); }

/* Needs-attention card — work that is NOT in the Google Sheet. */
.attn-card{ border:1.5px solid var(--alert); }
.attn-head{ font-family:var(--display); font-weight:800; font-size:17px; color:var(--alert); margin-bottom:6px; }
.attn-item{ padding:10px 0 2px; border-top:1px solid var(--line); }
.attn-item.first{ border-top:none; }
.attn-when{ font-family:var(--display); font-weight:700; font-size:16px; }
.attn-why{ font-size:15px; margin-top:2px; }
.attn-help{ font-size:14px; color:var(--muted); margin-top:4px; }
.attn-acts{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 6px; }
.attn-acts .btn{ flex:1 1 130px; }

/* Demo banner — a notice in the scroll flow, not part of the sticky top. */
.banner{
  background:#F6E7CF; color:var(--deep);
  padding:8px 14px; font-size:15px; text-align:center;
  border:1px solid var(--line); border-radius:12px; margin-bottom:12px;
}
.banner button{
  background:none; border:none; text-decoration:underline; font-weight:700;
  color:var(--deep); cursor:pointer; min-height:48px; padding:0 6px;
}

/* Layout */
main{ max-width:560px; margin:0 auto; padding:16px 16px 8px; }
.card{
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius); padding:16px; margin-bottom:14px;
}
.section-title{ font-family:var(--display); font-weight:700; font-size:18px; margin:20px 0 10px; }
.hint{ color:var(--muted); font-size:14px; }
.err{ color:var(--alert); font-weight:600; font-size:15px; margin-top:8px; }
.ok-note{ color:var(--ok); font-weight:600; font-size:15px; }

/* Buttons & chips (48px+ touch targets everywhere) */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:52px; padding:8px 18px; border-radius:14px;
  border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  font-family:var(--display); font-weight:700; font-size:18px; cursor:pointer;
}
.btn:active{ background:var(--soft); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:active{ background:var(--deep); border-color:var(--deep); }
.btn.primary:disabled{ opacity:.55; }
.btn.block{ width:100%; }
.btn.small{ min-height:48px; font-size:16px; padding:6px 14px; }
.icon-btn{
  width:48px; height:48px; flex:none; display:flex; align-items:center; justify-content:center;
  border:none; background:none; border-radius:12px; cursor:pointer; color:var(--muted);
}
.icon-btn:active{ background:var(--soft); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  min-height:48px; padding:10px 18px; border-radius:999px;
  border:1.5px solid var(--line); background:var(--paper);
  font-family:var(--display); font-weight:600; font-size:16px; cursor:pointer;
}
.chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }

/* Fields */
.field{ margin-bottom:14px; }
.field:last-child{ margin-bottom:0; }
.field > label{ display:block; font-weight:600; font-size:15px; margin-bottom:6px; }
.input{
  width:100%; min-height:52px; padding:10px 14px; font-size:18px;
  border:1.5px solid var(--line); border-radius:12px;
  background:var(--paper); color:var(--ink); font-family:var(--body);
  font-variant-numeric:tabular-nums;
}
.input.money{ font-family:var(--display); font-weight:700; font-size:20px; }
.input.gcash-in{ color:var(--gcash); }
select.input{ appearance:auto; }

/* Date card (tap anywhere to open the native picker) */
.date-card{ position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.date-card:focus-within{ outline:3px solid var(--ink); outline-offset:2px; }
.date-kicker{ font-family:var(--display); font-weight:700; font-size:14px; color:var(--accent); text-transform:uppercase; letter-spacing:.08em; }
.date-kicker.backfill{ color:var(--gcash); }
.date-big{ font-family:var(--display); font-weight:800; font-size:24px; line-height:1.15; }
.date-hint{ font-size:13px; color:var(--muted); margin-top:2px; }
.date-cover{ position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; font-size:18px; }
.cal-ico{ flex:none; color:var(--accent); }

/* Closed-day switch. The whole row is the label (tapping the words works) and
   the switch itself is 72x48 — it blanks a whole day, so it gets a real target. */
.switch-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:56px; cursor:pointer; }
.switch-row .sw-label{ font-family:var(--display); font-weight:700; font-size:18px; }
.switch-row .sw-sub{ font-size:14px; color:var(--muted); }
.switch{ position:relative; width:72px; height:48px; flex:none; }
.switch input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:pointer; }
.switch .track{ position:absolute; inset:0; background:var(--line); border-radius:999px; transition:background .15s; pointer-events:none; }
.switch .knob{
  position:absolute; top:6px; left:6px; width:36px; height:36px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(43,29,18,.35); transition:transform .15s; pointer-events:none;
}
.switch input:checked + .track{ background:var(--deep); }
.switch input:checked ~ .knob{ transform:translateX(24px); }
.switch input:focus-visible + .track{ outline:3px solid var(--ink); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ .switch .track, .switch .knob{ transition:none; } }

/* Steppers — giant +/− buttons, and a number field wide enough to read and
   tap (48px+ of usable width on a 375px phone, where two sit side by side). */
.stepper{ display:grid; grid-template-columns:48px minmax(0,1fr) 48px; gap:4px; align-items:center; }
.step-btn{
  width:48px; height:52px; border-radius:14px; cursor:pointer;
  border:1.5px solid var(--line); background:var(--bg);
  font-family:var(--display); font-size:28px; font-weight:700; color:var(--deep); line-height:1;
}
.step-btn:active{ background:var(--deep); border-color:var(--deep); color:#fff; }
.step-val{
  width:100%; height:52px; min-width:0; text-align:center;
  font-family:var(--display); font-size:22px; font-weight:700;
  border:1.5px solid var(--line); border-radius:12px; background:var(--paper);
  color:var(--ink); font-variant-numeric:tabular-nums;
}

/* Sales count cards */
.sku-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.sku-head strong{ font-family:var(--display); font-weight:800; font-size:20px; }
.sku-price{ font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
.sku-card{ padding:14px; }
.count-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
.count-cell > label, .count-cell > .cell-label{ display:block; font-weight:600; font-size:14px; color:var(--muted); margin-bottom:6px; }
.sold-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:12px; }
.sold-badge{ font-size:16px; }
.sold-badge b{ font-family:var(--display); font-size:22px; font-weight:800; color:var(--ok); font-variant-numeric:tabular-nums; }
.sold-badge.neg b{ color:var(--alert); }
.sku-split{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
  font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
.saved-hint{ color:var(--ok); font-weight:600; font-size:15px; margin:-6px 0 14px; }

/* The three entered buckets (Cheese / GCash / GCash cheese) + the derived
   plain-cash remainder, which is shown but never typed. */
.buckets{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
.count-cell.gc > label{ color:var(--gcash); }
.derived{
  display:flex; align-items:center; justify-content:center; height:52px;
  border-radius:12px; background:var(--soft);
  font-family:var(--display); font-weight:800; font-size:22px; color:var(--deep);
  font-variant-numeric:tabular-nums;
}

/* Collapsible cards — supplies bought today, stock used today */
.collapse{ padding:0; overflow:hidden; }
.collapse-head{
  width:100%; display:flex; align-items:center; gap:10px; min-height:62px;
  padding:12px 16px; background:none; border:none; text-align:left; cursor:pointer;
}
.collapse-head:active{ background:var(--soft); }
.collapse-head .ch-title{ flex:1; min-width:0; font-family:var(--display); font-weight:700; font-size:18px; }
.collapse-head .ch-sum{ font-family:var(--display); font-weight:800; font-size:17px; color:var(--deep); font-variant-numeric:tabular-nums; }
.collapse-head .chev{ flex:none; color:var(--muted); transition:transform .15s; }
.collapse-head[aria-expanded="true"] .chev{ transform:rotate(180deg); }
@media (prefers-reduced-motion: reduce){ .collapse-head .chev{ transition:none; } }
.collapse-body{ padding:0 16px 16px; }
.line-row{ display:flex; align-items:center; gap:10px; padding:5px 0; }
.line-row .ln-name{ flex:1; min-width:0; font-weight:600; }
.line-row .input{ width:118px; text-align:right; }
.line-row .unit{ width:32px; flex:none; font-size:14px; color:var(--muted); }
/* Quiet note for a row whose name has left the sheet's list. Advisory only —
   it never blocks the save. */
.ln-note{ font-size:13px; color:var(--muted); margin:-2px 0 6px; }
.sum-row{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  margin-top:12px; padding-top:10px; border-top:2px solid var(--ink); font-weight:700;
}
.sum-row b{ font-family:var(--display); font-size:22px; font-variant-numeric:tabular-nums; }

/* Receipt strip — the signature element */
.receipt-wrap{ margin:20px 0 8px; filter:drop-shadow(0 4px 8px rgba(43,29,18,.14)); }
.receipt{ background:var(--paper); padding:18px 18px 10px; border-radius:8px 8px 0 0; font-variant-numeric:tabular-nums; }
.r-brand{ text-align:center; font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:.14em; color:var(--deep); text-transform:uppercase; }
.r-date{ text-align:center; font-size:13px; color:var(--muted); margin:2px 0 10px; }
.r-line{ display:flex; justify-content:space-between; gap:12px; padding:3px 0; font-size:16px; }
.r-line .r-amt{ white-space:nowrap; }
.r-sep{ border-top:2px dashed var(--line); margin:10px 0; }
.r-total{ display:flex; justify-content:space-between; align-items:baseline; font-family:var(--display); font-weight:800; }
.r-total .lbl{ font-size:17px; letter-spacing:.1em; }
.r-total .amt{ font-size:42px; line-height:1.1; }
.r-sub{ display:flex; justify-content:space-between; font-size:16px; padding:2px 0; }
.r-sub.gcash .r-amt{ color:var(--gcash); font-weight:700; }
.r-empty{ text-align:center; color:var(--muted); font-size:15px; padding:8px 0 12px; }
.r-closed{ text-align:center; font-family:var(--display); font-weight:800; font-size:22px; color:var(--alert); padding:10px 0 14px; letter-spacing:.06em; }
.r-tear{
  height:11px;
  background:
    linear-gradient(45deg, var(--paper) 8px, transparent 0),
    linear-gradient(-45deg, var(--paper) 8px, transparent 0);
  background-size:16px 16px; background-repeat:repeat-x;
}
@keyframes tearoff{
  0%{ transform:none; opacity:1; }
  30%{ transform:translateY(4px) rotate(.6deg); }
  100%{ transform:translateY(34px) rotate(2.5deg); opacity:0; }
}
.receipt-wrap.tearing{ animation:tearoff .45s ease-in forwards; }
@media (prefers-reduced-motion: reduce){ .receipt-wrap.tearing{ animation:none; } }

/* Expenses list */
.gx-group{ margin-bottom:16px; }
.gx-group-head{ display:flex; justify-content:space-between; align-items:baseline; padding:0 4px 6px; }
.gx-group-head .d{ font-family:var(--display); font-weight:700; font-size:16px; }
.gx-group-head .t{ font-family:var(--display); font-weight:700; color:var(--deep); font-variant-numeric:tabular-nums; }
.gx-item{
  display:flex; align-items:center; gap:10px;
  background:var(--paper); border:1px solid var(--line); border-radius:14px;
  padding:10px 6px 10px 14px; margin-bottom:8px;
}
.gx-cat{
  flex:none; font-family:var(--display); font-weight:700; font-size:12px;
  background:var(--soft); color:var(--deep); border-radius:8px; padding:4px 8px;
  text-transform:uppercase; letter-spacing:.04em;
}
.gx-main{ flex:1; min-width:0; }
.gx-name{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gx-ref{ font-size:13px; color:var(--muted); }
.gx-amt{ font-family:var(--display); font-weight:800; font-size:18px; white-space:nowrap; font-variant-numeric:tabular-nums; }

/* Cutoff */
.period-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.period-nav .p-label{ font-family:var(--display); font-weight:800; font-size:20px; text-align:center; flex:1; }
.period-nav .p-sub{ display:block; font-family:var(--body); font-weight:600; font-size:13px; color:var(--muted); }
.nav-btn{
  width:52px; height:52px; flex:none; border-radius:14px; cursor:pointer;
  border:1.5px solid var(--line); background:var(--bg);
  font-family:var(--display); font-size:24px; font-weight:700; color:var(--deep);
}
.nav-btn:active{ background:var(--soft); }
.co-row{ display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:17px; font-variant-numeric:tabular-nums; }
.co-row .v{ font-weight:700; white-space:nowrap; }
.co-row.big{ font-family:var(--display); font-weight:800; align-items:baseline; }
.co-row.big .v{ font-size:34px; }
.co-row.gcash .v{ color:var(--gcash); }
.co-row.split .v{ color:var(--ok); }
.co-row.split.neg .v{ color:var(--alert); }
.co-sub{ text-align:right; font-size:14px; color:var(--muted); margin-top:-4px; }
.note-pre{
  white-space:pre-wrap; word-break:break-word;
  font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size:15px; line-height:1.6;
  background:var(--paper); border:1.5px dashed var(--line); border-radius:12px; padding:14px; margin-bottom:12px;
}
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ flex:1; }

/* More tab */
.kv{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; }
.kv .k{ color:var(--muted); }
.kv .v{ font-weight:600; text-align:right; word-break:break-word; }
.bl-total{ display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  padding-bottom:10px; margin-bottom:4px; border-bottom:2px solid var(--ink); }
.bl-total span{ font-weight:700; }
.bl-total strong{ font-family:var(--display); font-size:24px; font-variant-numeric:tabular-nums; }
.bl-item{ padding:10px 0; border-bottom:1px solid var(--line); }
.bl-item:last-child{ border-bottom:none; }
.bl-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
.bl-name{ font-weight:700; }
.bl-bal{ font-family:var(--display); font-weight:800; color:var(--deep); font-variant-numeric:tabular-nums; }
.bl-meter{ height:8px; border-radius:99px; background:var(--soft); margin-top:8px; overflow:hidden; }
.bl-meter i{ display:block; height:100%; background:var(--ok); border-radius:99px; }
.bl-sub{ font-size:13px; color:var(--muted); margin-top:4px; }

/* Tab bar */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  display:grid; grid-template-columns:repeat(4,1fr);
  background:var(--paper); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; cursor:pointer;
  color:var(--muted); font-family:var(--display); font-weight:700; font-size:13px;
}
.tab[aria-selected="true"]{ color:var(--accent); }
.tab svg{ width:24px; height:24px; }

/* Toast */
#toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(92px + env(safe-area-inset-bottom));
  background:var(--ink); color:var(--bg);
  padding:12px 22px; border-radius:999px;
  font-family:var(--display); font-weight:700; font-size:16px;
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:40;
  max-width:90vw; text-align:center;
}
#toast.show{ opacity:1; }
@media (prefers-reduced-motion: reduce){ #toast{ transition:none; } }
</style>
</head>
<body>

<div class="topbar">
  <header class="app-header">
    <div class="brand-lockup">
      <img class="brand-mark" src="logo.png" alt="" width="40" height="34" decoding="async">
      <div class="brand">Octogo <small id="brandBranch">Takoyaki tracker</small></div>
    </div>
    <span id="statusPill" class="pill demo" role="status" aria-live="polite">…</span>
  </header>

  <!-- The day's running TOTAL / Cash / GCash, always on screen on the Sales
       screen so the tin can be checked against it while counting. -->
  <div id="dayStrip" class="day-strip" aria-live="polite" hidden></div>
</div>

<main>
  <!-- Setup notice: it scrolls with the page, so the sticky region above stays
       the header plus the day total and nothing else. -->
  <div id="demoBanner" class="banner" hidden>
    Demo mode — your data stays on this phone until the API is set up.
    <button type="button" data-act="goto-ibapa">Set up →</button>
  </div>

  <section id="panel-benta" role="tabpanel" aria-labelledby="tab-benta"></section>

<script>
'use strict';
/* ============================================================
   Constants, storage, and shared state
   localStorage keys: state_v1 (bootstrap mirror), queue_v1
   (mutation queue), config_v1 (API url/token/sheet link).
   ============================================================ */
const APP_VERSION = '2.1.1';

const store = {
  read(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  // Returns whether the write actually landed. The app keeps running either
  // way, but a FAILED write is not something to swallow: the queue is unsent
  // work, so persistQueue() makes room and then says so out loud.
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

// Parse a stored key. Anything unreadable (missing, truncated, not JSON)
// comes back as null so the caller falls back to defaults.
function readStored(k){
  const raw = store.read(k);
  if (raw == null || raw === '') return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
function isObj(v){ return !!v && typeof v === 'object' && !Array.isArray(v); }
function asArr(v){ return Array.isArray(v) ? v : []; }
function asObj(v){ return isObj(v) ? v : {}; }
function txt(v){ return (v == null || typeof v === 'object') ? '' : String(v); }

// The two picklists are seeded here with the SAME names Code.gs seeds into the
// SupplyItems / StockItems tabs, so demo mode (and a phone whose sheet has not
// been migrated yet) can record supplies and stock on day one. The server
// auto-creates and seeds those tabs on the first save, so a seeded name is
// never rejected as "unknown item".
const SEED_SUPPLY_ITEMS = ['Veggies','Egg','Ginger','Water','Flour','Tissue','Toothpick',
  'Fork','Bag #3','Bag #6','Bag #16','Cheese','Rags','Fare'];
const SEED_STOCK_ITEMS = [['Takoyaki Flour','kg'],['Takoyaki Sauce','gal'],['Japanese Mayo','kg'],
  ['Bonito','g'],['Aonori','g'],['Togarashi','g']];

function freshState(){
  return {
    settings:{ branch:'Tañong', mama_per_cutoff:500, electric_per_cutoff:500, partners:'Nayt, Partner', staff:'Mama' },
    prices:[
      { sku:'box4',   label:'Box 4',  group:'box',    size:4,  price:50,  cheese_price:60,  active:true },
      { sku:'box6',   label:'Box 6',  group:'box',    size:6,  price:65,  cheese_price:80,  active:true },
      { sku:'box10',  label:'Box 10', group:'box',    size:10, price:105, cheese_price:125, active:true },
      { sku:'drinks', label:'Drinks', group:'simple', size:'', price:25,  cheese_price:'',  active:false }
    ],
    supplyItems: SEED_SUPPLY_ITEMS.map((item, i) => ({ item, active:true, sort:i+1 })),
    stockItems:  SEED_STOCK_ITEMS.map((p, i) => ({ product:p[0], unit:p[1], active:true, sort:i+1 })),
    backlogs:[],
    days:{},          // date -> DailyLog row
    counts:{},        // date -> [DailyCounts rows]
    dailySupplies:{}, // date -> [DailySupplies rows]  (pesos per item — money)
    stockUsage:{},    // date -> [StockUsage rows]     (quantities — NEVER money)
    expenses:{}       // entry_id -> Expenses row
  };
}

function freshConfig(){ return { apiUrl:'', token:'', sheetUrl:'' }; }

/* ------------------------------------------------------------
   Loading saved data safely.
   A stored blob may be partial (a version upgrade that changed the
   shape, a truncated write) or plain corrupt. Never trust it as the
   whole state: merge whatever survives over a COMPLETE default, coerce
   every field to the type the app expects, and drop what is malformed.
   The app must always boot into a usable screen.

   KEY CASING AT THE API SEAM. What we SEND is camelCase (cheeseQty, gcashQty,
   gcashCheeseQty, customAmount, customGcash, entryId, backlogRef — the
   documented request shape); what we STORE and what the server SENDS BACK is
   snake_case (cheese_price, cheese_qty, gcash_qty, gcash_cheese_qty,
   gcash_amount, custom_amount, custom_gcash, entry_id, backlog_ref,
   total_amount, supplies_total, …).
   Every normalizer below reads the snake_case key first and falls back to the
   camelCase spelling, so a phone on new code talking to an older still-
   deployed Apps Script cannot silently read a price or a balance as 0.
   ------------------------------------------------------------ */
// Prefer the snake_case key; fall back to the legacy camelCase one when the
// snake_case value is absent or blank. A real 0 or false still wins.
function pick(o, snake, camel){
  const v = o[snake];
  return (v === undefined || v === null || v === '') ? o[camel] : v;
}

function normPrice(p){
  if (!isObj(p) || !txt(p.sku)) return null;
  const cheese = pick(p, 'cheese_price', 'cheesePrice');
  return {
    sku: txt(p.sku),
    label: txt(p.label) || txt(p.sku),
    group: p.group === 'box' ? 'box' : 'simple',
    size: (p.size == null || typeof p.size === 'object') ? '' : p.size,
    price: num(p.price),
    cheese_price: (cheese === '' || cheese == null) ? '' : num(cheese),
    active: truthy(p.active)
  };
}
function normBacklog(b){
  if (!isObj(b) || !txt(b.name)) return null;
  const o = {
    name: txt(b.name), description: txt(b.description),
    total_amount: num(pick(b, 'total_amount', 'totalAmount')),
    start_date: txt(pick(b, 'start_date', 'startDate')),
    active: truthy(b.active)
  };
  // Only carry a server-supplied balance when there really is one —
  // backlogBalance() falls back to computing it from expenses otherwise.
  if (b.balance != null && b.balance !== '' && typeof b.balance !== 'object') o.balance = num(b.balance);
  if (b.paid != null && b.paid !== '' && typeof b.paid !== 'object') o.paid = num(b.paid);
  return o;
}
function normDay(r, key){
  if (!isObj(r)) return null;
  const date = isDateStr(r.date) ? txt(r.date) : (isDateStr(key) ? txt(key) : '');
  if (!date) return null;
  return {
    date, closed: truthy(r.closed), staff: txt(r.staff),
    // `gcash` is COMPUTED (server-side on save, locally by computeDay) — it is
    // still stored and still read, it is just no longer typed in by anyone.
    gcash: num(r.gcash), total: num(r.total), cash: num(r.cash),
    custom_amount: num(pick(r, 'custom_amount', 'customAmount')),
    // A pre-v2.1.0 sheet has no custom_gcash column, so it reads 0 — which is
    // exactly right for those days: nothing of the custom order was GCash.
    custom_gcash: num(pick(r, 'custom_gcash', 'customGcash')),
    notes: txt(r.notes),
    entry_id: txt(pick(r, 'entry_id', 'entryId')),
    updated_at: txt(pick(r, 'updated_at', 'updatedAt'))
  };
}
function normCount(c, key){
  if (!isObj(c) || !txt(c.sku)) return null;
  const date = isDateStr(c.date) ? txt(c.date) : (isDateStr(key) ? txt(key) : '');
  if (!date) return null;
  return {
    date, sku: txt(c.sku), sod: num(c.sod), eod: num(c.eod), sold: num(c.sold),
    // Four mutually exclusive buckets that sum to `sold`. Three are entered;
    // regular_qty is the derived plain-cash remainder. Pre-v2.1.0 rows have no
    // GCash columns, so they read 0 — i.e. "that day was all cash".
    cheese_qty: num(pick(c, 'cheese_qty', 'cheeseQty')),
    gcash_qty: num(pick(c, 'gcash_qty', 'gcashQty')),
    gcash_cheese_qty: num(pick(c, 'gcash_cheese_qty', 'gcashCheeseQty')),
    regular_qty: num(pick(c, 'regular_qty', 'regularQty')),
    amount: num(c.amount),
    gcash_amount: num(pick(c, 'gcash_amount', 'gcashAmount')),
    entry_id: txt(pick(c, 'entry_id', 'entryId'))
  };
}
// SupplyItems / StockItems — the two picklists. `sort` fixes the order the
// phone shows them in, so it matches the order in the sheet.
function normSupplyItem(s){
  if (!isObj(s) || !txt(s.item)) return null;
  return { item: txt(s.item), active: truthy(s.active), sort: num(s.sort) };
}
function normStockItem(s){
  if (!isObj(s) || !txt(s.product)) return null;
  return { product: txt(s.product), unit: txt(s.unit), active: truthy(s.active), sort: num(s.sort) };
}
// DailySupplies — pesos spent per item per day. This IS money: it feeds the
// cutoff note's Supplies line together with bulk Expenses(Supplies) rows.
function normDailySupply(s, key){
  if (!isObj(s) || !txt(s.item)) return null;
  const date = isDateStr(s.date) ? txt(s.date) : (isDateStr(key) ? txt(key) : '');
  if (!date) return null;
  return {
    date, item: txt(s.item), amount: num(s.amount),
    entry_id: txt(pick(s, 'entry_id', 'entryId')),
    updated_at: txt(pick(s, 'updated_at', 'updatedAt'))
  };
}
// StockUsage — quantities consumed per product per day. NEVER money: it never
// reaches the note or any total.
function normStockUse(s, key){
  if (!isObj(s) || !txt(s.product)) return null;
  const date = isDateStr(s.date) ? txt(s.date) : (isDateStr(key) ? txt(key) : '');
  if (!date) return null;
  return {
    date, product: txt(s.product), qty: num(s.qty),
    entry_id: txt(pick(s, 'entry_id', 'entryId')),
    updated_at: txt(pick(s, 'updated_at', 'updatedAt'))
  };
}
// The six stored expense categories. Anything else (a typo in the sheet, a
// prototype name like "toString") folds into Other — same as the server —
// so no amount can ever fall outside the cutoff maths.
const EXPENSE_CATS = ['Supplies','Octopus','Electric','Mama','Backlog','Other'];
function normCategory(v){ const c = txt(v).trim(); return EXPENSE_CATS.indexOf(c) >= 0 ? c : 'Other'; }

function normExpense(e, key){
  if (!isObj(e)) return null;
  const id = txt(pick(e, 'entry_id', 'entryId')) || txt(key);
  if (!id || !isDateStr(e.date)) return null;
  return {
    date: txt(e.date), category: normCategory(e.category), item: txt(e.item),
    amount: num(e.amount), backlog_ref: txt(pick(e, 'backlog_ref', 'backlogRef')),
    notes: txt(e.notes),
    entry_id: id, updated_at: txt(pick(e, 'updated_at', 'updatedAt'))
  };
}

// date/id -> row maps. Accepts the map shape the app writes today and a
// plain array (an older/newer shape), so an upgrade can't blank the app.
function toRowMap(v, norm, keyOf){
  const out = {};
  if (Array.isArray(v)){
    for (const r of v){ const n = norm(r, ''); if (n) out[keyOf(n)] = n; }
  } else if (isObj(v)){
    for (const k in v){ const n = norm(v[k], k); if (n) out[keyOf(n)] = n; }
  }
  return out;
}
// date -> [rows] maps for the three date-keyed detail collections (counts,
// daily supplies, stock usage). Accepts the map shape the app stores AND the
// flat array the API returns, so both go through the same normalizer.
function toDateListMap(v, norm){
  const out = {};
  const add = (row, key) => { const n = norm(row, key); if (n) (out[n.date] = out[n.date] || []).push(n); };
  if (Array.isArray(v)){ for (const r of v) add(r, ''); }
  else if (isObj(v)){
    for (const k in v){
      const list = v[k];
      if (Array.isArray(list)) for (const r of list) add(r, k);
      else if (isObj(list)) add(list, k);
    }
  }
  return out;
}
function toCountsMap(v){ return toDateListMap(v, normCount); }

// Settings are flat key/value pairs from the sheet. Anything object- or
// array-valued would render as "[object Object]" (or silently break
// staffList()), so it is dropped and the default kept. Used for BOTH the
// stored copy and the bootstrap reply so the two paths always agree.
function mergeSettings(target, raw){
  if (!isObj(raw)) return target;
  for (const k in raw){
    if (!Object.prototype.hasOwnProperty.call(raw, k) || k === '__proto__') continue;
    const v = raw[k];
    if (v != null && typeof v !== 'object') target[k] = v;
  }
  return target;
}

function sanitizeState(raw){
  const s = freshState();
  if (!isObj(raw)) return s;                       // null / string / array / corrupt -> defaults
  mergeSettings(s.settings, raw.settings);
  const prices = asArr(raw.prices).map(normPrice).filter(Boolean);
  if (prices.length) s.prices = prices;            // no usable prices -> keep the seed list
  // Same rule for the two picklists: an empty or unusable list keeps the seeds
  // so the supplies/stock cards are never blank.
  const supplyItems = asArr(raw.supplyItems).map(normSupplyItem).filter(Boolean);
  if (supplyItems.length) s.supplyItems = supplyItems;
  const stockItems = asArr(raw.stockItems).map(normStockItem).filter(Boolean);
  if (stockItems.length) s.stockItems = stockItems;
  s.backlogs = asArr(raw.backlogs).map(normBacklog).filter(Boolean);
  s.days     = toRowMap(raw.days, normDay, r => r.date);
  s.counts   = toCountsMap(raw.counts);
  s.dailySupplies = toDateListMap(raw.dailySupplies, normDailySupply);
  s.stockUsage    = toDateListMap(raw.stockUsage, normStockUse);
  s.expenses = toRowMap(raw.expenses, normExpense, r => r.entry_id);
  return s;
}

function sanitizeConfig(raw){
  const c = freshConfig();
  if (!isObj(raw)) return c;
  c.apiUrl  = txt(raw.apiUrl).trim();
  c.token   = txt(raw.token).trim();
  c.sheetUrl = txt(raw.sheetUrl).trim();
  return c;
}

// Queued mutations are the user's unsaved work — keep every well-formed
// entry, in order, payload untouched. Only drop entries the sync engine
// could not send at all (unknown action, missing payload or key).
const QUEUE_KEY_FOR = { saveDay:'date', saveExpense:'entryId', deleteExpense:'entryId' };
function sanitizeQueue(raw){
  const out = [];
  for (const item of asArr(raw)){
    if (!isObj(item)) continue;
    const need = QUEUE_KEY_FOR[item.action];
    if (!need) continue;
    if (!isObj(item.payload) || !item.payload[need]) continue;
    out.push({ action: item.action, payload: item.payload, tries: num(item.tries) });
  }
  return out;
}

/* ------------------------------------------------------------
   NEEDS ATTENTION (attention_v1) — things that did NOT reach the sheet.
   A server REJECTION is not "done": the optimistic day survives on this
   phone, so the mutation leaves the queue (it would jam it) and lands here
   instead. While this list has anything in it the status pill is never green,
   and both the Sales screen and More name the DATE, quote the server's own
   words, and offer a way to put it right.
     rejected — the server refused it; that day/expense is missing from the sheet
     gcash    — a day queued before v2.1: its typed GCash total is ignored by the
                server (correct), so the cash/GCash split needs re-entering
     dropped  — the server dropped counts for a sku that has left Prices
   ------------------------------------------------------------ */
const ATTN_KINDS = { rejected:true, gcash:true, dropped:true };
function attnTarget(action, payload){
  const need = QUEUE_KEY_FOR[action];
  return need ? txt(asObj(payload)[need]) : '';
}
function attnKey(a){ return a.kind + '|' + a.action + '|' + attnTarget(a.action, a.payload); }
function sanitizeAttention(raw){
  const out = [], seen = Object.create(null);
  for (const item of asArr(raw)){
    if (!isObj(item) || !ATTN_KINDS[item.kind] || !QUEUE_KEY_FOR[item.action]) continue;
    if (!isObj(item.payload) || !attnTarget(item.action, item.payload)) continue;
    const a = {
      kind: item.kind, action: item.action, payload: item.payload,
      date: isDateStr(item.date) ? txt(item.date) : (isDateStr(item.payload.date) ? txt(item.payload.date) : ''),
      message: txt(item.message), at: txt(item.at)
    };
    const k = attnKey(a);
    if (seen[k]) continue;
    seen[k] = true;
    out.push(a);
  }
  return out;
}

/* ------------------------------------------------------------
   PER-DATE DRAFTS (drafts_v1) — a half-entered day, kept per date so that
   changing the date (or backgrounding the app) cannot throw away typed work.
   Cleared for a date as soon as that date is saved.
   ------------------------------------------------------------ */
// Field values are kept as typed ('' means "nothing entered"), so a number and
// a numeric string are both fine here; everything reads them through num().
function raw1(v){ return (v == null || typeof v === 'object') ? '' : v; }
function sanitizeDrafts(rawv){
  const out = {};
  if (!isObj(rawv)) return out;
  for (const k in rawv){
    if (!isDateStr(k)) continue;
    const d = rawv[k];
    if (!isObj(d)) continue;
    out[k] = {
      date: k, closed: !!d.closed, staff: txt(d.staff),
      custom: raw1(d.custom), customGcash: raw1(d.customGcash), notes: txt(d.notes),
      rows: asArr(d.rows).filter(isObj).filter(r => txt(r.sku)).map(r => ({
        sku: txt(r.sku), sod: raw1(r.sod), eod: raw1(r.eod),
        cheese: raw1(r.cheese), gcash: raw1(r.gcash), gcashCheese: raw1(r.gcashCheese)
      })),
      supplies: asArr(d.supplies).filter(isObj).filter(s => txt(s.item))
        .map(s => ({ item: txt(s.item), amount: raw1(s.amount) })),
      stock: asArr(d.stock).filter(isObj).filter(s => txt(s.product))
        .map(s => ({ product: txt(s.product), unit: txt(s.unit), qty: raw1(s.qty) }))
    };
  }
  return out;
}

// Last line of defence: whatever happens later (a junk bootstrap reply,
// a hand-edited localStorage), every container the renderers walk exists.
function ensureShape(){
  if (!isObj(state)) state = freshState();
  if (!isObj(state.settings)) state.settings = freshState().settings;
  if (!Array.isArray(state.prices) || !state.prices.length) state.prices = freshState().prices;
  if (!Array.isArray(state.supplyItems) || !state.supplyItems.length) state.supplyItems = freshState().supplyItems;
  if (!Array.isArray(state.stockItems) || !state.stockItems.length) state.stockItems = freshState().stockItems;
  if (!Array.isArray(state.backlogs)) state.backlogs = [];
  if (!isObj(state.days)) state.days = {};
  if (!isObj(state.counts)) state.counts = {};
  if (!isObj(state.dailySupplies)) state.dailySupplies = {};
  if (!isObj(state.stockUsage)) state.stockUsage = {};
  if (!isObj(state.expenses)) state.expenses = {};
  if (!Array.isArray(queue)) queue = [];
  if (!isObj(config)) config = freshConfig();
  if (!Array.isArray(attention)) attention = [];
  if (!isObj(drafts)) drafts = {};
}

let state     = sanitizeState(readStored('state_v1'));
let queue     = sanitizeQueue(readStored('queue_v1'));
let config    = sanitizeConfig(readStored('config_v1'));
let attention = sanitizeAttention(readStored('attention_v1'));
let drafts    = sanitizeDrafts(readStored('drafts_v1'));

/* ------------------------------------------------------------
   RETENTION. state_v1 grows every day (a DailyLog row, its counts, its
   supplies and its stock usage) against a ~5 MB origin quota, so it is bounded
   here: roughly the last 120 days of history — eight cutoff periods — which is
   far more than the app ever shows. Anything still queued, still on the
   needs-attention list, still a draft or currently on screen is NEVER pruned,
   whatever its date. The sheet remains the full archive.
   ------------------------------------------------------------ */
const RETAIN_DAYS = 120;
function daysAgoStr(n){
  return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Manila' })
    .format(new Date(Date.now() - Math.max(0, num(n)) * 86400000));
}
// Dates that must survive pruning no matter how old they are.
function protectedDates(){
  const keep = Object.create(null);
  for (const q of asArr(queue)){
    const d = txt(asObj(q.payload).date);
    if (isDateStr(d)) keep[d] = true;
  }
  for (const a of asArr(attention)) if (isDateStr(a.date)) keep[a.date] = true;
  if (isObj(benta) && isDateStr(benta.date)) keep[benta.date] = true;
  keep[todayStr()] = true;
  return keep;
}
// Expenses are deliberately NOT pruned: a backlog balance is total_amount minus
// every Backlog payment ever made, so dropping old expense rows would silently
// inflate the balances the More screen shows. They are one small row each.
function pruneState(keepDays){
  const min = daysAgoStr(num(keepDays) || RETAIN_DAYS);
  const keep = protectedDates();
  for (const map of [state.days, state.counts, state.dailySupplies, state.stockUsage]){
    if (!isObj(map)) continue;
    for (const d in map){ if (!keep[d] && (!isDateStr(d) || d < min)) delete map[d]; }
  }
  for (const d in drafts){ if (!keep[d] && (!isDateStr(d) || d < min)) delete drafts[d]; }
}

// Set once a write really could not be made, so the screens can say so.
let storageFull = false;
function persistState(){
  pruneState();
  if (store.set('state_v1', state)) return true;
  pruneState(45);                                  // shed more history, try once more
  if (store.set('state_v1', state)) return true;
  storageFull = true;
  return false;
}
// Unsent work is the one thing that must never disappear quietly. If it cannot
// be written, make room by pruning old history and try again — and if it still
// cannot be written, SAY SO instead of pretending everything is fine.
function persistQueue(){
  if (store.set('queue_v1', queue)){
    if (storageFull){ storageFull = false; renderPanel(activeTab); }
    return true;
  }
  pruneState(45);
  store.set('state_v1', state);
  if (store.set('queue_v1', queue)){
    if (storageFull){ storageFull = false; renderPanel(activeTab); }
    return true;
  }
  storageFull = true;
  toast('This phone is out of storage. Work waiting to be sent may be lost if you close the app — sync as soon as you have signal.');
  renderPanel(activeTab);
  return false;
}
function persistConfig(){ store.set('config_v1', config); }
function persistAttention(){ store.set('attention_v1', attention); }
function persistDrafts(){ store.set('drafts_v1', drafts); }

/* ============================================================
   Utilities — dates (Asia/Manila), money, ids, escaping
   ============================================================ */
// Note text only — the generated cutoff note must always read in English.
const EN_MONTHS  = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// On-screen dates: English names (en-PH), Philippine time.
const DISP_WEEKDAY = new Intl.DateTimeFormat('en-PH', { timeZone:'Asia/Manila', weekday:'long' });
const DISP_MONTH   = new Intl.DateTimeFormat('en-PH', { timeZone:'Asia/Manila', month:'long' });

function todayStr(){ return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Manila' }).format(new Date()); }
function isDateStr(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s == null ? '' : s)); }
function d2parts(s){ const [y,m,d] = String(s == null ? '' : s).split('-').map(Number); return { y, m, d }; }
function partsToStr(y,m,d){ return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
function lastDayOf(y,m){ return new Date(y, m, 0).getDate(); }
// Noon UTC is 8pm in Manila on the same calendar day, so the weekday and
// month names always belong to the date the user actually picked.
function dateAt(s){ const p = d2parts(s); return new Date(Date.UTC(p.y, p.m-1, p.d, 12, 0, 0)); }
function weekdayName(s){ return isDateStr(s) ? DISP_WEEKDAY.format(dateAt(s)) : ''; }
function monthName(s){ return isDateStr(s) ? DISP_MONTH.format(dateAt(s)) : ''; }
function fmtLong(s){
  if (!isDateStr(s)) return String(s == null ? '' : s);
  const p = d2parts(s); return weekdayName(s) + ', ' + monthName(s) + ' ' + p.d + ', ' + p.y;
}
function fmtShort(s){
  if (!isDateStr(s)) return String(s == null ? '' : s);
  const p = d2parts(s); return monthName(s) + ' ' + p.d + ' (' + weekdayName(s) + ')';
}

function num(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g,''));
  return isFinite(n) ? n : 0;
}
// Money rounding, identical to the server's round2 — every peso figure the
// client computes goes through it so the two sides agree to the centavo.
function r2(n){ return Math.round(num(n) * 100) / 100; }
function fmt(n){
  n = r2(n);
  const whole = Number.isInteger(n);
  return n.toLocaleString('en-PH', { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: 2 });
}
// Sign goes BEFORE the peso sign: -₱1,520, never ₱-1,520.
function peso(n){
  const v = Math.round(num(n) * 100) / 100;
  return (v < 0 ? '-₱' : '₱') + fmt(Math.abs(v));
}
function noteVal(n){ n = num(n); return n === 0 ? '' : fmt(n); }
function uuid(){
  return (crypto && crypto.randomUUID) ? crypto.randomUUID()
    : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function truthy(v){ return v === true || v === 1 || v === 'TRUE' || v === 'true' || v === '1'; }
function activePrices(){ return asArr(state.prices).filter(p => isObj(p) && truthy(p.active)); }
function activeSupplyItems(){ return asArr(state.supplyItems).filter(s => isObj(s) && truthy(s.active)); }
function activeStockItems(){ return asArr(state.stockItems).filter(s => isObj(s) && truthy(s.active)); }
function staffList(){ return txt(asObj(state.settings).staff || 'Mama').split(',').map(s => s.trim()).filter(Boolean); }

/* ============================================================
   Domain math — day computation (mirrors the server rules) and
   cutoff figures. Prices come from the local mirror; the server
   recomputes authoritatively at save time.
   ============================================================ */
// `p` is a REQUEST-shaped payload — the same camelCase object we POST as
// saveDay (counts[].cheeseQty, counts[].gcashQty, customAmount, customGcash).
// Prices read off state.prices are the stored snake_case shape (cheese_price).
// Both spellings appear on purpose.
//
// FOUR PAYMENT/VARIANT BUCKETS per sku — this must reproduce apiSaveDay()
// exactly, or the receipt shows one figure and the sheet stores another:
//   cheese_qty        cheese, paid cash    (entered)
//   gcash_qty         regular, paid GCash  (entered)
//   gcash_cheese_qty  cheese, paid GCash   (entered)
//   regular_qty       regular, paid cash   (DERIVED = the remainder)
//   amount       = (regular + gcash) * price + (cheese + gcashCheese) * cheese_price
//   gcash_amount = gcash * price + gcashCheese * cheese_price
// The server REJECTS buckets that add up to more than sold; here they are
// clamped instead, so a half-typed row still renders a sensible receipt while
// validateBenta() shows the same complaint inline and blocks the save.
function computeDay(p){
  const lines = [];
  let sum = 0, gsum = 0;
  if (!p.closed){
    for (const c of asArr(p.counts)){
      const pr = asArr(state.prices).find(x => isObj(x) && x.sku === c.sku);
      if (!pr) continue;
      const sod = Math.max(0, num(c.sod));
      const eod = Math.max(0, num(c.eod));
      const sold = Math.max(0, sod - eod);
      const isBox = pr.group === 'box';
      const price = num(pr.price), cheesePrice = num(pr.cheese_price);
      // group=simple has no cheese version at all, so both cheese buckets are 0.
      const cheese = isBox ? clampQty(c.cheeseQty, sold) : 0;
      const gcashQty = clampQty(c.gcashQty, sold);
      const gcashCheese = isBox ? clampQty(c.gcashCheeseQty, sold) : 0;
      const regular = Math.max(0, sold - cheese - gcashQty - gcashCheese);
      const amount = (regular + gcashQty) * price + (cheese + gcashCheese) * cheesePrice;
      const gcashAmount = gcashQty * price + gcashCheese * cheesePrice;
      lines.push({
        sku:c.sku, label:pr.label, sod, eod, sold,
        cheese_qty:cheese, gcash_qty:gcashQty, gcash_cheese_qty:gcashCheese, regular_qty:regular,
        amount: r2(amount), gcash_amount: r2(gcashAmount),
        price, cheese_price:cheesePrice, group:pr.group
      });
      sum += amount; gsum += gcashAmount;
    }
  }
  const custom = p.closed ? 0 : Math.max(0, num(p.customAmount));
  // The GCash part of the custom order can never exceed the custom order — the
  // server rejects that; clamp so the local mirror can never disagree with it.
  const customGcash = p.closed ? 0 : Math.min(custom, Math.max(0, num(p.customGcash)));
  const total = r2(sum + custom);
  // Cash = Total − GCash still holds; GCash is now derived from what was
  // actually entered instead of read off the GCash app.
  const gcash = r2(gsum + customGcash);
  return { lines, total, gcash, cash: r2(total - gcash), custom, customGcash };
}
/** A bucket quantity as entered: never negative, never more than sold. */
function clampQty(v, sold){ return Math.min(Math.max(0, num(v)), Math.max(0, num(sold))); }

function currentPeriod(ds){
  const p = d2parts(ds);
  return p.d <= 15
    ? { start: partsToStr(p.y, p.m, 1),  end: partsToStr(p.y, p.m, 15) }
    : { start: partsToStr(p.y, p.m, 16), end: partsToStr(p.y, p.m, lastDayOf(p.y, p.m)) };
}
function shiftPeriod(per, dir){
  const s = d2parts(per.start);
  if (dir > 0){
    if (s.d === 1) return { start: partsToStr(s.y, s.m, 16), end: partsToStr(s.y, s.m, lastDayOf(s.y, s.m)) };
    const y = s.m === 12 ? s.y + 1 : s.y, m = s.m === 12 ? 1 : s.m + 1;
    return { start: partsToStr(y, m, 1), end: partsToStr(y, m, 15) };
  } else {
    if (s.d === 16) return { start: partsToStr(s.y, s.m, 1), end: partsToStr(s.y, s.m, 15) };
    const y = s.m === 1 ? s.y - 1 : s.y, m = s.m === 1 ? 12 : s.m - 1;
    return { start: partsToStr(y, m, 16), end: partsToStr(y, m, lastDayOf(y, m)) };
  }
}
function inPeriod(dateStr, per){ return dateStr >= per.start && dateStr <= per.end; }

function computeCutoff(per){
  let rawTotal = 0, rawCash = 0, rawGcash = 0, daysWithSales = 0;
  const days = asObj(state.days);
  for (const d in days){
    if (!inPeriod(d, per)) continue;
    const row = asObj(days[d]);
    rawTotal += num(row.total); rawCash += num(row.cash); rawGcash += num(row.gcash);
    if (num(row.total) > 0) daysWithSales++;
  }
  // Round the running sums BEFORE they feed Split, exactly as apiCutoff does,
  // so the residual cannot drift from the archived figure by a centavo.
  const total = r2(rawTotal), cash = r2(rawCash), gcash = r2(rawGcash);
  // Prototype-free accumulator + whitelisted category, so a category like
  // "toString" can never take a wrong branch and drop money from the note.
  const b = Object.create(null);
  for (const cat of EXPENSE_CATS) b[cat] = 0;
  const exps = asObj(state.expenses);
  for (const id in exps){
    const e = asObj(exps[id]);
    if (!inPeriod(e.date, per)) continue;
    b[normCategory(e.category)] += num(e.amount);
  }
  // The Supplies line is the sum of BOTH places a supply purchase can live:
  // bulk buys logged as Expenses(Supplies) and the small per-item daily buys in
  // DailySupplies. Same rule as apiCutoff(), so the preview and the archived
  // note never differ. (The UI warns against entering one purchase twice.)
  let dailySup = 0;
  const sup = asObj(state.dailySupplies);
  for (const d in sup){
    if (!inPeriod(d, per)) continue;
    for (const r of asArr(sup[d])) dailySup += num(asObj(r).amount);
  }
  // Stock usage is deliberately absent: it is quantities, never money.
  const supplies = r2(b.Supplies + dailySup);
  const other = r2(b.Backlog + b.Other);
  // Split is the residual, so a bigger Supplies figure simply leaves less.
  const split = r2(total - b.Mama - supplies - b.Octopus - other - b.Electric);
  return {
    total, cash, gcash, daysWithSales,
    mama:r2(b.Mama), supplies, octopus:r2(b.Octopus), electric:r2(b.Electric),
    other, split, perPartner: r2(split / 2)
  };
}

function buildNote(f, per){
  const s = d2parts(per.start), e = d2parts(per.end);
  const branch = asObj(state.settings).branch || 'Octogo';
  return [
    branch + ': ' + EN_MONTHS[s.m-1] + ' ' + s.d + ' - ' + e.d + ' Breakdown',
    '',
    // Total/Cash/GCash always print a number (0 when empty); only the six
    // expense categories below blank out at zero. This matches the server's
    // buildNoteText exactly, so the preview and the archived note never differ.
    'Total - ' + fmt(f.total),
    '',
    'Cash - ' + fmt(f.cash),
    'GCash - ' + fmt(f.gcash),
    '',
    'Mama - ' + noteVal(f.mama),
    'Split - ' + (num(f.split) !== 0 ? fmt(f.split) + '(' + fmt(f.perPartner) + ' each)' : ''),
    'Supplies - ' + noteVal(f.supplies),
    'Octopus - ' + noteVal(f.octopus),
    'Other payments - ' + noteVal(f.other),
    'Electric bill - ' + noteVal(f.electric)
  ].join('\n');
}

/* ============================================================
   Local mutation appliers — optimistic state mirror updates.
   Also replayed over fresh bootstrap data (reapplyQueue).
   ============================================================ */
// A generated note is stale once local data in its period changes —
// drop it so the UI never shows figures that no longer add up.
function invalidateNoteFor(date){
  if (!lastNote || !date) return;
  const parts = String(lastNote.key).split('_'); // key = start_end
  if (date >= parts[0] && date <= parts[1]) lastNote = null;
}

function applyLocalDay(p){
  ensureShape();
  invalidateNoteFor(p.date);
  const c = computeDay(p);
  const stamp = new Date().toISOString();
  state.days[p.date] = {
    date:p.date, closed:!!p.closed, staff:p.staff || '',
    gcash:c.gcash, total:c.total, cash:c.cash,
    custom_amount:c.custom, custom_gcash:c.customGcash,
    notes:p.notes || '', entry_id:p.entryId, updated_at:stamp
  };
  state.counts[p.date] = c.lines.map(l => ({
    date:p.date, sku:l.sku, sod:l.sod, eod:l.eod, sold:l.sold,
    cheese_qty:l.cheese_qty, regular_qty:l.regular_qty, amount:l.amount, entry_id:p.entryId,
    gcash_qty:l.gcash_qty, gcash_cheese_qty:l.gcash_cheese_qty, gcash_amount:l.gcash_amount
  }));
  // The server rewrites the whole date block and writes only non-zero rows —
  // mirror that exactly, or a zeroed item would linger on this phone alone.
  // A closed day clears both, same as the server.
  state.dailySupplies[p.date] = (p.closed ? [] : asArr(p.supplies))
    .filter(s => isObj(s) && txt(s.item) && num(s.amount) > 0)
    .map(s => ({ date:p.date, item:txt(s.item), amount:r2(s.amount), entry_id:p.entryId, updated_at:stamp }));
  state.stockUsage[p.date] = (p.closed ? [] : asArr(p.stock))
    .filter(s => isObj(s) && txt(s.product) && num(s.qty) > 0)
    .map(s => ({ date:p.date, product:txt(s.product), qty:num(s.qty), entry_id:p.entryId, updated_at:stamp }));
}
function applyLocalExpense(p){
  ensureShape();
  invalidateNoteFor(p.date);
  state.expenses[p.entryId] = {
    date:p.date, category:p.category, item:p.item || '', amount:num(p.amount),
    backlog_ref:p.backlogRef || '', notes:p.notes || '',
    entry_id:p.entryId, updated_at:new Date().toISOString()
  };
}
function applyLocalDeleteExpense(p){
  ensureShape();
  const e = state.expenses[p.entryId];
  if (e) invalidateNoteFor(e.date);
  delete state.expenses[p.entryId];
}

function reapplyQueue(){
  for (const item of asArr(queue)){
    if (item.action === 'saveDay') applyLocalDay(item.payload);
    else if (item.action === 'saveExpense') applyLocalExpense(item.payload);
    else if (item.action === 'deleteExpense') applyLocalDeleteExpense(item.payload);
  }
}

/* ============================================================
   Mutation queue + sync engine.
   Ordered drain, per-item retry on network failure (queue head
   blocks so order is preserved); server-rejected items are
   dropped with the error surfaced. Coalesces repeat saves.
   Triggers: app start, `online`, visibilitychange, after save.
   ============================================================ */
function enqueue(action, payload){
  // A fresh mutation for the same day/expense supersedes an earlier failure:
  // whatever went wrong is being re-sent now, so the warning goes.
  clearAttentionFor(action, attnTarget(action, payload));
  if (action === 'saveDay'){
    const i = queue.findIndex(q => q.action === 'saveDay' && q.payload.date === payload.date);
    if (i >= 0){ queue[i] = { action, payload, tries:0 }; persistQueue(); updateStatus(); return; }
  }
  if (action === 'saveExpense'){
    const i = queue.findIndex(q => q.action === 'saveExpense' && q.payload.entryId === payload.entryId);
    if (i >= 0){ queue[i] = { action, payload, tries:0 }; persistQueue(); updateStatus(); return; }
  }
  if (action === 'deleteExpense'){
    // Splice in place (never reassign `queue`) so references held by an
    // in-flight drainQueue stay coherent.
    for (let i = queue.length - 1; i >= 0; i--){
      const q = queue[i];
      if (q.action === 'saveExpense' && q.payload.entryId === payload.entryId) queue.splice(i, 1);
    }
  }
  queue.push({ action, payload, tries:0 });
  persistQueue(); updateStatus();
}

/* ---- needs-attention list: record, clear, retry ---- */
function noteAttention(kind, action, payload, message){
  if (!ATTN_KINDS[kind] || !attnTarget(action, payload)) return;
  const a = {
    kind, action, payload,
    date: isDateStr(asObj(payload).date) ? txt(payload.date) : '',
    message: txt(message), at: new Date().toISOString()
  };
  const k = attnKey(a);
  const i = attention.findIndex(x => attnKey(x) === k);
  if (i >= 0) attention[i] = a; else attention.push(a);
  persistAttention();
  updateStatus();
}
function clearAttentionFor(action, target){
  if (!target) return false;
  let changed = false;
  for (let i = attention.length - 1; i >= 0; i--){
    if (attention[i].action === action && attnTarget(action, attention[i].payload) === target){
      attention.splice(i, 1); changed = true;
    }
  }
  if (changed){ persistAttention(); updateStatus(); }
  return changed;
}
function findAttention(key){ return attention.find(a => attnKey(a) === key) || null; }
function attentionForDate(date){ return asArr(attention).filter(a => a.date === date); }

// A day queued BEFORE v2.1 carries a TYPED gcash total and no per-sku GCash
// buckets. The server ignores that figure (rightly — it is computed now), so
// the day replays with the whole cash/GCash split lost: Cash overstated, GCash
// understated for that whole period. Never let that pass silently.
function isLegacyGcashPayload(p){
  if (!isObj(p) || p.closed) return false;
  if (num(p.gcash) <= 0) return false;            // nothing was typed the old way
  if (num(p.customGcash) > 0) return false;       // already entered the new way
  for (const c of asArr(p.counts)){
    const r = asObj(c);
    if (num(r.gcashQty) > 0 || num(r.gcashCheeseQty) > 0) return false;
  }
  return true;
}
function flagLegacyGcashQueue(){
  for (const item of asArr(queue)){
    if (item.action === 'saveDay' && isLegacyGcashPayload(item.payload)){
      noteAttention('gcash', 'saveDay', item.payload, '');
    }
  }
}

class ApiError extends Error{ constructor(msg){ super(msg); this.server = true; } }

// Setup problem (wrong /exec URL, auth interstitial, HTML error page) —
// distinct from being offline, so the UI can say "check the setup".
function badResponseError(msg){
  const err = new Error(msg);
  err.badResponse = true;
  return err;
}

// An error whose message is already plain English and safe to show.
function plainError(msg){
  const err = new Error(msg);
  err.friendly = true;
  return err;
}

// Everything the user reads about a failure goes through here. Raw browser
// strings ("Failed to fetch", "NetworkError", "Unexpected token <") never
// reach the screen — a network/parse failure becomes plain English with a
// next step. Messages we wrote ourselves (server rejection, setup problem)
// pass through unchanged.
function friendlyError(err, nextStep){
  if (err && (err.server || err.badResponse || err.friendly) && err.message) return err.message;
  return 'Cannot reach the server. ' + (nextStep || 'It will try again.');
}

async function api(action, payload){
  if (!config.apiUrl) throw plainError('No API URL is set yet.');
  // POST + JSON string body, NO custom headers -> text/plain default,
  // so Apps Script never sees a CORS preflight. Follow redirects.
  const res = await fetch(config.apiUrl, {
    method:'POST',
    redirect:'follow',
    body: JSON.stringify({ token: config.token, action, payload: payload || {} })
  });
  const text = await res.text();
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw badResponseError('The server did not send app data. Check the API URL.'); }
  if (!res.ok) throw badResponseError('Server error ' + res.status + '. Check the API URL and the deployment.');
  if (!data || data.ok !== true) throw new ApiError((data && data.error) || 'The server reported an error.');
  return data.data;
}

let syncing = false;
let lastSyncError = '';

async function drainQueue(){
  updateStatus();
  if (syncing || !config.apiUrl || !navigator.onLine || queue.length === 0) return;
  syncing = true; updateStatus();
  let attnChanged = false;
  while (queue.length){
    const item = queue[0];
    try{
      // Flagged BEFORE it goes: the server will ignore this day's typed GCash
      // total, so the split has to be re-entered by hand.
      if (item.action === 'saveDay' && isLegacyGcashPayload(item.payload)){
        noteAttention('gcash', 'saveDay', item.payload, '');
        attnChanged = true;
      }
      const data = await api(item.action, item.payload);
      if (item.action === 'saveDay' && data) applyServerDay(item.payload, data);
      // Remove the item actually sent BY IDENTITY — enqueue may have
      // replaced/removed it mid-flight; if so, leave the replacement in
      // place so the next loop iteration sends it (entryId/date upserts
      // make a duplicate send harmless).
      const i = queue.indexOf(item);
      if (i !== -1) queue.splice(i, 1);
      persistQueue();
      lastSyncError = '';
    }catch(err){
      if (err && err.server){
        // REJECTED BY THE SERVER. This is NOT done: the optimistic day is still
        // only on this phone and the sheet has nothing for it. The item leaves
        // the queue (it would jam every later item) but goes on the persisted
        // needs-attention list, so the pill cannot turn green and the Sales
        // screen and More both name the date and quote the server.
        noteAttention('rejected', item.action, item.payload, err.message);
        attnChanged = true;
        lastSyncError = '';
        const i = queue.indexOf(item);
        if (i !== -1) queue.splice(i, 1);
        persistQueue();
        toast(item.action === 'saveDay' && isDateStr(item.payload.date)
          ? 'Not saved: ' + fmtShort(item.payload.date) + ' is still not in the sheet. See the red card on the Sales screen.'
          : 'Not saved: the server refused an expense. See More.');
      } else if (err && err.badResponse){
        // Server answered, but not with our API's JSON — a setup problem
        // (wrong URL/deployment), not offline. Keep the item; surface distinctly.
        item.tries = (item.tries || 0) + 1;
        lastSyncError = err.message;
        if (item.tries === 1) toast(err.message);
        break;
      } else {
        // Network trouble — keep the item (and order); retry on next trigger.
        item.tries = (item.tries || 0) + 1;
        lastSyncError = friendlyError(err);
        break;
      }
    }
  }
  syncing = false;
  persistState(); persistQueue(); updateStatus();
  // A new warning has to reach the screen she is actually looking at.
  if (attnChanged) renderPanel(activeTab);
  else if (activeTab === 'ibapa') renderIbapa();
}

// The saveDay RESPONSE is snake_case (same shape we store); older deployments
// sent camelCase, so read both — otherwise the server's authoritative cheese
// split would land as 0 on top of a perfectly good local row.
function applyServerDay(p, data){
  const day = asObj(state.days)[p.date];
  if (!day) return;
  if (data.total != null){ day.total = num(data.total); day.cash = num(data.cash); }
  // Guarded on its own: an older deployment's reply has no `gcash` at all, and
  // reading it as 0 there would wipe a perfectly good computed figure.
  if (data.gcash != null) day.gcash = num(data.gcash);
  if (Array.isArray(data.lines)){
    const rows = asArr(asObj(state.counts)[p.date]);
    for (const l of data.lines){
      if (!isObj(l)) continue;
      const r = rows.find(x => x.sku === l.sku);
      if (r){
        r.sold = num(l.sold);
        r.cheese_qty = num(pick(l, 'cheese_qty', 'cheeseQty'));
        r.regular_qty = num(pick(l, 'regular_qty', 'regularQty'));
        r.amount = num(l.amount);
        // Same story as `gcash` above: only overwrite what the reply carries.
        if (pick(l, 'gcash_qty', 'gcashQty') != null) r.gcash_qty = num(pick(l, 'gcash_qty', 'gcashQty'));
        if (pick(l, 'gcash_cheese_qty', 'gcashCheeseQty') != null) r.gcash_cheese_qty = num(pick(l, 'gcash_cheese_qty', 'gcashCheeseQty'));
        if (pick(l, 'gcash_amount', 'gcashAmount') != null) r.gcash_amount = num(pick(l, 'gcash_amount', 'gcashAmount'));
      }
    }
  }
  // A count row whose sku has left the Prices tab cannot be priced, so the
  // server DROPS it and says which ones. Mirror that here and tell her plainly —
  // silently keeping the row would leave the phone and the sheet disagreeing.
  const dropped = asArr(pick(data, 'dropped_skus', 'droppedSkus')).map(txt).filter(Boolean);
  if (dropped.length) applyDroppedSkus(p, dropped);
  persistState();
}

// A sku that has left the Prices tab has no label any more, and "box6" is not
// how anyone reads it. Fall back to a readable form of the sku itself so the
// message says "Box 6", the way the sheet spells it.
function prettySku(sku){
  const s = txt(sku);
  const m = /^([A-Za-z]+)(\d+)$/.exec(s);
  const word = m ? m[1] : s;
  const pretty = word.charAt(0).toUpperCase() + word.slice(1) + (m ? ' ' + m[2] : '');
  return pretty || s;
}
function skuLabel(sku){
  const pr = asArr(state.prices).find(x => isObj(x) && x.sku === sku);
  return txt(pr && pr.label) || prettySku(sku);
}
function listPhrase(names){
  if (names.length <= 1) return txt(names[0]);
  return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
}
function applyDroppedSkus(p, skus){
  const rows = asArr(asObj(state.counts)[p.date]);
  if (rows.length) state.counts[p.date] = rows.filter(r => skus.indexOf(txt(r.sku)) === -1);
  const one = skus.length === 1;
  const msg = listPhrase(skus.map(skuLabel)) + (one ? ' is' : ' are') +
    ' no longer in the Prices tab, so ' + (one ? 'its' : 'their') +
    ' counts were removed from this day.';
  noteAttention('dropped', 'saveDay', p, msg);
  toast(msg);
  // Reload the form so it shows what the sheet actually holds now — but never
  // over half-typed work.
  if (isObj(benta) && benta.date === p.date && !benta.dirty){
    loadBentaForm(p.date);
    if (activeTab === 'benta') renderPanel('benta');
  }
}

async function doBootstrap(){
  if (!config.apiUrl || !navigator.onLine) return false;
  try{
    const data = await api('bootstrap', {});
    applyBootstrap(data);
    persistState();
    renderPanel(activeTab);
    updateStatus();
    return true;
  }catch(e){
    console.error(e);
    lastSyncError = friendlyError(e);
    return false;
  }
}

// Data from the sheet gets exactly the same treatment as data from storage:
// every row through its element-wise normalizer, bad rows skipped one by
// one. One malformed row must cost that row only — never the whole sync.
function applyBootstrap(data){
  ensureShape();
  if (!isObj(data)) return;
  mergeSettings(state.settings, data.settings);
  if (Array.isArray(data.prices)){
    const prices = data.prices.map(normPrice).filter(Boolean);
    if (prices.length) state.prices = prices;       // no usable prices -> keep what we have
  }
  // The two picklists follow the same rule as prices: an empty or all-bad list
  // keeps what we have, so a sheet that has not been migrated yet (no
  // SupplyItems/StockItems tab) still shows the seeded cards.
  if (Array.isArray(data.supplyItems)){
    const items = data.supplyItems.map(normSupplyItem).filter(Boolean);
    if (items.length) state.supplyItems = items;
  }
  if (Array.isArray(data.stockItems)){
    const items = data.stockItems.map(normStockItem).filter(Boolean);
    if (items.length) state.stockItems = items;
  }
  if (Array.isArray(data.backlogs)) state.backlogs = data.backlogs.map(normBacklog).filter(Boolean);

  // REPLACE, never merge, for every date the snapshot covers. Merging left a
  // date whose supply rows had been CLEARED in the sheet holding its old rows
  // on this phone forever — and DailySupplies is money: it feeds the cutoff
  // note's Supplies line. Same for counts and stock usage, which the server
  // also rewrites per date.
  const dayMap   = data.days != null          ? toRowMap(data.days, normDay, r => r.date)                  : null;
  const countMap = data.counts != null        ? toCountsMap(data.counts)                                   : null;
  const supMap   = data.dailySupplies != null ? toDateListMap(data.dailySupplies, normDailySupply)         : null;
  const useMap   = data.stockUsage != null    ? toDateListMap(data.stockUsage, normStockUse)               : null;
  // The window the snapshot speaks for. The server states it (window_start) so
  // that "older than this reply covers" and "deleted in the sheet" are
  // distinguishable: inside the window the snapshot is the truth and a row it
  // omits is GONE; outside it this phone keeps its own history. Without the
  // explicit boundary a day or expense deleted by hand lingered forever.
  // An older deployment that does not send it falls back to the cautious
  // behaviour — only dates the reply mentions are touched, nothing is removed.
  const winStart = txt(pick(data, 'window_start', 'windowStart')).trim();
  if (winStart){
    // The server stated its window, so inside it the snapshot is complete and
    // authoritative for EVERY collection: a date it omits was deleted. One
    // shared set is right here precisely because the reply covers all of them.
    const covered = Object.create(null);
    for (const m of [dayMap, countMap, supMap, useMap]){ if (m) for (const d in m) covered[d] = true; }
    for (const store of [state.days, state.counts, state.dailySupplies, state.stockUsage]){
      for (const d in asObj(store)) if (d >= winStart) covered[d] = true;
    }
    if (dayMap) replaceCovered(state.days, dayMap, covered, true);
    if (countMap) replaceCovered(state.counts, countMap, covered);
    if (supMap)   replaceCovered(state.dailySupplies, supMap, covered);
    if (useMap)   replaceCovered(state.stockUsage, useMap, covered);
  } else {
    // No stated window (older deployment): stay cautious. Only touch dates the
    // reply itself mentions, each collection judged on its OWN dates — sharing
    // one set across them let a date carrying supplies delete that date's day —
    // and never remove a day, which is the pre-window behaviour.
    if (dayMap) Object.assign(state.days, dayMap);
    if (countMap) replaceCovered(state.counts, countMap, ownDates(countMap));
    if (supMap)   replaceCovered(state.dailySupplies, supMap, ownDates(supMap));
    if (useMap)   replaceCovered(state.stockUsage, useMap, ownDates(useMap));
  }
  if (data.expenses != null){
    const expMap = toRowMap(data.expenses, normExpense, r => r.entry_id);
    // Expenses are keyed by entry_id, so "covered" is judged on each row's date.
    if (winStart){
      const exps = asObj(state.expenses);
      for (const id in exps){
        const d = txt(asObj(exps[id]).date);
        if (d && d >= winStart && !expMap[id]) delete state.expenses[id];
      }
    }
    Object.assign(state.expenses, expMap);
  }
  // Local, not-yet-synced edits win over the snapshot. Guarded: one odd
  // queued payload must not throw away the snapshot we just applied.
  try{ reapplyQueue(); }catch(err){ console.error(err); }
}

// Inside the snapshot's window the server is the authority: a date it lists no
// rows for HAS no rows, so the stale ones go instead of lingering.
function ownDates(map){
  const out = Object.create(null);
  for (const d in asObj(map)) out[d] = true;
  return out;
}

// Inside `covered`, the snapshot is the truth: a date it carries is replaced, a
// date it omits is deleted. `single` distinguishes state.days (one object per
// date) from the list-valued collections (counts/supplies/stock usage).
// Anything still queued is restored right after by reapplyQueue().
function replaceCovered(target, incoming, covered, single){
  for (const d in covered){
    const row = incoming[d];
    const has = single ? isObj(row) : asArr(row).length > 0;
    if (has) target[d] = row;
    else delete target[d];
  }
}

function backlogBalance(bl){
  let base;
  if (bl.balance != null && bl.balance !== '') base = num(bl.balance);
  else {
    let paid = 0;
    const exps = asObj(state.expenses);
    for (const id in exps){
      const e = asObj(exps[id]);
      if (e.category === 'Backlog' && e.backlog_ref === bl.name) paid += num(e.amount);
    }
    base = num(bl.total_amount) - paid;
  }
  // Subtract queued (unsynced) payments the server snapshot can't know about.
  for (const q of asArr(queue)){
    if (q.action === 'saveExpense' && q.payload.category === 'Backlog' && q.payload.backlogRef === bl.name){
      if (bl.balance != null && bl.balance !== '') base -= num(q.payload.amount);
    }
  }
  return base;
}

/* ============================================================
   Shared chrome — status pill, demo banner, toast, tabs
   ============================================================ */
let activeTab = 'benta';
const $ = id => document.getElementById(id);

function updateStatus(){
  const pill = $('statusPill');
  ensureShape();
  // "Synced" is a promise that the sheet has everything. While anything is on
  // the needs-attention list that promise is false, so the pill never goes
  // green. A day the server REFUSED (or one whose GCash split was lost) is
  // missing money and says so in red; a dropped sku is a note, so it is amber.
  const needs = asArr(attention).length;
  const missing = asArr(attention).filter(a => a.kind !== 'dropped').length;
  if (!config.apiUrl){ pill.className = 'pill demo'; pill.textContent = 'Demo'; }
  else if (!navigator.onLine){ pill.className = 'pill off'; pill.textContent = 'Offline'; }
  else if (syncing){ pill.className = 'pill pending'; pill.textContent = 'Syncing…'; }
  else if (queue.length){ pill.className = 'pill pending'; pill.textContent = queue.length + ' waiting'; }
  else if (missing){ pill.className = 'pill attn'; pill.textContent = missing === 1 ? '1 not saved' : missing + ' not saved'; }
  else if (needs){ pill.className = 'pill pending'; pill.textContent = needs === 1 ? '1 to check' : needs + ' to check'; }
  else { pill.className = 'pill ok'; pill.textContent = 'Synced'; }
  $('demoBanner').hidden = !!config.apiUrl;
  $('brandBranch').textContent = asObj(state.settings).branch ? state.settings.branch : 'Takoyaki tracker';
}

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

const TABS = ['benta','gastos','cutoff','ibapa'];
function showTab(name){
  activeTab = name;
  for (const t of TABS){
    $('panel-' + t).hidden = t !== name;
    $('tab-' + t).setAttribute('aria-selected', String(t === name));
  }
  renderPanel(name);
  updateDayStrip();
  window.scrollTo(0, 0);
}

/* A re-render replaces the whole Sales panel, which on a phone means the field
   she is typing in is destroyed: focus gone, keyboard closed, half a figure
   lost. A background bootstrap must never do that — hold the re-render while a
   field inside the panel has focus and flush it the moment she is out of it. */
let bentaRenderPending = false;
function bentaIsEditing(){
  const p = $('panel-benta'), a = document.activeElement;
  if (!p || !a || !p.contains(a)) return false;
  const tag = (a.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select';
}
function flushBentaRender(){
  if (!bentaRenderPending || bentaIsEditing()) return;
  bentaRenderPending = false;
  if (activeTab === 'benta') renderPanel('benta');
}

function renderPanel(name){
  ensureShape();
  try{
    if (name === 'benta'){
      if (bentaIsEditing()){ bentaRenderPending = true; return; }
      bentaRenderPending = false;
      renderBenta();
    }
    else if (name === 'gastos') renderGastos();
    else if (name === 'cutoff') renderCutoff();
    else renderIbapa();
  }catch(err){
    // A blank screen with no explanation is the worst outcome for a
    // non-technical user — always leave something readable on screen.
    console.error(err);
    const panel = $('panel-' + name);
    if (panel) panel.innerHTML = '<div class="card"><p class="err">This screen could not be shown.</p>' +
      '<p class="hint" style="margin-top:6px;">Close the app and open it again. Your saved data is still on this phone.</p></div>';
  }
}

/* ============================================================
   SALES (benta panel) — daily entry screen with the live receipt strip
   ============================================================ */
let benta = null;

function loadBentaForm(date){
  ensureShape();
  const d = isDateStr(date) ? date : todayStr();
  const hasDay = isObj(state.days[d]);
  const day = asObj(state.days[d]);
  const counts = asArr(state.counts[d]).filter(isObj);
  const staff = staffList();
  const prev = isObj(benta) ? benta : {};
  // Rows = union of currently-active SKUs and SKUs already recorded for
  // this date, so editing an old day after a SKU is deactivated still
  // round-trips that SKU's counts instead of silently erasing them.
  const rows = [];
  const seen = {};
  const rowOf = (sku, c) => ({
    sku,
    sod:num(c.sod), eod:num(c.eod),
    // The three ENTERED buckets. regular_qty is not loaded: it is always
    // re-derived, so it can never fall out of step with the other three.
    cheese:num(c.cheese_qty), gcash:num(c.gcash_qty), gcashCheese:num(c.gcash_cheese_qty)
  });
  for (const pr of activePrices()){
    rows.push(rowOf(pr.sku, counts.find(x => x.sku === pr.sku) || {}));
    seen[pr.sku] = true;
  }
  for (const c of counts){
    if (!c.sku || seen[c.sku]) continue;
    seen[c.sku] = true;
    rows.push(rowOf(c.sku, c));
  }
  const supplies = bentaSupplyRows(d);
  const stock = bentaStockRows(d);
  benta = {
    date: d,
    closed: !!day.closed,
    staff: txt(day.staff) || (staff[0] || ''),
    custom: num(day.custom_amount),
    customGcash: num(day.custom_gcash),
    notes: txt(day.notes),
    rows,
    supplies,
    stock,
    // Open a card that already has entries so an edited day shows everything it
    // holds; otherwise remember whatever the user had open.
    suppliesOpen: !!prev.suppliesOpen || supplies.some(s => num(s.amount) > 0),
    stockOpen: !!prev.stockOpen || stock.some(s => num(s.qty) > 0),
    saved: hasDay,
    dirty: false,       // set on any user edit; cleared on load/save
    fromDraft: false    // true when unsaved typing was restored for this date
  };
  // Unsaved typing for this date always wins over what is stored: changing the

    if (panel) panel.innerHTML = '<div class="card"><p class="err">This screen could not be shown.</p>' +
      '<p class="hint" style="margin-top:6px;">Close the app and open it again. Your saved data is still on this phone.</p></div>';
  }
}

/* ============================================================
   SALES (benta panel) — daily entry screen with the live receipt strip
   ============================================================ */
let benta = null;

function loadBentaForm(date){
  ensureShape();
  const d = isDateStr(date) ? date : todayStr();
  const hasDay = isObj(state.days[d]);
  const day = asObj(state.days[d]);
  const counts = asArr(state.counts[d]).filter(isObj);
  const staff = staffList();
  const prev = isObj(benta) ? benta : {};
  // Rows = union of currently-active SKUs and SKUs already recorded for
  // this date, so editing an old day after a SKU is deactivated still
  // round-trips that SKU's counts instead of silently erasing them.
  const rows = [];
  const seen = Object.create(null);   // keyed by sku — sheet data, prototype-free
  const rowOf = (sku, c) => ({
    sku,
    sod:num(c.sod), eod:num(c.eod),
    // The three ENTERED buckets. regular_qty is not loaded: it is always
    // re-derived, so it can never fall out of step with the other three.
    cheese:num(c.cheese_qty), gcash:num(c.gcash_qty), gcashCheese:num(c.gcash_cheese_qty),
    // Boxes the special order used from this sku (v2.7.0), loaded from the same
    // snapshot the sheet stores. 0 on every row saved before the column existed.
    custom:num(c.custom_qty),
    // Given away or ruined (v2.10.1), loaded back like the special order's boxes.
    free:num(c.free_qty)
  });
  for (const pr of activePrices()){
    rows.push(rowOf(pr.sku, counts.find(x => x.sku === pr.sku) || {}));
    seen[pr.sku] = true;
  }
  for (const c of counts){
    if (!c.sku || seen[c.sku]) continue;
    seen[c.sku] = true;
    rows.push(rowOf(c.sku, c));
  }
  // Opening = previous close (v2.7.0): a date with NO saved counts pre-fills
  // each sku's SOD from that sku's EOD on the latest saved day strictly before
  // it. A prefill, never a lock — she edits it like anything typed — and a day
  // that already has saved counts always loads its own figures above.
  //
  // EVERY SKU, not only boxes (v2.9.8). v2.7.0 narrowed this to group=box with
  // no reason given anywhere, and that left nori — his own line of business, and
  // the one sku that is always group=simple because an excluded sku must be —
  // starting at 0 every night. `sold` is sod − eod for EVERY sku, so counting 8
  // nori left against a start of 0 read as max(0, 0 − 8) = nothing sold: his
  // nori money vanished quietly, which is the one thing this app exists to stop.
  // (Owner, 2026-08-27: "Bug in the starting count of nori, doesnt get the count
  // from the previous day".)
  if (!counts.length){
    for (const r of rows){
      const prevEod = prevEodFor(r.sku, d);
      if (prevEod !== '') r.sod = prevEod;
    }
  }
  const stock = bentaStockRows(d);
  benta = {
    date: d,
    closed: !!day.closed,
    staff: txt(day.staff) || (staff[0] || ''),
    custom: num(day.custom_amount),
    customGcash: num(day.custom_gcash),
    // The v2.7.0 figures, loaded back like the custom order: 0 on a fresh date
    // and on every day saved before the columns existed. The conversion is
    // SIGNED in the sheet (v2.7.3: negative = GCash cashed out of the tin);
    // the form holds its size and its direction separately, so nobody ever
    // types or reads a minus sign.
    gcashConverted: Math.abs(num(day.gcash_converted)),
    convDir: num(day.gcash_converted) < 0 ? 'in' : 'out',
    lidBoxes: num(day.lid_boxes),
    // The day's WAGE. A saved day shows the figure it was saved with (so history
    // never moves when the rate changes); a new day starts at today's rate, and
    // it can be lowered for a half day. A CLOSED day stores 0 and hides the
    // field, so it shows the usual rate instead — otherwise turning "Closed
    // today" back off would leave a silent ₱0 wage on a day that was worked.
    salary: (hasDay && !day.closed) ? daySalary(day) : dailySalary(),
    notes: txt(day.notes),
    rows,
    stock,
    // Open a card that already has entries so an edited day shows everything it
    // holds; otherwise remember whatever the user had open.
    stockOpen: !!prev.stockOpen || stock.some(s => num(s.qty) > 0),
    // Same rule for the wage: collapsed when it is simply the usual rate (which
    // is almost every night), open whenever the day carries a different figure —
    // a half day, or a day nobody was paid. Set below, once `benta` exists.
    wageOpen: !!prev.wageOpen,
    // The "Sold with GCash" card (v2.7.0) follows the same collapsible rule:
    // closed on an all-cash night (every figure 0), open the moment it holds
    // anything — nothing already entered is ever hidden. Set below.
    gcashOpen: !!prev.gcashOpen,
    saved: hasDay,
    dirty: false,       // set on any user edit; cleared on load/save
    fromDraft: false,   // true when unsaved typing was restored for this date
    // The photograph this night was read from (v2.9.0). Loaded back from the
    // stored day so an ORDINARY re-save keeps the link: the server rebuilds the
    // row from the payload, so a save that omits it would clear the cell and a
    // corrected night would quietly stop pointing at its paper.
    photoUrl: txt(day.photo_url),
    // True while the figures on the form came off a photograph and have not
    // been committed yet. It only ever makes the screen SAY something — no
    // figure, no validation and no payload reads it.
    fromPaper: false
  };
  if (wageIsCustom()) benta.wageOpen = true;
  if (gcashHeld()) benta.gcashOpen = true;
  // Unsaved typing for this date always wins over what is stored: changing the
  // date, backgrounding the app or a reload must not cost her the numbers she
  // has already read out of the notebook.
  applyBentaDraft(drafts[d]);
}

/** ONE sku's EOD on the latest saved day strictly before `date`, from local
 *  state — or '' when this phone holds no prior day for it. What is left on the
 *  shelf at close is what the stall opens with, so a fresh date's SOD pre-fills
 *  from here (v2.7.0). A prefill only: 0 stays a legitimate answer, and '' means
 *  "say nothing" rather than "say 0". */
function prevEodFor(sku, date){
  let bestDate = '', best = '';
  const byDate = asObj(state.counts);
  for (const d in byDate){
    if (!isDateStr(d) || !(d < txt(date)) || d < bestDate) continue;
    for (const r of asArr(byDate[d])){
      if (txt(asObj(r).sku) !== txt(sku)) continue;
      bestDate = d;
      // BLANK IS NEVER ZERO (v2.9.8), here as everywhere else. A row whose EOD
      // was never read says nothing about what was left, so it prefills NOTHING
      // and she counts it — rather than asserting 0 and making tonight's sold
      // figure read high. Reaching further back would be worse still: it would
      // carry a stale figure across a night we know happened. A typed 0 IS an
      // answer (the tray emptied) and prefills 0.
      best = isBlankVal(asObj(r).eod) ? '' : num(asObj(r).eod);
      break;
    }
  }
  return bestDate ? best : '';
}

/** Whether the form holds ANY GCash figure tonight — the one rule for whether
 *  the "Sold with GCash" card may start closed, read at load and after a draft
 *  is restored so the two can never disagree. */
function gcashHeld(){
  return asArr(asObj(benta).rows).some(r => num(asObj(r).gcash) > 0 || num(asObj(r).gcashCheese) > 0) ||
    num(asObj(benta).gcashConverted) > 0;
}

// Put a stashed draft back on the form. Rows/items are matched BY NAME, and a
// name the form does not have (a sku or picklist item removed since) is
// appended, so nothing typed is ever dropped on the floor.
function applyBentaDraft(dr){
  if (!isObj(dr)) return;
  benta.closed = !!dr.closed;
  benta.staff = txt(dr.staff) || benta.staff;
  benta.custom = dr.custom;
  benta.customGcash = dr.customGcash;
  // A draft from the old build has no salary in it: keep the loaded figure rather
  // than blanking a wage nobody chose to change. The v2.7.0 fields get the same
  // guard for the same reason — a pre-2.7.0 draft says nothing about them.
  if (dr.salary !== '' && dr.salary != null) benta.salary = dr.salary;
  if (dr.gcashConverted !== '' && dr.gcashConverted != null) benta.gcashConverted = dr.gcashConverted;
  // A pre-v2.7.3 draft has no direction: keep the form's (cash → GCash).
  if (dr.convDir === 'in' || dr.convDir === 'out') benta.convDir = dr.convDir;
  if (dr.lidBoxes !== '' && dr.lidBoxes != null) benta.lidBoxes = dr.lidBoxes;
  // The v2.9.0 pair, guarded the same way: a draft from an older build says
  // nothing about either, so the loaded day's own link stands. A draft that DOES
  // carry a link wins, because it is the newer, unsent version of this night.
  if (txt(dr.photoUrl)) benta.photoUrl = txt(dr.photoUrl);
  if (dr.fromPaper) benta.fromPaper = true;
  benta.notes = txt(dr.notes);
  for (const d of asArr(dr.rows)){
    const row = benta.rows.find(r => r.sku === d.sku);
    if (row){
      row.sod = d.sod; row.eod = d.eod; row.cheese = d.cheese; row.gcash = d.gcash; row.gcashCheese = d.gcashCheese;
      if (d.custom !== '' && d.custom != null) row.custom = d.custom;
      // Guarded the same way (v2.10.1): a draft from an older build says nothing
      // about give-aways, so the loaded row's own figure stands.
      if (d.free !== '' && d.free != null) row.free = d.free;
    }
    else benta.rows.push({ sku:d.sku, sod:d.sod, eod:d.eod, cheese:d.cheese, gcash:d.gcash,
      gcashCheese:d.gcashCheese, custom:raw1(d.custom), free:raw1(d.free) });
  }
  for (const d of asArr(dr.stock)){
    const row = benta.stock.find(r => r.product === d.product);
    if (row) row.qty = d.qty;
    else benta.stock.push({ product:d.product, unit:d.unit, qty:d.qty });
  }
  if (benta.stock.some(s => num(s.qty) > 0)) benta.stockOpen = true;
  // A restored draft must show everything it holds, the wage included —
  // and any GCash figure it carries.
  if (wageIsCustom()) benta.wageOpen = true;
  if (gcashHeld()) benta.gcashOpen = true;
  benta.dirty = true;      // it is still unsent work
  benta.fromDraft = true;
}

// Keep whatever is half-typed for the date currently on the form. Called before
// the date changes, and when the app is backgrounded or closed.
function stashBentaDraft(){
  if (!isObj(benta) || !benta.dirty || !isDateStr(benta.date)) return;
  drafts[benta.date] = {
    date: benta.date, closed: !!benta.closed, staff: txt(benta.staff),
    custom: raw1(benta.custom), customGcash: raw1(benta.customGcash),
    gcashConverted: raw1(benta.gcashConverted), convDir: txt(benta.convDir), lidBoxes: raw1(benta.lidBoxes),
    salary: raw1(benta.salary), notes: txt(benta.notes),
    // Kept with the numbers they belong to (v2.9.0): the paper this night came
    // off, and the fact that nobody has checked it yet.
    photoUrl: txt(benta.photoUrl), fromPaper: !!benta.fromPaper,
    rows: asArr(benta.rows).map(r => ({
      sku: txt(r.sku), sod: raw1(r.sod), eod: raw1(r.eod),
      cheese: raw1(r.cheese), gcash: raw1(r.gcash), gcashCheese: raw1(r.gcashCheese),
      custom: raw1(r.custom)
    })),
    stock: asArr(benta.stock).map(s => ({ product: txt(s.product), unit: txt(s.unit), qty: raw1(s.qty) }))
  };
  persistDrafts();
}
function clearBentaDraft(date){
  if (drafts[date] != null){ delete drafts[date]; persistDrafts(); }
}

// The stock picklist follows the SKU rule: every active product, plus any product
// this date already has a figure for, so editing an old day cannot silently erase
// an entry whose row was later deactivated or renamed.
// A blank (not 0) quantity means "nothing opened" — nicer to read than a column
// of zeroes, and it is what keeps the row out of the payload entirely.
function bentaStockRows(d){
  const saved = asArr(asObj(state.stockUsage)[d]).filter(isObj);
  const rows = [], seen = Object.create(null);   // keyed by product name — prototype-free
  for (const it of activeStockItems()){
    if (seen[it.product]) continue;
    seen[it.product] = true;
    const hit = saved.find(r => r.product === it.product);
    rows.push({ product:it.product, unit:txt(it.unit), qty: hit ? num(hit.qty) : '' });
  }
  for (const r of saved){
    if (!r.product || seen[r.product]) continue;
    seen[r.product] = true;
    const it = asArr(state.stockItems).find(x => isObj(x) && x.product === r.product);
    rows.push({ product:r.product, unit:txt(it && it.unit), qty:num(r.qty) });
  }
  return rows;
}

/**
 * The three bucket figures one row SENDS — the same values validateBenta
 * judges, so the phone can never refuse a figure it was not going to send, or
 * send a figure it never showed.
 *
 * A group=simple sku IN the cutoff has no cheese version, no cheese stepper and
 * nothing to fix, so a stray cheese figure is sent as 0 (the silent-zero rule —
 * the server enforces the real guard). An EXCLUDED sku sends its buckets
 * EXACTLY AS THE ROW HOLDS THEM: on every night entered since the sku was
 * excluded they are 0, and a non-zero one — an old day from before the flag
 * flipped — is money she has already read, so it must be seen and zeroed on
 * purpose. Its stepper renders (renderBenta's oldBuckets), validateBenta
 * refuses the save in the server's own words, and nothing is zeroed behind her
 * back. Sending 0 while validating the raw figure was the dead end: the save
 * was refused over a number that was neither sent nor fixable.
 */
/** Whether a sku's money counts for the day ON THE FORM: the loaded row's own
 *  snapshot first, else the live flag — cutoffOnDay over the form's date, so the
 *  card, the receipt, the validator and the payload all answer with one voice
 *  (v2.5.1). A sku with no price row and no snapshot counts IN, as always. */
function bentaRowInCutoff(sku){
  const pr = asArr(state.prices).find(p => isObj(p) && p.sku === txt(sku));
  return cutoffOnDay(storedPricesFor(asObj(benta).date), pr || { sku: txt(sku), in_cutoff: true });
}

function sentBuckets(r){
  const row = asObj(r);
  if (!bentaRowInCutoff(row.sku)){
    return { cheeseQty: num(row.cheese), gcashQty: num(row.gcash), gcashCheeseQty: num(row.gcashCheese) };
  }
  const cheeseSent = isBoxSku(row.sku);
  return {
    cheeseQty: cheeseSent ? num(row.cheese) : 0,
    gcashQty: num(row.gcash),
    gcashCheeseQty: cheeseSent ? num(row.gcashCheese) : 0
  };
}

function bentaPayload(){
  const closed = !!benta.closed;
  // Clamp here so the queued payload always matches what applyLocalDay /
  // computeDay stored locally — and so it can never breach a server rule.
  const custom = closed ? 0 : Math.max(0, num(benta.custom));
  // The date's stored snapshots, read ONCE for every row below.
  const snap = storedPricesFor(benta.date);
  return {
    date: benta.date,
    closed,
    staff: benta.staff,
    customAmount: custom,
    customGcash: closed ? 0 : Math.min(custom, Math.max(0, num(benta.customGcash))),
    // Tin cash swapped for GCash and the lid-box count (v2.7.0). Closed day
    // sends 0 for both, exactly as the server forces. The conversion is NOT
    // clamped to the day's cash here: validateBenta refuses that state in the
    // server's own sentence, so an over-large figure never queues at all.
    // SIGNED on the wire (v2.7.3): the direction chip carries the sign, the
    // typed amount never does. 'in' = GCash cashed out of the tin = negative.
    gcashConverted: closed ? 0
      : (benta.convDir === 'in' ? -1 : 1) * Math.max(0, num(benta.gcashConverted)),
    lidBoxes: closed ? 0 : Math.max(0, num(benta.lidBoxes)),
    // Boxes the special order used, per sku (v2.7.0) — only rows that actually
    // hold one travel, exactly as only opened stock travels. Sent as the row
    // holds them: a figure validateBenta refuses (an excluded sku's, a fraction)
    // blocks the save, so nothing here can queue what the server refuses.
    customBoxes: closed ? [] : asArr(benta.rows)
      .filter(r => num(r.custom) > 0)
      .map(r => ({ sku: r.sku, qty: num(r.custom) })),
    // The wage for this day. Sent as a figure so the sheet snapshots exactly what
    // is on screen; left OUT when the field is empty, which tells the server to
    // use the current rate. A closed day costs nothing and the server forces 0.
    salary: closed ? 0
      : (benta.salary === '' || benta.salary == null ? '' : Math.max(0, num(benta.salary))),
    notes: benta.notes,
    // The photograph this night was read from (v2.9.0). REQUEST keys are
    // camelCase, so `photoUrl`. Sent exactly as the form holds it — blank on
    // every night typed in by hand — because the server rebuilds the row from
    // this payload: omitting it would clear a link the sheet already has.
    // NOT clamped on a closed day, unlike every money field beside it: this is
    // a link to a piece of paper, not a figure, so there is nothing to zero.
    photoUrl: txt(benta.photoUrl),
    // REQUEST keys are camelCase. `gcash` is deliberately NOT sent: the server
    // computes it from these buckets and ignores a typed figure.
    // The buckets are sentBuckets(r) — the ONE reading shared with validateBenta,
    // so the validator only ever complains about figures that would really be
    // sent, and every figure sent was on the screen (see sentBuckets for the
    // excluded-sku rule that broke this symmetry once).
    // Each row also carries the price/cheesePrice/inCutoff the screen DISPLAYED
    // (v2.5.1) — the same effective values computeDay priced the receipt with.
    // The server uses them for a sku's FIRST row on the date, so a save queued
    // offline lands at the money the receipt and the tin showed, never at
    // whatever the price list says when it finally syncs. On a re-save the
    // sheet's own stored snapshots win, so a stale queued value cannot re-price
    // a night either. A sku with no price row sends none (the server drops its
    // counts and says so — there is nothing truthful to send).
    counts: closed ? [] : asArr(benta.rows).map(r => {
      const b = sentBuckets(r);
      const out = {
        sku:r.sku, sod:num(r.sod), eod:num(r.eod),
        cheeseQty: b.cheeseQty,
        gcashQty: b.gcashQty,
        gcashCheeseQty: b.gcashCheeseQty,
        // Given away or ruined (v2.10.1). Sent as the row holds it: a figure
        // validateBenta refuses never queues, so nothing here can send what the
        // server would refuse. Always present, like sod and eod.
        freeQty: Math.max(0, num(r.free))
      };
      const pr = asArr(state.prices).find(p => isObj(p) && p.sku === r.sku);
      if (pr){
        const eff = priceOnDay(snap, pr);
        out.price = num(eff.price);
        out.cheesePrice = num(eff.cheese_price);
        out.inCutoff = cutoffOnDay(snap, pr);
      }
      return out;
    }),
    // Only what was actually opened travels: the server writes non-zero rows
    // only, and a 0 for a product that has since left the sheet's list would be
    // rejected as unknown for no reason.
    // (No `supplies` array any more — that card is retired. Purchases go under
    // Expenses, which is now the only place they can live.)
    stock: closed ? [] : asArr(benta.stock)
      .filter(s => num(s.qty) > 0).map(s => ({ product:s.product, qty:num(s.qty) }))
  };
}

// SKU list to render: active prices plus any SKU already on the form
// (deactivated-but-recorded, or activated after the form was loaded).
function bentaSkuList(){
  const list = activePrices().slice();
  const seen = Object.create(null);   // keyed by sku — sheet data, prototype-free
  for (const pr of list) seen[pr.sku] = true;
  for (const r of asArr(benta.rows)){
    if (seen[r.sku]) continue;
    seen[r.sku] = true;
    const pr = asArr(state.prices).find(p => p.sku === r.sku);
    // A sku that has LEFT the Prices tab still has to render every figure it
    // already holds, so the placeholder is group:'box' — otherwise no cheese
    // stepper appears while a loaded cheese count still fails validation, and
    // the day can never be saved again. It cannot be priced, so the server
    // drops it (and says so); the card says that too.
    // in_cutoff true on the placeholder for the same reason a blank cell is true:
    // a sku nobody can look up must never lose its money silently.
    list.push(pr || { sku:r.sku, label:skuLabel(r.sku), group:'box', size:'', price:0, cheese_price:'', active:false, in_cutoff:true, missing:true });
  }
  return list;
}

// Plain-English breakdown of one sku row: how the boxes that sold split across
// the four buckets, and what the row is worth. Every bucket is a SUBSET of sold
// (same container — a dearer filling, or a different way of paying), so raising
// one only ever moves a box from one bucket to another. Spelling all of them out
// is what stops a stepper looking like it did nothing.
function skuSplitText(pr, row){
  const sold = Math.max(0, num(row.sod) - num(row.eod));
  if (!sold) return 'Enter the start and end counts to see the total.';
  const isBox = pr.group === 'box';
  const price = num(pr.price), cheesePrice = num(pr.cheese_price);
  // An EXCLUDED sku has no cheese and no payment split, so there is one figure to
  // show — and the line says out loud that it is not in the day's total.
  if (!inCutoffFlag(pr.in_cutoff)){
    return sold + ' × ' + peso(price) + ' = ' + peso(r2(sold * price)) + '  ·  not in the day’s total';
  }
  // Clamped in sequence, the same way computeDay clamps for the receipt, so
  // this line never spells out more boxes than were sold.
  const cheese = isBox ? clampQty(row.cheese, sold) : 0;
  const gcash = clampQty(row.gcash, sold - cheese);
  const gcashCheese = isBox ? clampQty(row.gcashCheese, sold - cheese - gcash) : 0;
  const regular = Math.max(0, sold - cheese - gcash - gcashCheese);
  const amount = (regular + gcash) * price + (cheese + gcashCheese) * cheesePrice;
  // Read in the same two groups the steppers are arranged in, and show each
  // group's peso subtotal — those are exactly the Cash and GCash figures on the
  // receipt, so this line explains where the receipt's split comes from.
  const cashAmt  = regular * price + cheese * cheesePrice;
  const gcashAmt = gcash * price + gcashCheese * cheesePrice;
  const side = (reg, ch) => {
    const bits = [];
    if (reg) bits.push(reg + ' regular');
    if (ch) bits.push(ch + ' cheese');
    return bits.join(' + ');
  };
  const groups = [];
  if (cashAmt) groups.push('Cash: ' + side(regular, cheese) + ' = ' + peso(cashAmt));
  if (gcashAmt) groups.push('GCash: ' + side(gcash, gcashCheese) + ' = ' + peso(gcashAmt));
  if (!groups.length) return peso(amount);
  return groups.join('  ·  ') + (groups.length > 1 ? '  ·  Total ' + peso(amount) : '');
}

// The row fields a stepper may write. A whitelist rather than free indexing,
// so a sku or a stray data attribute can never reach the prototype — and
// prototype-free itself, so "__proto__" or "toString" in a data attribute
// cannot answer truthily either.
const ROW_FIELDS = Object.assign(Object.create(null),
  { sod:'sod', eod:'eod', cheese:'cheese', gcash:'gcash', gcashCheese:'gcashCheese',
    // Boxes the special order used from this sku (v2.7.0) — customBoxes[].qty.
    custom:'custom',
    // Units that left the tray without being paid for (v2.10.1) — given away
    // or ruined. counts[].freeQty.
    free:'free' });

/* ---- The v2.7.0 presentation of the SAME three entered buckets. ----
   The sheet, the payload and `benta.rows` all keep the four buckets exactly as
   they were (cheese = cheese paid CASH, gcash = regular by GCash, gcashCheese =
   cheese by GCash) — but the screen now asks the stall's own two questions:
   "how many were cheese?" (a fact about what was MADE) and "how many were sold
   with GCash, and of those how many cheese?" (the payment). Those are sums of
   the buckets, so this is presentation only:
     C  = cheese + gcashCheese     (all cheese, however paid)
     G  = gcash + gcashCheese      (all GCash, whatever the filling)
     GC = gcashCheese              (the overlap: cheese AND GCash)
   and the buckets come straight back: gcashCheese = GC, cheese = C − GC,
   gcash = G − GC. Every stepper below edits the buckets through this map, so a
   queued payload, a draft and a loaded day never change meaning. */
const UI_FIELDS = Object.assign(Object.create(null),
  { cheeseAll:true, gcashAll:true, gcashOfCheese:true });
function rowUI(r){
  const row = asObj(r);
  const gc = Math.max(0, num(row.gcashCheese));
  return {
    C: Math.max(0, num(row.cheese)) + gc,
    G: Math.max(0, num(row.gcash)) + gc,
    GC: gc
  };
}
/* ---- BLANK IS NOT ZERO (v2.9.0). ----
   A reading of the paper leaves a figure it could not see EMPTY, and it must
   stay empty on the form: a 0 looks like an answer, and an answer nobody gave
   is the one thing a reading must never put on this screen. Every figure the
   app computes already reads a blank as 0 (num('') is 0), so these three are
   display-only — they decide what the box SHOWS, never what anything sums.
   A row can already hold a blank without any photograph in sight: clearing a
   stepper leaves one in a stashed draft, and showing that back as 0 was never
   right either. */
function isBlankVal(v){ return v === '' || v == null; }
/** One count field as it should APPEAR: blank when the row holds nothing. */
function stepVal(v){ return isBlankVal(v) ? '' : num(v); }
/** The three v2.7.0 presentation figures as they should APPEAR. Each is a SUM of
 *  buckets (rowUI), so it may only read blank when EVERY bucket behind it is
 *  blank — "2 plus something unread" is not a figure anybody should be shown,
 *  and the unread part is named in the reading's own list instead. */
function uiVal(r, key){
  const row = asObj(r);
  const ui = rowUI(row);
  if (key === 'GC') return isBlankVal(row.gcashCheese) ? '' : ui.GC;
  if (key === 'C') return (isBlankVal(row.cheese) && isBlankVal(row.gcashCheese)) ? '' : ui.C;
  return (isBlankVal(row.gcash) && isBlankVal(row.gcashCheese)) ? '' : ui.G;
}
/** How many sold, as it should APPEAR: blank unless BOTH counts are there. One
 *  count without the other is not a difference — "31 in, end of day unread"
 *  showing "Sold: 31" would be an invented night's sales. */
function soldVal(r){
  const row = asObj(r);
  if (isBlankVal(row.sod) || isBlankVal(row.eod)) return '';
  return Math.max(0, num(row.sod) - num(row.eod));
}
/** Reflect one row's bucket state into every UI stepper it feeds — the three
 *  figures interlock, so a change to one can move another. The field being
 *  typed in is left alone (rewriting it would fight the keyboard). */
function syncRowInputs(sku, r){
  const put = (f, v) => {
    const el = $('in-' + sku + '-' + f);
    if (el && el !== document.activeElement) el.value = v;
  };
  // uiVal, not rowUI: a press on ONE question must not fill the other two boxes
  // with 0s nobody gave. A bucket the reading could not see stays empty until
  // somebody answers it (v2.9.0).
  put('cheeseAll', uiVal(r, 'C'));
  put('gcashAll', uiVal(r, 'G'));
  put('gcashOfCheese', uiVal(r, 'GC'));
}
/** One press of a v2.7.0 stepper. Raising a figure adds the matching bucket
 *  (cash cheese, or regular GCash); lowering one takes from the same bucket
 *  first and only then reclassifies the overlap, so the OTHER question's answer
 *  never moves unless it has to. "Of those, cheese" only reclassifies boxes
 *  already counted on both sides — the invariant is GC ≤ min(C, G), which is
 *  exactly what keeps every bucket ≥ 0. Clamps mirror the server's bounds:
 *  every bucket is a subset of sold − the special order's boxes. */
function uiStep(r, field, dir){
  const sold = Math.max(0, num(r.sod) - num(r.eod));
  const customQty = Math.max(0, num(r.custom));
  const ui = rowUI(r);
  if (dir > 0 && sold === 0){
    toast('Enter Start of day and End of day first, then split the boxes.');
    return;
  }
  if (field === 'cheeseAll'){
    if (dir > 0){
      // paid = C + (G − GC) ≤ sold − custom, so C may grow to this room.
      const room = Math.max(0, sold - customQty - (ui.G - ui.GC));
      if (ui.C + 1 > room){
        toast(room === sold
          ? '“How many were cheese” can only go up to ' + sold + ' — that is how many were sold.'
          : '“How many were cheese” can only go up to ' + room + ' — the other ' + (sold - room) +
            ' of the ' + sold + ' sold are already GCash regular or the special order’s.');
      } else r.cheese = Math.max(0, num(r.cheese)) + 1;
    } else if (num(r.cheese) > 0) r.cheese = num(r.cheese) - 1;
    else if (num(r.gcashCheese) > 0){
      // The last cheese was a GCash one: it stays GCash, just not cheese.
      r.gcashCheese = num(r.gcashCheese) - 1;
      r.gcash = Math.max(0, num(r.gcash)) + 1;
    }
  } else if (field === 'gcashAll'){
    if (dir > 0){
      const room = Math.max(0, sold - customQty - (ui.C - ui.GC));
      if (ui.G + 1 > room){
        toast(room === sold
          ? '“Sold with GCash” can only go up to ' + sold + ' — that is how many were sold.'
          : '“Sold with GCash” can only go up to ' + room + ' — the other ' + (sold - room) +
            ' of the ' + sold + ' sold are already cheese paid in cash or the special order’s.');
      } else r.gcash = Math.max(0, num(r.gcash)) + 1;
    } else if (num(r.gcash) > 0) r.gcash = num(r.gcash) - 1;
    else if (num(r.gcashCheese) > 0){
      // The last GCash box was a cheese one: it stays cheese, now paid in cash.
      r.gcashCheese = num(r.gcashCheese) - 1;
      r.cheese = Math.max(0, num(r.cheese)) + 1;
    }
  } else if (field === 'gcashOfCheese'){
    if (dir > 0){
      if (num(r.cheese) > 0 && num(r.gcash) > 0){
        r.cheese = num(r.cheese) - 1;
        r.gcash = num(r.gcash) - 1;
        r.gcashCheese = num(r.gcashCheese) + 1;
      } else {
        toast('“Of those, cheese” can only go up to ' + Math.min(ui.C, ui.G) +
          ' — it counts boxes that are both cheese and paid by GCash.');
      }
    } else if (num(r.gcashCheese) > 0){
      r.gcashCheese = num(r.gcashCheese) - 1;
      r.cheese = Math.max(0, num(r.cheese)) + 1;
      r.gcash = Math.max(0, num(r.gcash)) + 1;
    }
  }
  benta.dirty = true;
  syncRowInputs(r.sku, r);
  afterCountChange(r.sku);
}
/** A figure TYPED into a v2.7.0 stepper field. Kept as typed where the map
 *  allows (validateBenta refuses the rest, as with every typed count); only the
 *  overlap is clamped, because GC beyond min(C, G) would push a bucket below
 *  zero — a state no payload may ever hold. */
function uiTyped(r, field, raw){
  const v = Math.max(0, num(raw));
  const ui = rowUI(r);
  if (field === 'cheeseAll'){
    const gc = Math.min(ui.GC, v);
    r.gcashCheese = gc;
    r.cheese = v - gc;
    r.gcash = Math.max(0, ui.G - gc);
  } else if (field === 'gcashAll'){
    const gc = Math.min(ui.GC, v);
    r.gcashCheese = gc;
    r.gcash = v - gc;
    r.cheese = Math.max(0, ui.C - gc);
  } else {
    const gc = Math.min(v, ui.C, ui.G);
    r.gcashCheese = gc;
    r.cheese = ui.C - gc;
    r.gcash = ui.G - gc;
  }
  syncRowInputs(r.sku, r);
}
// The three ENTERED buckets, with the label each one shows.
// Labels name BOTH dimensions — variant and payment — because a bare "Cheese"
// or "GCash" is ambiguous on its own and read as a riddle in the first cut of
// this screen. These strings are what a toast, an error and a screen reader say.
const BUCKETS = [
  { field:'cheese',      label:'Cheese paid in cash',  gcash:false, boxOnly:true },
  { field:'gcash',       label:'Regular paid by GCash', gcash:true,  boxOnly:false },
  { field:'gcashCheese', label:'Cheese paid by GCash',  gcash:true,  boxOnly:true }
];
function fieldLabel(field){
  const b = BUCKETS.find(x => x.field === field);
  return b ? b.label : field;
}
/** How many of `sold` are still unlabelled, ignoring one bucket. `isBox` is
 *  passed through because a group=simple sku has no cheese buckets at all —
 *  same rule computeDay applies, so the figures cannot disagree. */
function bucketRoom(row, sold, exceptField, isBox){
  let used = 0;
  for (const b of BUCKETS){
    if (b.field === exceptField) continue;
    if (b.boxOnly && !isBox) continue;
    used += Math.max(0, num(row[b.field]));
  }
  return Math.max(0, sold - used);
}
// (The old per-card "Regular (cash)" derived figure is gone with the v2.7.0
// layout: the cash remainder is now spelled out once, in the display-only
// "Sold with cash" card — cashRecapHTML — instead of per row.)
// Every place it lands in markup — attributes and ids alike — must be
// escaped, or the tag breaks apart and the steppers stop working.
function stepperHTML(sku, field, value, label, small){
  const s = esc(sku);
  return '<div class="stepper' + (small ? ' sm' : '') + '" data-sku="' + s + '" data-field="' + field + '">' +
    '<button type="button" class="step-btn" data-act="step" data-dir="-1" aria-label="Subtract one: ' + esc(label) + '">−</button>' +
    '<input class="step-val" id="in-' + s + '-' + field + '" inputmode="numeric" autocomplete="off" value="' + value + '" aria-label="' + esc(label) + '">' +
    '<button type="button" class="step-btn" data-act="step" data-dir="1" aria-label="Add one: ' + esc(label) + '">+</button>' +
  '</div>';
}

/* ---- The needs-attention card. Shown on BOTH the Sales screen and More, so
   whichever screen she is on, a day the sheet does not have is impossible to
   miss — with its date, the server's own words, and what to do next. ---- */
function attnCopy(a){
  const when = isDateStr(a.date) ? fmtLong(a.date) : 'One entry';
  if (a.kind === 'gcash') return {
    when,
    why: 'GCash for this day needs re-entering. It was typed as one total before the app was updated, so the sheet could not tell which boxes were paid by GCash.',
    help: 'Open this day, put the GCash boxes in, then tap Save day. Until then this day counts as all cash.'
  };
  if (a.kind === 'dropped') return {
    when,
    why: a.message,
    help: 'Everything else on this day was saved. Add the box size back in the Prices tab if you still sell it.'
  };
  if (a.action === 'saveDay') return {
    when,
    why: 'This day is NOT in the Google Sheet. The server would not take it: ' + a.message,
    help: 'Open this day, fix what that message says, then tap Save day again.'
  };
  // Everything else: name WHAT did not reach the sheet, in the words the screen
  // that made it uses, and where to put it right.
  const what = ATTN_WHAT[a.action] || { thing:'entry', where:'Add it again.' };
  return {
    when: (isDateStr(a.date) ? when + ' — ' : '') + what.thing,
    why: 'This ' + what.thing + ' is NOT in the Google Sheet. The server would not take it: ' + a.message,
    help: 'Tap Try again. If it keeps failing: ' + what.where
  };
}
const ATTN_WHAT = {
  saveExpense:     { thing:'expense',    where:'add it again from the Expenses screen.' },
  deleteExpense:   { thing:'deletion',   where:'delete it again from the Expenses screen.' },
  saveStockCount:  { thing:'stock count', where:'count it again under More → Stock on hand.' },
  saveStockDelivery: { thing:'delivery', where:'add it again with “Stock came in” under More → Stock on hand.' },
  saveCutoffSplit: { thing:'split',      where:'enter it again on the Cutoff screen.' },
  savePrices:      { thing:'price change', where:'change it again under More → Maintenance.' },
  saveSettings:    { thing:'settings change', where:'change it again under More → Maintenance.' },
  saveStockItems:  { thing:'stock list change', where:'change it again under More → Maintenance.' }
};
function attentionCardHTML(){
  ensureShape();
  if (!attention.length && !storageFull) return '';
  let h = '<div class="card attn-card">';
  if (attention.length){
    h += '<p class="attn-head">' + (attention.length === 1
      ? '1 entry needs your attention' : attention.length + ' entries need your attention') + '</p>';
    attention.forEach((a, i) => {
      const key = esc(attnKey(a));
      const c = attnCopy(a);
      h += '<div class="attn-item' + (i === 0 ? ' first' : '') + '">' +
        '<div class="attn-when">' + esc(c.when) + '</div>' +
        '<div class="attn-why">' + esc(c.why) + '</div>' +
        '<div class="attn-help">' + esc(c.help) + '</div>' +
        '<div class="attn-acts">' +
          (a.action === 'saveDay' && isDateStr(a.date)
            ? '<button type="button" class="btn small" data-act="attn-open" data-key="' + key + '">Open this day</button>' : '') +
          (a.kind === 'rejected'
            ? '<button type="button" class="btn small primary" data-act="attn-retry" data-key="' + key + '">Try again</button>' : '') +
          '<button type="button" class="btn small" data-act="attn-dismiss" data-key="' + key + '">' +
            (a.kind === 'rejected' ? 'Hide this' : 'Got it') + '</button>' +
        '</div>' +
      '</div>';
    });
  }
  if (storageFull){
    h += '<p class="err">This phone has run out of storage. Work waiting to be sent may be lost if the app is closed — tap Sync now in More as soon as you have signal.</p>';
  }
  return h + '</div>';
}

function openAttentionEntry(key){
  const a = findAttention(key);
  if (!a || !isDateStr(a.date)) return;
  stashBentaDraft();
  loadBentaForm(a.date);
  showTab('benta');
  toast('Opened ' + fmtShort(a.date) + '. Fix it, then tap Save day.');
}
function retryAttention(key){
  const a = findAttention(key);
  if (!a) return;
  enqueue(a.action, a.payload);      // clears this entry: it is being re-sent
  renderPanel(activeTab);
  toast('Sending it again…');
  drainQueue();
}
function dismissAttention(key){
  const a = findAttention(key);
  if (!a) return;
  if (a.kind === 'rejected' &&
      !confirm('This is still not in the Google Sheet. Hide the warning anyway?')) return;
  attention = attention.filter(x => attnKey(x) !== key);
  persistAttention();
  updateStatus();
  renderPanel(activeTab);
}

/* ONE quiet line when something is at or below its reorder point — never a
   modal, never anything that has to be dismissed before the day can be entered.
   It is a shopping reminder, not an error. */
function lowStockLineHTML(){
  let low = [];
  try{ low = lowStockList(); }catch(err){ console.error(err); return ''; }
  if (!low.length) return '';
  const names = listPhrase(low.map(s => s.product));
  return '<div class="low-line">' +
    '<span aria-hidden="true">🛒</span>' +
    '<span>Running low on <b>' + esc(names) + '</b>. ' +
      '<button type="button" class="lnk" data-act="goto-stock">See stock on hand</button></span>' +
  '</div>';
}

function renderBenta(){
  if (!benta) loadBentaForm(todayStr());
  const isToday = benta.date === todayStr();
  const staff = staffList();
  let h = '';

  // Anything that did not reach the sheet comes FIRST — before the day's entry.
  h += attentionCardHTML();
  h += lowStockLineHTML();

  // Date header (tap to backfill)
  h += '<div class="card date-card">' +
    '<div>' +
      '<div class="date-kicker' + (isToday ? '' : ' backfill') + '">' + (isToday ? 'Today' : 'Earlier day') + '</div>' +
      '<div class="date-big">' + fmtLong(benta.date) + '</div>' +
      '<div class="date-hint">Tap to change the date</div>' +
    '</div>' +
    '<svg class="cal-ico" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>' +
    '<input type="date" id="bentaDate" class="date-cover" value="' + benta.date + '" max="' + todayStr() + '" aria-label="Choose the date">' +
  '</div>' +
  '<p class="err" id="err-date" style="margin:-8px 4px 14px;" hidden></p>';

  // Never claim a day is saved while it is sitting on the needs-attention list:
  // the sheet does not have it.
  if (benta.fromDraft){
    h += '<p class="saved-hint" style="color:var(--accent-text);">Your unsent numbers for this day were kept. Tap Save day when it is complete.</p>';
  } else if (benta.saved && !dateNotInSheet(benta.date)){
    h += '<p class="saved-hint">✓ This day is already saved. You are editing it.</p>';
  }

  // WHERE THESE FIGURES CAME FROM (v2.9.0). A prefilled night is marked plainly
  // and in the accent, never in green: a reading is not a saved day and must
  // never look like one. It says so even after a reload, when the review card
  // itself is gone — the draft keeps the marker with the numbers.
  if (benta.fromPaper){
    h += '<p class="saved-hint" style="color:var(--accent-text);">These figures came from the paper — check them against it before you tap Save day. Nothing has been saved.</p>';
  }
  // The paper a SAVED night was read from, so the figures can always be taken
  // back to the page they came from. The link is validated before it is ever an
  // href (paperLink); the review card below carries its own while it is showing.
  const dayShot = paperLink(asObj(state.days)[benta.date] && state.days[benta.date].photo_url);
  if (dayShot && !paperShowingFor(benta.date)){
    h += '<p class="hint" style="margin:-6px 4px 14px;">This night was read from a photo of the paper. ' +
      '<a href="' + esc(dayShot) + '" target="_blank" rel="noopener noreferrer">Open the photo</a></p>';
  }
  // "Read it from the paper" — the camera, the progress, and the reading itself.
  // Absent entirely when the photo reader is not set up on this phone.
  try{ h += paperCardHTML(); }catch(err){ console.error(err); }

  // Closed-day toggle. The whole row is the label, so tapping the words works
  // too — this switch blanks a whole day.
  h += '<div class="card"><label class="switch-row" for="closedToggle">' +
    '<span><span class="sw-label" style="display:block;">Closed today</span><span class="sw-sub" style="display:block;">No sales on this day</span></span>' +
    '<span class="switch"><input type="checkbox" id="closedToggle"' + (benta.closed ? ' checked' : '') + ' aria-label="Closed today — no sales">' +
    '<span class="track"></span><span class="knob"></span></span>' +
  '</label></div>';

  // Staff chips
  if (staff.length){
    h += '<div class="section-title">Who minded the stall?</div><div class="chips" role="group" aria-label="Staff">';
    for (const s of staff){
      h += '<button type="button" class="chip" data-act="staff" data-staff="' + esc(s) + '" aria-pressed="' + String(benta.staff === s) + '">' + esc(s) + '</button>';
    }
    h += '</div>';
  }

  if (!benta.closed){
    // Count rows: active skus + skus already on the form (union) —
    // a mid-session bootstrap can activate/deactivate skus, so create a
    // placeholder row for any sku the form doesn't know yet.
    // ① BOX COUNTS (v2.7.0) — the screen is laid out the way the stall works:
    // count the boxes and say what was made here; HOW they were paid is the
    // "Sold with GCash" card below; the cash remainder is display-only after
    // that. Same four bucket keys travel in the payload — presentation only.
    h += '<div class="section-title">Box counts</div>';
    const skus = bentaSkuList();
    if (!skus.length){
      h += '<div class="card"><p class="hint">No box sizes to count yet. Add them in the Prices tab of the Google Sheet, then sync.</p></div>';
    }
    h += '<p class="hint" style="margin:-4px 0 12px;">Count each size in and out. “How many were cheese” is about what was made, not how it was paid — GCash comes in its own card below.</p>';
    // One row of a payment/variant card: a label beside a stepper (or a derived
    // figure). Shared by the sku cards, the GCash card and the custom-order card.
    const payRow = (label, inner, gc) =>
      '<div class="pay-row' + (gc ? ' gc' : '') + '">' +
        '<span class="pay-what">' + label + '</span>' + inner +
      '</div>';
    // The prices THIS DAY counts at (v2.5.0): a saved day keeps the prices it
    // was saved with, so reopening an old night shows the money it actually
    // made — not what the same boxes would make at today's prices.
    const daySnap = storedPricesFor(benta.date);
    for (const pr of skus){
      let row = asArr(benta.rows).find(r => r.sku === pr.sku);
      if (!row){ row = { sku:pr.sku, sod:0, eod:0, cheese:0, gcash:0, gcashCheese:0, custom:0 }; benta.rows.push(row); }
      const eff = priceOnDay(daySnap, pr);
      // What the badge SHOWS — blank while either count is missing (soldVal), so
      // a half-read row never advertises a night's sales nobody counted.
      const sold = soldVal(row);
      const isBox = pr.group === 'box';
      // A sku kept OUT of the cutoff is counted exactly like the others, so its
      // card looks ordinary — start count, end count, sold — with one badge and one
      // short line saying where its money goes. It has no payment split at all, so
      // no bucket steppers appear on it.
      // THE DAY's flag, not the live one (v2.5.1): a loaded row's own snapshot
      // wins, the same way the day's stored prices do, so the card, the receipt
      // (computeDay), the validator and a re-save all tell one story about a
      // night that was already saved.
      const inCut = cutoffOnDay(daySnap, pr);
      const prEff = Object.assign({}, pr, eff, { in_cutoff: inCut });
      // An excluded sku is ALWAYS a plain quantity card: one price, no cheese, no
      // buckets — whatever its `group` says. A sheet hand-edited into box + excluded
      // is a state the server refuses outright, so showing a cheese price here (and
      // then dropping the counts) would be the phone agreeing with a sheet the save
      // will reject. It renders plain and validateBenta quotes the server inline.
      const showCheese = isBox && inCut;
      const sk = esc(pr.sku);   // sku is sheet data — escape it everywhere it enters markup
      const stepFor = (field) =>
        stepperHTML(pr.sku, field, num(row[field]), fieldLabel(field) + ', ' + pr.label, true);

      // "How many were cheese" is a fact about what was MADE — cheese or
      // regular — never about payment (v2.7.0, owner's proposal). It shows the
      // TOTAL cheese (cash cheese + GCash cheese: rowUI); the GCash card below
      // splits the payment. Only a box sku has a cheese version at all.
      let cheeseFact = '';
      if (isBox && inCut){
        cheeseFact = '<div class="buckets">' +
          payRow('How many were cheese?',
            stepperHTML(pr.sku, 'cheeseAll', uiVal(row, 'C'), 'How many were cheese, ' + pr.label, true), false) +
          '<p class="hint" style="margin-top:4px;">What was made — cheese or regular. Not payment.</p>' +
        '</div>';
      }
      // An EXCLUDED sku normally has no bucket steppers at all — but a LOADED
      // row can still hold one from before the sku was excluded, and the save
      // refuses the day while it does. A figure with no stepper is a dead end:
      // there was no way to zero it from the phone, so the day could never be
      // saved again. Same rule the missing-sku placeholder uses for its cheese
      // steppers — whatever the row already holds must render, so it can be
      // seen and zeroed on purpose, never zeroed behind her back.
      /* GIVEN AWAY OR RUINED (v2.10.1). Its own small question, on EVERY sku —
         nori gets ruined as readily as a box does — because `sold` is what left
         the tray and the app must not price a freebie or a dropped box at full
         menu price. Not folded into the cheese/GCash card: those describe how
         paid sales were paid, and this is the opposite of a paid sale. */
      const freeAsk = '<div class="buckets">' +
        payRow('Given away or ruined?',
          stepperHTML(pr.sku, 'free', num(row.free), 'Given away or ruined, ' + pr.label, true), false) +
        '<p class="hint" style="margin-top:4px;">Counted in “Sold”, because it did leave the tray — just not paid for, so no money is added for it.</p>' +
        '<p class="err" id="err-free-' + sk + '" hidden></p>' +
      '</div>';

      let oldBuckets = '';
      if (!inCut){
        const held = BUCKETS.filter(b => num(row[b.field]) !== 0);
        if (held.length){
          oldBuckets = '<div class="buckets"><div class="pay-intro">Old counts to clear</div>' +
            '<p class="hint" style="margin:-4px 0 10px;">' + esc(pr.label) +
              ' is kept out of the cutoff now, so these old counts must go back to 0 before the day can save. ' +
              'The boxes still count in “Sold”.</p>' +
            held.map(b => payRow(esc(b.label), stepFor(b.field), b.gcash)).join('') +
          '</div>';
        }
      }
      h += '<div class="card sku-card" data-skucard="' + sk + '">' +
        '<div class="sku-head"><strong>' + esc(pr.label) + '</strong>' +
          (inCut ? '' : '<span class="badge-excl">Not in the cutoff</span>') +
          // The prices shown are the DAY's prices (the stored snapshot on a
          // saved day), so an old night reads at the money it was saved at.
          '<span class="sku-price">' + (pr.missing ? 'Not in the Prices tab'
            : peso(eff.price) + (showCheese ? ' · Cheese ' + peso(eff.cheese_price) : '') +
              (truthy(pr.active) ? '' : ' · no longer active')) + '</span></div>' +
        // It cannot be priced any more, so the server drops these counts when
        // the day is saved. Say so here rather than letting it surprise her.
        (pr.missing ? '<p class="hint" style="margin:-4px 0 10px;">' + esc(pr.label) +
          ' is not in the Prices tab any more, so it has no price. Saving this day will remove its counts.</p>' : '') +
        '<div class="count-grid">' +
          // stepVal, not num: a count the reading could not see stays EMPTY.
          '<div class="count-cell"><label for="in-' + sk + '-sod">Start of day</label>' + stepperHTML(pr.sku, 'sod', stepVal(row.sod), 'Start of day, ' + pr.label) + '</div>' +
          '<div class="count-cell"><label for="in-' + sk + '-eod">End of day</label>' + stepperHTML(pr.sku, 'eod', stepVal(row.eod), 'End of day, ' + pr.label) + '</div>' +
        '</div>' +
        '<div class="sold-row">' +
          '<div class="sold-badge" id="soldbadge-' + sk + '">Sold: <b id="sold-' + sk + '">' + sold + '</b></div>' +
        '</div>' +
        // An in-cutoff card carries only the cheese FACT here — payment lives in
        // the GCash card below and the cash remainder after it (v2.7.0). No
        // payment split on an excluded sku at all: its money is one plain amount
        // that never joins the day's Cash or GCash, its own arithmetic line says
        // so, and old bucket figures the row still holds render so they can be
        // zeroed — see oldBuckets.
        (inCut
          ? cheeseFact + freeAsk
          : oldBuckets + freeAsk + '<p class="excl-note">Count it as usual — its money is kept separate.</p>' +
            '<div class="sku-split" id="split-' + sk + '">' + skuSplitText(prEff, row) + '</div>') +
        '<p class="err" id="err-sku-' + sk + '" hidden></p>' +
      '</div>';
    }

    // ② SOLD WITH GCASH — one collapsible card for the whole payment question,
    // with the converted tin cash at its bottom (v2.7.0).
    h += gcashCardHTML(skus, daySnap, payRow);

    // ③ SOLD WITH CASH — display only: the derived remainder, spelled out.
    // Filled (and kept live) by updateReceipt, exactly like the receipt strip.
    h += '<div class="section-title">Sold with cash</div>' +
      '<div class="card" id="cashRecap"></div>';

    // Custom order (+ how much of it was GCash), the boxes it physically used,
    // the lid-box count and the day note. There is NO typed GCash total any
    // more: it is computed and shown on the receipt.
    h += '<div class="section-title">Custom order</div>';
    // The box skus a special order may draw from: every in-cutoff box on the
    // form — plus any row still HOLDING a figure (a sku since excluded or
    // deactivated), because a figure with no stepper is a dead end: it must
    // render so it can be seen and zeroed on purpose, never zeroed behind her
    // back. Same rule the excluded card applies to its old buckets.
    const cboxSkus = skus.filter(pr => {
      const r = asArr(benta.rows).find(x => x.sku === pr.sku) || {};
      return (pr.group === 'box' && cutoffOnDay(daySnap, pr)) || num(r.custom) > 0;
    });
    h += '<div class="card">' +
      '<div class="field"><label for="customAmount">Custom order (₱)</label>' +
        '<input class="input money" id="customAmount" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(benta.custom || '') + '">' +
        '<p class="err" id="err-custom" hidden></p></div>' +
      '<div class="field"><label for="customGcash">How much of that was GCash? (₱)</label>' +
        '<input class="input money gcash-in" id="customGcash" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(benta.customGcash || '') + '">' +
        '<p class="hint" style="margin-top:6px;">Leave it empty if the custom order was paid in cash.</p>' +
        '<p class="err" id="err-customGcash" hidden></p></div>';
    // Boxes the order USED (v2.7.0): whole boxes off tonight's counted stack.
    // They are not priced again — the typed amount above is the order's entire
    // value — so each one comes off its sku's priced quantity.
    if (cboxSkus.length){
      h += '<div class="buckets"><div class="pay-intro">Boxes the order used</div>' +
        '<p class="hint" style="margin:-4px 0 10px;">Whole boxes from tonight’s counts that went into this order. They are not priced again — the amount above is the order’s whole value.</p>';
      for (const pr of cboxSkus){
        const r = asArr(benta.rows).find(x => x.sku === pr.sku) || {};
        h += payRow(esc(pr.label),
          stepperHTML(pr.sku, 'custom', num(r.custom), 'Boxes the order used, ' + pr.label, true), false) +
          '<p class="err" id="err-cbox-' + esc(pr.sku) + '" hidden></p>';
      }
      h += '</div>';
    }
    // Box with lid (v2.7.0): its own labelled section — a plain count with NO
    // price, NO sales money, NO stock tracking and NO note impact.
    h += '<div class="buckets"><div class="pay-intro">Box with lid</div>' +
      payRow('Lid boxes used', lidStepperHTML(), false) +
      '<p class="hint" style="margin-top:4px;">Just a count — it has no price and touches no money.</p>' +
      '<p class="err" id="err-lidBoxes" hidden></p>' +
    '</div>';
    h += '<div class="field" style="margin-top:14px;"><label for="dayNotes">Note (optional)</label>' +
        '<input class="input" id="dayNotes" autocomplete="off" placeholder="e.g. 30 pcs party order" value="' + esc(benta.notes) + '"></div>' +
    '</div>';

    // The day's WAGE and the stock used, both saved by the same "Save day"
    // button as everything above. Both collapsed on the ordinary night — the
    // wage is already right and nothing was opened — so the common path down to
    // Save day is short. Either card opens itself when it holds something.
    h += wageCardHTML();
    topUpStockRows();
    h += stockCardHTML();
  } else {
    h += '<p class="hint" style="margin:-4px 4px 14px;">A closed day costs no wage, so nothing is added for it.</p>';
  }

  // Live receipt strip
  h += '<div class="receipt-wrap" id="receiptWrap">' +
    '<div class="receipt" id="receipt"></div>' +
    '<div class="r-tear" aria-hidden="true"></div>' +
  '</div>';

  // GCash is no longer typed in, so say where the figure comes from — it is
  // still the number to check against the GCash app history.
  if (!benta.closed){
    h += '<p class="hint" style="margin:2px 4px 12px;">The GCash total is added up from what you entered above. Check it against your GCash app.</p>';
  }

  h += '<div id="nightCheck"></div>';
  h += '<button type="button" class="btn primary block" data-act="save-day" style="margin-bottom:10px;">Save day</button>';

  $('panel-benta').innerHTML = h;
  updateReceipt();
  validateBentaLive();
}

/* ---- The stock card, saved by the same "Save day" action ---- */
const CHEV = '<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

function collapseCardHTML(key, title, summary, open, body){
  const bodyId = key + 'Body';
  return '<div class="card collapse">' +
    '<button type="button" class="collapse-head" data-act="toggle-' + key + '" aria-expanded="' + String(!!open) + '" aria-controls="' + bodyId + '">' +
      '<span class="ch-title">' + title + '</span>' +
      '<span class="ch-sum">' + summary + '</span>' + CHEV +
    '</button>' +
    '<div class="collapse-body" id="' + bodyId + '"' + (open ? '' : ' hidden') + '>' + body + '</div>' +
  '</div>';
}

/* ---- The WAGE card. Collapsed on an ordinary night, because it is already
   filled in with the usual rate and the nightly job is the boxes, not the wage.
   It is never hidden when it holds something to see: a half day, or a day nobody
   was paid, opens the card itself — and the amount is in the card's head either
   way, so it can be checked without opening anything. ---- */
/** A wage that is not simply the usual rate. */
function wageIsCustom(){
  const v = asObj(benta).salary;
  return v !== '' && v != null && num(v) !== dailySalary();
}
/** The figure shown beside the card's title. A blank field means the usual rate,
 *  which is exactly what the server will snapshot for the day. */
function wageSummary(){
  return peso(asObj(benta).salary === '' ? dailySalary() : num(asObj(benta).salary));
}
function wageCardHTML(){
  const body = '<div class="field" style="margin-bottom:0;">' +
      '<label for="daySalary">Wage (₱)</label>' +
      '<input class="input money" id="daySalary" inputmode="decimal" autocomplete="off" placeholder="' +
        esc(fmt(dailySalary())) + '" value="' + esc(benta.salary === '' ? '' : benta.salary) + '">' +
      '<p class="hint" style="margin-top:6px;">The usual wage is ' + peso(dailySalary()) +
        ' a day. Lower it for a half day, or put 0 if nobody was paid. ' +
        'It is not part of today’s sales — it comes out at the cutoff.</p>' +
      '<p class="err" id="err-salary" hidden></p>' +
    '</div>';
  return collapseCardHTML('wage', 'Wage for this day', wageSummary(), benta.wageOpen, body);
}
function updateWageCard(){
  const sum = document.querySelector('#panel-benta [data-act="toggle-wage"] .ch-sum');
  if (sum) sum.textContent = wageSummary();
}

/* ---- ② The "Sold with GCash" card (v2.7.0). The whole payment question in one
   collapsible card: per size, how many went through GCash and of those how many
   were cheese, with the converted tin cash at the bottom. Closed on an all-cash
   night — the common one — with its figure in the head so it can be read
   without opening anything; it opens itself the moment it holds a figure, and
   a validation error inside it opens it before the scroll (saveBenta). ---- */
/** The figure in the card's head: everything THIS card controls — the per-sku
 *  GCash money plus the converted cash. (The custom order's GCash part lives on
 *  the custom-order card, so it is not restated here.) '' when there is none,
 *  like the stock card. */
function gcashSummaryText(c){
  const d = isObj(c) ? c : computeDay(bentaPayload());
  const fig = r2(num(d.gcash) - num(d.customGcash));
  return fig ? peso(fig) : '';
}
function gcashCardHTML(skus, daySnap, payRow){
  let body = '<p class="hint">How many of tonight’s boxes were paid through GCash. ' +
    'They are already part of “Sold” above — this only splits the money.</p>';
  let anyRow = false;
  for (const pr of skus){
    // Excluded skus never appear here: they have no payment split at all.
    if (!cutoffOnDay(daySnap, pr)) continue;
    const row = asArr(benta.rows).find(r => r.sku === pr.sku);
    if (!row) continue;
    anyRow = true;
    // uiVal, not rowUI: a bucket the reading could not see shows EMPTY here too,
    // or the split would look answered when it is not (v2.9.0).
    body += '<div class="pay-group"><div class="pay-head gc">' + esc(pr.label) + '</div>' +
      payRow('Sold with GCash',
        stepperHTML(pr.sku, 'gcashAll', uiVal(row, 'G'), 'Sold with GCash, ' + pr.label, true), true) +
      // Only a box sku has a cheese version to point at.
      (pr.group === 'box'
        ? payRow('Of those, cheese',
            stepperHTML(pr.sku, 'gcashOfCheese', uiVal(row, 'GC'), 'Of the GCash boxes, cheese, ' + pr.label, true), true)
        : '') +
    '</div>';
  }
  if (!anyRow) body += '<p class="hint" style="margin-top:10px;">No box sizes to split yet.</p>';
  // Money converted between the tin and GCash during the day (v2.7.0; both
  // directions since v2.7.3): the Total is untouched, only the cash/GCash
  // split moves. Direction is two chips and the amount has no sign — the
  // stored value is signed, the form never shows a minus.
  const dirIn = benta.convDir === 'in';
  body += '<div class="buckets"><div class="field" style="margin-bottom:0;">' +
    '<label for="gcashConverted">Converted during the day (₱)</label>' +
    '<div class="chips" role="group" aria-label="Direction of the conversion" style="margin-bottom:8px;">' +
      '<button type="button" class="chip" data-act="conv-dir" data-dir="out" aria-pressed="' + String(!dirIn) + '">Cash → GCash</button>' +
      '<button type="button" class="chip" data-act="conv-dir" data-dir="in" aria-pressed="' + String(dirIn) + '">GCash → cash</button>' +
    '</div>' +
    '<input class="input money gcash-in" id="gcashConverted" inputmode="decimal" autocomplete="off" placeholder="0" value="' +
      esc(benta.gcashConverted || '') + '">' +
    '<p class="hint" style="margin-top:6px;">' + (dirIn
      ? 'GCash you paid out of the tin as cash during the day. '
      : 'Tin cash you moved into GCash during the day. ') +
      'The day’s total does not change — only the cash and GCash split.</p>' +
    '<p class="err" id="err-gcashConverted" hidden></p>' +
  '</div></div>';
  return collapseCardHTML('gcash', 'Sold with GCash', gcashSummaryText(), benta.gcashOpen, body);
}

/** The lid-box counter (v2.7.0): a plain count with no money anywhere near it.
 *  Not sku-keyed, so it gets its own act instead of riding the sku steppers. */
function lidStepperHTML(){
  const label = 'Lid boxes used';
  return '<div class="stepper sm">' +
    '<button type="button" class="step-btn" data-act="lid-step" data-dir="-1" aria-label="One less: ' + label + '">−</button>' +
    '<input class="step-val" id="lidBoxesIn" inputmode="numeric" autocomplete="off" value="' +
      esc(benta.lidBoxes || '') + '" aria-label="' + label + '">' +
    '<button type="button" class="step-btn" data-act="lid-step" data-dir="1" aria-label="One more: ' + label + '">+</button>' +
  '</div>';
}
/** One press of the lid stepper: whole units, never below zero — the same
 *  clamps the stock steppers apply, because it is the same kind of count. */
function lidStep(dir){
  let v = Math.floor(num(benta.lidBoxes)) + dir;
  if (v < 0) v = 0;
  benta.lidBoxes = v;
  benta.dirty = true;
  const f = $('lidBoxesIn');
  if (f) f.value = v || '';
  updateReceipt();
  validateBentaLive();
}

/* ---- ③ "Sold with cash": display only — the derived remainder, spelled out so
   the figure she counts the tin against explains itself (v2.7.0). Rebuilt by
   updateReceipt on every change, exactly like the receipt strip. ---- */
function cashRecapHTML(c){
  let rows = '';
  for (const l of asArr(asObj(c).lines)){
    // Excluded money is not cash-in-the-total; the receipt's tin line owns it.
    if (!l.in_cutoff) continue;
    const bits = [];
    if (l.regular_qty > 0) bits.push(l.regular_qty + ' regular × ' + peso(l.price));
    if (l.cheese_qty > 0) bits.push(l.cheese_qty + ' cheese × ' + peso(l.cheese_price));
    if (!bits.length) continue;
    const amt = r2(l.regular_qty * l.price + l.cheese_qty * l.cheese_price);
    rows += '<div class="co-row"><span>' + esc(txt(l.label)) + ' — ' + esc(bits.join(' + ')) +
      '</span><span class="v">' + peso(amt) + '</span></div>';
  }
  const customCash = r2(num(asObj(c).custom) - num(asObj(c).customGcash));
  if (customCash > 0){
    rows += '<div class="co-row"><span>Custom order paid in cash</span><span class="v">' + peso(customCash) + '</span></div>';
  }
  const cv = num(asObj(c).gcashConverted);
  if (cv > 0){
    rows += '<div class="co-row"><span>Converted to GCash</span><span class="v">−' + peso(cv) + '</span></div>';
  } else if (cv < 0){
    rows += '<div class="co-row"><span>GCash taken out as cash</span><span class="v">+' + peso(-cv) + '</span></div>';
  }
  if (!rows) rows = '<p class="hint">Enter the counts above — whatever is not GCash is cash, worked out here.</p>';
  return '<p class="hint" style="margin-bottom:8px;">Nothing to type here — cash is what is left after GCash.</p>' +
    rows +
    '<div class="sum-row"><span>Cash</span><b>' + peso(asObj(c).cash) + '</b></div>';
}

function stockUsedCount(){ return asArr(benta.stock).filter(r => num(r.qty) > 0).length; }

// The stock list is ADVISORY, not referential integrity: a row whose name has
// left the sheet's list must still save (the day has to stay re-saveable), so all
// this answers is whether to show the quiet note next to the row.
function stockListed(name){ return activeStockItems().some(s => s.product === name); }

// A mid-session sync can add a product to the list. Top the form up the same way
// the SKU list does — appended at the end, so nothing already typed moves and
// every row index stays valid.
function topUpStockRows(){
  const stk = asArr(benta.stock);
  for (const it of activeStockItems()){
    if (!stk.some(r => r.product === it.product)) stk.push({ product:it.product, unit:txt(it.unit), qty:'' });
  }
}

/** What a stock row says under its name — what was opened, or the unit it is
 *  counted in. PLAIN TEXT: the unit is free text typed on Maintenance, so it may
 *  hold an "&" or a quote, and it is escaped exactly ONCE by whoever renders it.
 *  Escaping it here as well printed the entity itself ("in gallon &amp; jugs").
 *  One function so the first render and every later update always agree. */
function stockRowSaid(qty, unit){
  const u = txt(unit);
  return num(qty) > 0 ? qtyWithUnit(num(qty), u) + ' opened' : (u ? 'in ' + u + 's' : '');
}

function stockCardHTML(){
  // Whole units OPENED, counted like the boxes: if a gallon of sauce is opened it
  // counts as used that day. Never a weight, never a running estimate — that is
  // what makes it countable with +/− buttons at all.
  let body = '<p class="hint">Count whole units you OPENED today — one gallon of sauce, one pack of flour. ' +
    'This is not money: it never changes the day’s total. It is what keeps the ' +
    '“Stock on hand” figures under More right.</p>';
  const rows = asArr(benta.stock);
  if (!rows.length){
    body += '<p class="hint" style="margin-top:10px;">No products yet. Add them under More → Maintenance, or in the StockItems tab of the Google Sheet.</p>';
  }
  rows.forEach((r, i) => {
    const nm = esc(r.product);
    body += '<div class="stk-row">' +
        '<div class="stk-what"><span class="stk-name" id="stk-name-' + i + '">' + nm + '</span>' +
          '<span class="stk-unit" id="stk-said-' + i + '">' + esc(stockRowSaid(r.qty, r.unit)) + '</span></div>' +
        stockStepperHTML(i, r) +
      '</div>' +
      (stockListed(r.product) ? '' : '<p class="ln-note">Not on the sheet’s list any more. It still saves.</p>') +
      '<p class="err" id="err-stock-' + nm + '" hidden></p>';
  });
  const n = stockUsedCount();
  return collapseCardHTML('stock', 'Stock used today', n ? n + (n === 1 ? ' product' : ' products') : '', benta.stockOpen, body);
}

/** Whole-unit stepper for one stock row. Addressed by ROW INDEX, never by name:
 *  a product name is sheet data and would make the id ambiguous (or breakable). */
function stockStepperHTML(i, r){
  const label = 'Units of ' + txt(r.product) + ' opened today';
  return '<div class="stepper sm" data-stkstep="' + i + '">' +
    '<button type="button" class="step-btn" data-act="stock-step" data-dir="-1" aria-label="One less: ' + esc(label) + '">−</button>' +
    '<input class="step-val" id="in-stk-' + i + '" data-stk="' + i + '" inputmode="numeric" autocomplete="off" ' +
      'value="' + esc(r.qty) + '" aria-label="' + esc(label) + '">' +
    '<button type="button" class="step-btn" data-act="stock-step" data-dir="1" aria-label="One more: ' + esc(label) + '">+</button>' +
  '</div>';
}

// The two collapsible cards on the Sales screen and the flag each one remembers.
// A whitelist, so a stray data attribute can never write a field on `benta`.
const COLLAPSE_FLAG = { stock:'stockOpen', wage:'wageOpen', gcash:'gcashOpen' };
function toggleCollapse(key){
  // hasOwnProperty, not a plain lookup: "toString" is inherited by every object
  // and would otherwise read as a valid flag name.
  const flag = Object.prototype.hasOwnProperty.call(COLLAPSE_FLAG, key) ? COLLAPSE_FLAG[key] : '';
  if (!flag) return;
  benta[flag] = !benta[flag];
  const head = document.querySelector('#panel-benta [data-act="toggle-' + key + '"]');
  const body = $(key + 'Body');
  if (head) head.setAttribute('aria-expanded', String(benta[flag]));
  if (body) body.hidden = !benta[flag];
}

function updateStockCard(){
  const n = stockUsedCount();
  const head = document.querySelector('#panel-benta [data-act="toggle-stock"] .ch-sum');
  if (head) head.textContent = n ? n + (n === 1 ? ' product' : ' products') : '';
  // Each row says what its own figure means, in the unit that gets opened.
  // textContent, so the text goes in exactly as stockRowSaid wrote it.
  asArr(benta.stock).forEach((r, i) => {
    const said = $('stk-said-' + i);
    if (said) said.textContent = stockRowSaid(r.qty, r.unit);
  });
}

/** One tap on a stock stepper: whole units only, never below zero. */
function stockStep(i, dir){
  const r = asArr(benta.stock)[num(i)];
  if (!r) return;
  let v = Math.floor(num(r.qty)) + dir;
  if (v < 0) v = 0;
  r.qty = v;
  benta.dirty = true;
  const input = $('in-stk-' + num(i));
  if (input) input.value = v;
  updateStockCard();
  validateBentaLive();
}

function updateReceipt(){
  if (!isObj(benta)) return;
  const c = computeDay(bentaPayload());
  updateDayStrip(c);                     // the sticky line at the top of the screen
  const el = $('receipt');
  if (!el) return;
  let h = '<div class="r-brand">Octogo ★ ' + esc(asObj(state.settings).branch || '') + '</div>' +
          '<div class="r-date">' + fmtLong(benta.date) + '</div>' +
          '<div class="r-sep" role="presentation"></div>';
  if (benta.closed){
    h += '<div class="r-closed">CLOSED</div>';
  } else {
    // One line per bucket that has something in it, so the receipt adds up the
    // same way the cards do and the GCash total below can be traced back.
    let any = false;
    for (const l of c.lines){
      // An EXCLUDED sku's money is NOT in the TOTAL below, so it must not sit among
      // the lines that add up to it. It gets its own line under the totals.
      if (!l.in_cutoff) continue;
      // The special order's boxes physically left this stack, so the line counts
      // them ("×6") and says out loud that some are not priced here ("less 1 for
      // the special order") — the amount prices only the regular remainder, and
      // the order's own money is the Custom order line below (v2.7.0).
      if (l.regular_qty > 0 || l.custom_qty > 0){
        any = true;
        const aside = [];
        if (l.custom_qty > 0) aside.push(l.custom_qty + ' for the special order');
        if (num(l.free_qty) > 0) aside.push(num(l.free_qty) + ' given away or ruined');
        h += rLine(l.label + ' ×' + (l.regular_qty + l.custom_qty + num(l.free_qty)) +
          (aside.length ? ', less ' + aside.join(' and ') : ''),
          l.regular_qty * l.price);
      }
      if (l.cheese_qty > 0){ any = true; h += rLine(l.label + ' cheese ×' + l.cheese_qty, l.cheese_qty * l.cheese_price); }
      // "GCash" alone would repeat the old ambiguity — say which variant.
      if (l.gcash_qty > 0){ any = true; h += rLine(l.label + ' GCash regular ×' + l.gcash_qty, l.gcash_qty * l.price); }
      if (l.gcash_cheese_qty > 0){ any = true; h += rLine(l.label + ' GCash cheese ×' + l.gcash_cheese_qty, l.gcash_cheese_qty * l.cheese_price); }
    }
    if (c.custom > 0){ any = true; h += rLine('Custom order', c.custom); }
    if (!any) h += '<div class="r-empty">Nothing yet — enter the container counts.</div>';
    h += '<div class="r-sep" role="presentation"></div>' +
      '<div class="r-total"><span class="lbl">TOTAL</span><span class="amt">' + peso(c.total) + '</span></div>' +
      '<div class="r-sub gcash"><span>GCash</span><span class="r-amt">' + peso(c.gcash) + '</span></div>' +
      '<div class="r-sub"><span>Cash</span><span class="r-amt">' + peso(c.cash) + '</span></div>';
    // The two v2.7.0 notes, each only when it has something to say: the moved
    // split (the figure is already inside GCash and out of Cash above), and the
    // lid-box count, which is not money at all.
    if (c.gcashConverted > 0){
      h += '<div class="r-note">' + peso(c.gcashConverted) + ' of the cash was converted to GCash</div>';
    } else if (c.gcashConverted < 0){
      h += '<div class="r-note">' + peso(-c.gcashConverted) + ' of the GCash was taken out as cash</div>';
    }
    if (c.lidBoxes > 0){
      h += '<div class="r-note">Lid boxes used: ' + fmt(c.lidBoxes) + '</div>';
    }
    // Money that is kept OUT of the cutoff, BELOW the totals and never added into
    // them. The tin line is not decoration: the nori cash sits in the same tin, so
    // without it the tin can never appear to reconcile and that reads as a bug.
    //
    // ONLY when there IS excluded money tonight (v2.4.1). There is a nori line in
    // `excludedLines` on every single night, so this block used to print a dead
    // "Nori ×0 — not in the total ₱0" and the tautology "Cash in the tin: ₱825 +
    // ₱0 Nori = ₱825" on every ordinary night — noise on the one screen that is
    // read daily. Nothing excluded sold, nothing shown.
    const xl = excludedTonight(c);
    if (xl.length){
      h += '<div class="r-excl">';
      for (const l of xl){
        h += '<div class="r-sub excl"><span>' + esc(l.label + ' ×' + l.sold) + ' — not in the total</span>' +
          '<span class="r-amt">' + peso(l.amount) + '</span></div>';
      }
      const what = xl.length === 1 ? txt(xl[0].label) : 'kept out';
      h += '<div class="r-tin">Cash in the tin: ' + peso(c.cash) + ' + ' + peso(c.excluded) +
        ' ' + esc(what) + ' = <b>' + peso(tinTotal(c)) + '</b></div>' +
      '</div>';
    }
  }
  el.innerHTML = h;
  // The display-only "Sold with cash" card and the GCash card's head figure
  // mirror the same computation (v2.7.0) — one sum, three places it shows.
  const recap = $('cashRecap');
  if (recap) recap.innerHTML = cashRecapHTML(c);
  const gsum = document.querySelector('#panel-benta [data-act="toggle-gcash"] .ch-sum');
  if (gsum) gsum.textContent = gcashSummaryText(c);
}
function rLine(label, amt){
  return '<div class="r-line"><span>' + esc(label) + '</span><span class="r-amt">' + fmt(amt) + '</span></div>';
}

// The day TOTAL, pinned. The receipt strip is a long way down a phone screen by
// the time the boxes, the buckets, the supplies and the stock are on it, and the
// total is the one figure she checks against the cash in the tin WHILE counting.
// Same numbers as the receipt, same order — this is a mirror, not a second sum.
function updateDayStrip(c){
  const strip = $('dayStrip');
  if (!strip) return;
  if (activeTab !== 'benta' || !isObj(benta)){ strip.hidden = true; strip.innerHTML = ''; return; }
  strip.hidden = false;
  if (benta.closed){
    strip.innerHTML = '<div class="ds-total"><span class="ds-lbl">CLOSED</span><span class="ds-amt">' + peso(0) + '</span></div>' +
      '<div class="ds-sub"><span>No sales on this day</span></div>';
    return;
  }
  const d = isObj(c) ? c : computeDay(bentaPayload());
  // The TIN, and only on a night with excluded money in it (v2.4.1). The tin holds
  // Cash PLUS that money, and the strip exists precisely because the receipt is
  // several screens down — so this is where the figure she counts against actually
  // gets read. Same rule as the receipt (excludedTonight), so the two cannot
  // disagree, and nothing at all on an ordinary night.
  const tin = excludedTonight(d).length
    ? '<span class="tin">Tin <b>' + peso(tinTotal(d)) + '</b></span>' : '';
  strip.innerHTML =
    '<div class="ds-total"><span class="ds-lbl">TOTAL</span><span class="ds-amt">' + peso(d.total) + '</span></div>' +
    '<div class="ds-sub"><span>Cash <b>' + peso(d.cash) + '</b></span>' +
      '<span class="gc">GCash <b>' + peso(d.gcash) + '</b></span>' + tin + '</div>';
}

function isWhole(v){ const n = num(v); return isFinite(n) && Math.floor(n) === n; }

/**
 * What the SERVER would refuse about the DATE of a recorded event — a day of
 * sales, an expense — or '' when it is fine. Mirrors reqEntryDate() in Code.gs,
 * wording included: a date in the future or before 2020 is almost always a
 * mangled year from a half-edited field, and either would file real money
 * where nobody looks. Checked when the field changes AND when it saves, so a
 * partial "000X" year can never be committed anywhere.
 */
function entryDateError(s){
  if (!isDateStr(s)) return 'That date is not complete. Pick the day from the calendar.';
  if (s > todayStr()) return 'That date (' + s + ') has not happened yet. Pick today or an earlier day.';
  if (s < '2020-01-01') return 'That date (' + s + ') is before 2020, which cannot be right. Check the year.';
  return '';
}

/**
 * What the SERVER would refuse about an EXCLUDED sku's row — in its own words — or
 * '' when there is nothing wrong. Both rules it mirrors are in apiSaveDay, checked
 * in this order.
 *
 * This is the one place the phone complains about a figure that has no stepper to
 * fix it, and that is deliberate. Everywhere else such a complaint is a day that
 * can never be saved again, so the cheese count on a `simple` sku is silently sent
 * as 0. Here the 0 would CHANGE MONEY she has already read: the only way a bucket
 * can hold anything on an excluded sku is that the sku used to count in the cutoff
 * (or was hand-edited in the sheet), and quietly zeroing it would move that money
 * out of the day's GCash with nothing anywhere saying so. So it is refused, with
 * the item named and the toggle to change named — and the way out is one tap away
 * on the Maintenance screen, which is where the flag lives on a phone.
 */
function excludedRowError(sku, row){
  const label = skuLabel(sku);
  const r = asObj(row);
  // MIRROR THE SERVER'S GUARD ORDER, not just its wording. apiSaveDay checks
  // "has no cheese version" BEFORE the excluded-sku check, so on a simple sku
  // (nori — the shipped shape) a cheese count comes back in those words. Saying
  // something different here would mean the phone and the sheet explain the same
  // refusal two ways, which is the kind of mismatch that makes a real message
  // look untrustworthy.
  // Each refusal STARTS with the server's own words (so the phone and the sheet
  // explain the same refusal the same way) and then names the way out — the
  // stepper now on the card, and the Maintenance toggle one tap away. A refusal
  // with no way out is a dead end, and this row used to be exactly that.
  if (!isBoxSku(sku) && num(r.cheese) !== 0){
    return label + ' has no cheese version, so its cheese counts must be 0.' +

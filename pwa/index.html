    '<div class="kv"><span class="k">Branch</span><span class="v">' + esc(asObj(state.settings).branch || '—') + '</span></div>' +
    (config.sheetUrl ? '<a class="btn block" style="margin-top:10px; text-decoration:none;" href="' + esc(config.sheetUrl) + '" target="_blank" rel="noopener">Open the Google Sheet</a>' : '') +
  '</div>';

  $('panel-ibapa').innerHTML = h;
}

/* ---- Stock on hand. Every figure here is COMPUTED (see stockStatusOf) and the
   card says where it comes from, because a number nobody can explain is a number
   nobody trusts. "Correct the count" is the one action that moves the baseline.
   "Stock came in" is the one action that records a delivery (v2.6.0): quantity
   only, no money anywhere near it — the supplier delivers on credit, and paying
   him later is an ordinary Supplies expense. ---- */
let countingProduct = '';   // the product whose count field is open
let countDraft = '';        // what is typed in it
let arriving = false;       // whether the "Stock came in" form is open
// One row per ACTIVE product, SNAPSHOTTED when the form opens — each row
// carries its own {product, unit, qty}, exactly like the Sales screen's stock
// card, so a stock-list change while the form is open (a Maintenance save, a
// background sync) can never shift a typed quantity onto a different product
// or drop it. Rows are still ADDRESSED by index (a name is sheet data), but
// they RESOLVE by the name they carry. A row whose product was renamed or
// deactivated mid-form saves under its stored name; if the sheet no longer
// knows it, the server refuses in its plain sentence and the red card says so
// — misdirected stock is silent, a refusal is not. (Owner, 2026-08-19: "dont
// let me choose, just present all the stocks with + button".)
let arrival = { rows: [], date: todayStr() };

function stockOnHandHTML(){
  let list = [];
  try{ list = stockStatusList(); }catch(err){ console.error(err); }
  let h = '<div class="section-title">Stock on hand</div><div class="card">';
  if (!list.length){
    h += '<p class="hint">No products yet. Add them under Maintenance below.</p></div>';
    return h;
  }
  const anyLow = list.some(s => s.low);
  h += '<p class="hint" style="margin-bottom:6px;">Worked out from what has arrived and what has been opened since the last count. ' +
    'A count is an END-OF-DAY figure and becomes the new starting point.</p>';
  if (anyLow) h += '<p class="hint" style="color:var(--alert); font-weight:600;">Time to buy what is marked LOW.</p>';

  // "Stock came in" — record a DELIVERY: what arrived and how many whole units.
  // No money field on purpose: it is not paid yet. Paying the supplier later is
  // a normal Supplies expense, whenever that happens.
  if (!arriving){
    h += '<button type="button" class="btn block" data-act="arrive-open" style="margin:6px 0 14px;">Stock came in</button>';
  } else {
    // Every product listed with its own stepper — the list is constant, so
    // there is nothing to choose, only counts to tap in. The rows are the
    // SNAPSHOT taken when the form opened (see `arrival`), never the live
    // list: typed work must not move because the list did (v2.7.4).
    h += '<div style="margin:6px 0 14px;">' +
      '<p class="hint" style="margin-bottom:6px;">Tap + on what arrived — whole units only, the same way you count what you open. No money here: paying for it is a normal expense, whenever you pay.</p>';
    asArr(arrival.rows).forEach((s, i) => {
      const label = 'Units of ' + txt(s.product) + ' that arrived';
      h += '<div class="stk-row">' +
        '<div class="stk-what"><span class="stk-name">' + esc(s.product) + '</span>' +
          (s.unit ? '<span class="stk-unit">by the ' + esc(s.unit) + '</span>' : '') + '</div>' +
        '<div class="stepper sm" data-arrstep="' + i + '">' +
          '<button type="button" class="step-btn" data-act="arrive-step" data-dir="-1" aria-label="One less: ' + esc(label) + '">−</button>' +
          '<input class="step-val" id="in-arr-' + i + '" data-arr="' + i + '" ' +
            'inputmode="numeric" autocomplete="off" ' +
            'value="' + esc(txt(s.qty)) + '" aria-label="' + esc(label) + '">' +
          '<button type="button" class="step-btn" data-act="arrive-step" data-dir="1" aria-label="One more: ' + esc(label) + '">+</button>' +
        '</div>' +
      '</div>';
    });
    h += '<div class="field" style="margin-top:10px;"><label for="arrDate">When did it arrive?</label>' +
        '<input class="input" type="date" id="arrDate" value="' + esc(arrival.date) + '" max="' + todayStr() + '"></div>' +
      '<p class="err" id="err-arrive" hidden></p>' +
      '<div class="btn-row"><button type="button" class="btn" data-act="arrive-cancel">Close</button>' +
        '<button type="button" class="btn primary" data-act="arrive-save">Add to stock</button></div>' +
    '</div>';
  }

  for (const s of list){
    const nm = esc(s.product);
    const isCounting = countingProduct === s.product;
    h += '<div class="st-item">' +
      '<div class="st-top">' +
        '<span class="st-name">' + nm + '</span>' +
        (s.low ? '<span class="badge-low">Low</span>' : '') +
        '<span class="st-qty' + (s.on_hand < 0 ? ' neg' : '') + '">' + esc(qtyWithUnit(s.on_hand, s.unit)) + '</span>' +
      '</div>' +
      '<div class="st-sub">' + esc(stockExplain(s)) + '</div>' +
      // A negative figure is honest information, not an error to hide: it means
      // more has been opened than the count and the deliveries account for.
      (s.on_hand < 0
        ? '<div class="st-sub" style="color:var(--alert);">Below zero, so the starting figure is out of date. Count what is really there and tap “Correct the count”.</div>'
        : '') +
      (s.reorder_at > 0 ? '<div class="st-sub">Buy more at ' + esc(qtyWithUnit(s.reorder_at, s.unit)) + ' or less.</div>' : '') +
      // How long it lasts at the rate it is actually being opened (v2.10.2) —
      // the figure the fixed reorder point cannot know.
      (stockRunwayText(s) ? '<div class="st-sub">' + esc(stockRunwayText(s)) + '</div>' : '') +
      (isCounting
        ? '<div class="st-count">' +
            '<div><label for="stCountIn">Counted today</label>' +
              '<input class="input money" id="stCountIn" inputmode="numeric" autocomplete="off" placeholder="0" value="' + esc(countDraft) + '"></div>' +
            '<button type="button" class="btn small primary" data-act="count-save" data-product="' + nm + '">Save count</button>' +
            '<button type="button" class="btn small" data-act="count-cancel">Cancel</button>' +
          '</div>' +
          '<p class="hint" style="margin-top:8px;">Count what is on the shelf at closing time today. From now on, on hand is this figure plus what arrives and minus what is opened.</p>' +
          '<p class="err" id="err-count" hidden></p>'
        : '<div class="st-acts"><button type="button" class="btn small" data-act="count-open" data-product="' + nm + '">Correct the count</button></div>') +
    '</div>';
  }
  return h + '</div>';
}

/** Where the figure comes from, in one plain sentence. */
function stockExplain(s){
  const from = s.baseline_date
    ? 'Counted ' + qtyWithUnit(s.baseline_qty, s.unit) + ' on ' + fmtShort(s.baseline_date)
    : 'Started at ' + qtyWithUnit(s.baseline_qty, s.unit);
  const bits = [];
  if (s.delivered_since) bits.push(qtyWithUnit(s.delivered_since, s.unit) + ' arrived');
  if (s.used_since) bits.push(qtyWithUnit(s.used_since, s.unit) + ' opened');
  return from + (bits.length ? ', then ' + bits.join(' and ') : ', nothing since') + '.';
}

function openCount(product){
  countingProduct = txt(product);
  const s = stockStatusList().find(x => x.product === countingProduct);
  // Pre-filled with the figure the app thinks is there, so a count that only
  // confirms it is one tap. A negative one starts blank — there is nothing
  // sensible to confirm.
  countDraft = s && s.on_hand > 0 ? String(s.on_hand) : '';
  renderIbapa();
  const f = $('stCountIn');
  if (f) f.focus();
}
function saveStockCountNow(product){
  const p = txt(product);
  const err = $('err-count');
  const qty = num(countDraft);
  if (countDraft === '' || qty < 0 || !isWhole(qty)){
    if (err){
      err.textContent = countDraft === ''
        ? 'Enter how many there are.'
        : 'Count whole units (1, 2, 3) — “' + txt(countDraft) + '” is not a whole unit.';
      err.hidden = false;
    }
    return;
  }
  // Dated TODAY: a stocktake is what you can see now, and the server reads it as
  // an end-of-day figure that already includes today's deliveries and usage.
  const payload = { date: todayStr(), product: p, qty, entryId: uuid() };
  applyLocalStockCount(payload);
  enqueue('saveStockCount', payload);
  persistState();
  countingProduct = ''; countDraft = '';
  renderIbapa();
  toast(p + ': counted ' + qtyWithUnit(qty, stockUnitOf(p)) + '. That is the new starting figure.');
  drainQueue();
}

/** One press of the arrival stepper. Clamped at 0 (the validator asks for at
 *  least 1) and always a whole number — the buttons can only ever step by one. */
function arriveStep(i, dir){
  const row = asArr(arrival.rows)[num(i)];
  if (!row) return;
  const q = Math.max(0, Math.floor(num(row.qty)) + (num(dir) > 0 ? 1 : -1));
  row.qty = String(q);
  const f = $('in-arr-' + num(i));
  if (f) f.value = String(q);
}

/** Save the deliveries: one row per product with a quantity, no money anywhere
 *  near any of them (v2.6.0). The same clamps the server applies — at least 1
 *  whole unit per named row, an event date (no future, no pre-2020) — refused
 *  here in the server's own words so the phone never queues a row the sheet
 *  will bounce. Each product is its own saveStockDelivery (its own entryId),
 *  so a replay converges per product. On-hand rises the moment this returns. */
function saveArrival(){
  const err = $('err-arrive');
  const dateBad = entryDateError(arrival.date);
  let bad = '';
  const rows = [];
  if (dateBad) bad = dateBad;
  else {
    // Each row resolves by the NAME it has carried since the form opened —
    // never by position in the live list, which may have changed underneath
    // (v2.7.4: an index resolved at save time silently booked a quantity
    // typed on one product against a different one).
    for (const s of asArr(arrival.rows)){
      if (bad) break;
      const raw = txt(asObj(s).qty);
      if (raw === '' || num(raw) === 0) continue;    // untouched row: nothing arrived
      const qty = num(raw);
      if (!isWhole(qty) || qty < 1){
        bad = txt(s.product) + ': count whole units (1, 2, 3) — “' + raw + '” is not a whole unit.';
      } else {
        rows.push({ product: txt(s.product), unit: txt(s.unit), qty });
      }
    }
    if (!bad && !rows.length) bad = 'Tap + on what arrived — at least one product.';
  }
  if (bad){
    if (err){ err.textContent = bad; err.hidden = false; }
    return;
  }
  const date = arrival.date || todayStr();
  const said = [];
  for (const r of rows){
    const payload = { date, product: r.product, qty: r.qty, entryId: uuid() };
    applyLocalStockDelivery(payload);
    enqueue('saveStockDelivery', payload);
    said.push(qtyWithUnit(r.qty, r.unit) + ' of ' + r.product);
  }
  persistState();
  arriving = false;
  arrival = { rows: [], date: todayStr() };
  renderIbapa();
  toast('Added to your stock: ' + said.join(', ') +
    '. Paying for it goes under Expenses as usual, whenever you pay.');
  drainQueue();
}

/* ---- Maintenance. One place to change the prices, the constants and the stock
   list without opening the sheet on a phone. Every save goes through the offline
   queue like any other mutation. The API token is never shown or sent here. ---- */
let maintOpen = false;

/** "Check the sheet" (v2.7.5): ask the server to audit every tab for
 *  hand-edit damage and print its sentences. Pure read. The findings carry
 *  sheet data (product names, item names), so each is escaped exactly once. */
async function runSheetCheck(btn){
  const out = $('sheetCheckOut');
  if (btn) btn.disabled = true;
  if (out) out.innerHTML = '<p class="hint" style="margin-top:8px;">Checking every tab…</p>';
  try{
    const data = await api('sheetCheck', {});
    const found = asArr(asObj(data).findings);
    let h;
    if (!found.length){
      h = '<div class="card" style="margin-top:10px;"><p style="font-weight:600;">Nothing looks wrong.</p>' +
        '<p class="hint" style="margin-top:4px;">Every tab was read — no stray duplicates, no orphaned rows, no money that disagrees with itself.</p></div>';
    } else {
      h = '<div class="card attn-card" style="margin-top:10px;"><p class="attn-head">' +
        (found.length === 1 ? '1 thing to look at' : found.length + ' things to look at') + '</p>';
      for (const f of found) h += '<p style="margin-top:8px;">' + esc(txt(f)) + '</p>';
      h += '<p class="hint" style="margin-top:10px;">These are sheet edits to make by hand — the app itself never writes rows like these.</p></div>';
    }
    if (out) out.innerHTML = h;
  }catch(err){
    if (out) out.innerHTML = '<p class="err" style="margin-top:8px;">' + esc(String(err && err.message || err)) + '</p>';
  }finally{
    if (btn) btn.disabled = false;
  }
}

let maintPrices = null;   // sku -> { price, cheesePrice, boxCost, active, inCutoff }
let maintConst = null;    // the six settings, as typed
let maintStock = null;    // product -> { unit, reorderAt, unitCost, active }

/** Load the forms from the current state. Called when the section is opened, so
 *  it always starts from what the sheet last said. */
function maintLoad(){
  // Keyed by sku / product name — sheet data, so both maps are prototype-free:
  // a sku spelled "__proto__" must land in the map, never on its prototype.
  maintPrices = Object.create(null);
  for (const p of asArr(state.prices)){
    if (!isObj(p) || !txt(p.sku)) continue;
    // The two costs are the only fields here kept BLANK when they are blank
    // (rawNum, never num): "no cost known" is a real state, and a 0 in the box
    // would be an answer nobody gave. rawNum, not `=== ''`, because a state_v1
    // written before v2.8.0 has no such key at all.
    maintPrices[p.sku] = { price: num(p.price), cheesePrice: num(p.cheese_price),
      boxCost: rawNum(p.box_cost),
      active: truthy(p.active), inCutoff: inCutoffFlag(p.in_cutoff) };
  }
  const st = asObj(state.settings);
  maintConst = {
    daily_salary: dailySalary(), split_default: splitDefault(),
    mama_per_cutoff: num(st.mama_per_cutoff), electric_per_cutoff: num(st.electric_per_cutoff),
    branch: txt(st.branch), staff: txt(st.staff),
    supply_picklist: txt(st.supply_picklist)
  };
  maintStock = Object.create(null);
  for (const s of asArr(state.stockItems)){
    if (!isObj(s) || !txt(s.product)) continue;
    maintStock[s.product] = { unit: txt(s.unit), reorderAt: rawNum(s.reorder_at),
      unitCost: rawNum(s.unit_cost), active: truthy(s.active) };
  }
}

/** A sync in the middle of editing can add a price or a product, or take one
 *  away. Top the forms up (never overwriting what is already typed) and drop what
 *  has gone, so the fields on screen are exactly the rows that will be saved —
 *  a row rendered from a missing entry would otherwise save a ₱0 price. */
function maintTopUp(){
  if (!maintPrices) return maintLoad();
  const keepP = Object.create(null);
  for (const p of asArr(state.prices)){
    if (!isObj(p) || !txt(p.sku)) continue;
    keepP[p.sku] = true;
    if (!maintPrices[p.sku]){
      maintPrices[p.sku] = { price: num(p.price), cheesePrice: num(p.cheese_price),
        boxCost: rawNum(p.box_cost),
        active: truthy(p.active), inCutoff: inCutoffFlag(p.in_cutoff) };
    }
  }
  for (const sku in maintPrices) if (!keepP[sku]) delete maintPrices[sku];
  const keepS = Object.create(null);
  for (const s of asArr(state.stockItems)){
    if (!isObj(s) || !txt(s.product)) continue;
    keepS[s.product] = true;
    if (!maintStock[s.product]){
      maintStock[s.product] = { unit: txt(s.unit), reorderAt: rawNum(s.reorder_at),
        unitCost: rawNum(s.unit_cost), active: truthy(s.active) };
    }
  }
  for (const p in maintStock) if (!keepS[p]) delete maintStock[p];
}

/** What is wrong with one price row — or '' when it is fine. `pr` is the sheet's
 *  own row (for the name, and whether it has a cheese version); `m` is what is
 *  typed in the fields. Every rule apiSavePrices() enforces is mirrored here, in
 *  the same order, so the phone never queues a price change the server refuses.
 *
 *  A CLEARED field reads as 0, and a ₱0 price on something still marked "Still
 *  selling this" gives it away all night: the Sales card read "₱0 · Cheese ₱60"
 *  and every box counted for free, with nothing anywhere saying why. So a price
 *  is required while a sku is being sold — turning it off is how you stop
 *  selling it. An inactive sku may keep a 0: it sells nothing. */
function priceRowError(pr, m){
  const label = txt(asObj(pr).label) || txt(asObj(pr).sku);
  const price = num(asObj(m).price), cheese = num(asObj(m).cheesePrice);
  const isBox = asObj(pr).group === 'box';
  if (price < 0 || cheese < 0) return 'A price cannot be less than zero.';
  if (asObj(m).active){
    if (!(price > 0)){
      return label + ' is still being sold, so it needs a price. At ₱0 every box would ' +
        'count as free. Type a price, or turn “Still selling this” off.';
    }
    // Only a box sku has a cheese version at all; group=simple keeps its 0.
    if (isBox && !(cheese > 0)){
      return label + ' is still being sold, so it needs a cheese price too. At ₱0 every ' +
        'cheese box would count as free. Type a price, or turn “Still selling this” off.';
    }
  }
  // Keeping money out of the cutoff means ONE plain quantity at ONE price: no cheese
  // variant and no cash/GCash split. A box sku cannot be that, so apiSavePrices
  // REFUSES the batch — and this refusal has to happen before the toggle is applied
  // locally, or the phone starts hiding that sku's cheese steppers (and zeroing its
  // cheese counts) while the sheet still has it counting in the cutoff with a cheese
  // price. Checked whether or not the sku is still being sold, exactly as the server
  // checks it: an inactive box cannot be kept out of the cutoff either.
  // Only an EXPLICIT false is refused, and for the same reason the server only
  // WRITES an explicit value: a row that says nothing about the flag (an older
  // build's queued batch) means "leave it exactly as it is", so treating a missing
  // field as false would refuse every ordinary price edit ever queued.
  // The BOX COST (v2.8.0). A blank is left out of the payload entirely, so only
  // a typed figure can be wrong — and a negative one is refused here in the
  // server's own words, naming the sku exactly as apiSavePrices names it. It is
  // never rounded on the way through: box4's real cost is ₱0.375.
  const boxCost = txt(asObj(m).boxCost).trim();
  if (boxCost !== '' && num(boxCost) < 0){
    return txt(asObj(pr).sku) + ': the box cost cannot be negative.';
  }
  const flagGiven = !(asObj(m).inCutoff === null || asObj(m).inCutoff === undefined || asObj(m).inCutoff === '');
  if (flagGiven && !inCutoffFlag(asObj(m).inCutoff) && isBox){
    return label + ' is a box with a cheese version, so it cannot be kept out of the cutoff. ' +
      'An item kept out is a simple item: one price and no cheese. Leave “Counts in the cutoff” ' +
      'on for it, or change its group to simple in the Prices tab of the sheet.';
  }
  return '';
}

/**
 * The Settings payload the "Standing amounts" card sends — built from what is
 * TYPED, with every BLANK field left out entirely (v2.5.1).
 *
 * Blank means "unchanged", never ₱0: a wage field swiped clear and saved used
 * to travel as 0 (num('') is 0), write daily_salary = 0 to the sheet, and every
 * later day snapshotted a ₱0 wage — the note's Salary line went blank and
 * Remaining was overstated by a day's wage at a time. An explicit 0 ("nobody is
 * paid") must be TYPED. The server reads a blank the same way, but it never
 * gets to see one from this screen unless the key is omitted — which is what
 * this does. Branch/staff follow the same rule (a blank branch is separately
 * refused before this is called: it heads the note).
 */
function maintSettingsPayload(mc){
  const m = asObj(mc);
  const settings = {};
  const branch = txt(m.branch).trim();
  if (branch) settings.branch = branch;
  const staff = txt(m.staff).trim();
  if (staff) settings.staff = staff;
  // Same blank-omission rule: a cleared picklist field means "leave the sheet's
  // list alone", never "wipe the chips off the expense form".
  const picklist = txt(m.supply_picklist).trim();
  if (picklist) settings.supply_picklist = picklist;
  for (const k of ['daily_salary','split_default','mama_per_cutoff','electric_per_cutoff']){
    const raw = m[k];
    if (raw === '' || raw == null) continue;   // blank = leave the sheet's figure alone
    settings[k] = r2(Math.max(0, num(raw)));
  }
  return settings;
}

function saveMaintPrices(){
  maintTopUp();
  const rows = [];
  for (const sku in maintPrices){
    const m = maintPrices[sku];
    const bad = priceRowError(asArr(state.prices).find(p => isObj(p) && p.sku === sku) || { sku }, m);
    if (bad){ setErr('err-maint-prices', bad); return; }
    // `inCutoff` travels because this screen KNOWS the flag — it is showing the
    // toggle. (The server writes that cell only when a payload carries it, so a
    // batch queued by an older build still leaves every flag exactly as it is.)
    const row = { sku, price: r2(m.price), cheesePrice: r2(m.cheesePrice),
      active: !!m.active, inCutoff: !!m.inCutoff };
    // The box cost travels ONLY when there is a figure in the field, and it
    // travels EXACTLY as typed:
    //   - a BLANK field means "leave the sheet's cost alone" (the key is left
    //     out, which is what the server reads as leave-alone), never "this box
    //     is free" and never "blank that cell" — a cost wiped by accident would
    //     quietly drop a whole sku out of the costing;
    //   - no r2, because r2(0.375) is 0.38. Rounding the owner's own figure on
    //     the way past would restate it by half a centavo on every box sold,
    //     which is exactly the bug the server refuses to commit.
    if (txt(m.boxCost).trim() !== '') row.boxCost = num(m.boxCost);
    rows.push(row);
  }
  setErr('err-maint-prices', '');
  const payload = { rows, entryId: uuid() };
  applyLocalPrices(payload);
  enqueue('savePrices', payload);
  costInvalidate();
  persistState();
  maintLoad();
  renderIbapa();
  toast('Prices saved. They count for the days you save from now on.');
  drainQueue();
}

function saveMaintSettings(){
  if (!txt(maintConst.branch).trim()){
    setErr('err-maint-set', 'The branch name cannot be empty — it is the first line of the note.');
    return;
  }
  for (const k of ['daily_salary','split_default','mama_per_cutoff','electric_per_cutoff']){
    const raw = maintConst[k];
    if (raw !== '' && raw != null && num(raw) < 0){
      setErr('err-maint-set', 'These amounts cannot be less than zero.'); return;
    }
  }
  setErr('err-maint-set', '');
  // Only the whitelisted keys travel, and `token` is not one of them — it is
  // never read from here, never sent, never editable on this screen. A BLANK
  // field is OMITTED from the payload entirely (v2.5.1): blank means
  // "unchanged", and an explicit ₱0 must be typed — see maintSettingsPayload.
  const settings = maintSettingsPayload(maintConst);
  const payload = { settings, entryId: uuid() };
  applyLocalSettings(payload);
  enqueue('saveSettings', payload);
  costInvalidate();
  persistState();
  maintLoad();
  updateStatus();
  renderIbapa();
  toast('Saved.');
  drainQueue();
}

function saveMaintStock(){
  maintTopUp();
  const rows = [];
  for (const product in maintStock){
    const m = maintStock[product];
    if (m.reorderAt !== '' && (num(m.reorderAt) < 0 || !isWhole(num(m.reorderAt)))){
      setErr('err-maint-stock', 'Use whole units for “Buy more at”, or leave it empty.');
      return;
    }
    // A cost is money, not a count: fractions are fine (a bundle price divided
    // by the bundle count), a negative one is not. The server's own sentence.
    const unitCost = txt(m.unitCost).trim();
    if (unitCost !== '' && num(unitCost) < 0){
      setErr('err-maint-stock', product + ': the unit cost cannot be negative.');
      return;
    }
    const row = { product, unit: txt(m.unit).trim(), reorderAt: m.reorderAt === '' ? '' : num(m.reorderAt), active: !!m.active };
    // Same rule, same reason as savePrices' boxCost: a blank field is left out
    // (leave the sheet's cost alone), and a typed figure travels unrounded.
    if (unitCost !== '') row.unitCost = num(unitCost);
    rows.push(row);
  }
  setErr('err-maint-stock', '');
  const payload = { rows, entryId: uuid() };
  applyLocalStockItems(payload);
  enqueue('saveStockItems', payload);
  costInvalidate();
  persistState();
  maintLoad();
  renderIbapa();
  toast('Stock list saved.');
  drainQueue();
}

/* ---- "What it costs" (v2.8.0). NAYT'S SCREEN — Mama never needs it, which is
   why it lives on More, closed, behind a button.

   Every figure here is computed by the SERVER (action `costing`) over one 1–15 /
   16–end period, from the whole sheet. Nothing is worked out on the phone: the
   costing reads StockUsage, Expenses, DailyCounts and Settings together, and a
   phone holding only the last few weeks would answer a different question with
   the same confidence. So there is no offline mode and no local fallback — when
   there is no API, or the request fails, the section says that in one sentence
   instead of drawing a screen full of zeros. It BLOCKS NOTHING: it is a pure
   read, it never queues anything, and it never touches the cutoff or the note.

   `costRes` remembers WHICH period (and which target) the figures answer, so a
   number on screen can never belong to a different fortnight than the label
   above it. ---- */
let costOpen = false;     // the section is closed until he asks for it
let costPer = null;       // the period the figures cover
let costRes = null;       // { key, target, data } — the answer and what it answers
let costErr = '';         // why there are no figures, in one plain sentence
let costBusy = false;     // a request is in flight
let costStale = false;    // a cost was edited, so the last answer was thrown away
let costTarget = '';      // the nightly take he types. BLANK = no target at all.

/** A Maintenance save changes what the costing is made of — a cost, a price, a
 *  standing amount. The answer on screen was computed from the OLD figures, so
 *  it is thrown away rather than left sitting under a fresh label. It is not
 *  re-asked here: the save is still in the queue, and the server would answer
 *  from the sheet as it is now. */
function costInvalidate(){
  if (!costRes && !costErr) return;
  costRes = null; costErr = '';
  costStale = costOpen;
}

/** A figure the server could not work out arrives as `null`, and it renders as a
 *  dash — never ₱0. Zero balls and "we do not know" are different answers, and a
 *  ₱0 that means the second one is a lie the whole screen is built to avoid.
 *  The reason is always said beside it (see costWhyNone). */
function isNone(v){ return v === null || v === undefined || v === ''; }
function costPeso(v){ return isNone(v) ? '—' : peso(v); }
function costNum(v){ return isNone(v) ? '—' : fmt(v); }

/** Why a per-ball or per-night figure is a dash. Answered from the two things
 *  that make the division impossible, in the order the server checks them. */
function costWhyNone(daysOpen, balls){
  if (!(daysOpen > 0)) return 'No night in this cutoff is open yet, so there is nothing to divide by.';
  if (!(balls > 0)) return 'No boxes were counted in this cutoff, so there are no balls to divide by.';
  return '';
}

let trendOpen = false;    // whether "How the nights compare" is showing

/** The trend section. Worked out entirely on the phone, so it opens instantly
 *  and works with no signal — unlike the costing, which must ask the server. */
function trendHTML(){
  let h = '<div class="section-title">How the nights compare</div>';
  if (!trendOpen){
    return h + '<div class="card"><p class="hint" style="margin-bottom:10px;">Which nights of the week are worth opening, ' +
      'what is actually earning, and how this fortnight sits against the last. Worked out on this phone from the nights already logged.</p>' +
      '<button type="button" class="btn block" data-act="trend-open">Show me the nights</button></div>';
  }
  const nights = trendNights(0);
  if (nights.length < TREND_MIN_NIGHTS){
    return h + '<div class="card"><p class="hint">' + esc(nights.length === 0
      ? 'No finished nights are logged yet, so there is nothing to compare.'
      : 'Only ' + nights.length + (nights.length === 1 ? ' night is' : ' nights are') +
        ' logged so far. This needs at least ' + TREND_MIN_NIGHTS +
        ' to say anything worth acting on — it will fill in on its own.') + '</p>' +
      '<button type="button" class="btn block" data-act="trend-close" style="margin-top:10px;">Close</button></div>';
  }

  // ① NIGHTS OF THE WEEK. The question is "is Tuesday worth opening?", so the
  // count behind each average is printed beside it — an average of three nights
  // and an average of twelve are not the same claim.
  const wk = trendByWeekday();
  h += '<div class="card"><div class="pay-intro">Average take, by night of the week</div>';
  if (!wk.length){
    h += '<p class="hint">No night of the week has ' + TREND_MIN_WEEKDAY +
      ' finished nights yet, so there is nothing to average.</p>';
  } else {
    for (const w of wk){
      h += '<div class="co-row"><span>' + esc(w.name) + ' <span class="hint">(' + w.nights +
        (w.nights === 1 ? ' night' : ' nights') + ')</span></span><span class="v">' + peso(w.avg) + '</span></div>';
    }
    if (wk.length >= 2){
      const best = wk[0], worst = wk[wk.length - 1];
      h += '<p class="hint" style="margin-top:8px;">' + esc(best.name) + 's bring in about ' +
        esc(peso(best.avg)) + ' and ' + esc(worst.name) + 's about ' + esc(peso(worst.avg)) +
        '. That is what the nights have done, not what they will do — a fiesta or a downpour is not in here.</p>';
    }
    const missing = 7 - wk.length;
    if (missing > 0){
      h += '<p class="hint">' + missing + (missing === 1 ? ' night' : ' nights') +
        ' of the week are left out — fewer than ' + TREND_MIN_WEEKDAY + ' finished nights each so far.</p>';
    }
  }
  h += '</div>';

  // ② WHAT IS EARNING. Money from each row's own stored amount, so this can
  // never disagree with the receipt that night printed.
  const mix = trendBySku();
  h += '<div class="card"><div class="pay-intro">What earned, last ' + mix.nights +
    (mix.nights === 1 ? ' night' : ' nights') + '</div>';
  for (const r of mix.rows){
    h += '<div class="co-row"><span>' + esc(skuLabel(r.sku)) + ' <span class="hint">(' + esc(fmt(r.sold) + ' sold') +
      (r.free > 0 ? ', ' + fmt(r.free) + ' given away' : '') + ')</span></span>' +
      '<span class="v">' + peso(r.amount) + '</span></div>';
  }
  const idle = mix.rows.filter(r => r.sold === 0);
  if (idle.length){
    h += '<p class="hint" style="margin-top:8px;">' +
      esc(listPhrase(idle.map(r => skuLabel(r.sku)))) +
      ' sold nothing in these nights. Worth knowing before you buy more of it.</p>';
  }
  h += '</div>';

  // ③ THE LAST TWO FINISHED FORTNIGHTS — like for like. A cutoff still running
  // is never compared to a whole one (the v2.9.4 lesson).
  const cut = trendCutoffs();
  h += '<div class="card"><div class="pay-intro">The last two finished cutoffs</div>';
  if (!cut){
    h += '<p class="hint">Two finished cutoffs with nights in them are needed before they can be compared. Not yet.</p>';
  } else {
    const row = (label, c) => '<div class="co-row"><span>' + esc(label) +
      ' <span class="hint">(' + c.nights + (c.nights === 1 ? ' night' : ' nights') +
      ', ' + esc(peso(c.avg)) + ' a night)</span></span><span class="v">' + peso(c.total) + '</span></div>';
    h += row(periodLabelOf(cut.before), cut.before) + row(periodLabelOf(cut.latest), cut.latest);
    const d = cut.change;
    h += '<p class="hint" style="margin-top:8px;">' + (d === 0
      ? 'The two came to the same.'
      : (d > 0 ? 'Up ' : 'Down ') + esc(peso(Math.abs(d))) + ' on the cutoff before it' +
        (cut.latest.nights !== cut.before.nights
          ? ' — on ' + cut.latest.nights + ' nights against ' + cut.before.nights +
            ', so the take a night is the fairer figure'
          : '')) + '.</p>';
  }
  h += '</div>';

  h += '<div class="card"><button type="button" class="btn block" data-act="trend-close">Close</button></div>';
  return h;
}

/** "August 16 - 31" for a period, reusing the same wording the Cutoff screen
 *  uses so one fortnight is never named two ways. */
function periodLabelOf(p){
  const s = d2parts(txt(asObj(p).start)), e = d2parts(txt(asObj(p).end));
  return monthName(asObj(p).start) + ' ' + s.d + ' – ' +
    (s.m === e.m ? '' : monthName(asObj(p).end) + ' ') + e.d;
}

function costingHTML(){
  let h = '<div class="section-title">What it costs</div>';
  if (!costOpen){
    return h + '<div class="card"><p class="hint" style="margin-bottom:10px;">What a ball costs to make, what each box leaves you, ' +
      'and what the prices would have to be to leave more. Worked out by the server from what has been logged.</p>' +
      '<button type="button" class="btn block" data-act="cost-open">Work out the costing</button></div>';
  }
  const per = costPer || currentPeriod(todayStr());
  const s = d2parts(per.start), e = d2parts(per.end);
  const isCurrent = periodKey(per) === periodKey(currentPeriod(todayStr()));
  // The same period navigation as the Cutoff screen, so "this cutoff" means the
  // same fortnight on both screens.
  h += '<div class="card"><div class="period-nav">' +
    '<button type="button" class="nav-btn" data-act="cost-prev" aria-label="Previous cutoff">‹</button>' +
    '<div class="p-label">' + monthName(per.start) + ' ' + s.d + ' – ' + e.d +
      '<span class="p-sub">' + (isCurrent ? 'This cutoff' : s.y) + '</span></div>' +
    '<button type="button" class="nav-btn" data-act="cost-next" aria-label="Next cutoff">›</button>' +
  '</div></div>';

  const answered = costRes && costRes.key === periodKey(per);
  if (costBusy){
    h += '<div class="card"><p class="hint">Working it out…</p></div>';
  } else if (costErr){
    // ONE plain sentence, and no figures at all beside it.
    h += '<div class="card"><p class="err" style="margin-top:0;">' + esc(costErr) + '</p>' +
      (config.apiUrl ? '<button type="button" class="btn block" data-act="cost-refresh" style="margin-top:10px;">Try again</button>' : '') +
    '</div>';
  } else if (!answered){
    h += '<div class="card">' +
      (costStale ? '<p class="hint" style="margin-bottom:10px;">A cost was changed, so the old figures were thrown away. ' +
        'Work it out again once the change has synced.</p>' : '') +
      '<button type="button" class="btn block" data-act="cost-refresh">Work it out</button></div>';
  } else {
    // A malformed response must not take the whole More tab down with it.
    try{ h += costFiguresHTML(costRes, per); }
    catch(err){
      console.error(err);
      h += '<div class="card"><p class="err" style="margin-top:0;">The server’s costing did not make sense to this app, so nothing is shown.</p></div>';
    }
  }
  h += '<div class="card"><button type="button" class="btn block" data-act="cost-close">Close the costing</button></div>';
  return h;
}

/** The figures. Every product name and sku label here is SHEET DATA and is
 *  escaped exactly once on the way in. */
function costFiguresHTML(res, per){
  const d = asObj(asObj(res).data);
  const daysOpen = num(d.days_open), balls = num(d.balls);
  const v = asObj(d.variable), fx = asObj(d.fixed), pd = asObj(d.per_day);
  const why = costWhyNone(daysOpen, balls);

  // WHAT THIS PERIOD CANNOT HONESTLY SAY, before any figure it qualifies
  // (v2.8.0). An UNDER-stated cost is the dangerous direction — it makes a
  // price look safe to cut — so these sit on top, and the server withholds
  // the price advice for as long as any of them holds.
  let h = '';
  const cav = asArr(d.caveats);
  if (cav.length){
    h += '<div class="card attn-card"><p class="attn-head">' +
      (cav.length === 1 ? 'Read this first' : 'Read these first') + '</p>';
    for (const c of cav) h += '<p style="margin-top:8px;">' + esc(txt(c)) + '</p>';
    // The unfinished-cutoff caveat ends by saying which cutoff to price from
    // (v2.9.4), so that cutoff is one tap away rather than two guesses at the
    // arrows. Only offered when the server says the window is still running.
    if (asObj(d.fixed).period_finished === false){
      h += '<button type="button" class="btn" data-act="cost-last-done" style="margin-top:10px;">' +
        'Show the last finished cutoff</button>';
    }
    h += '<p class="hint" style="margin-top:10px;">' + (asArr(d.targets).length
      ? 'The figures below still hold — read them knowing this, and the price advice leans to the cautious side.'
      : 'The figures below are still worked out, because they are useful — but they are a <b>floor</b>, ' +
        'not the whole truth, so the price advice stays switched off until this is filled in.') + '</p>' +
    '</div>';
  }

  // WHAT THIS IS, and what KIND of figure each part is. The two cost sources are
  // never added into one line, because over a fortnight they are not the same
  // money: a sack of flour bought in this period may still be unopened, and a
  // sack opened in it may have been paid for last month.
  h += '<div class="card">' +
    '<div class="kv"><span class="k">These nights</span><span class="v">' +
      esc(fmtShort(txt(d.start) || per.start)) + ' – ' + esc(fmtShort(txt(d.end) || per.end)) + '</span></div>' +
    '<div class="kv"><span class="k">Nights open</span><span class="v">' + fmt(daysOpen) + '</span></div>' +
    '<div class="kv"><span class="k">Balls sold</span><span class="v">' + fmt(balls) + '</span></div>' +
    '<div class="kv"><span class="k">Money taken</span><span class="v">' + peso(d.revenue) + '</span></div>' +
    '<p class="hint" style="margin-top:10px;">Stock opened and boxes used are what was <b>used up</b> on these nights. ' +
      'Supplies and octopus are what was <b>paid for</b> on these nights. Over a fortnight those are not the same money, ' +
      'so they are shown apart and never added into one figure.</p>' +
    '<p class="hint" style="margin-top:6px;">This is for you to decide with. It changes no cutoff, no note and no price.</p>' +
  '</div>';

  // THE PER-BALL STACK.
  h += '<div class="card">' +
    '<div class="co-row big"><span>Every ball</span><span class="v">' + costPeso(v.per_ball) + '</span></div>' +
    '<div class="co-sub">what one ball cost to make</div>' +
    '<div class="r-sep" role="presentation"></div>' +
    '<div class="co-row"><span>Stock opened</span><span class="v">' + peso(v.stock) + '</span></div>' +
    '<div class="co-row"><span>Supplies &amp; octopus paid</span><span class="v">' + peso(v.money) + '</span></div>' +
    '<div class="co-row"><span>Boxes used</span><span class="v">' + peso(v.boxes) + '</span></div>' +
    // What was PAID for things already priced per unit above, shown so the
    // subtraction is visible (v2.8.0). Without this line the money figure here
    // quietly disagrees with the Expenses screen and looks like a mistake.
    // What was PAID for things priced per unit above — and ONLY the part whose
    // promise was actually kept may claim to be "counted above" (v2.9.2). Money
    // set aside for stock that was never logged as opened is counted NOWHERE,
    // and the caveat card says so; asserting otherwise here would be the same
    // untruth in smaller print.
    (num(v.counted_per_unit) > 0
      ? '<div class="r-sep" role="presentation"></div>' +
        '<div class="co-row"><span>Also paid' +
          (num(v.counted_as_stock) > 0 && !num(v.stock) ? ', counted nowhere' : ', counted above instead') +
          '</span><span class="v">' + peso(v.counted_per_unit) + '</span></div>' +
        '<p class="hint" style="margin-top:8px;">' + (num(v.counted_as_stock) > 0 && !num(v.stock)
          ? 'That is what you paid for stock and boxes in these nights. The boxes are counted above as they were ' +
            'used — but nothing was logged as OPENED, so the stock money is in no figure here. See the note at the top.'
          : 'That is what you paid for flour and boxes in these nights. It is <b>not</b> added here, because the ' +
            'flour is already counted as it was opened and the boxes as they were used — counting the money too ' +
            'would price every ball dearer than it is.') + '</p>'
      : '') +
    (isNone(v.per_ball) && why ? '<p class="hint" style="margin-top:8px;">' + why + '</p>' : '') +
  '</div>';

  // THE FIXED COST OF A NIGHT — not per ball, on purpose: it is owed whether one
  // box sells or a hundred do.
  h += '<div class="card">' +
    '<div class="co-row big"><span>Every night</span><span class="v">' + costPeso(fx.per_day) + '</span></div>' +
    '<div class="co-sub">the costs that do not follow the balls</div>' +
    '<div class="r-sep" role="presentation"></div>' +
    '<div class="co-row"><span>Wages</span><span class="v">' + peso(fx.salary) + '</span></div>' +
    '<div class="co-row"><span>Mama and the electric</span><span class="v">' + peso(fx.shares) + '</span></div>' +
    (isNone(fx.per_day)
      ? '<p class="hint" style="margin-top:8px;">No night in this cutoff is open yet, so there is nothing to spread them over.</p>'
      : '<p class="hint" style="margin-top:8px;">Both are for the whole cutoff, spread over the ' + fmt(daysOpen) +
        (daysOpen === 1 ? ' night' : ' nights') + ' open.</p>') +
  '</div>';

  // PER SKU — the margin is the number he decides with, so it is the big one.
  const skus = asArr(d.per_sku);
  h += '<div class="card"><p class="mt-name">What each box leaves</p>';
  if (!skus.length){
    h += '<p class="hint">Nothing has been sold in this cutoff yet.</p>';
  } else {
    for (const r of skus){
      const row = asObj(r);
      const mpb = row.margin_per_box;
      h += '<div class="st-item"><div class="st-top">' +
          '<span class="st-name">' + esc(txt(row.label) || txt(row.sku)) + '</span>' +
          '<span class="st-qty' + (!isNone(mpb) && num(mpb) < 0 ? ' neg' : '') + '">' + costPeso(mpb) + '</span>' +
        '</div>' +
        '<div class="st-sub">' + fmt(num(row.sold)) + ' sold · sells for ' + peso(row.price) +
          ' · costs ' + costPeso(row.cost_per_box) + ' a box' +
          (isNone(row.margin_per_ball) ? '' : ' · leaves ' + peso(row.margin_per_ball) + ' a ball') +
        '</div></div>';
    }
    h += '<p class="hint" style="margin-top:10px;">The big figure is what one box leaves after everything above it. ' +
      'A dash means something that box is made of has no cost on file yet.</p>';
  }
  h += '</div>';

  // BREAK-EVEN and what a typical night leaves. break_even_balls is for the
  // WHOLE cutoff (the server's own scope), so the nightly figure is that spread
  // over the nights that were open — and both are shown, labelled, rather than
  // one number that could be read as either.
  const be = d.break_even_balls;
  const bePerNight = (isNone(be) || !(daysOpen > 0)) ? null : r2(num(be) / daysOpen);
  const left = pd.left;
  h += '<div class="card">' +
    '<div class="co-row"><span>Balls a night just to break even</span><span class="v">' + costNum(bePerNight) + '</span></div>' +
    (isNone(bePerNight)
      ? '<p class="hint" style="margin-top:6px;">' + (why ||
          'The average ball costs more than it sells for, so no number of nights breaks even — the prices are what would have to change.') + '</p>'
      : '<div class="co-sub">' + fmt(be) + ' for the whole cutoff, over ' + fmt(daysOpen) +
        (daysOpen === 1 ? ' night' : ' nights') + '</div>') +
    '<div class="r-sep" role="presentation"></div>' +
    '<div class="co-row"><span>A night takes</span><span class="v">' + costPeso(pd.revenue) + '</span></div>' +
    '<div class="co-row"><span>A night costs</span><span class="v">' + costPeso(pd.cost) + '</span></div>' +
    // The LABEL carries the sign, exactly as the note's residual does: never
    // "leaves -₱120".
    '<div class="co-row split' + (!isNone(left) && num(left) < 0 ? ' neg' : '') + '">' +
      '<span>' + (!isNone(left) && num(left) < 0 ? 'A night loses' : 'A night leaves') + '</span>' +
      '<span class="v">' + (isNone(left) ? '—' : peso(Math.abs(num(left)))) + '</span></div>' +
    (isNone(left) ? '<p class="hint" style="margin-top:6px;">No night in this cutoff is open yet, so there is no typical night.</p>' : '') +
  '</div>';

  // THE TARGET TABLE. Advice, never applied — nothing here writes a price. The
  // answer lives in its OWN container so that typing in the field can replace
  // it without re-rendering the tab under the keyboard (the same reason the
  // Cutoff screen's split has updateSplitLive).
  h += '<div class="card"><p class="mt-name">To leave more a night</p>' +
    '<div class="field" style="margin-top:10px;"><label for="costTarget">What do you want a night to leave you (₱)?</label>' +
      '<input class="input money" id="costTarget" inputmode="decimal" autocomplete="off" placeholder="none" value="' + esc(costTarget) + '"></div>' +
    '<p class="err" id="err-cost-target" hidden></p>' +
    '<button type="button" class="btn block" data-act="cost-target">Work out the prices</button>' +
    '<div id="costTargetOut">' + costTargetOutHTML(res) + '</div>' +
  '</div>';

  // WHAT WAS LEFT OUT, said plainly. A cost that is quietly too low is worse
  // than one that is visibly absent, so these are named rather than guessed.
  const up = asArr(d.unpriced);
  if (up.length){
    h += '<div class="card attn-card"><p class="attn-head">' +
      (up.length === 1 ? '1 thing has no cost on file' : up.length + ' things have no cost on file') + '</p>' +
      '<p>These are <b>not</b> in any figure above — not even at ₱0. Give them a cost under Maintenance and work it out again.</p>';
    for (const u of up){
      const row = asObj(u);
      const isBox = txt(row.kind) === 'box';
      h += '<div class="st-item"><div class="st-top">' +
          '<span class="st-name">' + esc(txt(row.label) || txt(row.name)) + '</span>' +
          '<span class="st-qty">' + fmt(num(row.qty)) + '</span></div>' +
        '<div class="st-sub">' + (isBox
          ? 'boxes sold with no box cost — set it under Maintenance, in Prices'
          : 'opened with no unit cost — set it under Maintenance, in the stock list') + '</div></div>';
    }
    h += '</div>';
  }
  return h;
}

/** The target answer, on its own so it can be replaced as the field is typed.
 *
 *  A BLANK field shows NOTHING — a target nobody asked for is a made-up figure,
 *  and this screen is built on not inventing any. And while the field differs
 *  from what the server was asked, the PRICES ARE NOT SHOWN AT ALL: a price
 *  table that answers a figure no longer in the box above it is worse than no
 *  table, exactly as a note that contradicts the split field would be. */
function costTargetOutHTML(res){
  const d = asObj(asObj(res).data);
  const typed = txt(costTarget).trim();
  const answeredFor = txt(asObj(res).target).trim();
  if (typed === ''){
    return '<p class="hint" style="margin-top:10px;">Empty means no target, so there is nothing to show. ' +
      'Type what a night should leave you and this will say what each price would have to be.</p>';
  }
  if (num(typed) < 0) return '';        // the refusal is already on screen
  if (typed !== answeredFor){
    return '<p class="hint" style="margin-top:10px;">Tap “Work out the prices” to answer for ' +
      peso(num(typed)) + ' a night.</p>';
  }
  const tgt = asArr(d.targets).map(asObj).find(x => r2(num(x.per_day)) === r2(num(typed)));
  const rows = tgt ? asArr(tgt.prices) : [];
  // Withheld on purpose (v2.8.0): the server sends no targets at all while
  // this period's cost data is known to be incomplete. Say WHY, in the same
  // words as the card above, rather than showing a price built on a floor.
  if (!rows.length && asArr(d.caveats).length){
    return '<p class="hint" style="margin-top:10px;">No price advice for this cutoff yet — see “Read this first” above. ' +
      'Prices worked out from an incomplete cost would read too low, which is the one mistake this screen exists to prevent.</p>';
  }
  if (!rows.length){
    return '<p class="hint" style="margin-top:10px;">There is nothing to work this out from yet: the prices are scaled from what ' +
      'this cutoff actually took, and this cutoff has no open night with money in it.</p>';
  }
  let h = '<p class="hint" style="margin-top:12px;">To leave ' + peso(tgt.per_day) + ' a night, selling the same mix as this ' +
    'cutoff sold, the prices would need to be:</p>';
  for (const pr of rows){
    const row = asObj(pr);
    h += '<div class="co-row"><span>' + esc(skuLabel(txt(row.sku))) + '</span><span class="v">' + peso(row.price) + '</span></div>';
  }
  return h + '<p class="hint" style="margin-top:10px;">Advice only — nothing has been saved. Change a price under Maintenance when ' +
    'you decide, and it counts for the days you save from then on.</p>';
}

/** Follow the target field as it is typed, rewriting ONLY the answer under it so
 *  the keyboard stays put. */
function updateCostTarget(){
  const out = $('costTargetOut');
  if (!out || !costRes) return;
  try{ out.innerHTML = costTargetOutHTML(costRes); }
  catch(err){ console.error(err); }
}

/** Ask the server. The ONLY way this screen gets a figure: there is no offline
 *  answer to give, so a missing API and a failed request both end as one
 *  sentence and no numbers. */
async function loadCosting(){
  const per = costPer || (costPer = currentPeriod(todayStr()));
  const key = periodKey(per);
  const typed = txt(costTarget).trim();
  if (typed !== '' && num(typed) < 0){
    // Refused, and SAID on the screen rather than only in a field that the next
    // render may replace: an early return used to leave the whole section mute,
    // so paging between cutoffs did nothing and looked broken (v2.8.0).
    costErr = 'The nightly target cannot be negative — clear it, or type what a night should leave you.';
    costBusy = false;
    setErr('err-cost-target', 'The nightly target cannot be negative.');
    renderIbapa();
    return;
  }
  setErr('err-cost-target', '');
  if (!config.apiUrl){
    costRes = null; costStale = false; costBusy = false;
    costErr = 'The costing is worked out by the server from the whole sheet, so it needs the API — set it up above first.';
    renderIbapa();
    return;
  }
  costBusy = true; costErr = ''; costStale = false;
  renderIbapa();
  try{
    // A BLANK target sends no key at all — the harmless default, and the same
    // shape a phone that predates this screen would send.
    const payload = { start: per.start, end: per.end };
    if (typed !== '') payload.targetPerDay = num(typed);
    const data = await api('costing', payload);
    // He may have moved to another cutoff while this was in the air. The answer
    // belongs to the period it was asked for, and nothing else.
    if (periodKey(costPer || per) !== key) return;
    costRes = { key, target: typed, data: asObj(data) };
    costErr = '';
  }catch(err){
    console.error(err);
    // Guarded exactly like the success path (v2.8.0): a request for a period he
    // has already navigated away from must not delete the answer on screen just
    // because it failed late — the figures showing belong to THIS period and
    // are still true.
    if (periodKey(costPer || per) === key){
      costRes = null;
      costErr = friendlyError(err, 'Try again when there is a signal.');
    }
  }finally{
    costBusy = false;
    if (activeTab === 'ibapa') renderIbapa();
  }
}

async function testConnection(){
  const btn = $('testBtn'), out = $('testResult');
  if (!config.apiUrl){ out.textContent = 'Enter the URL first.'; return; }
  btn.disabled = true; out.textContent = 'Testing…';
  try{
    const data = await api('ping', {});
    out.innerHTML = '<span class="ok-note">✓ Connected. API version ' + esc((data && data.version) || '?') + '</span>';
    toast('Connected to the API.');
    await drainQueue();
    await doBootstrap();
  }catch(err){
    console.error(err);
    const msg = friendlyError(err, 'Check the internet connection and the URL above, then try again.');
    out.innerHTML = '<span style="color:var(--alert); font-weight:600;">✗ ' + esc(msg) + '</span>';
  }finally{
    const b = $('testBtn');
    if (b) b.disabled = false;
    updateStatus();
  }
}

/* ============================================================
   READ IT FROM THE PAPER (v2.9.0) — the photograph of Mama's page

   Mama writes every night on paper before anything is typed into this app. A
   real row reads `B4 | 31-28 | 1c = 60 | 2 = 100`, "Gc" marks GCash, a figure
   with a line through it is cancelled, and the page carries its own total in her
   hand. This screen photographs that page and sends it to the SEPARATE Octogo
   Vision web app — its own deployment, its own token, its own Gemini key. The
   tracker's own script gains nothing from any of this and never sees the photo.

   What this code does, and every line below obeys it:
     - it PRE-FILLS the Sales form and stops. NOTHING auto-saves. The night is
       committed by the ordinary "Save day", so every validation, refusal and
       snapshot rule that guarded a typed night guards a read one unchanged.
     - a figure the reading could not see stays EMPTY, never 0. A 0 looks like an
       answer, and an answer nobody gave is the one thing this must never show.
     - THE CROSS-CHECK is why any of it can be trusted: the page's own total,
       against what the prefilled form adds up to. Two independent sources
       agreeing is the same principle as every other figure in this app. A gap is
       named in pesos, points at the lines to look at, and does NOT block the
       save — he decides.
     - everything that comes back is UNTRUSTED TEXT. A model reply is escaped
       exactly once on its way into markup and is never rendered AS markup; the
       photo link is proved to be an ordinary http(s) address before it is ever
       an href or handed to the sheet.
   ============================================================ */

/** Whether this phone has the photo reader at all. BOTH halves are needed: a URL
 *  with no token is a button that can only ever be refused, and a dead button is
 *  worse than an absent one. Blank means the feature simply is not here. */
function visionReady(){ return !!(txt(config.visionUrl) && txt(config.visionToken)); }

/** The SECOND door, called exactly like the first and sharing none of its setup:
 *  its own URL, its own token, nothing about the sheet. Same transport as api()
 *  for the same reason — a POST with no custom headers defaults to text/plain,
 *  so Apps Script never sees a CORS preflight it cannot answer. */
async function visionApi(action, payload){
  if (!visionReady()) throw plainError('The photo reader is not set up on this phone yet — set it up under More.');
  const res = await fetchWithTimeout(config.visionUrl, {
    method:'POST',
    redirect:'follow',
    body: JSON.stringify({ token: config.visionToken, action, payload: payload || {} })
  }, VISION_TIMEOUT_MS, 'photo reader');
  const text = await res.text();
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw badResponseError('The photo reader did not send app data. Check its Web App URL under More.'); }
  if (!res.ok) throw badResponseError('The photo reader answered with error ' + res.status + '. Check its URL and its deployment.');
  if (!data || data.ok !== true) throw new ApiError((data && data.error) || 'The photo reader reported an error.');
  return data.data;
}

/* The reading on screen: { date, reading }. One at a time, and it belongs to ONE
   date — moving the form to another night puts it away rather than letting it
   describe figures it never read. */
let paper = null;
let paperBusy = '';   // what is happening right now, in her words. '' = nothing.
let paperErr = '';    // why the last attempt read nothing. One plain sentence.

function paperShowingFor(date){ return !!(isObj(paper) && paper.date === txt(date)); }
/** Put the reading away. With a date, only if it is that night's. */
function paperClear(date){
  if (date !== undefined && !paperShowingFor(date)) return;
  paper = null;
  paperErr = '';
}
function paperHide(){
  paper = null;
  paperErr = '';
  renderPanel('benta');
}

/* ---- The photograph, made small enough to be read. ----
   A phone camera produces 3–8 MB and the reader accepts about 4, so shrinking
   is not an optimisation: an original would simply be refused. The ladder cuts
   QUALITY before SIZE, because a smaller page is harder to read than a slightly
   blurrier one, and the first pass that fits is the one that is sent. */
const PAPER_MAX_BYTES = 4 * 1024 * 1024;
const PAPER_STEPS = [[1600, 0.8], [1600, 0.6], [1280, 0.55], [1024, 0.5]];
const PAPER_UNREADABLE = 'That picture could not be opened on this phone, so nothing was read — take it again, or type the night in by hand.';

/** Bytes behind a base64 string WITHOUT decoding it — the same arithmetic
 *  Vision.gs does on the other side, so this phone never sends a photograph
 *  that is going to be refused for its size. */
function b64Bytes(s){
  const n = String(s == null ? '' : s).length;
  if (!n) return 0;
  let pad = 0;
  if (s.charAt(n - 1) === '=') pad++;
  if (n > 1 && s.charAt(n - 2) === '=') pad++;
  return Math.floor(n / 4) * 3 - pad;
}

/** The picture decoded, with the phone's EXIF rotation baked into the PIXELS. A
 *  sideways page reads far worse, and createImageBitmap is the one call that
 *  applies the orientation reliably; the <img> fallback is for an engine that
 *  rejects the options bag. */
async function decodePhoto(file){
  if (typeof createImageBitmap === 'function'){
    try{ return await createImageBitmap(file, { imageOrientation:'from-image' }); }
    catch(e){ /* no options support — fall through to the <img> path */ }
  }
  return await new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(plainError(PAPER_UNREADABLE)); };
    img.src = url;
  });
}

/** One pass: draw the picture down to `edge` on its long side, encode as JPEG,
 *  and return the base64 BODY only — the data: prefix is stripped here because
 *  that is what the reader wants and a URL is the wrong place for a photograph. */
function paperEncode(src, edge, quality){
  const w0 = num(src.width || src.naturalWidth);
  const h0 = num(src.height || src.naturalHeight);
  if (!(w0 > 0 && h0 > 0)) throw plainError(PAPER_UNREADABLE);
  const scale = Math.min(1, edge / Math.max(w0, h0));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w0 * scale));
  cv.height = Math.max(1, Math.round(h0 * scale));
  const cx = cv.getContext('2d');
  if (!cx) throw plainError(PAPER_UNREADABLE);
  // A JPEG has no transparency and an undrawn pixel encodes BLACK. White is
  // what a sheet of paper looks like.
  cx.fillStyle = '#FFFFFF';
  cx.fillRect(0, 0, cv.width, cv.height);
  cx.drawImage(src, 0, 0, cv.width, cv.height);
  const url = cv.toDataURL('image/jpeg', quality);
  const at = String(url).indexOf(',');
  const b64 = at === -1 ? '' : String(url).slice(at + 1);
  if (!b64) throw plainError(PAPER_UNREADABLE);
  return { base64: b64, bytes: b64Bytes(b64) };
}

async function shrinkPhoto(file){
  if (!file || !num(file.size)) throw plainError(PAPER_UNREADABLE);
  const src = await decodePhoto(file);
  let last = null;
  try{
    for (const step of PAPER_STEPS){
      last = paperEncode(src, step[0], step[1]);
      if (last.bytes <= PAPER_MAX_BYTES) break;
    }
  }finally{
    // An ImageBitmap holds the decoded picture in memory until it is closed, and
    // a phone that has just taken a 12-megapixel photograph has none to spare.
    if (src && typeof src.close === 'function') src.close();
  }
  if (!last || last.bytes > PAPER_MAX_BYTES){
    throw plainError('That photo is too big to send even after shrinking it, so nothing was read — take it again from a little further back, or type the night in by hand.');
  }
  // Always image/jpeg: whatever the camera wrote (an iPhone writes HEIC), it
  // leaves this phone re-encoded, so the reader never has to guess.
  return { base64: last.base64, mimeType: 'image/jpeg' };
}

/** The product list the phone sends WITH the photograph — its OWN vocabulary, so
 *  the reader never touches the sheet and "B4" becomes box4 by the owner's own
 *  labels. Priced and classified at THIS DAY's stored figures, the same ones the
 *  card, the receipt, the validator and the payload read, so the model checks a
 *  row's arithmetic against the prices the night will actually be saved at.
 *  REQUEST keys are camelCase: cheesePrice, inCutoff. */
function paperSkus(date){
  const snap = storedPricesFor(date);
  return bentaSkuList().map(pr => {
    const eff = priceOnDay(snap, pr);
    return {
      sku: txt(pr.sku),
      label: txt(pr.label) || txt(pr.sku),
      size: num(pr.size),
      price: num(eff.price),
      cheesePrice: num(eff.cheese_price),
      inCutoff: cutoffOnDay(snap, pr)
    };
  });
}

/* ---- The reading, read defensively. ----
   These mirror Vision.gs's own intOrBlank_ / moneyOrBlank_ / fracOrBlank_ on
   purpose. The duplication IS the point: this is the one payload in the app that
   is not written by the owner's own sheet, so the phone re-applies the rule
   instead of trusting that the other side did. Anything that is not a usable
   figure reads BLANK — never 0. */
function paperInt(v){
  if (v === null || v === undefined || v === '' || typeof v === 'boolean' || typeof v === 'object') return '';
  const n = Number(String(v).replace(/[,\s]/g, ''));
  if (!isFinite(n) || n < 0) return '';
  if (Math.abs(n - Math.round(n)) > 1e-9) return '';
  return Math.round(n);
}
function paperMoney(v){
  if (v === null || v === undefined || v === '' || typeof v === 'boolean' || typeof v === 'object') return '';
  const n = Number(String(v).replace(/[₱,\s]/g, ''));
  if (!isFinite(n) || n < 0) return '';
  return r2(n);
}
function paperFrac(v){
  if (v === null || v === undefined || v === '' || typeof v === 'boolean' || typeof v === 'object') return '';
  const n = Number(v);
  if (!isFinite(n) || n < 0 || n > 1) return '';
  return Math.round(n * 100) / 100;
}
/** The photo's link, or ''. It becomes an HREF and it is stored in the sheet, so
 *  it is proved to be an ordinary web address before it is either — anything
 *  else (a "javascript:" line, a sentence, a whole paragraph) is not a link and
 *  is dropped. The same rule the server applies on the way in. */
function paperLink(v){
  const s = txt(v).trim();
  if (!s || s.length > 2000) return '';
  return /^https?:\/\/[^\s"'<>]+$/.test(s) ? s : '';
}
/** Untrusted text, kept short. Escaping stops it being markup; the cap stops one
 *  reply filling the screen — and the phone's storage — with prose. */
function paperText(v, max){
  const s = txt(v).replace(/\s+/g, ' ').trim();
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

/** The reply -> what this screen shows and fills in. snake_case on the wire, as
 *  every response is, with the camelCase fallback every other reader here has.
 *  A reply that is not a READING is refused rather than massaged into an empty
 *  form that looks like it worked. */
function normReading(raw, date){
  const d = asObj(raw);
  if (!Array.isArray(d.counts)){
    throw plainError('The photo did not come back as a reading of the paper, so nothing was filled in — the night can still be typed in by hand.');
  }
  // The phone's own vocabulary is the ONLY one. A sku it cannot name is never
  // guessed into a real one: that would put a night's boxes on the wrong
  // product. The reader refuses them too, and names them in `unread`.
  const known = Object.create(null);
  for (const pr of bentaSkuList()) known[txt(pr.sku)] = txt(pr.label) || txt(pr.sku);
  const counts = [];
  const seen = Object.create(null);
  for (const rowRaw of d.counts){
    const r = asObj(rowRaw);
    const sku = txt(r.sku);
    if (!sku || !known[sku] || seen[sku]) continue;   // first row per sku wins
    seen[sku] = true;
    counts.push({
      sku: sku, label: known[sku],
      sod: paperInt(r.sod), eod: paperInt(r.eod),
      cheese: paperInt(r.cheese), gcash: paperInt(r.gcash),
      gcash_cheese: paperInt(pick(r, 'gcash_cheese', 'gcashCheese')),
      confidence: paperFrac(r.confidence)
    });
  }
  return {
    // THE DATE IS THE PHONE'S, never the model's. The phone knows which night it
    // photographed; a date read off a smudged corner does not, and a reading
    // filed under the wrong night is worse than no reading at all.
    date: txt(date),
    counts: counts,
    custom_amount: paperMoney(pick(d, 'custom_amount', 'customAmount')),
    custom_gcash: paperMoney(pick(d, 'custom_gcash', 'customGcash')),
    total_on_paper: paperMoney(pick(d, 'total_on_paper', 'totalOnPaper')),
    // What the PEN wrote at the top of the page (v2.9.1). It decides nothing —
    // the night saved is always the one on screen — it only lets the phone
    // notice that this page is not that night.
    date_on_paper: paperText(pick(d, 'date_on_paper', 'dateOnPaper'), 40),
    notes: paperText(d.notes, 400),
    unread: asArr(d.unread).map(u => paperText(u, 160)).filter(Boolean).slice(0, 24),
    photo_url: paperLink(pick(d, 'photo_url', 'photoUrl')),
    photo_saved: truthy(d.photo_saved),
    photo_error: paperText(pick(d, 'photo_error', 'photoError'), 240),
    model: paperText(d.model, 60)
  };
}

/**
 * The reading, ONTO the form — and this is the whole of what it does. It writes
 * `benta` and nothing else: it does not save, does not queue, does not touch the
 * sheet, and leaves every figure the page does not carry exactly as it was (the
 * wage, who minded the stall, the lid boxes, the stock opened, the day's note).
 * The model's own remarks are NOT written into the day's note either: that field
 * is Mama's sentence and goes into the sheet, and an observation about a smudge
 * is not hers. It is shown on the review card instead.
 *
 * THE ONE MAPPING IN THIS FEATURE, written down because money moves on it. The
 * reader is told in so many words that a cheese box paid by GCash "counts in
 * cheese AND in GCash cheese" — so `cheese` is ALL the cheese on that row
 * however it was paid, `gcash` the plain boxes paid by GCash, `gcash_cheese` the
 * cheese ones. The sheet's four buckets are mutually exclusive, so:
 *     gcashCheese = gcash_cheese
 *     cheese      = cheese - gcash_cheese     (the cheese that was paid in cash)
 *     gcash       = gcash                     (plain, paid by GCash)
 * and the form's own two questions then read back as "how many were cheese" =
 * cheese + gcashCheese and "sold with GCash" = gcash + gcashCheese.
 *
 * What this mapping CANNOT get wrong is the figure the cross-check tests: a
 * night's total depends only on how many boxes were cheese ALTOGETHER, so a
 * misread of which cheese box was paid how moves money between Cash and GCash
 * and never changes the Total. The review card prints all five figures in the
 * form's own words, so a wrong split is caught by eye before Save day.
 *
 * A BLANK STAYS BLANK all the way through: the subtraction only happens when
 * `cheese` was really read, and an unread `gcash_cheese` counts as 0 in that one
 * subtraction — so "one cheese, could not tell how it was paid" lands as one
 * cheese box and an EMPTY "of those, cheese", which is exactly what was seen.
 */
function applyReadingToForm(rd){
  const r = asObj(rd);
  for (const c of asArr(r.counts)){
    const row = asArr(benta.rows).find(x => x.sku === c.sku);
    if (!row) continue;
    row.sod = c.sod;
    row.eod = c.eod;
    row.gcashCheese = c.gcash_cheese;
    row.cheese = (c.cheese === '') ? '' : Math.max(0, c.cheese - num(c.gcash_cheese));
    row.gcash = c.gcash;
  }
  // A special order is a PESO AMOUNT on the page, not a box count, so the boxes
  // it used (customBoxes) are nowhere on the paper and are left untouched.
  benta.custom = r.custom_amount;
  benta.customGcash = r.custom_gcash;
  const link = paperLink(r.photo_url);
  if (link) benta.photoUrl = link;
  benta.fromPaper = true;
  benta.dirty = true;
  // Nothing the reading filled in may sit hidden behind a collapsed head.
  if (gcashHeld()) benta.gcashOpen = true;
}

/** One read row in the FORM's terms — the same five figures the cards below ask
 *  for, so the review can be read straight down against them. Blank stays blank,
 *  and a sum may only read blank when every figure behind it does. */
function paperFormFigures(c){
  const gc = c.gcash_cheese;
  return {
    sod: c.sod,
    eod: c.eod,
    sold: (c.sod === '' || c.eod === '') ? '' : Math.max(0, c.sod - c.eod),
    cheeseAll: c.cheese,
    gcashAll: (c.gcash === '' && gc === '') ? '' : num(c.gcash) + num(gc),
    gcashOfCheese: gc
  };
}

/** How sure the reading was of one row, in words. A figure is not a feeling and
 *  "0.62" means nothing to anybody reading this at eleven at night. */
function paperSureWord(v){
  if (v === '') return 'it did not say how sure it was';
  const n = num(v);
  if (n >= 0.9) return 'sure of this row';
  if (n >= 0.7) return 'fairly sure of this row';
  return 'NOT sure of this row';
}

/** The skus worth looking at first when the totals disagree: the ones with the
 *  most figures the reading could not see, then the ones it was least sure of. A
 *  blank outranks a low confidence because a blank IS the figure missing from
 *  the form, which is the likeliest cause of a gap. */
/** Everything this reading did NOT read, in the owner's words (v2.9.0). The
 *  gate found the cross-check claiming "every figure was read clearly" while
 *  the same reading listed unread figures — and blaming Mama's arithmetic for
 *  the app's own blind spot. Three sources, because a gap can hide in any of
 *  them: the model's own `unread` list, a figure it left blank OUTSIDE the
 *  count rows (the special order, the paper's total), and a product ROW that
 *  never came back at all — which appears in no list, since an omitted row
 *  cannot name itself. */
function paperGaps(rd){
  const r = asObj(rd);
  const out = asArr(r.unread).map(u => txt(u)).filter(Boolean);
  if (r.custom_amount === '') out.push('the special-order amount');
  if (r.custom_gcash === '') out.push('the GCash part of the special order');
  // Rows the page should have had. Judged against the skus this form offers,
  // which is the only list the phone can honestly compare against.
  const got = Object.create(null);
  for (const c of asArr(r.counts)) got[txt(asObj(c).sku)] = true;
  for (const row of asArr(asObj(benta).rows)){
    if (!got[row.sku]) out.push(skuLabel(row.sku) + ' (no line for it came back at all)');
  }
  return out;
}

function paperSuspects(rd){
  const rows = asArr(asObj(rd).counts).map(c => {
    let blanks = 0;
    for (const f of ['sod', 'eod', 'cheese', 'gcash', 'gcash_cheese']) if (c[f] === '') blanks++;
    return {
      label: txt(c.label),
      blanks: blanks,
      conf: c.confidence === '' ? 0 : num(c.confidence),
      unsure: c.confidence === '' || num(c.confidence) < 0.9
    };
  }).filter(x => x.blanks > 0 || x.unsure);
  rows.sort((a, b) => (b.blanks - a.blanks) || (a.conf - b.conf));
  return rows.slice(0, 2).map(x => x.label);
}

/**
 * THE CROSS-CHECK, and the reason a machine reading a photograph belongs
 * anywhere near this money. The page carries its own total in Mama's hand; the
 * form now carries what the reading made of the same page. Two independent
 * sources agreeing is real evidence the reading is right.
 *
 * It never blocks anything. A gap is named in pesos with the lines to look at
 * first, and "Save day" works exactly as it always did — he decides.
 */
function paperCross(){
  if (!isObj(paper) || !isObj(benta) || paper.date !== benta.date) return null;
  const rd = asObj(paper.reading);
  if (rd.total_on_paper === ''){
    return { state:'unknown', said:'The total in your own hand was not read off the page, so there is nothing to check these figures against — go through them against the paper before saving.' };
  }
  const said = r2(num(rd.total_on_paper));
  const c = computeDay(bentaPayload());
  const mine = r2(num(c.total));
  if (said === mine){
    return { state:'agree', said:'The paper says ' + peso(said) + ' and so does this — good.' };
  }
  // Money kept OUT of the cutoff (nori) sits in the same tin and is very likely
  // written into the page's own total, while it is deliberately outside the
  // day's Total here. When THAT is the whole difference the two do agree, and
  // crying mismatch would be a false alarm on an ordinary night.
  const excl = r2(num(c.excluded));
  if (excl !== 0 && r2(mine + excl) === said){
    // Consistent — but NOT proof, and the gate was right to say so: a reading
    // that happened to fall short by exactly the excluded amount lands here
    // too, and calling that "Good" would bless a misread night. So the
    // assumption is stated and left with him, which is all the arithmetic
    // actually supports (v2.9.0).
    return { state:'agree', said:'The paper says ' + peso(said) + '. The day’s total here is ' + peso(mine) +
      ', and the ' + peso(excl) + ' kept out of the cutoff makes up the rest — so these agree IF the paper’s ' +
      'total counts the nori in. If it does not, then something is ' + peso(excl) + ' out. You will know which.' };
  }
  // WHERE TO LOOK. The unread things come first, because a figure the reading
  // never had is a better explanation of a gap than a figure it was merely
  // unsure of — and the old wording skipped them entirely and blamed the
  // paper's arithmetic instead (v2.9.0).
  const gaps = paperGaps(rd);
  const look = paperSuspects(rd);
  let where;
  if (gaps.length){
    where = ' This reading did not get ' + listPhrase(gaps.slice(0, 3)) +
      ' — that is the first place to look.';
  } else if (look.length === 0){
    where = ' Every figure on the page came back read, and clearly, so the difference is more likely in the' +
      ' adding-up on the paper itself — check that before you change anything here.';
  } else if (look.length === 1){
    where = ' Look at ' + look[0] + ' first — the reading was least sure of it.';
  } else {
    where = ' Look at ' + look[0] + ' first, then ' + look[1] + ' — the reading was least sure of those.';
  }
  return { state:'differ', said:'The paper says ' + peso(said) + ' but these figures add up to ' + peso(mine) +
    ' — ' + peso(r2(Math.abs(said - mine))) + (mine < said ? ' short' : ' too much') + '.' + where +
    ' Nothing is saved yet: change what is wrong, or save it as it stands.' };
}

/** The cross-check as markup. `errs` is validateBenta's own answer, so the card
 *  can also say how many lines hold a figure the sheet will refuse — those
 *  refusals are printed on the cards themselves, which are screens further down. */
function paperCrossHTML(errs){
  const cx = paperCross();
  if (!cx) return '';
  const cls = cx.state === 'agree' ? ' agree' : (cx.state === 'differ' ? ' differ' : '');
  let h = '<p class="paper-cross' + cls + '">' + esc(cx.said) + '</p>';
  // THE ONE BLANK THAT INVENTS MONEY, said out loud. Every figure the app sums
  // reads a blank as 0, so a row with a start count and NO end count prices the
  // whole shelf as sold — and the total above it looks perfectly ordinary while
  // it does. Read off the FORM, not the reading, so it clears the moment the
  // count is filled in. (The other way round — an end count with no start —
  // is a negative Sold, which validateBenta already refuses by name.)
  const half = asArr(asObj(benta).rows)
    .filter(r => isBlankVal(r.eod) && !isBlankVal(r.sod) && num(r.sod) > 0)
    .map(r => esc(skuLabel(r.sku)));
  if (half.length){
    h += '<p class="paper-cross differ">The end count is still empty on <b>' + listPhrase(half) +
      '</b>, so the figures above count every one of those boxes as sold. Fill it in and this will settle.</p>';
  }
  const e = asObj(errs);
  let bad = 0;
  for (const c of asArr(asObj(paper).reading && paper.reading.counts)) if (e['sku:' + c.sku]) bad++;
  if (bad){
    h += '<p class="paper-note">' + bad + (bad === 1
      ? ' line below holds a figure the sheet will not take'
      : ' lines below hold figures the sheet will not take') +
      ' — the red note on each of those cards says what is wrong.</p>';
  }
  return h;
}
/** Rebuilt on every edit, from validateBentaLive, so a gap he has just closed
 *  stops saying it is open. */
function updatePaperCross(errs){
  const el = $('paperCross');
  if (!el) return;
  el.innerHTML = paperCrossHTML(errs);
}

/** The whole card: the camera, what is happening, and the reading itself.
 *  Returns '' when the photo reader is not set up on this phone — the feature is
 *  absent rather than present and broken. */
/** Whether the page in the photograph is dated as a DIFFERENT night from the
 *  one on screen (v2.9.1). This gap was invisible and dangerous: an old page's
 *  figures agree with its own total perfectly, so the cross-check blesses them,
 *  and May's night saves onto an August day with nothing on screen objecting.
 *
 *  The pen writes "5/18" with no year and in no agreed order, so a mismatch is
 *  only claimed when NEITHER reading of those numbers can be the night on
 *  screen — day/month and month/day both. Anything unparsable is silence: an
 *  unreadable corner is not evidence of anything. Returns the resolved date it
 *  believes the page is, so the card can offer to go there. */
function paperPageDate(){
  const rd = asObj(asObj(paper).reading);
  const raw = txt(rd.date_on_paper).trim();
  const on = txt(asObj(benta).date);
  if (!raw || !isDateStr(on)) return null;
  const nums = raw.match(/\d{1,4}/g);
  if (!nums || nums.length < 2) return null;           // no two figures: say nothing
  const a = num(nums[0]), b = num(nums[1]);
  const here = d2parts(on);
  // Either order may be what the pen meant, so either matching is a match.
  if ((a === here.m && b === here.d) || (a === here.d && b === here.m)) return null;
  // It differs. Resolve the most likely night it IS: month/day first (the
  // owner's own pages read that way), in this year unless that is still to
  // come, in which case the same date last year.
  const pick2 = (mm, dd) => (mm >= 1 && mm <= 12 && dd >= 1 && dd <= lastDayOf(here.y, mm)) ? [mm, dd] : null;
  const guess = pick2(a, b) || pick2(b, a);
  if (!guess) return { raw, date: '' };               // differs, but unresolvable
  let iso = partsToStr(here.y, guess[0], guess[1]);
  if (iso > todayStr()) iso = partsToStr(here.y - 1, guess[0], guess[1]);
  return { raw, date: iso };
}

function paperCardHTML(){
  if (!visionReady() || !isObj(benta)) return '';
  // A closed day has no page of figures to read.
  if (benta.closed) return '';

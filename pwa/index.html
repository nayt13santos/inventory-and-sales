<!doctype html>
<html lang="en-PH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Octogo Tracker</title>
<meta name="description" content="Daily sales and expenses tracker for Octogo Takoyaki.">
<meta name="theme-color" content="#C25E0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Octogo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Octogo Tracker — styles
   Palette: rice-paper / soy ink / takoyaki-sauce / deep sear /
   nori / GCash blue / alert. Type: Baloo 2 display + system body.
   ============================================================ */
:root{
  --bg:#FBF8F2;
  --ink:#2B1D12;
  --accent:#C25E0A;
  --deep:#8F3D0C;
  --ok:#3E5C3A;
  --gcash:#1B6DE0;
  --alert:#B3402E;
  --paper:#FFFFFF;
  --line:#E8DFD0;
  --soft:#F3ECDF;
  --muted:#7A6A58;
  --radius:16px;
  --display:'Baloo 2', ui-rounded, 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
  --body:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.45;
  min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
:focus-visible{ outline:3px solid var(--ink); outline-offset:2px; border-radius:6px; }
button{ font:inherit; color:inherit; }
[hidden]{ display:none !important; }

/* Header. The whole top region is one sticky block: brand + status, the demo
   banner, and (on Sales) the day's running TOTAL — see .day-strip. */
.topbar{ position:sticky; top:0; z-index:20; background:var(--bg); }
.app-header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--bg); border-bottom:1px solid var(--line);
}
.brand-lockup{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark{ width:40px; height:34px; object-fit:contain; flex:none; }
.brand{ font-family:var(--display); font-weight:800; font-size:22px; color:var(--deep); line-height:1.1; }
.brand small{ display:block; font-family:var(--body); font-weight:600; font-size:12px; color:var(--muted); letter-spacing:.04em; }
.pill{
  font-family:var(--display); font-weight:700; font-size:14px;
  padding:7px 14px; border-radius:999px; white-space:nowrap;
}
.pill.ok{ background:var(--ok); color:#fff; }
.pill.pending{ background:var(--accent); color:#fff; }
.pill.off, .pill.demo{ background:var(--soft); color:var(--muted); }
/* Something did NOT reach the sheet — never green, never quiet. */
.pill.attn{ background:var(--alert); color:#fff; }

/* Sticky day total — the figure to check against the cash in the tin while
   counting. It mirrors the receipt strip, which stays the signature element. */
.day-strip{
  display:flex; align-items:center; justify-content:space-between; gap:4px 10px;
  padding:6px 16px 7px; background:var(--bg); border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;
  /* Cash + GCash + the tin can outrun 375px once the figures are four digits.
     Wrapping keeps every figure readable; the page itself must never scroll
     sideways for a bar that is only there to be glanced at. */
  flex-wrap:wrap;
}
.day-strip .ds-total{ display:flex; align-items:baseline; gap:8px; min-width:0; }
.day-strip .ds-lbl{ font-family:var(--display); font-weight:700; font-size:12px; letter-spacing:.1em; color:var(--muted); }
.day-strip .ds-amt{ font-family:var(--display); font-weight:800; font-size:23px; line-height:1.1; }
.day-strip .ds-sub{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:2px 10px; font-size:13px; color:var(--muted); }
.day-strip .ds-sub > span{ white-space:nowrap; }
.day-strip .ds-sub b{ font-family:var(--display); font-size:15px; color:var(--ink); }
.day-strip .ds-sub .gc b{ color:var(--gcash); }
/* The cash tin — Cash plus the money kept out of the cutoff. Shown only on a night
   that has some, so it never restates Cash. */
.day-strip .ds-sub .tin b{ color:var(--deep); }

/* Needs-attention card — work that is NOT in the Google Sheet. */
.attn-card{ border:1.5px solid var(--alert); }
.attn-head{ font-family:var(--display); font-weight:800; font-size:17px; color:var(--alert); margin-bottom:6px; }
.attn-item{ padding:10px 0 2px; border-top:1px solid var(--line); }
.attn-item.first{ border-top:none; }
.attn-when{ font-family:var(--display); font-weight:700; font-size:16px; }
.attn-why{ font-size:15px; margin-top:2px; }
.attn-help{ font-size:14px; color:var(--muted); margin-top:4px; }
.attn-acts{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 6px; }
.attn-acts .btn{ flex:1 1 130px; }

/* Demo banner — a notice in the scroll flow, not part of the sticky top. */
.banner{
  background:#F6E7CF; color:var(--deep);
  padding:8px 14px; font-size:15px; text-align:center;
  border:1px solid var(--line); border-radius:12px; margin-bottom:12px;
}
.banner button{
  background:none; border:none; text-decoration:underline; font-weight:700;
  color:var(--deep); cursor:pointer; min-height:48px; padding:0 6px;
}

/* Layout */
main{ max-width:560px; margin:0 auto; padding:16px 16px 8px; }
.card{
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius); padding:16px; margin-bottom:14px;
}
.section-title{ font-family:var(--display); font-weight:700; font-size:18px; margin:20px 0 10px; }
.hint{ color:var(--muted); font-size:14px; }
.err{ color:var(--alert); font-weight:600; font-size:15px; margin-top:8px; }
.ok-note{ color:var(--ok); font-weight:600; font-size:15px; }

/* Buttons & chips (48px+ touch targets everywhere) */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:52px; padding:8px 18px; border-radius:14px;
  border:1.5px solid var(--line); background:var(--paper); color:var(--ink);
  font-family:var(--display); font-weight:700; font-size:18px; cursor:pointer;
}
.btn:active{ background:var(--soft); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:active{ background:var(--deep); border-color:var(--deep); }
.btn.primary:disabled{ opacity:.55; }
.btn.block{ width:100%; }
.btn.small{ min-height:48px; font-size:16px; padding:6px 14px; }
.icon-btn{
  width:48px; height:48px; flex:none; display:flex; align-items:center; justify-content:center;
  border:none; background:none; border-radius:12px; cursor:pointer; color:var(--muted);
}
.icon-btn:active{ background:var(--soft); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  min-height:48px; padding:10px 18px; border-radius:999px;
  border:1.5px solid var(--line); background:var(--paper);
  font-family:var(--display); font-weight:600; font-size:16px; cursor:pointer;
}
.chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }

/* Fields */
.field{ margin-bottom:14px; }
.field:last-child{ margin-bottom:0; }
.field > label{ display:block; font-weight:600; font-size:15px; margin-bottom:6px; }
.input{
  width:100%; min-height:52px; padding:10px 14px; font-size:18px;
  border:1.5px solid var(--line); border-radius:12px;
  background:var(--paper); color:var(--ink); font-family:var(--body);
  font-variant-numeric:tabular-nums;
}
.input.money{ font-family:var(--display); font-weight:700; font-size:20px; }
.input.gcash-in{ color:var(--gcash); }
select.input{ appearance:auto; }

/* Date card (tap anywhere to open the native picker) */
.date-card{ position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.date-card:focus-within{ outline:3px solid var(--ink); outline-offset:2px; }
.date-kicker{ font-family:var(--display); font-weight:700; font-size:14px; color:var(--accent); text-transform:uppercase; letter-spacing:.08em; }
.date-kicker.backfill{ color:var(--gcash); }
.date-big{ font-family:var(--display); font-weight:800; font-size:24px; line-height:1.15; }
.date-hint{ font-size:13px; color:var(--muted); margin-top:2px; }
.date-cover{ position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; font-size:18px; }
.cal-ico{ flex:none; color:var(--accent); }

/* Closed-day switch. The whole row is the label (tapping the words works) and
   the switch itself is 72x48 — it blanks a whole day, so it gets a real target. */
.switch-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:56px; cursor:pointer; }
.switch-row .sw-label{ font-family:var(--display); font-weight:700; font-size:18px; }
.switch-row .sw-sub{ font-size:14px; color:var(--muted); }
.switch{ position:relative; width:72px; height:48px; flex:none; }
.switch input{ position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:pointer; }
.switch .track{ position:absolute; inset:0; background:var(--line); border-radius:999px; transition:background .15s; pointer-events:none; }
.switch .knob{
  position:absolute; top:6px; left:6px; width:36px; height:36px; border-radius:50%;
  background:#fff; box-shadow:0 1px 3px rgba(43,29,18,.35); transition:transform .15s; pointer-events:none;
}
.switch input:checked + .track{ background:var(--deep); }
.switch input:checked ~ .knob{ transform:translateX(24px); }
.switch input:focus-visible + .track{ outline:3px solid var(--ink); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ .switch .track, .switch .knob{ transition:none; } }

/* Steppers — giant +/− buttons, and a number field wide enough to read and
   tap (48px+ of usable width on a 375px phone, where two sit side by side). */
.stepper{ display:grid; grid-template-columns:48px minmax(0,1fr) 48px; gap:4px; align-items:center; }
/* Compact variant for the payment rows, where the stepper sits beside a label
   instead of filling a column. Fixed width so the row cannot overflow and clip
   its own label — full 48px touch targets kept. */
.stepper.sm{ grid-template-columns:48px 56px 48px; }
.stepper.sm .step-btn{ height:48px; }
.stepper.sm .step-val{ height:48px; font-size:20px; }
.step-btn{
  width:48px; height:52px; border-radius:14px; cursor:pointer;
  border:1.5px solid var(--line); background:var(--bg);
  font-family:var(--display); font-size:28px; font-weight:700; color:var(--deep); line-height:1;
}
.step-btn:active{ background:var(--deep); border-color:var(--deep); color:#fff; }
.step-val{
  width:100%; height:52px; min-width:0; text-align:center;
  font-family:var(--display); font-size:22px; font-weight:700;
  border:1.5px solid var(--line); border-radius:12px; background:var(--paper);
  color:var(--ink); font-variant-numeric:tabular-nums;
}

/* Sales count cards */
.sku-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
.sku-head strong{ font-family:var(--display); font-weight:800; font-size:20px; }
.sku-price{ font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
.sku-card{ padding:14px; }
.count-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
.count-cell > label, .count-cell > .cell-label{ display:block; font-weight:600; font-size:14px; color:var(--muted); margin-bottom:6px; }
.sold-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:12px; }
.sold-badge{ font-size:16px; }
.sold-badge b{ font-family:var(--display); font-size:22px; font-weight:800; color:var(--ok); font-variant-numeric:tabular-nums; }
.sold-badge.neg b{ color:var(--alert); }
.sku-split{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
  font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
.saved-hint{ color:var(--ok); font-weight:600; font-size:15px; margin:-6px 0 14px; }

/* Kept OUT of the cutoff (nori). Sold and counted like anything else, so it must
   look ordinary — one quiet badge and one short line, never a warning colour:
   nothing is wrong, this money is simply the owner's own to settle. */
.badge-excl{
  flex:none; font-family:var(--display); font-weight:700; font-size:12px;
  background:var(--soft); color:var(--deep); border-radius:8px; padding:3px 8px;
  text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
}
.excl-note{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);
  font-size:14px; color:var(--muted); }

/* Sold splits two ways at once — variant and payment — so the boxes are grouped
   by HOW it was paid, and each row says WHICH variant. Position carries the
   meaning; no label has to hide half of it. Plain regular cash is the derived
   remainder: shown, never typed. */
.buckets{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
.pay-intro{ font-weight:700; margin-bottom:10px; }
.pay-group + .pay-group{ margin-top:12px; }
.pay-head{
  font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:8px;
}
.pay-head.gc{ color:var(--gcash); }
.pay-row{ display:flex; align-items:center; gap:12px; min-height:56px; }
.pay-row + .pay-row{ margin-top:6px; }
.pay-what{ flex:1; min-width:0; font-size:16px; }
.pay-row.gc .pay-what{ color:var(--ink); }
.pay-row .stepper{ flex:none; }
.pay-note{ flex:none; font-size:13px; color:var(--muted); }
.derived{
  display:flex; align-items:center; justify-content:center;
  min-width:56px; height:48px; padding:0 10px;
  border-radius:12px; background:var(--soft);
  font-family:var(--display); font-weight:800; font-size:22px; color:var(--deep);
  font-variant-numeric:tabular-nums;
}

/* Stock rows: a name that says what its number means, beside a whole-unit
   stepper. Same 48px targets as the box steppers — this is Mama's card too. */
.stk-row{ display:flex; align-items:center; gap:12px; min-height:60px; }
.stk-row + .stk-row{ border-top:1px solid var(--line); }
.stk-what{ flex:1; min-width:0; }
.stk-name{ display:block; font-weight:600; }
.stk-unit{ display:block; font-size:13px; color:var(--muted); }
.stk-row .stepper{ flex:none; }

/* Low stock: one quiet line on Sales, a small badge on the More list. Never a
   modal, never anything that blocks the day's entry. */
.low-line{
  display:flex; align-items:center; gap:8px;
  background:#F6E7CF; border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; margin:0 0 14px; font-size:15px; color:var(--deep);
}
.low-line b{ font-weight:700; }
/* An inline text button that still has a real touch target. */
.lnk{
  background:none; border:none; padding:8px 0; min-height:48px;
  font:inherit; font-weight:700; color:var(--deep); text-decoration:underline; cursor:pointer;
}
.badge-low{
  flex:none; font-family:var(--display); font-weight:700; font-size:12px;
  background:var(--alert); color:#fff; border-radius:8px; padding:3px 8px;
  text-transform:uppercase; letter-spacing:.04em;
}

/* Stock-on-hand list (More) */
.st-item{ padding:12px 0; border-bottom:1px solid var(--line); }
.st-item:last-child{ border-bottom:none; }
.st-top{ display:flex; align-items:baseline; gap:10px; }
.st-name{ flex:1; min-width:0; font-weight:700; }
.st-qty{ font-family:var(--display); font-weight:800; font-size:22px; color:var(--deep); font-variant-numeric:tabular-nums; white-space:nowrap; }
.st-qty.neg{ color:var(--alert); }
.st-sub{ font-size:13px; color:var(--muted); margin-top:4px; }
.st-acts{ display:flex; gap:8px; margin-top:10px; }
.st-count{ display:flex; gap:8px; align-items:flex-end; margin-top:10px; }
.st-count .input{ width:110px; text-align:right; }

/* Maintenance rows */
.mt-row{ padding:12px 0; border-bottom:1px solid var(--line); }
.mt-row:last-of-type{ border-bottom:none; }
.mt-name{ font-weight:700; margin-bottom:8px; }
.mt-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
.mt-grid label, .mt-cell label{ display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
.mt-toggle{ display:flex; align-items:center; gap:10px; min-height:48px; margin-top:6px; cursor:pointer; }
.mt-toggle input{ width:26px; height:26px; accent-color:var(--accent); }

/* Collapsible cards — stock used today */
.collapse{ padding:0; overflow:hidden; }
.collapse-head{
  width:100%; display:flex; align-items:center; gap:10px; min-height:62px;
  padding:12px 16px; background:none; border:none; text-align:left; cursor:pointer;
}
.collapse-head:active{ background:var(--soft); }
.collapse-head .ch-title{ flex:1; min-width:0; font-family:var(--display); font-weight:700; font-size:18px; }
.collapse-head .ch-sum{ font-family:var(--display); font-weight:800; font-size:17px; color:var(--deep); font-variant-numeric:tabular-nums; }
.collapse-head .chev{ flex:none; color:var(--muted); transition:transform .15s; }
.collapse-head[aria-expanded="true"] .chev{ transform:rotate(180deg); }
@media (prefers-reduced-motion: reduce){ .collapse-head .chev{ transition:none; } }
.collapse-body{ padding:0 16px 16px; }
.line-row{ display:flex; align-items:center; gap:10px; padding:5px 0; }
.line-row .ln-name{ flex:1; min-width:0; font-weight:600; }
.line-row .input{ width:118px; text-align:right; }
.line-row .unit{ width:32px; flex:none; font-size:14px; color:var(--muted); }
/* Quiet note for a row whose name has left the sheet's list. Advisory only —
   it never blocks the save. */
.ln-note{ font-size:13px; color:var(--muted); margin:-2px 0 6px; }
.sum-row{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  margin-top:12px; padding-top:10px; border-top:2px solid var(--ink); font-weight:700;
}
.sum-row b{ font-family:var(--display); font-size:22px; font-variant-numeric:tabular-nums; }

/* Receipt strip — the signature element */
.receipt-wrap{ margin:20px 0 8px; filter:drop-shadow(0 4px 8px rgba(43,29,18,.14)); }
.receipt{ background:var(--paper); padding:18px 18px 10px; border-radius:8px 8px 0 0; font-variant-numeric:tabular-nums; }
.r-brand{ text-align:center; font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:.14em; color:var(--deep); text-transform:uppercase; }
.r-date{ text-align:center; font-size:13px; color:var(--muted); margin:2px 0 10px; }
.r-line{ display:flex; justify-content:space-between; gap:12px; padding:3px 0; font-size:16px; }
.r-line .r-amt{ white-space:nowrap; }
.r-sep{ border-top:2px dashed var(--line); margin:10px 0; }
.r-total{ display:flex; justify-content:space-between; align-items:baseline; font-family:var(--display); font-weight:800; }
.r-total .lbl{ font-size:17px; letter-spacing:.1em; }
.r-total .amt{ font-size:42px; line-height:1.1; }
.r-sub{ display:flex; justify-content:space-between; font-size:16px; padding:2px 0; }
.r-sub.gcash .r-amt{ color:var(--gcash); font-weight:700; }
/* Money that is NOT in the TOTAL above it, printed below the totals with the one
   line that makes the tin add up. Dashed rule so the eye sees it is outside. */
.r-excl{ margin-top:8px; padding-top:8px; border-top:2px dashed var(--line); }
.r-sub.excl .r-amt{ color:var(--deep); font-weight:700; }
/* .r-note: the same quiet voice for the receipt's non-money notes (v2.7.0 —
   the converted-to-GCash sentence and the lid-box count). Its own name because
   .r-tin MEANS the tin line and lives inside the excluded-money guard. */
.r-tin, .r-note{ font-size:13px; color:var(--muted); padding-top:4px; }
.r-empty{ text-align:center; color:var(--muted); font-size:15px; padding:8px 0 12px; }
.r-closed{ text-align:center; font-family:var(--display); font-weight:800; font-size:22px; color:var(--alert); padding:10px 0 14px; letter-spacing:.06em; }
.r-tear{
  height:11px;
  background:
    linear-gradient(45deg, var(--paper) 8px, transparent 0),
    linear-gradient(-45deg, var(--paper) 8px, transparent 0);
  background-size:16px 16px; background-repeat:repeat-x;
}
@keyframes tearoff{
  0%{ transform:none; opacity:1; }
  30%{ transform:translateY(4px) rotate(.6deg); }
  100%{ transform:translateY(34px) rotate(2.5deg); opacity:0; }
}
.receipt-wrap.tearing{ animation:tearoff .45s ease-in forwards; }
@media (prefers-reduced-motion: reduce){ .receipt-wrap.tearing{ animation:none; } }

/* Expenses list */
.gx-group{ margin-bottom:16px; }
.gx-group-head{ display:flex; justify-content:space-between; align-items:baseline; padding:0 4px 6px; }
.gx-group-head .d{ font-family:var(--display); font-weight:700; font-size:16px; }
.gx-group-head .t{ font-family:var(--display); font-weight:700; color:var(--deep); font-variant-numeric:tabular-nums; }
.gx-item{
  display:flex; align-items:center; gap:10px;
  background:var(--paper); border:1px solid var(--line); border-radius:14px;
  padding:10px 6px 10px 14px; margin-bottom:8px;
}
.gx-cat{

<script>
'use strict';
/* ============================================================
   Constants, storage, and shared state
   localStorage keys: state_v1 (bootstrap mirror), queue_v1
   (mutation queue), config_v1 (API url/token/sheet link).
   ============================================================ */
const APP_VERSION = '2.7.4';

const store = {
  read(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  // Returns whether the write actually landed. The app keeps running either
  // way, but a FAILED write is not something to swallow: the queue is unsent
  // work, so persistQueue() makes room and then says so out loud.
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

// Parse a stored key. Anything unreadable (missing, truncated, not JSON)
// comes back as null so the caller falls back to defaults.
function readStored(k){
  const raw = store.read(k);
  if (raw == null || raw === '') return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
function isObj(v){ return !!v && typeof v === 'object' && !Array.isArray(v); }
function asArr(v){ return Array.isArray(v) ? v : []; }
function asObj(v){ return isObj(v) ? v : {}; }
function txt(v){ return (v == null || typeof v === 'object') ? '' : String(v); }
// A number that may legitimately be BLANK, kept blank. Used for the columns
// where "nothing here" and "zero" mean different things: a day's salary (blank =
// the standard rate, 0 = a day off) and a stock reorder point (blank = no
// warning at all, 0 = also no warning, but typed on purpose).
function rawNum(v){
  return (v == null || v === '' || typeof v === 'object') ? '' : num(v);
}

// The stock picklist is seeded here with the SAME names AND UNITS Code.gs seeds
// into the StockItems tab, so demo mode (and a phone whose sheet has not been
// migrated yet) can record stock on day one. The unit is the thing you OPEN, not
// a weight — that is what makes usage countable in whole units like the boxes.
// The server auto-creates and seeds the tab on the first save, so a seeded name
// is never rejected as "unknown product".
// (The old SupplyItems picklist is GONE with the retired daily-supplies card:
// purchases live in Expenses, which is now the only place they can live.)
const SEED_STOCK_ITEMS = [['Takoyaki Flour','pack'],['Takoyaki Sauce','gallon'],['Japanese Mayo','pack'],
  ['Bonito','pack'],['Aonori','pack'],['Togarashi','pack']];

// Fallbacks that match Code.gs, used when the Settings row is missing or blank —
// a blank daily_salary must never quietly make a day of work cost ₱0.
const DEFAULT_DAILY_SALARY = 200;
const DEFAULT_SPLIT = 3000;

function freshState(){
  return {
    settings:{ branch:'Tañong', mama_per_cutoff:500, electric_per_cutoff:500,
      partners:'Nayt, Partner', staff:'Mama',
      daily_salary:DEFAULT_DAILY_SALARY, split_default:DEFAULT_SPLIT,
      // The expense form's one-tap buckets between Octopus and Other (v2.7.1,
      // the owner's list), seeded with the SAME value seedSettings writes into
      // the sheet — so demo mode (and a sheet not migrated yet) offers the
      // chips from day one. Money buckets, not the stock list: quantities
      // enter under Stock on hand, this is what the peso was for.
      supply_picklist: 'Veggies, Eggs, Flour, Box' },
    // EXACTLY the skus setupSheet() seeds into the Prices tab, and nothing else.
    // A seeded sku the sheet does not have is not harmless: Maintenance sends
    // every sku in this list, and the server refuses a price row it has no group
    // and size for — so ONE phantom row made the whole batch refusable and no
    // price could be changed before the first bootstrap. (Owner sells takoyaki
    // and nori. A new product is a sheet job: add the Prices row, then sync.)
    //
    // `in_cutoff` FALSE means "sell it, count it, but keep its money out of every
    // cutoff figure" — nori is the owner's own line of business and he settles
    // that money himself. A row with NO in_cutoff at all counts IN (see
    // inCutoffFlag): that is what a pre-v2.4.0 sheet, and every blank cell in it,
    // has to mean.
    prices:[
      { sku:'box4',   label:'Box 4',  group:'box', size:4,  price:50,  cheese_price:60,  active:true, in_cutoff:true },
      { sku:'box6',   label:'Box 6',  group:'box', size:6,  price:65,  cheese_price:80,  active:true, in_cutoff:true },
      { sku:'box10',  label:'Box 10', group:'box', size:10, price:105, cheese_price:125, active:true, in_cutoff:true },
      { sku:'nori',   label:'Nori',   group:'simple', size:'', price:25, cheese_price:'', active:true, in_cutoff:false }
    ],
    stockItems:  SEED_STOCK_ITEMS.map((p, i) => ({
      product:p[0], unit:p[1], active:true, sort:i+1,
      // The one-time starting baseline and the low-stock threshold. Seeded the
      // same way the sheet seeds them: nothing on hand, no baseline date (which
      // means "count the whole history"), no warning until a point is set.
      opening_qty:0, opening_date:'', reorder_at:'',
      baseline_qty:0, baseline_date:'', delivered_since:0, used_since:0,
      delivered_before:0, used_before:0
    })),
    backlogs:[],
    // Row maps are PROTOTYPE-FREE (Object.create(null)): they are keyed by sheet
    // data — an entry_id, a sku, a product name — and on a plain object a key
    // spelled "__proto__" would silently rewrite the map's prototype instead of
    // storing the row. A null prototype makes every key an ordinary key.
    days: Object.create(null),          // date -> DailyLog row
    counts: Object.create(null),        // date -> [DailyCounts rows]
    stockUsage: Object.create(null),    // date -> [StockUsage rows]   (whole units opened — NEVER money)
    stockCounts: Object.create(null),   // date -> [StockCounts rows]  (stocktakes; each becomes a baseline)
    stockDeliveries: Object.create(null), // date -> [StockDeliveries rows] (whole units ARRIVED — NEVER money; v2.6.0)
    cutoffInputs: Object.create(null),  // "start_end" -> CutoffInputs row (the ENTERED split)
    expenses: Object.create(null),      // entry_id -> Expenses row
    // The first date the last bootstrap snapshot covered ('' before the first
    // sync). Kept so the Cutoff screen can say plainly when a period reaches
    // further back than this phone can see.
    window_start: ''
  };
}

function freshConfig(){ return { apiUrl:'', token:'', sheetUrl:'' }; }

/* ------------------------------------------------------------
   Loading saved data safely.
   A stored blob may be partial (a version upgrade that changed the
   shape, a truncated write) or plain corrupt. Never trust it as the
   whole state: merge whatever survives over a COMPLETE default, coerce
   every field to the type the app expects, and drop what is malformed.
   The app must always boot into a usable screen.

   KEY CASING AT THE API SEAM. What we SEND is camelCase (cheeseQty, gcashQty,
   gcashCheeseQty, customAmount, customGcash, gcashConverted, lidBoxes,
   customBoxes, entryId, backlogRef — the documented request shape); what we
   STORE and what the server SENDS BACK is snake_case (cheese_price,
   cheese_qty, gcash_qty, gcash_cheese_qty, gcash_amount, custom_amount,
   custom_gcash, gcash_converted, lid_boxes, custom_qty, entry_id,
   backlog_ref, total_amount, supplies_total, …).
   Every normalizer below reads the snake_case key first and falls back to the
   camelCase spelling, so a phone on new code talking to an older still-
   deployed Apps Script cannot silently read a price or a balance as 0.
   ------------------------------------------------------------ */
// Prefer the snake_case key; fall back to the legacy camelCase one when the
// snake_case value is absent or blank. A real 0 or false still wins.
function pick(o, snake, camel){
  const v = o[snake];
  return (v === undefined || v === null || v === '') ? o[camel] : v;
}

/**
 * The `in_cutoff` flag, and the ONE reader in this file whose BLANK means TRUE.
 *
 * THIS IS NOT truthy() AND MUST NEVER BE REPLACED BY IT. truthy('') is false; a
 * blank in_cutoff has to be TRUE, because:
 *   - the sheet migration APPENDS the column, so every price row already on the
 *     owner's live sheet has an EMPTY cell in it,
 *   - a sheet not migrated yet has no such column at all (the row arrives with
 *     no key), and
 *   - a state_v1 written by an older build of this app has no key either.
 * If any of those read FALSE, box4/box6/box10 would silently drop out of the
 * cutoff: the day's total, the preview and the note would all collapse to almost
 * nothing while every figure still looked like a perfectly good number.
 *
 * So the default is IN, and only an explicitly false-y value takes a sku out. An
 * unrecognised value counts IN too: the flag's job is to remove ONE sku the owner
 * set up on purpose, never to quietly remove money nobody asked it to.
 * Mirrors asCutoffFlag() in Code.gs exactly.
 */
function inCutoffFlag(v){
  if (v === true) return true;
  if (v === false) return false;
  const s = txt(v).trim().toLowerCase();
  if (s === '') return true;                 // blank / missing key => counts IN
  return !(s === 'false' || s === '0' || s === 'no' || s === 'n' || s === 'off');
}

/**
 * The `in_cutoff` SNAPSHOT on one COUNT row, kept exactly as it arrived: `true`,
 * `false`, or `''` for "this row has no snapshot".
 *
 * It is NOT resolved here, and that is the whole point. A count row's flag is a
 * fact about the night it was saved (v2.4.1), so an explicit value must survive
 * untouched — while a BLANK has to stay blank until something can answer it, which
 * is `countInCutoff()` reading the sku's current flag at USE time. Resolving a
 * blank in here would mean reading `state.prices` from inside a normalizer, which
 * also runs while `state` is still being built — the same reason a day's `salary`
 * is stored raw and resolved by `daySalary()`.
 */
function rawCutoffFlag(v){
  return (v == null || v === '' || typeof v === 'object') ? '' : inCutoffFlag(v);
}

function normPrice(p){
  if (!isObj(p) || !txt(p.sku)) return null;
  const cheese = pick(p, 'cheese_price', 'cheesePrice');
  return {
    sku: txt(p.sku),
    label: txt(p.label) || txt(p.sku),
    group: p.group === 'box' ? 'box' : 'simple',
    size: (p.size == null || typeof p.size === 'object') ? '' : p.size,
    price: num(p.price),
    cheese_price: (cheese === '' || cheese == null) ? '' : num(cheese),
    active: truthy(p.active),
    // FALSE = sold and counted as usual, but its money stays OUT of every cutoff
    // figure. Read with inCutoffFlag, NOT truthy: a blank or missing value is
    // TRUE. `pick` hands a real `false` straight through, so an excluded sku
    // survives even from a legacy camelCase server.
    in_cutoff: inCutoffFlag(pick(p, 'in_cutoff', 'inCutoff'))
  };
}
function normBacklog(b){
  if (!isObj(b) || !txt(b.name)) return null;
  const o = {
    name: txt(b.name), description: txt(b.description),
    total_amount: num(pick(b, 'total_amount', 'totalAmount')),
    start_date: txt(pick(b, 'start_date', 'startDate')),
    active: truthy(b.active)
  };
  // Only carry a server-supplied balance when there really is one —
  // backlogBalance() falls back to computing it from expenses otherwise.
  if (b.balance != null && b.balance !== '' && typeof b.balance !== 'object') o.balance = num(b.balance);
  if (b.paid != null && b.paid !== '' && typeof b.paid !== 'object') o.paid = num(b.paid);
  return o;
}
function normDay(r, key){
  if (!isObj(r)) return null;
  const date = isDateStr(r.date) ? txt(r.date) : (isDateStr(key) ? txt(key) : '');
  if (!date) return null;
  return {
    date, closed: truthy(r.closed), staff: txt(r.staff),
    // That day's WAGE, snapshotted when the day was saved. Kept exactly as it
    // arrived — a blank (a row written before salary was stored, or a server too
    // old to send it) stays blank and is resolved by daySalary() at read time.
    // Resolving it here would mean reading state.settings from inside a
    // normalizer, which also runs while `state` is still being built.
    salary: rawNum(r.salary),
    // `gcash` is COMPUTED (server-side on save, locally by computeDay) — it is
    // still stored and still read, it is just no longer typed in by anyone.
    gcash: num(r.gcash), total: num(r.total), cash: num(r.cash),
    custom_amount: num(pick(r, 'custom_amount', 'customAmount')),
    // A pre-v2.1.0 sheet has no custom_gcash column, so it reads 0 — which is
    // exactly right for those days: nothing of the custom order was GCash.
    custom_gcash: num(pick(r, 'custom_gcash', 'customGcash')),
    // That day's money from in_cutoff=FALSE skus. It sits BESIDE the day's money
    // and is NEVER inside total / cash / gcash — the receipt prints it below them,
    // because the cash tin holds Cash PLUS this. A pre-v2.4.0 row has no column at
    // all and reads 0, which is exactly right: there was no excluded sku to sell.
    excluded_total: num(pick(r, 'excluded_total', 'excludedTotal')),
    // Tin cash swapped for a GCash transfer during the day (v2.7.0). Already
    // INSIDE `gcash` and out of `cash` — this is the snapshot that lets the
    // receipt say so. A pre-v2.7.0 row has no column and reads 0: nothing was
    // converted, which is exactly right for those days.
    gcash_converted: num(pick(r, 'gcash_converted', 'gcashConverted')),
    // Lid boxes used (v2.7.0): a plain count with NO price, NO money, NO stock
    // tracking. Blank/absent reads 0 for the same reason.
    lid_boxes: num(pick(r, 'lid_boxes', 'lidBoxes')),
    notes: txt(r.notes),
    entry_id: txt(pick(r, 'entry_id', 'entryId')),
    updated_at: txt(pick(r, 'updated_at', 'updatedAt'))
  };
}
function normCount(c, key){
  if (!isObj(c) || !txt(c.sku)) return null;
  const date = isDateStr(c.date) ? txt(c.date) : (isDateStr(key) ? txt(key) : '');
  if (!date) return null;
  return {
    date, sku: txt(c.sku), sod: num(c.sod), eod: num(c.eod), sold: num(c.sold),
    // Four mutually exclusive buckets that sum to `sold`. Three are entered;
    // regular_qty is the derived plain-cash remainder. Pre-v2.1.0 rows have no
    // GCash columns, so they read 0 — i.e. "that day was all cash".
    cheese_qty: num(pick(c, 'cheese_qty', 'cheeseQty')),
    gcash_qty: num(pick(c, 'gcash_qty', 'gcashQty')),
    gcash_cheese_qty: num(pick(c, 'gcash_cheese_qty', 'gcashCheeseQty')),
    regular_qty: num(pick(c, 'regular_qty', 'regularQty')),
    amount: num(c.amount),
    gcash_amount: num(pick(c, 'gcash_amount', 'gcashAmount')),
    // The per-unit PRICES this row's money was computed from (v2.5.0) — the rest
    // of the snapshot, beside the amounts it explains. Kept RAW: a blank means
    // the row was written before the columns existed, and it is answered by the
    // sku's CURRENT price at use time (storedPricesFor), exactly as the server
    // resolves it. Coercing a blank to 0 here would re-price an old night at
    // nothing the moment it was reopened.
    price: rawNum(c.price),
    cheese_price: rawNum(pick(c, 'cheese_price', 'cheesePrice')),
    // How many of `sold` a special order physically used (v2.7.0). Part of the
    // same snapshot: this row's `amount` prices sold − custom_qty units, and the
    // row alone must be able to say so. Blank/absent reads 0 — no special order
    // drew from this line, so all of `sold` was priced, exactly as it was.
    custom_qty: num(pick(c, 'custom_qty', 'customQty')),
    entry_id: txt(pick(c, 'entry_id', 'entryId')),
    // Whether THIS row's money counted, as decided the night it was saved
    // (v2.4.1). Kept raw — '' when the row predates the column — because a blank
    // is answered by the sku's current flag at read time (countInCutoff), and
    // because only a snapshot can stop a later tick of "counts in the cutoff"
    // restating a fortnight that has already been sent.
    in_cutoff: rawCutoffFlag(pick(c, 'in_cutoff', 'inCutoff'))
  };
}
// StockItems — the stock picklist AND the ledger settings behind each product.
// `sort` fixes the order the phone shows them in, so it matches the sheet.
//
// `on_hand` and `low` are DELIBERATELY NOT kept: on hand is computed, never
// stored (the same rule as a backlog balance). What is kept is everything the
// arithmetic needs — the baseline, and the totals the server counted over the
// WHOLE history, which is more history than this phone holds.
function normStockItem(s){
  if (!isObj(s) || !txt(s.product)) return null;
  const openQty = num(pick(s, 'opening_qty', 'openingQty'));
  // NOT defaulted to today. A blank date means "count the whole history"
  // ('' < any yyyy-MM-dd), exactly as on the server. Coercing it to today would
  // silently drop every delivery already logged.
  const openDate = txt(pick(s, 'opening_date', 'openingDate'));
  const bq = pick(s, 'baseline_qty', 'baselineQty');
  return {
    product: txt(s.product), unit: txt(s.unit),
    active: truthy(s.active), sort: num(s.sort),
    opening_qty: openQty,
    opening_date: openDate,
    // Blank = no warning at all. Kept blank so the Maintenance field can show
    // "not set" instead of a 0 the owner never typed.
    reorder_at: rawNum(pick(s, 'reorder_at', 'reorderAt')),
    // The baseline the server measured from. A server too old to send it (or a
    // seeded row) falls back to the opening figure, which is what the baseline
    // IS until the first stocktake.
    baseline_qty: (bq == null || bq === '') ? openQty : num(bq),
    baseline_date: txt(pick(s, 'baseline_date', 'baselineDate')) || openDate,
    delivered_since: num(pick(s, 'delivered_since', 'deliveredSince')),
    used_since: num(pick(s, 'used_since', 'usedSince')),
    // The pre-window parts of those totals (v2.5.1): what the server counted
    // for dates BEFORE window_start. The ledger adds the phone's own in-window
    // rows on top of these. A server too old to send them ships 0, which reads
    // as "nothing beyond my own rows" — the honest floor, never a top-up.
    delivered_before: num(pick(s, 'delivered_before', 'deliveredBefore')),
    used_before: num(pick(s, 'used_before', 'usedBefore'))
  };
}
// StockCounts — a physical stocktake. It BECOMES that product's baseline, which
// is what stops spoilage, breakage and miscounts skewing on hand forever.
function normStockCount(s, key){
  if (!isObj(s) || !txt(s.product)) return null;
  const date = isDateStr(s.date) ? txt(s.date) : (isDateStr(key) ? txt(key) : '');
  if (!date) return null;
  return {
    date, product: txt(s.product),
    counted_qty: num(pick(s, 'counted_qty', 'countedQty')),
    entry_id: txt(pick(s, 'entry_id', 'entryId')),
    updated_at: txt(pick(s, 'updated_at', 'updatedAt'))
  };
}
// CutoffInputs — the ENTERED split for one period. Period-keyed, not date-keyed,
// so the phone can pre-fill and preview it offline.
function normCutoffInput(r){
  if (!isObj(r) || !isDateStr(r.start) || !isDateStr(r.end)) return null;
  return {
    start: txt(r.start), end: txt(r.end),
    split_amount: num(pick(r, 'split_amount', 'splitAmount')),
    entry_id: txt(pick(r, 'entry_id', 'entryId')),
    updated_at: txt(pick(r, 'updated_at', 'updatedAt'))
  };
}
// StockUsage — WHOLE UNITS OPENED per product per day. NEVER money: it never
// reaches the note or any total.
function normStockUse(s, key){
  if (!isObj(s) || !txt(s.product)) return null;
  const date = isDateStr(s.date) ? txt(s.date) : (isDateStr(key) ? txt(key) : '');
  if (!date) return null;
  return {
    date, product: txt(s.product), qty: num(s.qty),
    entry_id: txt(pick(s, 'entry_id', 'entryId')),
    updated_at: txt(pick(s, 'updated_at', 'updatedAt'))
  };
}
// StockDeliveries — WHOLE UNITS ARRIVED per product per day (v2.6.0). NEVER
// money: suppliers deliver on credit, so goods arriving and money leaving are
// two different events — this is the arriving half, and paying the supplier
// later is an ordinary Supplies expense with no stock attached.
function normStockDelivery(s, key){
  if (!isObj(s) || !txt(s.product)) return null;
  const date = isDateStr(s.date) ? txt(s.date) : (isDateStr(key) ? txt(key) : '');
  if (!date) return null;
  return {
    date, product: txt(s.product), qty: num(s.qty),
    entry_id: txt(pick(s, 'entry_id', 'entryId')),
    updated_at: txt(pick(s, 'updated_at', 'updatedAt'))
  };
}
// The six stored expense categories. Anything else (a typo in the sheet, a
// prototype name like "toString") folds into Other — same as the server —
// so no amount can ever fall outside the cutoff maths.
const EXPENSE_CATS = ['Supplies','Octopus','Electric','Mama','Backlog','Other'];
function normCategory(v){ const c = txt(v).trim(); return EXPENSE_CATS.indexOf(c) >= 0 ? c : 'Other'; }

// The ONLY Settings keys the Maintenance screen may write, and how to read each
// one. Mirrors SETTABLE_SETTINGS in Code.gs exactly. `token` is deliberately
// absent and must stay absent: it is never shown, never sent, never editable
// here — an API that can rewrite its own shared secret can lock the owner out of
// his own sheet from a phone.
const SETTABLE_SETTINGS = {
  branch:'text', staff:'text', supply_picklist:'text',
  daily_salary:'money', split_default:'money',
  mama_per_cutoff:'money', electric_per_cutoff:'money'
};

function normExpense(e, key){
  if (!isObj(e)) return null;
  const id = txt(pick(e, 'entry_id', 'entryId')) || txt(key);
  if (!id || !isDateStr(e.date)) return null;
  return {
    date: txt(e.date), category: normCategory(e.category), item: txt(e.item),
    amount: num(e.amount), backlog_ref: txt(pick(e, 'backlog_ref', 'backlogRef')),
    notes: txt(e.notes),
    entry_id: id, updated_at: txt(pick(e, 'updated_at', 'updatedAt')),
    // A DELIVERY names what arrived and how much of it, on the same row as the
    // money that paid for it. Blank on most rows — most expenses are not tracked
    // stock. `amount` is the money and is counted exactly once, as always;
    // stock_qty feeds only the stock ledger.
    stock_product: txt(pick(e, 'stock_product', 'stockProduct')),
    stock_qty: num(pick(e, 'stock_qty', 'stockQty'))
  };
}

// date/id -> row maps. Accepts the map shape the app writes today and a
// plain array (an older/newer shape), so an upgrade can't blank the app.
// PROTOTYPE-FREE: the keys are sheet data (an entry_id, a date), and on a plain
// object a key spelled "__proto__" would rewrite the map's prototype.
function toRowMap(v, norm, keyOf){
  const out = Object.create(null);
  if (Array.isArray(v)){
    for (const r of v){ const n = norm(r, ''); if (n) out[keyOf(n)] = n; }
  } else if (isObj(v)){
    for (const k in v){ const n = norm(v[k], k); if (n) out[keyOf(n)] = n; }
  }
  return out;
}
// date -> [rows] maps for the three date-keyed detail collections (counts,
// daily supplies, stock usage). Accepts the map shape the app stores AND the
// flat array the API returns, so both go through the same normalizer.
function toDateListMap(v, norm){
  const out = Object.create(null);
  const add = (row, key) => { const n = norm(row, key); if (n) (out[n.date] = out[n.date] || []).push(n); };
  if (Array.isArray(v)){ for (const r of v) add(r, ''); }
  else if (isObj(v)){
    for (const k in v){
      const list = v[k];
      if (Array.isArray(list)) for (const r of list) add(r, k);
      else if (isObj(list)) add(list, k);
    }
  }
  return out;
}
function toCountsMap(v){ return toDateListMap(v, normCount); }

// Settings are flat key/value pairs from the sheet. Anything object- or
// array-valued would render as "[object Object]" (or silently break
// staffList()), so it is dropped and the default kept. Used for BOTH the
// stored copy and the bootstrap reply so the two paths always agree.
function mergeSettings(target, raw){
  if (!isObj(raw)) return target;
  for (const k in raw){
    if (!Object.prototype.hasOwnProperty.call(raw, k) || k === '__proto__') continue;
    const v = raw[k];
    if (v != null && typeof v !== 'object') target[k] = v;
  }
  return target;
}

function sanitizeState(raw){
  const s = freshState();
  if (!isObj(raw)) return s;                       // null / string / array / corrupt -> defaults
  mergeSettings(s.settings, raw.settings);
  const prices = asArr(raw.prices).map(normPrice).filter(Boolean);
  if (prices.length) s.prices = prices;            // no usable prices -> keep the seed list
  // Same rule for the stock picklist: an empty or unusable list keeps the seeds
  // so the stock card is never blank.
  const stockItems = asArr(raw.stockItems).map(normStockItem).filter(Boolean);
  if (stockItems.length) s.stockItems = stockItems;
  s.backlogs = asArr(raw.backlogs).map(normBacklog).filter(Boolean);
  s.days     = toRowMap(raw.days, normDay, r => r.date);
  s.counts   = toCountsMap(raw.counts);
  s.stockUsage    = toDateListMap(raw.stockUsage, normStockUse);
  s.stockCounts   = toDateListMap(raw.stockCounts, normStockCount);
  s.stockDeliveries = toDateListMap(raw.stockDeliveries, normStockDelivery);
  s.cutoffInputs  = toRowMap(raw.cutoffInputs, normCutoffInput, r => periodKey(r));
  s.expenses = toRowMap(raw.expenses, normExpense, r => r.entry_id);
  s.window_start = isDateStr(raw.window_start) ? txt(raw.window_start) : '';
  return s;
}

function sanitizeConfig(raw){
  const c = freshConfig();
  if (!isObj(raw)) return c;
  c.apiUrl  = txt(raw.apiUrl).trim();
  c.token   = txt(raw.token).trim();
  c.sheetUrl = txt(raw.sheetUrl).trim();
  return c;
}

// Queued mutations are the user's unsaved work — keep every well-formed
// entry, in order, payload untouched. Only drop entries the sync engine
// could not send at all (unknown action, missing payload or key).
// Every queued action, and the payload key that identifies it. The key is what
// coalescing, the needs-attention list and "which day is this?" all read, so a
// new action MUST be listed here — sanitizeQueue drops what it does not know,
// and an unlisted action would be thrown away on the next app start.
// The maintenance writers carry an entryId purely for this bookkeeping; the
// server ignores it (they upsert by their own natural keys).
// Actions whose payload is a COMPLETE snapshot of one form, so a second save
// replaces the first outright instead of queueing behind it (last write wins).
// Declared here because attnTarget() below needs it.
// Both lookup tables are PROTOTYPE-FREE: they are indexed with strings read out
// of storage (an action name) and a plain literal would answer truthily for
// "__proto__" or "toString", letting a corrupt queue entry take a wrong branch.
const SNAPSHOT_ACTIONS = Object.assign(Object.create(null),
  { savePrices:true, saveSettings:true, saveStockItems:true });
const QUEUE_KEY_FOR = Object.assign(Object.create(null), {
  saveDay:'date', saveExpense:'entryId', deleteExpense:'entryId',
  saveStockCount:'entryId', saveStockDelivery:'entryId', saveCutoffSplit:'entryId',
  savePrices:'entryId', saveSettings:'entryId', saveStockItems:'entryId'
});
function sanitizeQueue(raw){
  const out = [];
  for (const item of asArr(raw)){
    if (!isObj(item)) continue;
    const need = QUEUE_KEY_FOR[item.action];
    if (!need) continue;
    if (!isObj(item.payload) || !item.payload[need]) continue;
    out.push({ action: item.action, payload: item.payload, tries: num(item.tries) });
  }
  return out;
}

/* ------------------------------------------------------------
   NEEDS ATTENTION (attention_v1) — things that did NOT reach the sheet.
   A server REJECTION is not "done": the optimistic day survives on this
   phone, so the mutation leaves the queue (it would jam it) and lands here
   instead. While this list has anything in it the status pill is never green,
   and both the Sales screen and More name the DATE, quote the server's own
   words, and offer a way to put it right.
     rejected — the server refused it; that day/expense is missing from the sheet
     gcash    — a day queued before v2.1: its typed GCash total is ignored by the
                server (correct), so the cash/GCash split needs re-entering
     dropped  — the server dropped counts for a sku that has left Prices
   ------------------------------------------------------------ */
const ATTN_KINDS = Object.assign(Object.create(null), { rejected:true, gcash:true, dropped:true });
function attnTarget(action, payload){
  // A config form coalesces by ACTION — one form, one pending batch — so its
  // identity is the action itself. Keying it on entryId (a fresh uuid every
  // save) meant a later save could never match an earlier refusal, so that
  // red card could never be cleared and sat there forever.
  if (SNAPSHOT_ACTIONS[action]) return action;
  const need = QUEUE_KEY_FOR[action];
  return need ? txt(asObj(payload)[need]) : '';
}
function attnKey(a){ return a.kind + '|' + a.action + '|' + attnTarget(a.action, a.payload); }
function sanitizeAttention(raw){
  const out = [], seen = Object.create(null);
  for (const item of asArr(raw)){
    if (!isObj(item) || !ATTN_KINDS[item.kind] || !QUEUE_KEY_FOR[item.action]) continue;
    if (!isObj(item.payload) || !attnTarget(item.action, item.payload)) continue;
    const a = {
      kind: item.kind, action: item.action, payload: item.payload,
      date: isDateStr(item.date) ? txt(item.date) : (isDateStr(item.payload.date) ? txt(item.payload.date) : ''),
      message: txt(item.message), at: txt(item.at)
    };
    const k = attnKey(a);
    if (seen[k]) continue;
    seen[k] = true;
    out.push(a);
  }
  return out;
}

/* ------------------------------------------------------------
   PER-DATE DRAFTS (drafts_v1) — a half-entered day, kept per date so that
   changing the date (or backgrounding the app) cannot throw away typed work.
   Cleared for a date as soon as that date is saved.
   ------------------------------------------------------------ */
// Field values are kept as typed ('' means "nothing entered"), so a number and
// a numeric string are both fine here; everything reads them through num().
function raw1(v){ return (v == null || typeof v === 'object') ? '' : v; }
function sanitizeDrafts(rawv){
  const out = {};
  if (!isObj(rawv)) return out;
  for (const k in rawv){
    if (!isDateStr(k)) continue;
    const d = rawv[k];
    if (!isObj(d)) continue;
    out[k] = {
      date: k, closed: !!d.closed, staff: txt(d.staff),
      custom: raw1(d.custom), customGcash: raw1(d.customGcash),
      // The v2.7.0 fields. A draft written by an older build has none of them,
      // so they read '' — which every reader treats as the harmless 0. The
      // conversion DIRECTION (v2.7.3) only survives as one of its two values.
      gcashConverted: raw1(d.gcashConverted), lidBoxes: raw1(d.lidBoxes),
      convDir: d.convDir === 'in' ? 'in' : 'out',
      salary: raw1(d.salary), notes: txt(d.notes),
      rows: asArr(d.rows).filter(isObj).filter(r => txt(r.sku)).map(r => ({
        sku: txt(r.sku), sod: raw1(r.sod), eod: raw1(r.eod),
        cheese: raw1(r.cheese), gcash: raw1(r.gcash), gcashCheese: raw1(r.gcashCheese),
        // Boxes the special order used from this sku (v2.7.0); '' on old drafts.
        custom: raw1(r.custom)
      })),
      // A draft written by the old build also carries a `supplies` array. It is
      // dropped here on purpose: that card is retired, and reviving those figures
      // would put a purchase in two places.
      stock: asArr(d.stock).filter(isObj).filter(s => txt(s.product))
        .map(s => ({ product: txt(s.product), unit: txt(s.unit), qty: raw1(s.qty) }))
    };
  }
  return out;
}

// Last line of defence: whatever happens later (a junk bootstrap reply,
// a hand-edited localStorage), every container the renderers walk exists.
function ensureShape(){
  if (!isObj(state)) state = freshState();
  if (!isObj(state.settings)) state.settings = freshState().settings;
  if (!Array.isArray(state.prices) || !state.prices.length) state.prices = freshState().prices;
  if (!Array.isArray(state.stockItems) || !state.stockItems.length) state.stockItems = freshState().stockItems;
  if (!Array.isArray(state.backlogs)) state.backlogs = [];
  if (!isObj(state.days)) state.days = Object.create(null);
  if (!isObj(state.counts)) state.counts = Object.create(null);
  if (!isObj(state.stockUsage)) state.stockUsage = Object.create(null);
  if (!isObj(state.stockCounts)) state.stockCounts = Object.create(null);
  if (!isObj(state.stockDeliveries)) state.stockDeliveries = Object.create(null);
  if (!isObj(state.cutoffInputs)) state.cutoffInputs = Object.create(null);
  if (!isObj(state.expenses)) state.expenses = Object.create(null);
  if (!isDateStr(state.window_start)) state.window_start = '';
  if (!Array.isArray(queue)) queue = [];
  if (!isObj(config)) config = freshConfig();
  if (!Array.isArray(attention)) attention = [];
  if (!isObj(drafts)) drafts = {};
}

let state     = sanitizeState(readStored('state_v1'));
let queue     = sanitizeQueue(readStored('queue_v1'));
let config    = sanitizeConfig(readStored('config_v1'));
let attention = sanitizeAttention(readStored('attention_v1'));
let drafts    = sanitizeDrafts(readStored('drafts_v1'));

/* ------------------------------------------------------------
   RETENTION. state_v1 grows every day (a DailyLog row, its counts, its
   supplies and its stock usage) against a ~5 MB origin quota, so it is bounded
   here: roughly the last 120 days of history — eight cutoff periods — which is
   far more than the app ever shows. Anything still queued, still on the
   needs-attention list, still a draft or currently on screen is NEVER pruned,
   whatever its date. The sheet remains the full archive.
   ------------------------------------------------------------ */
const RETAIN_DAYS = 120;
function daysAgoStr(n){
  return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Manila' })
    .format(new Date(Date.now() - Math.max(0, num(n)) * 86400000));
}
// Dates that must survive pruning no matter how old they are.
function protectedDates(){
  const keep = Object.create(null);
  for (const q of asArr(queue)){
    const d = txt(asObj(q.payload).date);
    if (isDateStr(d)) keep[d] = true;
  }
  for (const a of asArr(attention)) if (isDateStr(a.date)) keep[a.date] = true;
  if (isObj(benta) && isDateStr(benta.date)) keep[benta.date] = true;
  keep[todayStr()] = true;
  return keep;
}
// Expenses are deliberately NOT pruned: a backlog balance is total_amount minus
// every Backlog payment ever made, and a delivery's quantity rides on the same
// row, so dropping old expense rows would silently inflate the balances AND
// deflate stock on hand. They are one small row each.
// StockCounts are not pruned either: the latest one per product is that product's
// baseline, and a baseline can be months old — pruning it would move on hand.
// Stock USAGE is pruned with the rest of the day's history, and stockStatusOf()
// is what keeps that honest: it carries whatever the server counted and this
// phone no longer holds, instead of quietly reading it as zero. Stock
// DELIVERIES get the same treatment for the same reason: only in-window rows
// are ever summed locally, and the server's delivered_before carries the rest.
function pruneState(keepDays){
  const min = daysAgoStr(num(keepDays) || RETAIN_DAYS);
  const keep = protectedDates();
  for (const map of [state.days, state.counts, state.stockUsage, state.stockDeliveries]){
    if (!isObj(map)) continue;
    for (const d in map){ if (!keep[d] && (!isDateStr(d) || d < min)) delete map[d]; }
  }
  for (const d in drafts){ if (!keep[d] && (!isDateStr(d) || d < min)) delete drafts[d]; }
}

// Set once a write really could not be made, so the screens can say so.
let storageFull = false;
function persistState(){
  pruneState();
  if (store.set('state_v1', state)) return true;
  pruneState(45);                                  // shed more history, try once more
  if (store.set('state_v1', state)) return true;
  storageFull = true;
  return false;
}
// Unsent work is the one thing that must never disappear quietly. If it cannot
// be written, make room by pruning old history and try again — and if it still
// cannot be written, SAY SO instead of pretending everything is fine.
function persistQueue(){
  if (store.set('queue_v1', queue)){
    if (storageFull){ storageFull = false; renderPanel(activeTab); }
    return true;
  }
  pruneState(45);
  store.set('state_v1', state);
  if (store.set('queue_v1', queue)){
    if (storageFull){ storageFull = false; renderPanel(activeTab); }
    return true;
  }
  storageFull = true;
  toast('This phone is out of storage. Work waiting to be sent may be lost if you close the app — sync as soon as you have signal.');
  renderPanel(activeTab);
  return false;
}
function persistConfig(){ store.set('config_v1', config); }
// The needs-attention list is the ONE copy of "this day is not in the sheet".
// A write that fails silently would let the red card vanish on the next app
// start while the money is still missing — so it gets the queue's treatment:
// make room by pruning old history, try again, and if it still cannot be
// written SAY SO instead of pretending everything is fine.
function persistAttention(){
  if (store.set('attention_v1', attention)) return true;
  pruneState(45);
  store.set('state_v1', state);
  if (store.set('attention_v1', attention)) return true;
  storageFull = true;
  toast('This phone is out of storage. A warning about work that is not in the sheet may be lost if you close the app.');
  renderPanel(activeTab);
  return false;
}
function persistDrafts(){ store.set('drafts_v1', drafts); }

/* ============================================================
   Utilities — dates (Asia/Manila), money, ids, escaping
   ============================================================ */
// Note text only — the generated cutoff note must always read in English.
const EN_MONTHS  = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// On-screen dates: English names (en-PH), Philippine time.
const DISP_WEEKDAY = new Intl.DateTimeFormat('en-PH', { timeZone:'Asia/Manila', weekday:'long' });
const DISP_MONTH   = new Intl.DateTimeFormat('en-PH', { timeZone:'Asia/Manila', month:'long' });

function todayStr(){ return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Manila' }).format(new Date()); }
function isDateStr(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s == null ? '' : s)); }
function d2parts(s){ const [y,m,d] = String(s == null ? '' : s).split('-').map(Number); return { y, m, d }; }
function partsToStr(y,m,d){ return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
function lastDayOf(y,m){ return new Date(y, m, 0).getDate(); }
// Noon UTC is 8pm in Manila on the same calendar day, so the weekday and
// month names always belong to the date the user actually picked.
function dateAt(s){ const p = d2parts(s); return new Date(Date.UTC(p.y, p.m-1, p.d, 12, 0, 0)); }
function weekdayName(s){ return isDateStr(s) ? DISP_WEEKDAY.format(dateAt(s)) : ''; }
function monthName(s){ return isDateStr(s) ? DISP_MONTH.format(dateAt(s)) : ''; }
function fmtLong(s){
  if (!isDateStr(s)) return String(s == null ? '' : s);
  const p = d2parts(s); return weekdayName(s) + ', ' + monthName(s) + ' ' + p.d + ', ' + p.y;
}
function fmtShort(s){
  if (!isDateStr(s)) return String(s == null ? '' : s);
  const p = d2parts(s); return monthName(s) + ' ' + p.d + ' (' + weekdayName(s) + ')';
}

function num(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g,''));
  return isFinite(n) ? n : 0;
}
// Money rounding, identical to the server's round2 — every peso figure the
// client computes goes through it so the two sides agree to the centavo.
function r2(n){ return Math.round(num(n) * 100) / 100; }
function fmt(n){
  n = r2(n);
  // Rounding can land on NEGATIVE ZERO (r2(-0.004) is -0), and toLocaleString
  // prints that as "-0" — a minus sign on a figure that is nothing. Normalize.
  if (n === 0) n = 0;
  const whole = Number.isInteger(n);
  return n.toLocaleString('en-PH', { minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: 2 });
}
// Sign goes BEFORE the peso sign: -₱1,520, never ₱-1,520.
function peso(n){
  const v = Math.round(num(n) * 100) / 100;
  return (v < 0 ? '-₱' : '₱') + fmt(Math.abs(v));
}
function noteVal(n){ n = num(n); return n === 0 ? '' : fmt(n); }
function uuid(){

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function truthy(v){ return v === true || v === 1 || v === 'TRUE' || v === 'true' || v === '1'; }
function activePrices(){ return asArr(state.prices).filter(p => isObj(p) && truthy(p.active)); }
/** Whether a sku's money COUNTS toward the cutoff. A sku this phone has no price
 *  row for counts IN — the same default a blank cell has, because the flag exists
 *  to remove one sku on purpose, never to drop money by accident. */
function skuInCutoff(sku){
  const pr = asArr(state.prices).find(p => isObj(p) && p.sku === txt(sku));
  return pr ? inCutoffFlag(pr.in_cutoff) : true;
}
/**
 * Whether ONE SAVED COUNT ROW's money counted — read off the row's own snapshot,
 * never off the Prices tab as it stands today. Mirrors countCutoffFlag() in
 * Code.gs, and it is the only thing history may be classified by.
 *
 * Classifying saved rows by the LIVE flag let one tick in Maintenance restate a
 * fortnight that had already been sent, in both directions: tick nori back ON and
 * the ₱300 that `total` never contained dropped out of the excluded block too, so
 * it existed nowhere on the screen; tick a counted sku OFF and money that IS
 * inside `total` also appeared under "not part of this cutoff", i.e. twice, in two
 * contradictory ways. The owner reconciles his tin against these figures.
 *
 * A BLANK snapshot means there is none — the row was written before v2.4.1, or by
 * a server whose sheet has no such column — so it falls back to the sku's current

 * price row for counts IN, the same default a blank Prices cell gets.
 */
function countInCutoff(row){
  const r = asObj(row);

  return inCutoffFlag(r.in_cutoff);
}
/** group=box for a sku still on the form (a deactivated sku keeps its group).
 *  A sku that is no longer in Prices at all counts as a box, so its cheese

 *  Lives here beside skuInCutoff: the form, the validator and the renderer all
 *  have to answer these two questions the same way. */
function isBoxSku(sku){
  const pr = asArr(state.prices).find(p => isObj(p) && p.sku === txt(sku));
  return pr ? pr.group === 'box' : true;
}
function activeStockItems(){ return asArr(state.stockItems).filter(s => isObj(s) && truthy(s.active)); }
function staffList(){ return txt(asObj(state.settings).staff || 'Mama').split(',').map(s => s.trim()).filter(Boolean); }
/** The expense form's one-tap item choices (v2.7.0): comma-separated names in
 *  Settings `supply_picklist`, split the same way `staff` is. Empty when the
 *  key is blank or missing — the form then behaves exactly as before. */
function supplyPicklist(){ return txt(asObj(state.settings).supply_picklist).split(',').map(s => s.trim()).filter(Boolean); }
/** The current daily wage and the default split, from Settings. A blank or
 *  unusable value falls back to the seeded figure — the same rule Code.gs
 *  applies, so the phone and the note can never disagree about the rate. */
function dailySalary(){
  const v = asObj(state.settings).daily_salary;

}
function splitDefault(){

/**
 * The price/cheese_price/in_cutoff snapshots already stored on ONE date's count
 * rows, keyed by sku — '' where a row has no snapshot (written before v2.5.0,
 * or v2.4.1 for the flag). Mirrors storedPricesFor() in Code.gs.
 *
 * This is what makes REOPENING a saved day show the money it was saved at: a
 * correction weeks after a price change fixes the count, it does not re-price
 * the night — and does not RE-CLASSIFY it either (v2.5.1): the flag rides in
 * the same map, so a Maintenance flip cannot move a saved day's money between
 * the cutoff and the excluded block. The rows this reads are the same ones the
 * server sends back (its own stored snapshot), so the phone and the sheet
 * resolve a date's prices and classification the same way.
 */
function storedPricesFor(date){
  const out = Object.create(null);
  for (const r of asArr(asObj(state.counts)[txt(date)])){
    const c = asObj(r);
    const sku = txt(c.sku);
    if (!sku || out[sku]) continue;
    out[sku] = {
      price: (c.price === '' || c.price == null) ? '' : num(c.price),
      cheese_price: (c.cheese_price === '' || c.cheese_price == null) ? '' : num(c.cheese_price),
      in_cutoff: rawCutoffFlag(c.in_cutoff)
    };
  }
  return out;
}
/** The prices ONE sku counts at on the day the map above was built for: the
 *  stored snapshot where there is one, else the sku's CURRENT price — the same
 *  fallback the server applies, and the only answer a legacy row can give. */
function priceOnDay(stored, pr){
  const p = asObj(pr);
  const s = asObj(stored)[txt(p.sku)];
  return {
    price: (s && s.price !== '') ? s.price : num(p.price),
    cheese_price: (s && s.cheese_price !== '') ? s.cheese_price : num(p.cheese_price)
  };
}
/** Whether ONE sku's money counts ON THE DAY the map above was built for: the
 *  row's own stored snapshot where there is one, else the sku's current flag —
 *  the same precedence apiSaveDay applies on a re-save (v2.5.1), so what the
 *  Sales screen shows for a LOADED day is what a re-save writes. A blank
 *  snapshot falls back to the live flag, exactly as countInCutoff reads it. */
function cutoffOnDay(stored, pr){
  const p = asObj(pr);
  const s = asObj(stored)[txt(p.sku)];
  if (s && s.in_cutoff !== '' && s.in_cutoff != null) return inCutoffFlag(s.in_cutoff);
  return inCutoffFlag(p.in_cutoff);
}

/* ============================================================
   Domain math — day computation (mirrors the server rules) and
   cutoff figures. Prices come from the local mirror; the server
   recomputes authoritatively at save time.
   ============================================================ */
// `p` is a REQUEST-shaped payload — the same camelCase object we POST as
// saveDay (counts[].cheeseQty, counts[].gcashQty, customAmount, customGcash).
// Prices read off state.prices are the stored snake_case shape (cheese_price).
// Both spellings appear on purpose.
//
// FOUR PAYMENT/VARIANT BUCKETS per sku — this must reproduce apiSaveDay()
// exactly, or the receipt shows one figure and the sheet stores another:
//   cheese_qty        cheese, paid cash    (entered)
//   gcash_qty         regular, paid GCash  (entered)
//   gcash_cheese_qty  cheese, paid GCash   (entered)
//   regular_qty       regular, paid cash   (DERIVED = the remainder)
//   amount       = (regular + gcash) * price + (cheese + gcashCheese) * cheese_price
//   gcash_amount = gcash * price + gcashCheese * cheese_price
// The server REJECTS buckets that add up to more than sold; here they are
// clamped instead, so a half-typed row still renders a sensible receipt while
// validateBenta() shows the same complaint inline and blocks the save.
//
// ONLY in_cutoff skus reach total/gcash (v2.4.0), exactly as apiSaveDay does it.
// An excluded sku (nori) is counted like anything else and its money is summed
// into `excluded`, which goes nowhere near total, cash or gcash — so it reaches no
// cutoff figure and no line of the note. The receipt prints it BELOW the totals.
function computeDay(p){
  const lines = [];
  let sum = 0, gsum = 0, xsum = 0;
  // The prices already stored on THIS DATE's rows (v2.5.0): a re-save is a
  // correction of that night's counts, never a re-pricing of them. Read BEFORE
  // applyLocalDay rewrites the date's rows, exactly as apiSaveDay reads the
  // sheet before it rewrites the block.
  const stored = storedPricesFor(asObj(p).date);
  // Boxes a special order physically used, per sku (v2.7.0). They come off the
  // counted stack but contribute NO menu-price money — the typed custom amount
  // is the order's entire value — so each sku's PRICED quantity below is
  // sold − custom qty. First entry per sku wins, like every other reader.
  const customBySku = Object.create(null);
  for (const cb of asArr(asObj(p).customBoxes)){
    const s = txt(asObj(cb).sku);
    if (s && customBySku[s] === undefined) customBySku[s] = num(asObj(cb).qty);
  }
  if (!p.closed){
    for (const c of asArr(p.counts)){
      const pr = asArr(state.prices).find(x => isObj(x) && x.sku === c.sku);
      if (!pr) continue;
      const sod = Math.max(0, num(c.sod));
      const eod = Math.max(0, num(c.eod));
      const sold = Math.max(0, sod - eod);
      const isBox = pr.group === 'box';
      // A LOADED day classifies by ITS OWN row's snapshot, exactly as it prices
      // by its own stored prices (v2.5.1) — so flipping "counts in the cutoff"
      // in Maintenance never moves a saved night's money between the total and
      // the excluded line on this screen. A fresh date has no snapshot and uses
      // the live flag, which is what will be snapshotted when it saves.
      const inCutoff = cutoffOnDay(stored, pr);
      const eff = priceOnDay(stored, pr);
      const price = num(eff.price), cheesePrice = num(eff.cheese_price);
      // An EXCLUDED sku has NO variant and NO payment split at all — not cheese,
      // not GCash, not GCash cheese — so ALL THREE buckets are 0 here, exactly as
      // apiSaveDay refuses all three (v2.4.1). Guarding gcashQty alone was not
      // enough: a cheese count on an excluded sku was priced at the CHEESE price
      // into `excluded`, so the receipt showed money the sheet would never store.
      // Its card has no bucket stepper of any kind, so a figure here can only come
      // from a stale draft or a hand-edited sheet row; bentaPayload sends the same
      // 0s, and validateBenta refuses a non-zero one in the server's own words
      // rather than letting the money change quietly.
      // (group=simple has no cheese version either, hence `isBox` too.)
      // Clamped IN SEQUENCE, not each against `sold` alone: three buckets each
      // clamped to sold could still add up to more than sold (cheese 2 + GCash 2
      // on 3 sold), and the receipt then listed more boxes than were sold while
      // the inline error said so. Each bucket may only claim what is still
      // unclaimed, so what the receipt and the strip print always sums to sold.
      // validateBenta still refuses the save; this only keeps the preview honest.
      // The special order's boxes claim FIRST (v2.7.0): they are whole boxes off
      // this stack that the four buckets can no longer describe, so the buckets
      // clamp against what is left — sold − custom — exactly the bound apiSaveDay
      // enforces. Only an in-cutoff box sku can be drawn from (the server refuses
      // the rest; here the preview reads it as 0 so the receipt stays sensible
      // while validateBenta shows the refusal inline).
      const customQty = (isBox && inCutoff) ? clampQty(customBySku[c.sku], sold) : 0;
      const avail = sold - customQty;
      const cheese = (isBox && inCutoff) ? clampQty(c.cheeseQty, avail) : 0;
      const gcashQty = inCutoff ? clampQty(c.gcashQty, avail - cheese) : 0;
      const gcashCheese = (isBox && inCutoff) ? clampQty(c.gcashCheeseQty, avail - cheese - gcashQty) : 0;
      const regular = Math.max(0, avail - cheese - gcashQty - gcashCheese);
      const amount = (regular + gcashQty) * price + (cheese + gcashCheese) * cheesePrice;
      const gcashAmount = gcashQty * price + gcashCheese * cheesePrice;
      lines.push({
        sku:c.sku, label:pr.label, sod, eod, sold,
        cheese_qty:cheese, gcash_qty:gcashQty, gcash_cheese_qty:gcashCheese, regular_qty:regular,
        amount: r2(amount), gcash_amount: r2(gcashAmount),
        price, cheese_price:cheesePrice, group:pr.group,
        // How many of `sold` the special order used — carried on the line so the
        // receipt can say "less N for the special order" and applyLocalDay can
        // store the snapshot exactly as the sheet does.
        custom_qty: customQty,
        // Did this line's money COUNT? Carried on the line so the receipt can print
        // an excluded sku apart instead of leaving the totals looking wrong.
        in_cutoff: inCutoff
      });
      if (inCutoff){ sum += amount; gsum += gcashAmount; }
      else xsum += amount;
    }
  }
  const custom = p.closed ? 0 : Math.max(0, num(p.customAmount));
  // The GCash part of the custom order can never exceed the custom order — the
  // server rejects that; clamp so the local mirror can never disagree with it.
  const customGcash = p.closed ? 0 : Math.min(custom, Math.max(0, num(p.customGcash)));
  const total = r2(sum + custom);
  // Cash = Total − GCash still holds; GCash is now derived from what was
  // actually entered instead of read off the GCash app.
  const gcashSales = r2(gsum + customGcash);
  // Money converted between the tin and GCash (v2.7.0; SIGNED since v2.7.3,
  // negative = GCash cashed out): it moves the SPLIT only — the Total is
  // untouched. It can only move money that EXISTS on the side it leaves, so it
  // clamps at the day's cash going one way and at the day's GCash going the
  // other — exactly the bounds apiSaveDay refuses over (validateBenta shows
  // those refusals inline; this keeps the preview true).
  const cashBefore = r2(total - gcashSales);
  const gcashConverted = p.closed ? 0 : Math.max(-gcashSales, Math.min(cashBefore, num(p.gcashConverted)));
  const gcash = r2(gcashSales + gcashConverted);
  // Lid boxes (v2.7.0): a plain count carried through so the receipt can print
  // it. NO price, NO money — it touches nothing else here.
  const lidBoxes = p.closed ? 0 : Math.max(0, num(p.lidBoxes));
  return {
    lines, total, gcash, cash: r2(total - gcash), custom, customGcash,
    gcashConverted, lidBoxes,
    // Kept apart, never added in. `excluded` is the sum of `excludedLines`, so
    // whatever the receipt prints below the totals always adds up to itself.
    excluded: r2(xsum),
    excludedLines: lines.filter(l => !l.in_cutoff)
  };
}
/** A bucket quantity as entered: never negative, never more than sold. */
function clampQty(v, sold){ return Math.min(Math.max(0, num(v)), Math.max(0, num(sold))); }

/**
 * The excluded lines worth PRINTING tonight — and on an ordinary night, none.
 *
 * `computeDay` returns a line for every sku on the form, so `excludedLines` is
 * never empty once nori is in the Prices tab: the receipt printed "Nori ×0 — not
 * in the total ₱0" and then the tautology "Cash in the tin: ₱825 + ₱0 Nori = ₱825"
 * on EVERY ordinary night. This screen is used nightly and noise on it is a real
 * cost, so the block appears only when there is excluded money to explain.
 *
 * ONE rule, read by both the receipt and the sticky day strip, so the two can
 * never disagree about whether the tin needs mentioning.
 */
function excludedTonight(c){
  return asArr(asObj(c).excludedLines).filter(l => r2(num(asObj(l).amount)) !== 0);
}
/** What is actually in the cash tin: the day's Cash PLUS the excluded money that
 *  shares it. Only shown when excludedTonight() has something in it — otherwise it
 *  would just restate Cash. */
function tinTotal(c){ return r2(num(asObj(c).cash) + num(asObj(c).excluded)); }

function currentPeriod(ds){
  const p = d2parts(ds);
  return p.d <= 15
    ? { start: partsToStr(p.y, p.m, 1),  end: partsToStr(p.y, p.m, 15) }
    : { start: partsToStr(p.y, p.m, 16), end: partsToStr(p.y, p.m, lastDayOf(p.y, p.m)) };
}
function shiftPeriod(per, dir){
  const s = d2parts(per.start);
  if (dir > 0){
    if (s.d === 1) return { start: partsToStr(s.y, s.m, 16), end: partsToStr(s.y, s.m, lastDayOf(s.y, s.m)) };
    const y = s.m === 12 ? s.y + 1 : s.y, m = s.m === 12 ? 1 : s.m + 1;
    return { start: partsToStr(y, m, 1), end: partsToStr(y, m, 15) };
  } else {
    if (s.d === 16) return { start: partsToStr(s.y, s.m, 1), end: partsToStr(s.y, s.m, 15) };
    const y = s.m === 1 ? s.y - 1 : s.y, m = s.m === 1 ? 12 : s.m - 1;
    return { start: partsToStr(y, m, 16), end: partsToStr(y, m, lastDayOf(y, m)) };
  }
}
function inPeriod(dateStr, per){ return dateStr >= per.start && dateStr <= per.end; }
/** A period's identity: "2026-07-16_2026-07-31". Defined here, beside the period
 *  maths, because the cutoff figures need it to find that period's entered
 *  split — not only the Cutoff screen. */
function periodKey(per){ return txt(asObj(per).start) + '_' + txt(asObj(per).end); }

/** That day's WAGE as the cutoff will count it: 0 on a closed day, the day's own
 *  snapshot when it has one, else today's rate for a row saved before the figure
 *  was stored. Identical to readDays() on the server, so the phone's preview and
 *  the note can never disagree by ₱200 a day. */
function daySalary(row){
  const r = asObj(row);
  if (truthy(r.closed)) return 0;
  return r.salary === '' || r.salary == null ? dailySalary() : Math.max(0, num(r.salary));
}

/** The SPLIT for a period: an ENTERED amount, not the residual (owner,
 *  2026-08-03). The row saved for this exact period if there is one, else the
 *  Settings default. `entered` lets the screen say which one it is showing. */
function splitFor(per){
  const row = asObj(state.cutoffInputs)[periodKey(per)];
  if (isObj(row) && row.split_amount !== '' && row.split_amount != null){
    return { amount: Math.max(0, r2(row.split_amount)), entered: true };
  }
  return { amount: splitDefault(), entered: false };
}

/**
 * The period's money from in_cutoff=FALSE skus, per sku and in total — the same
 * block apiCutoff returns as `excluded` / `excluded_lines`.
 *
 * DISPLAY ONLY. Nothing here may reach a cutoff figure or the note; it exists
 * because the owner asked to SEE the excluded total per cutoff while keeping it
 * out of everything ("just show the total per cutoff, and I'll exclude it on my
 * own").
 *
 *   qty    = Σ sold    over the period's count rows for that sku
 *   amount = Σ amount   the money SNAPSHOTTED on those rows when each day was
 *                       saved, so a later price edit cannot rewrite what a past
 *                       day earned
 *
 * WHICH ROWS ARE EXCLUDED IS ALSO A SNAPSHOT (v2.4.1): each row carries the flag
 * that decided its money the night it was saved, and countInCutoff() — never the
 * live Prices flag — is what classifies it here. Classifying saved money by the

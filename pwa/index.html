  const showing = paperShowingFor(benta.date);
  let h = '<div class="card' + (showing ? ' paper-card' : '') + '">';
  if (paperBusy){
    // Progress, and nothing disabled: the rest of the screen stays usable, so
    // she can carry on entering the night while the photo is being read.
    h += '<p class="paper-head">Reading the paper…</p>' +
      '<p class="hint" style="margin-top:6px;">' + esc(paperBusy) +
      ' Carry on entering the night if you like — this will not touch anything until it is done.</p>';
  } else {
    h += '<button type="button" class="btn block" data-act="paper-shoot">' +
      (showing ? 'Read the paper again' : '📷 Read it from the paper') + '</button>' +
      '<p class="hint" style="margin-top:8px;">Photograph the page for ' + esc(fmtShort(benta.date)) +
      ' and the figures are filled in for you to check. Nothing is saved until you tap Save day.</p>';
  }
  if (paperErr) h += '<p class="err">' + esc(paperErr) + '</p>';
  if (showing){
    // BEFORE any figure: this page may not be this night. Said first, because
    // every number below it is right for the page and wrong for the screen.
    const pd = paperPageDate();
    if (pd){
      h += '<div class="card attn-card" style="margin:10px 0;"><p class="attn-head">This page is dated ' +
        esc(pd.raw) + '</p><p>You are entering <b>' + esc(fmtShort(benta.date)) + '</b>. The figures below ' +
        'were read off that page, so they belong to the night it is dated' +
        (pd.date ? ' — ' + esc(fmtShort(pd.date)) : '') + ', not to this one.</p>' +
        (pd.date
          ? '<div class="btn-row"><button type="button" class="btn small primary" data-act="paper-goto" data-date="' +
            esc(pd.date) + '">Enter ' + esc(fmtShort(pd.date)) + ' instead</button></div>'
          : '<p class="hint" style="margin-top:8px;">Move to that night on the date above before saving.</p>') +
      '</div>';
    }
    try{ h += paperReviewHTML(asObj(paper.reading)); }
    catch(err){
      console.error(err);
      h += '<p class="err">The reading could not be shown on this screen, so nothing was filled in — type the night in by hand.</p>';
    }
  }
  h += '</div>';
  return h;
}

/** EVERY field the reading looked at, per sku, with what it read and what it
 *  left blank — plus the page's own total, the cross-check, what it could not
 *  read at all, and the photograph. Every string from the reply and every label
 *  from the sheet is escaped here, exactly once. */
function paperReviewHTML(rd){
  const fig = (v) => v === '' ? '<span class="unread">not read</span>' : '<b>' + esc(String(v)) + '</b>';
  const money = (v) => v === '' ? '<span class="unread">not read</span>' : '<b>' + esc(peso(v)) + '</b>';
  let h = '<div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">' +
    '<p class="paper-head">What the paper said</p>' +
    '<p class="paper-sub">' + esc(fmtLong(rd.date)) + (rd.model ? ' · read by ' + esc(rd.model) : '') + '</p>';
  // The photograph itself, so any figure here can be taken back to the page.
  const link = paperLink(rd.photo_url);
  if (link){
    h += '<p class="paper-sub"><a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">Open the photo of the paper</a></p>';
  } else if (rd.photo_error){
    h += '<p class="paper-note">' + esc(rd.photo_error) + '</p>';
  } else if (rd.photo_saved){
    h += '<p class="paper-note">The photo was kept, but its link did not arrive as a web address, so it cannot be opened from here.</p>';
  } else {
    h += '<p class="paper-note">The photo itself was not kept, so this reading cannot be checked against the picture later.</p>';
  }

  const rows = asArr(rd.counts);
  if (!rows.length){
    h += '<p class="paper-note">No product row on the page could be matched to anything this phone sells.</p>';
  }
  let first = true;
  for (const c of rows){
    const f = paperFormFigures(c);
    h += '<div class="paper-row' + (first ? ' first' : '') + '">' +
      '<div class="paper-sku">' + esc(c.label) + '</div>' +
      '<div class="paper-figs">' +
        'Start of day ' + fig(f.sod) + ' · End of day ' + fig(f.eod) + ' · Sold ' + fig(f.sold) +
      '</div>' +
      '<div class="paper-figs">' +
        'Cheese ' + fig(f.cheeseAll) + ' · Sold with GCash ' + fig(f.gcashAll) +
        ' · Of those, cheese ' + fig(f.gcashOfCheese) +
      '</div>' +
      '<div class="paper-conf">' + esc(paperSureWord(c.confidence)) + '</div>' +
    '</div>';
    first = false;
  }
  h += '<div class="paper-row"><div class="paper-sku">Special order</div>' +
    '<div class="paper-figs">Amount ' + money(rd.custom_amount) +
      ' · Paid by GCash ' + money(rd.custom_gcash) + '</div></div>' +
    '<div class="paper-row"><div class="paper-sku">The total on the page</div>' +
    '<div class="paper-figs">' + money(rd.total_on_paper) + '</div></div>';

  // THE CROSS-CHECK. Left empty here on purpose: validateBentaLive fills it the
  // moment this card is on screen and again after every edit, so there is one
  // place the comparison is written and it can never go stale.
  h += '<div id="paperCross"></div>';

  if (asArr(rd.unread).length){
    h += '<p class="paper-note" style="color:var(--alert); font-weight:600;">What it could not read. Every one of these is EMPTY on the form, not 0:</p>' +
      '<ul class="paper-list">';
    for (const u of rd.unread) h += '<li>' + esc(u) + '</li>';
    h += '</ul>';
  } else {
    h += '<p class="paper-note">It read every figure it was looking for.</p>';
  }
  if (rd.notes) h += '<p class="paper-note">It also noticed: ' + esc(rd.notes) + '</p>';

  h += '<p class="paper-note">Nothing here has been saved. The figures are on the form below — check them against the paper in your hand, then tap Save day as usual.</p>' +
    '<div class="attn-acts">' +
      '<button type="button" class="btn" data-act="paper-shoot">Read it again</button>' +
      '<button type="button" class="btn" data-act="paper-hide">Hide this</button>' +
    '</div></div>';
  return h;
}

/** The camera, asked for on a tap and never opened on its own. */
function paperShoot(){
  if (!isObj(benta) || paperBusy) return;
  paperErr = '';
  if (!visionReady()){
    paperErr = 'The photo reader is not set up on this phone yet — set its own URL and its own token under More.';
    renderPanel('benta');
    return;
  }
  if (!navigator.onLine){
    // Said BEFORE the camera opens: a photograph taken for nothing costs her a
    // second trip to the paper.
    paperErr = 'There is no internet just now, so a photo cannot be read — type the night in by hand, or try again when there is a signal.';
    renderPanel('benta');
    return;
  }
  // One question, and only when there is something to lose — the reading
  // REPLACES what is on the form. Asked before the camera opens, so a picture is
  // never taken and then thrown away.
  if ((benta.dirty || benta.saved) &&
      !confirm('Reading the paper will replace the figures now on the form for ' + fmtShort(benta.date) +
        '. Nothing already in the Google Sheet is touched. Read the photo anyway?')) return;
  const inp = $('paperShot');
  if (!inp){
    paperErr = 'The camera could not be opened on this phone, so nothing was read — type the night in by hand.';
    renderPanel('benta');
    return;
  }
  // Cleared FIRST, or choosing the same picture twice fires no change event at
  // all and the button looks broken.
  inp.value = '';
  inp.click();
}

/** The whole flow, in the order it has to happen: shrink, send, normalise,
 *  review, PRE-FILL. Nothing in it can save a day. */
async function paperTake(file){
  if (!isObj(benta) || paperBusy) return;
  // The night this reading belongs to, pinned NOW. If the form moves to another
  // date while the photo is in the air the answer is dropped — a reading filed
  // under the wrong night is worse than no reading at all.
  const date = benta.date;
  paper = null;
  paperErr = '';
  paperBusy = 'Making the photo small enough to send…';
  renderPanel('benta');
  try{
    const shot = await shrinkPhoto(file);
    if (!paperStillWanted(date)) return;
    paperBusy = 'Reading the figures off the paper…';
    renderPanel('benta');
    const data = await visionApi('readSheet', {
      imageBase64: shot.base64,
      mimeType: shot.mimeType,
      date: date,
      skus: paperSkus(date)
    });
    if (!paperStillWanted(date)) return;
    const rd = normReading(data, date);
    paper = { date: date, reading: rd };
    applyReadingToForm(rd);
  }catch(err){
    console.error(err);
    paper = null;
    // The reader's own refusals are already plain English and already say that
    // typing the night in by hand is still there; friendlyError passes those
    // through untouched and turns a raw browser failure into a sentence.
    paperErr = friendlyError(err, 'Try again, or type the night in by hand.');
  }finally{
    paperBusy = '';
    // renderPanel, not renderBenta: if she is typing in a field the re-render
    // waits until she is out of it, exactly as a background sync does.
    if (activeTab === 'benta') renderPanel('benta');
  }
}
function paperStillWanted(date){ return isObj(benta) && benta.date === txt(date); }

/** Prove the wiring without spending a single unit of Gemini quota: `ping`
 *  answers from the reader's own constants and never calls the model. */
async function visionTest(){
  const out = $('visionTestResult');
  if (!visionReady()){
    if (out) out.textContent = 'Enter the photo reader URL and its own token first.';
    return;
  }
  const btn = $('visionTestBtn');
  if (btn) btn.disabled = true;
  if (out) out.textContent = 'Testing…';
  try{
    const d = asObj(await visionApi('ping', {}));
    const o = $('visionTestResult');
    if (o){
      o.innerHTML = truthy(d.key_configured)
        ? '<span class="ok-note">✓ The photo reader answered. Version ' + esc(txt(d.version)) +
          ', reading with ' + esc(txt(d.model)) + '.</span>'
        : '<span style="color:var(--alert); font-weight:600;">✗ The photo reader answered, but it has no Gemini key in it yet, so it cannot read a photo. Paste the key into the Octogo Vision project and save the file.</span>';
    }
  }catch(err){
    console.error(err);
    const o = $('visionTestResult');
    if (o) o.innerHTML = '<span style="color:var(--alert); font-weight:600;">✗ ' +
      esc(friendlyError(err, 'Check the URL and the token above, then try again.')) + '</span>';
  }finally{
    const b = $('visionTestBtn');
    if (b) b.disabled = false;
  }
}

/* ============================================================
   Event wiring — delegated clicks/inputs per panel + globals
   ============================================================ */
document.addEventListener('click', (ev) => {
  // A tap anywhere means she is no longer typing, so any re-render that was
  // held back for the keyboard's sake can land now.
  setTimeout(flushBentaRender, 0);
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'goto-ibapa') showTab('ibapa');

  // Needs attention
  else if (act === 'attn-open') openAttentionEntry(el.dataset.key);
  else if (act === 'attn-retry') retryAttention(el.dataset.key);
  else if (act === 'attn-dismiss') dismissAttention(el.dataset.key);

  // Sales
  else if (act === 'step'){
    const st = el.closest('.stepper');
    bentaStep(st.dataset.sku, st.dataset.field, Number(el.dataset.dir));
  }
  else if (act === 'staff'){
    benta.staff = el.dataset.staff;
    benta.dirty = true;
    document.querySelectorAll('#panel-benta [data-act="staff"]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.staff === benta.staff)));
  }
  else if (act === 'toggle-stock') toggleCollapse('stock');
  else if (act === 'toggle-wage') toggleCollapse('wage');
  else if (act === 'toggle-gcash') toggleCollapse('gcash');
  else if (act === 'lid-step') lidStep(Number(el.dataset.dir));
  else if (act === 'stock-step'){
    const st = el.closest('[data-stkstep]');
    if (st) stockStep(st.dataset.stkstep, Number(el.dataset.dir));
  }
  // The conversion's direction (v2.7.3): a chip, so the amount never carries a
  // sign. Changing it is a real edit of the day — it moves the split.
  else if (act === 'conv-dir'){
    benta.convDir = el.dataset.dir === 'in' ? 'in' : 'out';
    benta.dirty = true;
    renderBenta();
    validateBentaLive();
  }
  else if (act === 'save-day') saveBenta();
  else if (act === 'goto-stock') showTab('ibapa');
  // Read it from the paper (v2.9.0). Neither of these saves anything: one opens
  // the camera, the other puts the reading away.
  else if (act === 'paper-shoot') paperShoot();
  // "Enter that night instead" (v2.9.1). Moves the form to the night the PAGE
  // is dated, keeping the reading, so the figures land where they belong. The
  // date change goes through the ordinary path — the draft for the night being
  // left is stashed exactly as it is when she taps the date herself.
  else if (act === 'paper-goto'){
    const d = txt(el.dataset.date);
    if (!isDateStr(d)) return;
    stashBentaDraft();
    const rd = isObj(paper) ? paper : null;
    loadBentaForm(d);
    if (rd){
      // The reading belongs to the page, so it follows the page's night — and
      // is applied there, where it is finally about the right day.
      paper = { date: d, reading: rd.reading, at: rd.at };
      try{ applyReadingToForm(asObj(paper.reading)); }
      catch(err){ console.error(err); paperErr = 'The reading could not be put on this night — type it in by hand.'; }
    }
    renderBenta();
    validateBentaLive();
    toast('Now entering ' + fmtShort(d) + ' — the figures from the page are on it.');
  }
  else if (act === 'paper-hide') paperHide();

  // Expenses
  else if (act === 'gastos-open'){ gx.open = true; gx.date = todayStr(); renderGastos(); }
  else if (act === 'gastos-cancel'){ gx.open = false; gxElsewhere = null; renderGastos(); }
  // The bucket IS the whole choice (v2.7.1): Octopus/Other file as those
  // categories, a picklist name files as Supplies with that name as the item.
  else if (act === 'gastos-pick'){
    gx.pick = txt(el.dataset.pick);
    renderGastos();
    const f = $('gxAmount'); if (f) f.focus();
  }
  else if (act === 'gastos-paid'){
    const want = txt(el.dataset.paid);
    // Only one of the three, never whatever a stale attribute happens to say.
    if (PAID_FROM_CHOICES.some(c => c.key === want)) gx.paidFrom = want;
    renderGastos();
  }
  else if (act === 'gastos-submit') submitGasto();
  else if (act === 'gastos-del') deleteGasto(el.dataset.id);

  // Cutoff
  // A blank day, opened for entry — or answered with "the stall was dark".
  else if (act === 'cut-open-day'){
    const d = txt(el.dataset.date);
    if (!isDateStr(d)) return;
    stashBentaDraft();
    loadBentaForm(d);
    showTab('benta');
    toast('Opened ' + fmtShort(d) + '. Enter the night, then tap Save day.');
  }
  else if (act === 'cut-closed-day'){
    const d = txt(el.dataset.date);
    if (!isDateStr(d)) return;
    if (!confirm('Mark ' + fmtShort(d) + ' as a closed day? No sales, and no wage for that day.')) return;
    // The same shape the Sales screen sends for a closed day: the server zeroes
    // the money, the counts and the wage from `closed` alone.
    const payload = { date: d, closed: true, staff: txt(asArr(staffList())[0]),
      customAmount: 0, customGcash: 0, gcashConverted: 0, lidBoxes: 0, customBoxes: [],
      notes: '', counts: [], stock: [], entryId: uuid() };
    applyLocalDay(payload);
    enqueue('saveDay', payload);
    persistState();
    renderCutoff();
    toast(fmtShort(d) + ' marked closed.');
    drainQueue();
  }
  else if (act === 'cutoff-prev'){ cutoffPer = shiftPeriod(cutoffPer, -1); renderCutoff(); }
  else if (act === 'cutoff-next'){ cutoffPer = shiftPeriod(cutoffPer, 1); renderCutoff(); }
  else if (act === 'cutoff-suggest') addSuggestedExpense(el.dataset.cat, el.dataset.item, el.dataset.amt);
  else if (act === 'cutoff-generate') generateNote();
  else if (act === 'copy-note') copyNote();
  else if (act === 'share-note') shareNote();
  else if (act === 'split-save') saveSplit();
  else if (act === 'pay-backlog') payBacklog();

  // More tab
  else if (act === 'sheet-check') runSheetCheck(el);
  else if (act === 'sync-now'){
    // Drain FIRST so the bootstrap snapshot reflects our mutations —
    // the reverse order can overwrite local edits with pre-edit rows.
    (async () => {
      await drainQueue();
      await doBootstrap();
      if (activeTab === 'ibapa') renderIbapa();
    })();
  }
  else if (act === 'test-conn') testConnection();
  // The photo reader's own test (v2.9.0). A `ping` spends no Gemini quota at all,
  // which is exactly why it is the safe way to prove the wiring.
  else if (act === 'vision-test') visionTest();

  // Stock on hand
  else if (act === 'count-open') openCount(el.dataset.product);
  else if (act === 'count-cancel'){ countingProduct = ''; countDraft = ''; renderIbapa(); }
  else if (act === 'count-save') saveStockCountNow(el.dataset.product);
  else if (act === 'arrive-open'){
    arriving = true;
    // SNAPSHOT the list now: each row owns its product name from here on.
    arrival = { rows: activeStockItems().map(s => ({
      product: txt(asObj(s).product), unit: txt(asObj(s).unit), qty: '' })), date: todayStr() };
    renderIbapa();
  }
  else if (act === 'arrive-cancel'){ arriving = false; renderIbapa(); }
  else if (act === 'arrive-step'){
    const st = el.closest('[data-arrstep]');
    if (st) arriveStep(st.dataset.arrstep, Number(el.dataset.dir));
  }
  else if (act === 'arrive-save') saveArrival();

  // What it costs (v2.8.0). Every one of these ASKS THE SERVER — there is no
  // local answer to fall back to, and none is invented.
  else if (act === 'cost-open'){
    costOpen = true;
    if (!costPer) costPer = currentPeriod(todayStr());
    loadCosting();
  }
  else if (act === 'trend-open'){ trendOpen = true; renderIbapa(); }
  else if (act === 'trend-close'){ trendOpen = false; renderIbapa(); }
  else if (act === 'cost-close'){ costOpen = false; renderIbapa(); }
  else if (act === 'cost-prev'){
    costPer = shiftPeriod(costPer || currentPeriod(todayStr()), -1);
    costRes = null; costErr = ''; costStale = false;
    loadCosting();
  }
  else if (act === 'cost-next'){
    costPer = shiftPeriod(costPer || currentPeriod(todayStr()), 1);
    costRes = null; costErr = ''; costStale = false;
    loadCosting();
  }
  // The last cutoff that has actually RUN OUT (v2.9.4) — walked back from the
  // one on screen rather than assumed to be the previous one, so it is right
  // whichever period he happens to be looking at.
  else if (act === 'cost-last-done'){
    let p = costPer || currentPeriod(todayStr());
    const today = todayStr();
    let guard = 0;
    while (p.end >= today && guard++ < 40) p = shiftPeriod(p, -1);
    costPer = p;
    costRes = null; costErr = ''; costStale = false;
    loadCosting();
  }
  else if (act === 'cost-refresh' || act === 'cost-target') loadCosting();

  // Maintenance
  else if (act === 'maint-open'){ maintOpen = true; maintLoad(); renderIbapa(); }
  else if (act === 'maint-close'){ maintOpen = false; renderIbapa(); }
  else if (act === 'maint-save-prices') saveMaintPrices();
  else if (act === 'maint-save-set') saveMaintSettings();
  else if (act === 'maint-save-stock') saveMaintStock();
});

document.querySelector('.tabbar').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-tab]');
  if (b) showTab(b.dataset.tab);
});

document.addEventListener('input', (ev) => {
  // The stock rows are addressed by their row INDEX in a data attribute: a
  // product name is sheet data and would make an id ambiguous.
  const ds = ev.target.dataset || {};
  if (ds.stk != null){
    const r = asArr(benta.stock)[num(ds.stk)];
    if (r){ r.qty = ev.target.value; benta.dirty = true; updateStockCard(); validateBentaLive(); }
    return;
  }
  /* "Stock came in" (v2.9.6). Read HERE, by its own data attribute, for the
     reason the comment above gives — and because reading it by ID could not
     work: these boxes are called "in-arr-0", which starts with "in-", so the
     Sales steppers' `id.startsWith('in-')` branch claimed them first and threw
     the keystroke away. The dedicated in-arr- branch further down that chain
     was unreachable from the day it was written, so typing a delivery did
     nothing at all: 10 packs typed stayed 0, and one tap of + then read 1
     rather than 11. Only the +/- buttons ever moved the figure. */
  if (ds.arr != null){
    const r = asArr(arrival.rows)[num(ds.arr)];
    if (r) r.qty = ev.target.value;
    return;
  }
  // Maintenance fields, all keyed by the row they belong to (sku or product).
  if (ds.mprice != null){ if (maintPrices[ds.mprice]) maintPrices[ds.mprice].price = ev.target.value; return; }
  if (ds.mcheese != null){ if (maintPrices[ds.mcheese]) maintPrices[ds.mcheese].cheesePrice = ev.target.value; return; }
  if (ds.munit != null){ if (maintStock[ds.munit]) maintStock[ds.munit].unit = ev.target.value; return; }
  if (ds.mreorder != null){ if (maintStock[ds.mreorder]) maintStock[ds.mreorder].reorderAt = ev.target.value; return; }
  // The two costs (v2.8.0). Kept as TYPED — a cost can be ₱0.375, and coercing
  // it through a rounder on the way in would restate the owner's own figure.
  if (ds.mboxcost != null){ if (maintPrices[ds.mboxcost]) maintPrices[ds.mboxcost].boxCost = ev.target.value; return; }
  if (ds.munitcost != null){ if (maintStock[ds.munitcost]) maintStock[ds.munitcost].unitCost = ev.target.value; return; }
  if (ds.mset != null){
    if (maintConst && Object.prototype.hasOwnProperty.call(SETTABLE_SETTINGS, ds.mset)) maintConst[ds.mset] = ev.target.value;
    return;
  }

  const id = ev.target.id;
  if (!id) return;

  // Sales fields. There is no typed GCash total any more — it is computed.
  if (id === 'customAmount'){ benta.custom = ev.target.value; benta.dirty = true; updateReceipt(); validateBentaLive(); }
  else if (id === 'customGcash'){ benta.customGcash = ev.target.value; benta.dirty = true; updateReceipt(); validateBentaLive(); }
  else if (id === 'gcashConverted'){ benta.gcashConverted = ev.target.value; benta.dirty = true; updateReceipt(); validateBentaLive(); }
  else if (id === 'lidBoxesIn'){ benta.lidBoxes = ev.target.value; benta.dirty = true; updateReceipt(); validateBentaLive(); }
  else if (id === 'daySalary'){ benta.salary = ev.target.value; benta.dirty = true; updateWageCard(); validateBentaLive(); }
  else if (id === 'dayNotes'){ benta.notes = ev.target.value; benta.dirty = true; }
  else if (id.startsWith('in-')){
    // Take the sku/field from the stepper's data attributes rather than
    // parsing them back out of the id — a sku is sheet data and may contain
    // dashes or other characters that make the id ambiguous.
    // `data-sku` required: this branch may only claim steppers that ARE Sales
    // rows. Without that test it swallows any other "in-…" box silently, which
    // is exactly how "Stock came in" lost every typed figure (v2.9.6).
    const st = ev.target.closest('.stepper');
    if (st && st.dataset.sku){
      const sku = st.dataset.sku;
      // A v2.7.0 presentation field writes the buckets through its own map.
      if (UI_FIELDS[st.dataset.field]){
        const r = benta.rows.find(x => x.sku === sku);
        if (r){ uiTyped(r, st.dataset.field, ev.target.value); benta.dirty = true; afterCountChange(sku); }
      } else {
        const field = ROW_FIELDS[st.dataset.field];
        const r = field ? benta.rows.find(x => x.sku === sku) : null;
        if (r){ r[field] = Math.max(0, num(ev.target.value)); benta.dirty = true; afterCountChange(sku); }
      }
    }
  }

  // Expenses fields
  else if (id === 'gxAmount') gx.amount = ev.target.value;
  else if (id === 'gxDate'){
    // Kept as typed, judged live — a half-edited year ("0002-…") shows the
    // server's own complaint at once, and submitGasto refuses to commit it.
    gx.date = ev.target.value || todayStr();
    setErr('err-gx-date', ev.target.value ? entryDateError(ev.target.value) : '');
  }


  // Cutoff fields. The split's residual follows the field as it is typed; only
  // the four figures it moves are rewritten, so the keyboard stays put.
  else if (id === 'coSplitIn'){
    if (cutoffPer) splitEdits[periodKey(cutoffPer)] = ev.target.value;
    updateSplitLive();
  }
  else if (id === 'payBlAmount') payBl.amount = ev.target.value;

  // More: the stocktake field
  else if (id === 'stCountIn') countDraft = ev.target.value;

  // More: the costing's nightly target. Typing it does NOT re-ask the server —
  // "Work out the prices" does, and until it is tapped the screen says so
  // rather than showing prices for a figure that is no longer in the field.
  else if (id === 'costTarget'){
    costTarget = ev.target.value;
    setErr('err-cost-target', txt(costTarget).trim() !== '' && num(costTarget) < 0
      ? 'The nightly target cannot be negative.' : '');
    updateCostTarget();
  }

  // Config fields (auto-saved)
  else if (id === 'cfgUrl'){ config.apiUrl = ev.target.value.trim(); persistConfig(); updateStatus(); }
  else if (id === 'cfgToken'){ config.token = ev.target.value.trim(); persistConfig(); }
  else if (id === 'cfgSheet'){ config.sheetUrl = ev.target.value.trim(); persistConfig(); }
  // The photo reader's OWN pair (v2.9.0), persisted exactly like the sheet's.
  // No re-render here, for the same reason the three fields above do not do one:
  // rewriting the panel would destroy the field being typed in. The Sales button
  // appears on the next render of that screen, which is where it is needed.
  else if (id === 'cfgVisionUrl'){ config.visionUrl = ev.target.value.trim(); persistConfig(); }
  else if (id === 'cfgVisionToken'){ config.visionToken = ev.target.value.trim(); persistConfig(); }
});

document.addEventListener('change', (ev) => {
  const id = ev.target.id;
  const ds = ev.target.dataset || {};
  // Checkboxes and selects report through `change` on every phone, so the
  // maintenance toggles and the two pickers are wired here rather than on input.
  if (ds.mactive != null){ if (maintPrices[ds.mactive]) maintPrices[ds.mactive].active = ev.target.checked; return; }
  if (ds.mcutoff != null){ if (maintPrices[ds.mcutoff]) maintPrices[ds.mcutoff].inCutoff = ev.target.checked; return; }
  if (ds.mstockactive != null){ if (maintStock[ds.mstockactive]) maintStock[ds.mstockactive].active = ev.target.checked; return; }
  if (id === 'arrDate'){
    // The same clamps every event date gets: kept as typed, judged live in the
    // server's own words, and never committed while it is wrong (saveArrival
    // checks again). A cleared field falls back to today.
    arrival.date = ev.target.value || todayStr();
    setErr('err-arrive', ev.target.value ? entryDateError(ev.target.value) : '');
    return;
  }
  if (id === 'payBlRef'){ payBl.ref = ev.target.value; return; }
  // The camera came back with a picture (v2.9.0). The File is taken FIRST and
  // the input cleared at once: the object stays valid on its own, and clearing
  // it is what lets the same photograph be chosen twice.
  if (id === 'paperShot'){
    const shot = (ev.target.files && ev.target.files[0]) || null;
    ev.target.value = '';
    if (shot) paperTake(shot);
    return;
  }
  if (id === 'bentaDate'){
    const v = ev.target.value;
    // The form NEVER moves onto a date the server would refuse: a future day, a
    // half-edited year ("0002-…"), or a cleared field. The picker snaps back to
    // the day it was on and the complaint uses the server's own words — checked
    // here on change AND again in validateBenta on save, so a partial state
    // cannot be committed from either direction.
    const bad = v ? entryDateError(v) : 'That date is not complete. Pick the day from the calendar.';
    if (bad){
      ev.target.value = benta.date;
      toast(bad);
      return;
    }
    // A refusal about last night's photograph has nothing to say about a
    // different night (v2.9.0). The READING itself is kept: it is filed under
    // its own date and shows again the moment that date is opened.
    paperErr = '';
    if (v !== benta.date){
      // Changing the date used to throw away everything typed, with no warning.
      // Keep it as a draft for the date it belongs to, say so, and put it back
      // the moment that date is opened again.
      const from = benta.date, wasDirty = !!benta.dirty;
      stashBentaDraft();
      loadBentaForm(v);
      renderBenta();
      if (wasDirty) toast('Your numbers for ' + fmtShort(from) + ' were kept. Pick that date again to finish them.');
    } else {
      loadBentaForm(v); renderBenta();
    }
  }
  else if (id === 'closedToggle'){
    // Marking a day closed BLANKS it: counts, custom order, wage — everything.
    // With sales already on the form that is a whole night's money going, so it
    // asks once, naming the amount, before anything is touched.
    if (ev.target.checked && !benta.closed){
      const c = computeDay(bentaPayload());   // benta.closed is still false here
      const money = r2(num(c.total) + num(c.excluded));
      if (money > 0 &&
          !confirm('This day has ' + peso(money) + ' of sales entered. “Closed today” removes all of it. Mark the day closed anyway?')){
        ev.target.checked = false;
        return;
      }
    }
    benta.closed = ev.target.checked;
    benta.dirty = true;
    renderBenta();
  }
});

// A held-back Sales re-render lands as soon as she is out of the field. Both
// events are wired (blur does not bubble, so it is taken in the capture phase)
// and any tap elsewhere flushes too, so a deferred render can never be stranded.
document.addEventListener('focusout', () => { setTimeout(flushBentaRender, 0); });
document.addEventListener('blur', () => { setTimeout(flushBentaRender, 0); }, true);

window.addEventListener('online', () => { drainQueue(); });
window.addEventListener('offline', () => { updateStatus(); });

// The calendar day this page last saw. Only a form that is still showing THAT
// day may be advanced to the new today — see onAppResume.
let lastSeenToday = todayStr();

// App resume (installed PWAs stay alive across days). Auto-advance ONLY when
// the form is still showing the today it was loaded with: picking an earlier
// date and then reading the notebook (app backgrounded in between) is the
// natural order of work, and snapping back to Today would land her numbers on
// the wrong day. Always re-render so the "Today" kicker, the date-input max and
// the current-period displays recompute. Then sync.
function onAppResume(){
  const t = todayStr();
  if (benta && !benta.dirty && benta.date !== t && benta.date === lastSeenToday){
    loadBentaForm(t);
  }
  lastSeenToday = t;
  const di = $('bentaDate');
  if (di) di.max = t;
  renderPanel(activeTab);
  updateDayStrip();
  drainQueue();
  // Reopening the app is the safest moment to swap in a downloaded update.
  if (typeof applyUpdateIfSafe === 'function') applyUpdateIfSafe();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') onAppResume();
  else stashBentaDraft();      // backgrounded mid-entry: keep what is typed
});
window.addEventListener('pagehide', () => { stashBentaDraft(); });
window.addEventListener('pageshow', () => { onAppResume(); });

/* ============================================================
   Boot
   ============================================================ */
// A partial or truncated state_v1 can lose rows that are still sitting in
// the queue. Replay the queue over whatever survived so unsent work shows
// up on screen instead of quietly disappearing. (Idempotent: the appliers
// recompute the same rows from the same payloads.)
try{ reapplyQueue(); }catch(err){ console.error(err); }

try{
  loadBentaForm(todayStr());
}catch(err){
  console.error(err);
  state = freshState();
  loadBentaForm(todayStr());
}
// A day queued before v2.1 loses its cash/GCash split when it replays. Flag
// those dates now, so the warning is on screen even offline.
try{ flagLegacyGcashQueue(); }catch(err){ console.error(err); }
// Bound the stored history on the way in, not only on the way out.
try{ pruneState(); persistState(); persistDrafts(); }catch(err){ console.error(err); }
updateStatus();
showTab('benta');
(async () => {
  // Drain BEFORE bootstrap so the snapshot can't clobber queued edits.
  await drainQueue();
  await doBootstrap();
})();

/* ============================================================
   Self-updating. The service worker caches the app so it runs offline, which
   means a freshly uploaded version would otherwise only appear on the SECOND
   open: the first open quietly downloads it, the second renders it. Nobody
   should have to know that. So when a new version takes over we reload for
   them — but only at a moment where nothing can be lost.
   ============================================================ */
let updateWaiting = false;
let reloadingForUpdate = false;

// sw.js uses clientsClaim, so on a FIRST install controllerchange also fires
// when the brand-new worker claims this uncontrolled page — reloading for that
// would be a pointless flash. So skip exactly that one initial claim, and treat
// every later controllerchange as a real new version. (If a worker was already
// driving the page at load — the normal case once installed — there is no
// initial claim to skip and the very next change is an update.)
let sawInitialClaim = !!(navigator.serviceWorker && navigator.serviceWorker.controller);

/** Is a field focused right now? Reloading out from under an open keyboard is
 *  the one thing genuinely worth waiting for — the next resume or the next save
 *  catches the update a moment later. */
function isTypingNow(){
  const el = document.activeElement;
  if (!el) return false;
  const tag = String(el.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable === true;
}

// Never reload while work could be lost; hold the update until it is safe
// (after a save, or the next time the app is opened).
function applyUpdateIfSafe(){
  if (!updateWaiting || reloadingForUpdate) return;
  if (typeof syncing !== 'undefined' && syncing) return;              // request in flight
  if (typeof paperBusy !== 'undefined' && paperBusy) return;          // a photo is being read
  /* A HALF-ENTERED DAY IS NO LONGER A LIFE SENTENCE (v2.9.7).
     `benta.dirty` was a flat refusal — and a RESTORED DRAFT sets it on every
     single load, because it genuinely is unsent work. So a phone holding one
     unsaved night held its update back at every resume, for as long as that
     night stayed unsaved: stuck on old code indefinitely, with nothing on
     screen saying so. That is how a phone sat on 2.9.5 while 2.9.6 was live.
     What this gate is really for is not yanking the screen from under her
     fingers and not losing typing — neither of which needs a permanent hold.
     The draft store round-trips every field on the form (closed, staff, the
     custom pair, the conversion and its direction, lids, wage, notes, the
     photo link, every row and every stock line), so stashing first makes the
     reload lossless, and the restored draft says so on screen as it always
     has. */
  if (typeof benta === 'object' && benta && benta.dirty){
    if (isTypingNow()) return;
    if (typeof stashBentaDraft === 'function') stashBentaDraft();
  }
  // NOT blocked by a non-empty queue: queued mutations live in localStorage and
  // replay after the reload. Blocking on them would strand the app on an old
  // version forever in demo mode, or whenever the server is unreachable.
  reloadingForUpdate = true;   // one reload per page load — never a loop
  updateWaiting = false;
  location.reload();
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* file:// or unsupported — app still works */ });
  });
  // Fires once a newly installed worker claims this page (sw.js does
  // skipWaiting + clientsClaim), i.e. the new files are cached and ready.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!sawInitialClaim){ sawInitialClaim = true; return; }  // first install, not an update
    updateWaiting = true;
    applyUpdateIfSafe();
  });
}
</script>
</body>
</html>

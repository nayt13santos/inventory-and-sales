 * current flag let one tick in Maintenance restate a fortnight already sent, in
 * both directions (see countInCutoff). A row with a blank snapshot falls back to
 * the sku's current flag, which is all a row written before v2.4.1 can tell us.
 *
 * A count row with no snapshot and no price row on this phone counts IN, exactly as
 * before. But an explicit FALSE snapshot on a sku that has since left the Prices
 * tab IS still excluded money and is still listed — after the priced skus, under
 * its sku as its own label — because `total` must always equal the lines printed
 * beneath it. Skus are listed in Prices order so the block reads the same every
 * time, and a sku with nothing sold is left out rather than printed as a zero
 * line — identical to excludedForPeriod() in Code.gs.
 */
function excludedForPeriod(per){
  const agg = Object.create(null);
  const orphans = [];
  const byDate = asObj(state.counts);
  for (const d in byDate){
    if (!inPeriod(d, per)) continue;
    for (const r of asArr(byDate[d])){
      const c = asObj(r);
      const sku = txt(c.sku);
      if (!sku || countInCutoff(c)) continue;
      if (!agg[sku]){
        agg[sku] = { qty:0, amount:0 };
        if (!asArr(state.prices).some(p => isObj(p) && txt(p.sku) === sku)) orphans.push(sku);
      }
      agg[sku].qty += num(c.sold);
      agg[sku].amount += num(c.amount);
    }
  }
  const lines = [];
  let total = 0;
  const emitted = Object.create(null);
  const emit = (sku, label) => {
    if (emitted[sku]) return;
    const a = agg[sku];
    if (!a || (a.qty === 0 && a.amount === 0)) return;
    emitted[sku] = true;
    lines.push({ sku, label, qty:r2(a.qty), amount:r2(a.amount) });
    total += a.amount;
  };
  for (const pr of asArr(state.prices)){
    if (!isObj(pr)) continue;
    emit(txt(pr.sku), txt(pr.label) || txt(pr.sku));
  }
  for (const sku of orphans) emit(sku, sku);
  return { lines, total: r2(total) };
}

function computeCutoff(per){
  let rawTotal = 0, rawGcash = 0, rawSalary = 0, daysWithSales = 0, openDays = 0;
  const days = asObj(state.days);
  for (const d in days){
    if (!inPeriod(d, per)) continue;
    const row = asObj(days[d]);
    rawTotal += num(row.total); rawGcash += num(row.gcash);
    // The wage for every day that was NOT closed, at the figure that day was
    // saved with. Snapshotted per day precisely so a later rate change never
    // rewrites history.
    rawSalary += daySalary(row);
    if (!truthy(row.closed)) openDays++;
    if (num(row.total) > 0) daysWithSales++;
  }
  // Round the running sums BEFORE they feed the residual, exactly as apiCutoff
  // does, so the two cannot drift from each other by a centavo. Cash is derived
  // from Total − GCash on both sides (never summed independently).
  const total = r2(rawTotal), gcash = r2(rawGcash), salary = r2(rawSalary);
  const cash = r2(total - gcash);
  // Prototype-free accumulator + whitelisted category, so a category like
  // "toString" can never take a wrong branch and drop money from the note.
  const b = Object.create(null);
  for (const cat of EXPENSE_CATS) b[cat] = 0;
  const exps = asObj(state.expenses);
  for (const id in exps){
    const e = asObj(exps[id]);
    if (!inPeriod(e.date, per)) continue;
    b[normCategory(e.category)] += num(e.amount);
  }
  // Supplies is Expenses(category=Supplies) ALONE (v2.3.0). The nightly
  // daily-supplies card is retired, so a purchase now lives in exactly one place
  // and cannot be counted twice. Same rule as apiCutoff(), so the preview and the
  // archived note never differ.
  // Stock usage is deliberately absent everywhere here: it is quantities, never
  // money. A delivery's stock_qty likewise moves only the ledger — its `amount`
  // is the money and it is already inside b.Supplies exactly once.
  const supplies = r2(b.Supplies);
  const other = r2(b.Backlog + b.Other);
  const mama = r2(b.Mama), octopus = r2(b.Octopus), electric = r2(b.Electric);
  // Split is an ENTERED amount now, so it is no longer the residual...
  const sp = splitFor(per);
  const split = r2(sp.amount);
  // ...REMAINING is: what is left in the business after everything, and the
  // figure backlog payments are funded from. It MAY BE NEGATIVE (a short
  // cutoff) and is never clamped — a clamp would hide exactly the fortnight
  // the owner most needs to see.
  const remaining = r2(total - mama - split - supplies - octopus - salary - other - electric);
  // --- Excluded skus (nori): DISPLAY ONLY, and deliberately computed AFTER the
  // residual so it is obvious that nothing above can depend on it. It enters no
  // figure here and buildNote() never reads it — the note the owner sends his
  // partner does not change by a single byte.
  const x = excludedForPeriod(per);
  return {
    total, cash, gcash, daysWithSales, openDays,
    mama, supplies, octopus, electric, other, salary,
    split, perPartner: r2(split / 2), splitEntered: sp.entered,
    remaining,
    excluded: x.total, excludedLines: x.lines
  };
}

/** The same figures with a DIFFERENT split, so the residual can follow the field
 *  as it is typed without re-reading the whole period. The arithmetic is the one
 *  in computeCutoff — kept in one expression here so the two cannot drift. */
function cutoffWithSplit(f, rawSplit){
  const split = r2(Math.max(0, num(rawSplit)));
  const remaining = r2(num(f.total) - num(f.mama) - split - num(f.supplies) -
    num(f.octopus) - num(f.salary) - num(f.other) - num(f.electric));
  return Object.assign({}, f, { split, perPartner: r2(split / 2), remaining });
}

/* ---- The Split field: what it MEANS, and whether it has been saved yet. ----
   The Split lives in two places at once — the figure saved for the period (in
   state.cutoffInputs, which is what the note is built from) and the raw text in
   the field. These three functions are the only bridge between them, so the
   preview, the note and the save can never read the field differently. */
// The Split as it is being typed, per period ("start_end" -> raw field value).
// Kept out of state_v1 on purpose: it is unsaved typing, and the saved figure
// lives in state.cutoffInputs where the preview and the note both read it.
let splitEdits = {};

/** The amount a raw field value MEANS. A BLANK field is the usual amount — the
 *  same reading saveSplit() applies — because blank is how the screen shows "I
 *  have not changed it". Reading a blank as ₱0 made the headline residual swing
 *  by the whole split and flip its label, promising a figure no save would ever
 *  write. */
function splitFieldAmount(raw){
  return (raw === '' || raw == null) ? splitDefault() : num(raw);
}

/** The figures the Cutoff screen is SHOWING: this period's figures with the
 *  Split field as it currently reads. Untouched field -> the saved figure. */
function liveCutoff(per){
  const f = computeCutoff(per);
  const key = periodKey(per);
  if (!Object.prototype.hasOwnProperty.call(splitEdits, key)) return f;
  return cutoffWithSplit(f, splitFieldAmount(splitEdits[key]));
}

/** A typed-but-UNSAVED Split for this period, or null when the field agrees with
 *  what is saved. The note is built from the SAVED figure (the server reads
 *  CutoffInputs), so while this returns something the note would contradict the
 *  figures printed directly above it — and one screen showing two different
 *  Splits is worse than no note at all. */
function pendingSplit(per){
  const key = periodKey(per);
  if (!Object.prototype.hasOwnProperty.call(splitEdits, key)) return null;
  const amount = r2(Math.max(0, splitFieldAmount(splitEdits[key])));
  const saved = r2(splitFor(per).amount);
  return amount === saved ? null : { key, raw: splitEdits[key], amount, saved };
}

/** "July 1 - 15" (same month) or "July 30 - August 2" (spanning months) —
 *  identical to periodLabel() in Code.gs. Note text only, always English. */
function notePeriodLabel(per){
  const s = d2parts(per.start), e = d2parts(per.end);
  if (s.y === e.y && s.m === e.m) return EN_MONTHS[s.m-1] + ' ' + s.d + ' - ' + e.d;
  return EN_MONTHS[s.m-1] + ' ' + s.d + ' - ' + EN_MONTHS[e.m-1] + ' ' + e.d;
}

function buildNote(f, per){
  // Default branch matches Code.gs, so a phone that has never synced still
  // writes the note the sheet would write.
  const branch = asObj(state.settings).branch || 'Tañong';
  // The final line is the RESIDUAL and its LABEL carries the sign, so a note can
  // never read "Remaining - -2,000": "Remaining - 1,000" when it is 0 or more,
  // "Short - 2,000" when it is negative. It always prints a number.
  const remaining = num(f.remaining);
  const residual = remaining < 0
    ? 'Short - ' + fmt(-remaining)
    : 'Remaining - ' + fmt(remaining);
  return [
    branch + ': ' + notePeriodLabel(per) + ' Breakdown',
    '',
    // Total/Cash/GCash always print a number (0 when empty); only the seven
    // expense/share categories below blank out at zero. This matches the
    // server's buildNoteText exactly, byte for byte, so the preview and the
    // archived note never differ.
    'Total - ' + fmt(f.total),
    '',
    'Cash - ' + fmt(f.cash),
    'GCash - ' + fmt(f.gcash),
    '',
    'Mama - ' + noteVal(f.mama),
    'Split - ' + (num(f.split) !== 0 ? fmt(f.split) + '(' + fmt(f.perPartner) + ' each)' : ''),
    'Supplies - ' + noteVal(f.supplies),
    'Octopus - ' + noteVal(f.octopus),
    'Salary - ' + noteVal(f.salary),
    'Other payments - ' + noteVal(f.other),
    'Electric bill - ' + noteVal(f.electric),
    '',
    residual
  ].join('\n');
}

/**
 * Why a note may NOT be built from this phone's figures — the server's own
 * refusal, word for word — or '' when the note is fine to build (v2.5.1).
 *
 * Mirrors the negative-category refusal in apiCutoff: a negative category sum
 * can only come from a hand-edited expense row (saveExpense refuses amounts
 * ≤ 0), and a note built on it states money that never existed. The SERVER
 * refuses to generate that note; the phone must refuse ITS OWN copy for the
 * same period in the same sentence — a demo/offline/fallback note containing
 * "Supplies - -400" is exactly the artifact the server's refusal exists to
 * prevent, so building it locally would convert the refusal into the bug.
 */
function noteRefusal(per){
  const f = computeCutoff(per);
  const negCats = [];
  if (num(f.mama) < 0) negCats.push('Mama');
  if (num(f.supplies) < 0) negCats.push('Supplies');
  if (num(f.octopus) < 0) negCats.push('Octopus');
  if (num(f.electric) < 0) negCats.push('Electric');
  if (num(f.other) < 0) negCats.push('Other payments');
  if (!negCats.length) return '';
  // The note-line each expense belongs to — Backlog/unknown fold into "Other
  // payments", the same mapping computeCutoff and the server both apply.
  const noteCat = c => {
    const cat = normCategory(c);
    return (cat === 'Mama' || cat === 'Supplies' || cat === 'Octopus' || cat === 'Electric')
      ? cat : 'Other payments';
  };
  const offenders = [];
  const exps = asObj(state.expenses);
  for (const id in exps){
    const e = asObj(exps[id]);
    if (!inPeriod(txt(e.date), per) || !(num(e.amount) < 0)) continue;
    if (negCats.indexOf(noteCat(e.category)) === -1) continue;
    offenders.push(txt(e.date) + ' ' + txt(e.category) +
      (txt(e.item) ? ' "' + txt(e.item) + '"' : '') + ' (' + fmt(e.amount) + ')');
  }
  return 'Cannot make the note: ' + listPhrase(negCats) +
    (negCats.length > 1 ? ' add up to less than zero' : ' adds up to less than zero') +
    ' for this period, because of ' +
    (offenders.length === 1 ? 'this expense row: ' : 'these expense rows: ') +
    offenders.join('; ') +
    '. A negative expense is a data mistake — fix or delete ' +
    (offenders.length === 1 ? 'that row' : 'those rows') +
    ' in the Expenses tab, then generate the note again.';
}

/* ------------------------------------------------------------
   STOCK ON HAND — computed, never stored (the same rule as a backlog balance).

     baseline  = the latest stocktake known for the product (by date, then
                 updated_at), else its opening figure
     delivered = Σ Expenses.stock_qty      (legacy rows — deliveries used to
                 ride on the expense that paid for them, and rows already in
                 the sheet keep counting forever)
               + Σ StockDeliveries.qty     ("Stock came in", v2.6.0 — the only
                 door new arrivals use, no money anywhere near it)
                 for the product, date > baseline date
     used      = Σ StockUsage.qty      for the product, date > baseline date
     on hand   = baseline + delivered − used
     low       = reorder point > 0 and on hand <= it

   STRICTLY AFTER the baseline date: a stocktake is an end-of-day figure that
   already reflects that day's deliveries and usage. A BLANK baseline date means
   the whole history counts ('' < any yyyy-MM-dd).

   The arithmetic runs on the phone's OWN rows, which is what makes demo mode and
   offline work honest — and it includes anything still queued, because the local
   appliers have already written it into the mirror. The phone's window starts at
   window_start though, while the server counts the WHOLE history, so bootstrap
   ships each product's totals SPLIT at that date (delivered_before/used_before,
   v2.5.1): this phone sums ONLY its own in-window rows and adds the pre-window
   parts. Every in-window row is therefore counted from the phone's own mirror —
   so a correction, a deletion or a re-closed day moves on-hand IMMEDIATELY. (The
   old "carry floor" — topping the local sums back up to the server's whole-
   history totals — could not tell "rows this phone cannot see" from "rows this
   phone just corrected", and silently undid every downward fix.)

   On hand MAY BE NEGATIVE (the seeded baseline is 0, so usage against stock
   delivered before tracking began legitimately reads below zero). It is shown
   as-is: a negative figure is honest information that a count is needed.
   ------------------------------------------------------------ */
function latestStockCount(product){
  let best = null;
  const byDate = asObj(state.stockCounts);
  for (const d in byDate){
    for (const r of asArr(byDate[d])){
      const c = asObj(r);
      if (txt(c.product) !== product || !isDateStr(c.date)) continue;
      if (!best || c.date > best.date ||
          (c.date === best.date && txt(c.updated_at) >= txt(best.updated_at))) best = c;
    }
  }
  return best;
}

function stockStatusOf(it){
  const item = asObj(it);
  const product = txt(item.product);
  // The baseline the SERVER used (its latest count anywhere, else the opening
  // figure). A count this phone knows about that is not older wins, so a
  // just-queued "Correct the count" re-baselines immediately.
  const server = { date: txt(item.baseline_date), qty: num(item.baseline_qty) };
  let base = server;
  const local = latestStockCount(product);
  if (local && local.date >= server.date){
    base = { date: txt(local.date), qty: num(local.counted_qty) };
  }

  // The rows this phone CANNOT see: the server's totals for dates strictly
  // before window_start (and strictly after ITS baseline). They only apply
  // while this phone measures from the same baseline DATE the server did — a
  // newer local stocktake already contains everything before itself. In demo
  // mode (no sync yet) both parts are simply 0 and every local row is summed.
  const win = txt(asObj(state).window_start);
  const useBefore = base.date === server.date;
  let delivered = useBefore ? num(item.delivered_before) : 0;
  let used = useBefore ? num(item.used_before) : 0;

  // ...plus this phone's OWN in-window rows — its mirror is the truth for what
  // it can see, so a corrected figure, a deleted delivery or a re-closed day
  // moves on-hand at once instead of being topped back up (the deleted v2.5.0
  // carry floor). `!win` (demo / never synced) means every local row counts.
  const exps = asObj(state.expenses);
  for (const id in exps){
    const e = asObj(exps[id]);
    const d = txt(e.date);
    if (txt(e.stock_product) === product && d > base.date && (!win || d >= win)) delivered += num(e.stock_qty);
  }
  // ...and the deliveries logged through "Stock came in" (v2.6.0) — the same
  // window rule as the legacy rows above, because the server's delivered_before
  // already carries the pre-window part of BOTH doors.
  const arrivals = asObj(state.stockDeliveries);
  for (const d in arrivals){
    if (!(d > base.date) || (win && d < win)) continue;
    for (const r of asArr(arrivals[d])){
      if (txt(asObj(r).product) === product) delivered += num(asObj(r).qty);
    }
  }
  const usage = asObj(state.stockUsage);
  for (const d in usage){
    if (!(d > base.date) || (win && d < win)) continue;
    for (const r of asArr(usage[d])){
      if (txt(asObj(r).product) === product) used += num(asObj(r).qty);
    }
  }
  delivered = r2(delivered);
  used = r2(used);

  const onHand = r2(base.qty + delivered - used);
  const reorderAt = num(item.reorder_at);
  return {
    product, unit: txt(item.unit),
    on_hand: onHand,
    low: reorderAt > 0 && onHand <= reorderAt,
    reorder_at: reorderAt,
    baseline_qty: r2(base.qty), baseline_date: base.date,
    delivered_since: delivered, used_since: used
  };
}
/** Every active product with its computed figures, in sheet order. */
function stockStatusList(){ return activeStockItems().map(stockStatusOf); }
/** The unit a product is opened in ("gallon"), whatever list it is on. */
function stockUnitOf(product){
  const it = asArr(state.stockItems).find(x => isObj(x) && x.product === txt(product));
  return txt(it && it.unit);
}
function lowStockList(){ return stockStatusList().filter(s => s.low); }
/** "2 packs" / "1 gallon" / "3" when the sheet has no unit for it. */
function qtyWithUnit(qty, unit){
  const n = num(qty);
  const u = txt(unit).trim();
  if (!u) return fmt(n);
  return fmt(n) + ' ' + (Math.abs(n) === 1 ? u : u + 's');
}

/* ============================================================
   Local mutation appliers — optimistic state mirror updates.
   Also replayed over fresh bootstrap data (reapplyQueue).
   ============================================================ */
// A generated note is stale once local data in its period changes —
// drop it so the UI never shows figures that no longer add up.
function invalidateNoteFor(date){
  if (!lastNote || !date) return;
  const parts = String(lastNote.key).split('_'); // key = start_end
  if (date >= parts[0] && date <= parts[1]) lastNote = null;
}

function applyLocalDay(p){
  ensureShape();
  invalidateNoteFor(p.date);
  const c = computeDay(p);
  const stamp = new Date().toISOString();
  state.days[p.date] = {
    date:p.date, closed:!!p.closed, staff:p.staff || '',
    // The wage, resolved and SNAPSHOTTED exactly as apiSaveDay does it: 0 on a
    // closed day, the figure sent for a half day (an explicit 0 honoured), else
    // today's rate. Stored per day so a later rate change never rewrites history.
    salary: p.closed ? 0
      : ((p.salary === '' || p.salary == null) ? dailySalary() : Math.max(0, num(p.salary))),
    gcash:c.gcash, total:c.total, cash:c.cash,
    custom_amount:c.custom, custom_gcash:c.customGcash,
    // The day's money from excluded skus, stored BESIDE the day's money exactly as
    // the sheet stores it — never inside total, cash or gcash.
    excluded_total:c.excluded,
    // The converted cash and the lid-box count (v2.7.0), stored exactly as the
    // sheet stores them: the conversion is already inside `gcash` above, and the
    // lid boxes touch no money at all.
    gcash_converted:c.gcashConverted, lid_boxes:c.lidBoxes,
    notes:p.notes || '', entry_id:p.entryId, updated_at:stamp
  };
  state.counts[p.date] = c.lines.map(l => ({
    date:p.date, sku:l.sku, sod:l.sod, eod:l.eod, sold:l.sold,
    cheese_qty:l.cheese_qty, regular_qty:l.regular_qty, amount:l.amount, entry_id:p.entryId,
    gcash_qty:l.gcash_qty, gcash_cheese_qty:l.gcash_cheese_qty, gcash_amount:l.gcash_amount,
    // How many of `sold` the special order used (v2.7.0) — the last piece of the
    // snapshot: this row's `amount` prices sold − custom_qty units.
    custom_qty: l.custom_qty,
    // The flag SNAPSHOTTED beside the money it decided, exactly as the sheet stores
    // it (v2.4.1). Whether this line's money counted is a fact about THIS day,
    // settled when it was saved — so a later tick of "counts in the cutoff" cannot
    // restate a cutoff this phone has already shown.
    in_cutoff: l.in_cutoff,
    // ...and the prices themselves (v2.5.0), completing the snapshot exactly as
    // apiSaveDay stores it: a re-save of this date reuses these, so a later
    // price edit can never restate a night already entered.
    price: l.price, cheese_price: l.cheese_price
  }));
  // The server rewrites the whole date block and writes only non-zero rows —
  // mirror that exactly, or a zeroed product would linger on this phone alone.
  // A closed day clears it, same as the server.
  // (`p.supplies` is ignored: a payload queued by the old build still carries it,
  // and the server ignores it too. Purchases live in Expenses and nowhere else.)
  state.stockUsage[p.date] = (p.closed ? [] : asArr(p.stock))
    .filter(s => isObj(s) && txt(s.product) && num(s.qty) > 0)
    .map(s => ({ date:p.date, product:txt(s.product), qty:num(s.qty), entry_id:p.entryId, updated_at:stamp }));
}
function applyLocalExpense(p){
  ensureShape();
  invalidateNoteFor(p.date);
  state.expenses[p.entryId] = {
    date:p.date, category:p.category, item:p.item || '', amount:num(p.amount),
    backlog_ref:p.backlogRef || '', notes:p.notes || '',
    entry_id:p.entryId, updated_at:new Date().toISOString(),
    // The optional delivery riding on this row. Money stays in `amount`, counted
    // once; the quantity feeds only the stock ledger.
    stock_product: txt(p.stockProduct),
    stock_qty: txt(p.stockProduct) ? Math.max(0, num(p.stockQty)) : 0
  };
}
/** A stocktake: it becomes that product's new baseline. Keyed by entry_id like
 *  the sheet, and filed under its date so the ledger can find it. */
function applyLocalStockCount(p){
  ensureShape();
  const date = txt(p.date);
  if (!isDateStr(date)) return;
  const row = { date, product:txt(p.product), counted_qty:Math.max(0, num(p.qty)),
    entry_id:txt(p.entryId), updated_at:new Date().toISOString() };
  // Upsert by entry_id, across every date: a re-sent count must not become two.
  for (const d in asObj(state.stockCounts)){
    state.stockCounts[d] = asArr(state.stockCounts[d]).filter(r => txt(asObj(r).entry_id) !== row.entry_id);
    if (!state.stockCounts[d].length) delete state.stockCounts[d];
  }
  (state.stockCounts[date] = asArr(state.stockCounts[date])).push(row);
}
/** A delivery — whole units ARRIVED, no money anywhere near it (v2.6.0). Keyed
 *  by entry_id like the sheet and filed under its date, so the ledger finds it
 *  and on-hand rises the moment it is saved, online or not. */
function applyLocalStockDelivery(p){
  ensureShape();
  const date = txt(p.date);
  if (!isDateStr(date)) return;
  const row = { date, product:txt(p.product), qty:Math.max(0, num(p.qty)),
    entry_id:txt(p.entryId), updated_at:new Date().toISOString() };
  // Upsert by entry_id, across every date: a re-sent delivery must not become two.
  for (const d in asObj(state.stockDeliveries)){
    state.stockDeliveries[d] = asArr(state.stockDeliveries[d]).filter(r => txt(asObj(r).entry_id) !== row.entry_id);
    if (!state.stockDeliveries[d].length) delete state.stockDeliveries[d];
  }
  (state.stockDeliveries[date] = asArr(state.stockDeliveries[date])).push(row);
}
/** The entered Split for one period, upserted by (start, end) like the sheet. */
function applyLocalCutoffSplit(p){
  ensureShape();
  const per = { start:txt(p.start), end:txt(p.end) };
  if (!isDateStr(per.start) || !isDateStr(per.end)) return;
  state.cutoffInputs[periodKey(per)] = {
    start:per.start, end:per.end, split_amount:Math.max(0, r2(p.amount)),
    entry_id:txt(p.entryId), updated_at:new Date().toISOString()
  };
  invalidateNoteFor(per.start);
}
/* ---- Maintenance writers, applied locally so the screens show the new figures
   straight away and keep showing them offline. Each one touches ONLY the fields
   its action can write, and leaves rows the payload does not mention alone. ---- */
function applyLocalPrices(p){
  ensureShape();
  for (const r of asArr(p.rows)){
    const row = asObj(r);
    const pr = asArr(state.prices).find(x => isObj(x) && x.sku === txt(row.sku));
    if (!pr) continue;                    // the server refuses an unknown sku too
    pr.price = Math.max(0, num(row.price));
    pr.cheese_price = Math.max(0, num(row.cheesePrice));
    pr.active = !!row.active;
    // `inCutoff` is applied ONLY when the payload explicitly carries it — the same
    // rule apiSavePrices enforces. A batch queued by an older build says nothing
    // about the flag, and defaulting it would take every takoyaki sku out of the
    // cutoff the moment that batch replayed.
    if (!(row.inCutoff === null || row.inCutoff === undefined || row.inCutoff === '')){
      pr.in_cutoff = inCutoffFlag(row.inCutoff);
    }
  }
}
function applyLocalSettings(p){
  ensureShape();
  // A generated note can depend on these (the usual split, and the wage a day
  // saved before v2.3.0 counts at), so it is stale the moment they change.
  lastNote = null;
  const inc = asObj(p.settings);
  for (const k in inc){
    // The same whitelist the server enforces. `token` is not on it and must
    // never be: an API that can rewrite its own secret can lock the owner out.
    if (!Object.prototype.hasOwnProperty.call(SETTABLE_SETTINGS, k)) continue;
    const v = inc[k];
    if (v == null || typeof v === 'object') continue;
    state.settings[k] = SETTABLE_SETTINGS[k] === 'money' ? Math.max(0, num(v)) : txt(v);
  }
}
function applyLocalStockItems(p){
  ensureShape();
  let maxSort = 0;
  for (const x of asArr(state.stockItems)) maxSort = Math.max(maxSort, num(asObj(x).sort));
  for (const r of asArr(p.rows)){
    const row = asObj(r);
    const product = txt(row.product);
    if (!product) continue;
    let it = asArr(state.stockItems).find(x => isObj(x) && x.product === product);
    if (!it){
      // A brand-new product is safe to create here (unlike a price): it carries
      // no money, and it starts with a zero baseline like the seeded six.
      it = { product, unit:'', active:true, sort:++maxSort,
        opening_qty:0, opening_date:'', reorder_at:'',
        baseline_qty:0, baseline_date:'', delivered_since:0, used_since:0,
        delivered_before:0, used_before:0 };
      state.stockItems.push(it);
    }
    it.unit = txt(row.unit);
    it.active = !!row.active;
    it.reorder_at = rawNum(row.reorderAt);
    // `sort`, the opening baseline and the ledger figures are never touched here.
  }
}
function applyLocalDeleteExpense(p){
  ensureShape();
  const e = state.expenses[p.entryId];
  if (e) invalidateNoteFor(e.date);
  delete state.expenses[p.entryId];
}

// Every queued action has a local applier, and they are replayed IN ORDER on top
// of a fresh snapshot. An action missing from here would show the old figure
// until the sheet answered — which offline is "forever".
const LOCAL_APPLIERS = {
  saveDay: p => applyLocalDay(p),
  saveExpense: p => applyLocalExpense(p),
  deleteExpense: p => applyLocalDeleteExpense(p),
  saveStockCount: p => applyLocalStockCount(p),
  saveStockDelivery: p => applyLocalStockDelivery(p),
  saveCutoffSplit: p => applyLocalCutoffSplit(p),
  savePrices: p => applyLocalPrices(p),
  saveSettings: p => applyLocalSettings(p),
  saveStockItems: p => applyLocalStockItems(p)
};
function applyLocalMutation(action, payload){
  const apply = Object.prototype.hasOwnProperty.call(LOCAL_APPLIERS, action)
    ? LOCAL_APPLIERS[action] : null;
  if (apply) apply(payload);
}
/** Everything this phone holds that the SHEET does not, replayed on top of a
 *  fresh snapshot — the queue AND the needs-attention list.
 *
 *  The attention list is not optional here. A mutation the server REFUSED
 *  leaves the queue (it would jam every later item) and lives only in
 *  `attention`, so replaying the queue alone left applyBootstrap deleting that
 *  date: it sits inside window_start, the reply does not carry it, and inside
 *  its own window the snapshot is authoritative. The day was wiped off the
 *  phone — the one copy of it anywhere — while the red card still told her to go
 *  and fix it. Never tell someone to fix a day that has vanished.
 *
 *  Order: the queue first, then anything on the attention list the queue does
 *  NOT already carry for the same target. A rejection is older than whatever
 *  was queued after it, so the queue keeps the last word. The appliers are
 *  idempotent, so replaying is always safe. */
function reapplyQueue(){
  const q = asArr(queue);
  for (const item of q) applyLocalMutation(item.action, item.payload);
  for (const a of asArr(attention)){
    // ONLY a 'rejected' entry is work the sheet does not have; it must be
    // replayed or the bootstrap deletes a day the user was just told to fix.
    // 'dropped' and 'gcash' are NOTES about days the sheet already holds —
    // replaying those re-runs applyLocalDay, which recomputes money from
    // today's prices and throws away the snapshot the server just sent, so a
    // price change would silently restate an old day's takings.
    if (a.kind !== 'rejected') continue;
    const target = attnTarget(a.action, a.payload);
    if (target && q.some(item => item.action === a.action &&
        attnTarget(item.action, item.payload) === target)) continue;
    applyLocalMutation(a.action, a.payload);
  }
}

/* ============================================================
   Mutation queue + sync engine.
   Ordered drain, per-item retry on network failure (queue head
   blocks so order is preserved); server-rejected items are
   dropped with the error surfaced. Coalesces repeat saves.
   Triggers: app start, `online`, visibilitychange, after save.
   ============================================================ */
function enqueue(action, payload){
  // Everything queued changed the local mirror first, so any bootstrap reply
  // still in flight is now describing a phone that no longer exists.
  bumpMutations();
  // A fresh mutation for the same day/expense supersedes an earlier failure:
  // whatever went wrong is being re-sent now, so the warning goes.
  clearAttentionFor(action, attnTarget(action, payload));
  if (action === 'saveDay'){
    const i = queue.findIndex(q => q.action === 'saveDay' && q.payload.date === payload.date);
    if (i >= 0){ queue[i] = { action, payload, tries:0 }; persistQueue(); updateStatus(); return; }
  }
  // Everything else is identified by its entryId (the same key the sheet upserts
  // on), so re-saving the same expense, stocktake or split converges on one item.
  if (QUEUE_KEY_FOR[action] === 'entryId' && txt(payload.entryId)){
    const i = queue.findIndex(q => q.action === action && q.payload.entryId === payload.entryId);
    if (i >= 0){ queue[i] = { action, payload, tries:0 }; persistQueue(); updateStatus(); return; }
  }
  if (SNAPSHOT_ACTIONS[action]){
    const i = queue.findIndex(q => q.action === action);
    if (i >= 0){ queue[i] = { action, payload, tries:0 }; persistQueue(); updateStatus(); return; }
  }
  if (action === 'deleteExpense'){
    // Deleting the expense settles every complaint about it too: a rejected
    // save on the attention list is a card telling her to re-send an expense
    // she has just chosen not to have, and it can never clear itself (nothing
    // else will ever enqueue that saveExpense again).
    clearAttentionFor('saveExpense', txt(payload.entryId));
    // Splice in place (never reassign `queue`) so references held by an
    // in-flight drainQueue stay coherent.
    for (let i = queue.length - 1; i >= 0; i--){
      const q = queue[i];
      if (q.action === 'saveExpense' && q.payload.entryId === payload.entryId) queue.splice(i, 1);
    }
  }
  queue.push({ action, payload, tries:0 });
  persistQueue(); updateStatus();
}

/* ---- needs-attention list: record, clear, retry ---- */
function noteAttention(kind, action, payload, message){
  if (!ATTN_KINDS[kind] || !attnTarget(action, payload)) return;
  const a = {
    kind, action, payload,
    date: isDateStr(asObj(payload).date) ? txt(payload.date) : '',
    message: txt(message), at: new Date().toISOString()
  };
  const k = attnKey(a);
  const i = attention.findIndex(x => attnKey(x) === k);
  if (i >= 0) attention[i] = a; else attention.push(a);
  persistAttention();
  updateStatus();
}
function clearAttentionFor(action, target){
  if (!target) return false;
  let changed = false;
  for (let i = attention.length - 1; i >= 0; i--){
    if (attention[i].action === action && attnTarget(action, attention[i].payload) === target){
      attention.splice(i, 1); changed = true;
    }
  }
  if (changed){ persistAttention(); updateStatus(); }
  return changed;
}
function findAttention(key){ return attention.find(a => attnKey(a) === key) || null; }
function attentionForDate(date){ return asArr(attention).filter(a => a.date === date); }
/** Whether the sheet is MISSING this date — a refused SAVE OF THE DAY, and
 *  only that. 'dropped' is a note about one sku on a day that saved; 'gcash'
 *  is a note that a saved day's cash/GCash split needs re-entering; and a
 *  refused expense, stocktake or delivery is its own thing that happens to
 *  CARRY a date — the day itself is sitting in the sheet. Claiming "not in
 *  the sheet" for any of those (as this once did for 'gcash', and until
 *  v2.6.0 for every rejected action) told the owner a day was missing that
 *  was right there — and pointed him at a Sales screen with nothing to fix. */
function dateNotInSheet(date){
  return attentionForDate(date).some(a => a.kind === 'rejected' && a.action === 'saveDay');
}
/** What to say once the receipt has torn off. The tear-off animation runs ~450ms,
 *  so its callback speaks AFTER drainQueue has already said the server refused
 *  the day — and "Saved <date>." was landing last, leaving the final word on
 *  screen a claim that is false. Say nothing when the day is not in the sheet:
 *  the rejection toast and the red card are the truth. */
// What we can HONESTLY say the instant a day is written locally. Claiming
// "Saved" here was a race: it was only true if the server's refusal happened to
// beat the tear-off animation, and on a cold Apps Script start over mobile data
// (~1.5s) "Saved August 3" sat on screen for half a second before a rejection
// replaced it. With prefers-reduced-motion the callback runs synchronously, so
// the refusal always lost. So: only say "Saved" when there is nothing left to
// send; while it is still in flight, say what is actually true.
function daySavedMessage(date){
  if (dateNotInSheet(date)) return '';                       // already refused
  if (!config.apiUrl) return 'Saved on this phone.';           // demo mode: nowhere else to go
  const waiting = asArr(queue).some(q => q.action === 'saveDay' && txt(q.payload.date) === date);
  return waiting ? 'Sending ' + fmtShort(date) + ' to the sheet…'
                 : 'Saved ' + fmtShort(date) + '.';
}

// A day queued BEFORE v2.1 carries a TYPED gcash total and no per-sku GCash
// buckets. The server ignores that figure (rightly — it is computed now), so
// the day replays with the whole cash/GCash split lost: Cash overstated, GCash
// understated for that whole period. Never let that pass silently.
function isLegacyGcashPayload(p){
  if (!isObj(p) || p.closed) return false;
  if (num(p.gcash) <= 0) return false;            // nothing was typed the old way
  if (num(p.customGcash) > 0) return false;       // already entered the new way
  for (const c of asArr(p.counts)){
    const r = asObj(c);
    if (num(r.gcashQty) > 0 || num(r.gcashCheeseQty) > 0) return false;
  }
  return true;
}
function flagLegacyGcashQueue(){
  for (const item of asArr(queue)){
    if (item.action === 'saveDay' && isLegacyGcashPayload(item.payload)){
      noteAttention('gcash', 'saveDay', item.payload, '');
    }
  }
}

class ApiError extends Error{ constructor(msg){ super(msg); this.server = true; } }

// Setup problem (wrong /exec URL, auth interstitial, HTML error page) —
// distinct from being offline, so the UI can say "check the setup".
function badResponseError(msg){
  const err = new Error(msg);
  err.badResponse = true;
  return err;
}

// An error whose message is already plain English and safe to show.
function plainError(msg){
  const err = new Error(msg);
  err.friendly = true;
  return err;
}

// Everything the user reads about a failure goes through here. Raw browser
// strings ("Failed to fetch", "NetworkError", "Unexpected token <") never
// reach the screen — a network/parse failure becomes plain English with a
// next step. Messages we wrote ourselves (server rejection, setup problem)
// pass through unchanged.
function friendlyError(err, nextStep){
  if (err && (err.server || err.badResponse || err.friendly) && err.message) return err.message;
  return 'Cannot reach the server. ' + (nextStep || 'It will try again.');
}

async function api(action, payload){
  if (!config.apiUrl) throw plainError('No API URL is set yet.');
  // POST + JSON string body, NO custom headers -> text/plain default,
  // so Apps Script never sees a CORS preflight. Follow redirects.
  const res = await fetch(config.apiUrl, {
    method:'POST',
    redirect:'follow',
    body: JSON.stringify({ token: config.token, action, payload: payload || {} })
  });
  const text = await res.text();
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw badResponseError('The server did not send app data. Check the API URL.'); }
  if (!res.ok) throw badResponseError('Server error ' + res.status + '. Check the API URL and the deployment.');
  if (!data || data.ok !== true) throw new ApiError((data && data.error) || 'The server reported an error.');
  return data.data;
}

let syncing = false;
let lastSyncError = '';

/* A COUNTER of local change, stamped when a slow request starts and compared
   when its reply lands. A bootstrap takes seconds on a cold Apps Script start,
   and she keeps working: anything saved (or drained) in that window makes the
   in-flight snapshot a picture of a sheet that is already out of date —
   applying it would roll the screen back and, worse, re-run reapplyQueue over
   rows the drain has already reconciled. The reply is simply discarded; the
   next sync asks again. */
let mutationCounter = 0;
function bumpMutations(){ mutationCounter++; }

async function drainQueue(){
  updateStatus();
  if (syncing || !config.apiUrl || !navigator.onLine || queue.length === 0) return;
  syncing = true; updateStatus();
  let attnChanged = false;
  let landed = false;   // did anything reach the sheet this drain?
  while (queue.length){
    const item = queue[0];
    try{
      // Flagged BEFORE it goes: the server will ignore this day's typed GCash
      // total, so the split has to be re-entered by hand.
      if (item.action === 'saveDay' && isLegacyGcashPayload(item.payload)){
        noteAttention('gcash', 'saveDay', item.payload, '');
        attnChanged = true;
      }
      const data = await api(item.action, item.payload);
      // The reply belongs to THE ITEM THAT WAS SENT, by identity. While it was
      // in flight, enqueue may have REPLACED it (a newer save for the same
      // day/entry coalesces into a fresh object) or REMOVED it (a delete
      // superseding a queued save). A superseded item's reply is stale: its
      // sheet write was harmless (the replacement re-sends over the same
      // upsert key), but applying it here would stamp OLD money over the NEWER
      // local rows. So a superseded reply is dropped whole — never applied.
      const i = queue.indexOf(item);
      const superseded = i === -1;
      if (!superseded){
        if (item.action === 'saveDay' && data) applyServerDay(item.payload, data);
        queue.splice(queue.indexOf(item), 1);
        persistQueue();
      }
      // Either way the SHEET changed, so any bootstrap reply still in flight
      // is a picture of a sheet that no longer exists.
      bumpMutations();
      landed = true;
      lastSyncError = '';
    }catch(err){
      // Same identity check as the success path: a refusal of a payload that
      // has already been superseded must not leave a rejection card — the
      // replacement is queued right behind it and is about to speak for that
      // target itself. The stale item is already out of the queue.
      const superseded = queue.indexOf(item) === -1;
      if (err && err.server){
        if (!superseded){
          // REJECTED BY THE SERVER. This is NOT done: the optimistic day is still
          // only on this phone and the sheet has nothing for it. The item leaves
          // the queue (it would jam every later item) but goes on the persisted
          // needs-attention list, so the pill cannot turn green and the Sales
          // screen and More both name the date and quote the server.
          noteAttention('rejected', item.action, item.payload, err.message);
          attnChanged = true;
          const i = queue.indexOf(item);
          if (i !== -1) queue.splice(i, 1);
          persistQueue();
          bumpMutations();
          // Name WHAT was refused (a split refusal announced as "an expense"
          // sends her hunting through the wrong screen's entries — v2.5.1).
          toast(item.action === 'saveDay' && isDateStr(item.payload.date)
            ? 'Not saved: ' + fmtShort(item.payload.date) + ' is still not in the sheet. See the red card on the Sales screen.'
            : item.action === 'saveExpense'
              ? 'Not saved: the server refused an expense. See More.'
              : 'Not saved: the server refused ' +
                (ATTN_WHAT[item.action] ? 'the ' + ATTN_WHAT[item.action].thing : 'an entry') +
                '. See More.');
        }
        lastSyncError = '';
      } else if (err && err.badResponse){
        // Server answered, but not with our API's JSON — a setup problem
        // (wrong URL/deployment), not offline. Keep the item; surface distinctly.
        item.tries = (item.tries || 0) + 1;
        lastSyncError = err.message;
        if (item.tries === 1) toast(err.message);
        break;
      } else {
        // Network trouble — keep the item (and order); retry on next trigger.
        item.tries = (item.tries || 0) + 1;
        lastSyncError = friendlyError(err);
        break;
      }
    }
  }
  syncing = false;
  persistState(); persistQueue(); updateStatus();
  // A new warning has to reach the screen she is actually looking at.
  if (attnChanged) renderPanel(activeTab);
  else if (activeTab === 'ibapa') renderIbapa();
  // Anything that LANDED changed figures only the server computes — a backlog's
  // balance, a whole-history on-hand. Re-bootstrap NOW (v2.5.1), so they are
  // right within the same sync instead of holding the stale figure until the
  // next app start. (Before this, a backlog payment "vanished" the moment it
  // drained: while queued it was subtracted locally; once in the sheet it was
  // in neither the local subtraction nor the old server balance.) doBootstrap
  // carries its own mutation stamp, so a save typed while this reply is in the
  // air still discards it — nothing here can roll fresh work back.
  if (landed) await doBootstrap();
}

// The saveDay RESPONSE is snake_case (same shape we store); older deployments
// sent camelCase, so read both — otherwise the server's authoritative cheese
// split would land as 0 on top of a perfectly good local row.
function applyServerDay(p, data){
  const day = asObj(state.days)[p.date];
  if (!day) return;
  if (data.total != null){ day.total = num(data.total); day.cash = num(data.cash); }
  // Guarded on its own: an older deployment's reply has no `gcash` at all, and
  // reading it as 0 there would wipe a perfectly good computed figure.
  if (data.gcash != null) day.gcash = num(data.gcash);
  // The wage the server actually stored, so the phone shows the figure the cutoff
  // will use rather than its own guess at the rate. Same guard: an older
  // deployment sends no salary, and 0 would read as "a day off".
  if (data.salary != null && data.salary !== '') day.salary = num(data.salary);
  // The day's excluded money, as the sheet stored it. Guarded like the others: an
  // older deployment sends no such key, and reading it as 0 would wipe a figure the
  // phone worked out correctly for itself.
  const excl = pick(data, 'excluded_total', 'excludedTotal');
  if (excl != null && excl !== '') day.excluded_total = num(excl);
  // The converted cash and the lid-box count the sheet stored (v2.7.0). Same
  // guard as the rest: a deployment too old to send them leaves the phone's own
  // figures alone instead of zeroing them.
  const conv = pick(data, 'gcash_converted', 'gcashConverted');
  if (conv != null && conv !== '') day.gcash_converted = num(conv);
  const lids = pick(data, 'lid_boxes', 'lidBoxes');
  if (lids != null && lids !== '') day.lid_boxes = num(lids);
  if (Array.isArray(data.lines)){
    const rows = asArr(asObj(state.counts)[p.date]);
    for (const l of data.lines){
      if (!isObj(l)) continue;
      const r = rows.find(x => x.sku === l.sku);
      if (r){
        r.sold = num(l.sold);
        r.cheese_qty = num(pick(l, 'cheese_qty', 'cheeseQty'));
        r.regular_qty = num(pick(l, 'regular_qty', 'regularQty'));
        r.amount = num(l.amount);
        // Same story as `gcash` above: only overwrite what the reply carries.
        if (pick(l, 'gcash_qty', 'gcashQty') != null) r.gcash_qty = num(pick(l, 'gcash_qty', 'gcashQty'));
        if (pick(l, 'gcash_cheese_qty', 'gcashCheeseQty') != null) r.gcash_cheese_qty = num(pick(l, 'gcash_cheese_qty', 'gcashCheeseQty'));
        if (pick(l, 'gcash_amount', 'gcashAmount') != null) r.gcash_amount = num(pick(l, 'gcash_amount', 'gcashAmount'));
        // The server's own snapshot of whether this line's money counted, which is
        // what the sheet now stores on the row. Guarded like the rest: a deployment
        // too old to send it leaves the phone's own snapshot in place, and that is
        // the right answer — not a blank that would hand the classification back to
        // a live flag that may since have been flipped.
        const snap = pick(l, 'in_cutoff', 'inCutoff');
        if (snap != null) r.in_cutoff = inCutoffFlag(snap);
        // The prices the sheet actually computed this line at (v2.5.0), so a
        // re-save from this phone reuses the sheet's own snapshot. Guarded the
        // same way: an older deployment sends none, and a 0 would re-price the
        // night at nothing.
        if (l.price != null && l.price !== '') r.price = num(l.price);
        const chp = pick(l, 'cheese_price', 'cheesePrice');
        if (chp != null && chp !== '') r.cheese_price = num(chp);
        // The special-order boxes the sheet stored on this line (v2.7.0) — same
        // guard: an older deployment sends none and the phone's figure stands.
        const cq = pick(l, 'custom_qty', 'customQty');
        if (cq != null && cq !== '') r.custom_qty = num(cq);
      }
    }
  }
  // A count row whose sku has left the Prices tab cannot be priced, so the
  // server DROPS it and says which ones. Mirror that here and tell her plainly —
  // silently keeping the row would leave the phone and the sheet disagreeing.
  const dropped = asArr(pick(data, 'dropped_skus', 'droppedSkus')).map(txt).filter(Boolean);
  if (dropped.length) applyDroppedSkus(p, dropped);
  persistState();
}

// A sku that has left the Prices tab has no label any more, and "box6" is not
// how anyone reads it. Fall back to a readable form of the sku itself so the
// message says "Box 6", the way the sheet spells it.
function prettySku(sku){
  const s = txt(sku);
  const m = /^([A-Za-z]+)(\d+)$/.exec(s);
  const word = m ? m[1] : s;
  const pretty = word.charAt(0).toUpperCase() + word.slice(1) + (m ? ' ' + m[2] : '');
  return pretty || s;
}
function skuLabel(sku){
  const pr = asArr(state.prices).find(x => isObj(x) && x.sku === sku);
  return txt(pr && pr.label) || prettySku(sku);
}
function listPhrase(names){
  if (names.length <= 1) return txt(names[0]);
  return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
}
function applyDroppedSkus(p, skus){
  const rows = asArr(asObj(state.counts)[p.date]);
  if (rows.length) state.counts[p.date] = rows.filter(r => skus.indexOf(txt(r.sku)) === -1);
  const one = skus.length === 1;
  const msg = listPhrase(skus.map(skuLabel)) + (one ? ' is' : ' are') +
    ' no longer in the Prices tab, so ' + (one ? 'its' : 'their') +
    ' counts were removed from this day.';
  noteAttention('dropped', 'saveDay', p, msg);
  toast(msg);
  // Reload the form so it shows what the sheet actually holds now — but never
  // over half-typed work.
  if (isObj(benta) && benta.date === p.date && !benta.dirty){
    loadBentaForm(p.date);
    if (activeTab === 'benta') renderPanel('benta');
  }
}

async function doBootstrap(){
  if (!config.apiUrl || !navigator.onLine) return false;
  // Stamp the moment the request LEAVES. If anything is saved locally — or the
  // drain lands anything on the sheet — while the reply is in the air, that
  // reply describes a sheet (and a phone) that no longer exists: applying it
  // would roll fresh work back to the pre-drain rows. Discard it; the next
  // sync trigger asks again and gets a current snapshot.
  const stamp = mutationCounter;
  try{
    const data = await api('bootstrap', {});
    if (mutationCounter !== stamp) return false;   // stale before it arrived
    applyBootstrap(data);
    persistState();
    renderPanel(activeTab);
    updateStatus();
    return true;
  }catch(e){
    console.error(e);
    lastSyncError = friendlyError(e);
    return false;
  }
}

// Data from the sheet gets exactly the same treatment as data from storage:
// every row through its element-wise normalizer, bad rows skipped one by
// one. One malformed row must cost that row only — never the whole sync.
function applyBootstrap(data){
  ensureShape();
  if (!isObj(data)) return;
  mergeSettings(state.settings, data.settings);
  if (Array.isArray(data.prices)){
    const prices = data.prices.map(normPrice).filter(Boolean);
    if (prices.length) state.prices = prices;       // no usable prices -> keep what we have
  }
  // The stock picklist follows the same rule as prices: an empty or all-bad list
  // keeps what we have, so a sheet that has not been migrated yet (no StockItems
  // tab) still shows the seeded card.
  if (Array.isArray(data.stockItems)){
    const items = data.stockItems.map(normStockItem).filter(Boolean);
    if (items.length) state.stockItems = items;
  }
  if (Array.isArray(data.backlogs)) state.backlogs = data.backlogs.map(normBacklog).filter(Boolean);

  // REPLACE, never merge, for every date the snapshot covers. Merging left a
  // date whose rows had been CLEARED in the sheet holding its old rows on this
  // phone forever — and stock rows move on-hand, which is money's twin: they say
  // what has to be bought. Counts and stock usage are both rewritten per date by
  // the server, so the snapshot is the truth for a date it mentions.
  const dayMap   = data.days != null        ? toRowMap(data.days, normDay, r => r.date)      : null;
  const countMap = data.counts != null      ? toCountsMap(data.counts)                       : null;
  const useMap   = data.stockUsage != null  ? toDateListMap(data.stockUsage, normStockUse)   : null;
  const cntMap   = data.stockCounts != null ? toDateListMap(data.stockCounts, normStockCount): null;
  const dlvMap   = data.stockDeliveries != null ? toDateListMap(data.stockDeliveries, normStockDelivery) : null;
  // The window the snapshot speaks for. The server states it (window_start) so
  // that "older than this reply covers" and "deleted in the sheet" are
  // distinguishable: inside the window the snapshot is the truth and a row it
  // omits is GONE; outside it this phone keeps its own history. Without the
  // explicit boundary a day or expense deleted by hand lingered forever.
  // An older deployment that does not send it falls back to the cautious
  // behaviour — only dates the reply mentions are touched, nothing is removed.
  const winStart = txt(pick(data, 'window_start', 'windowStart')).trim();
  // Remembered so the Cutoff screen can say plainly when a period reaches
  // further back than this phone can see (the note the server generates is
  // always computed from the whole sheet, so IT stays complete).
  if (isDateStr(winStart)) state.window_start = winStart;
  if (winStart){
    // The server stated its window, so inside it the snapshot is complete and
    // authoritative for EVERY collection: a date it omits was deleted. One
    // shared set is right here precisely because the reply covers all of them.
    const covered = Object.create(null);
    for (const m of [dayMap, countMap, useMap, cntMap, dlvMap]){ if (m) for (const d in m) covered[d] = true; }
    for (const store of [state.days, state.counts, state.stockUsage, state.stockCounts, state.stockDeliveries]){
      for (const d in asObj(store)) if (d >= winStart) covered[d] = true;
    }
    if (dayMap) replaceCovered(state.days, dayMap, covered, true);
    if (countMap) replaceCovered(state.counts, countMap, covered);
    if (useMap)   replaceCovered(state.stockUsage, useMap, covered);
    if (cntMap)   replaceCovered(state.stockCounts, cntMap, covered);
    if (dlvMap)   replaceCovered(state.stockDeliveries, dlvMap, covered);
  } else {
    // No stated window (older deployment): stay cautious. Only touch dates the
    // reply itself mentions, each collection judged on its OWN dates — sharing
    // one set across them let a date carrying stock rows delete that date's day —
    // and never remove a day, which is the pre-window behaviour.
    if (dayMap) Object.assign(state.days, dayMap);
    if (countMap) replaceCovered(state.counts, countMap, ownDates(countMap));
    if (useMap)   replaceCovered(state.stockUsage, useMap, ownDates(useMap));
    if (cntMap)   replaceCovered(state.stockCounts, cntMap, ownDates(cntMap));
    if (dlvMap)   replaceCovered(state.stockDeliveries, dlvMap, ownDates(dlvMap));
  }
  // The entered splits. Period-keyed, not date-keyed: every row whose period ENDS
  // inside the window ships, so inside that span the reply is authoritative and a
  // row it omits was deleted in the sheet.
  if (data.cutoffInputs != null){
    const inputs = toRowMap(data.cutoffInputs, normCutoffInput, r => periodKey(r));
    if (winStart){
      for (const k in asObj(state.cutoffInputs)){
        const end = txt(asObj(state.cutoffInputs[k]).end);
        if (end && end >= winStart && !inputs[k]) delete state.cutoffInputs[k];
      }
    }
    Object.assign(state.cutoffInputs, inputs);
  }
  if (data.expenses != null){
    const expMap = toRowMap(data.expenses, normExpense, r => r.entry_id);
    // Expenses are keyed by entry_id, so "covered" is judged on each row's date.
    if (winStart){
      const exps = asObj(state.expenses);
      for (const id in exps){
        const d = txt(asObj(exps[id]).date);
        if (d && d >= winStart && !expMap[id]) delete state.expenses[id];
      }
    }
    Object.assign(state.expenses, expMap);
  }
  // Local, not-yet-synced edits win over the snapshot. Guarded: one odd
  // queued payload must not throw away the snapshot we just applied.
  try{ reapplyQueue(); }catch(err){ console.error(err); }
}

// Inside the snapshot's window the server is the authority: a date it lists no
// rows for HAS no rows, so the stale ones go instead of lingering.
function ownDates(map){
  const out = Object.create(null);
  for (const d in asObj(map)) out[d] = true;
  return out;
}

// Inside `covered`, the snapshot is the truth: a date it carries is replaced, a
// date it omits is deleted. `single` distinguishes state.days (one object per
// date) from the list-valued collections (counts/supplies/stock usage).
// Anything still queued is restored right after by reapplyQueue().
function replaceCovered(target, incoming, covered, single){
  for (const d in covered){
    const row = incoming[d];
    const has = single ? isObj(row) : asArr(row).length > 0;
    if (has) target[d] = row;
    else delete target[d];
  }
}

function backlogBalance(bl){
  let base;
  if (bl.balance != null && bl.balance !== '') base = num(bl.balance);
  else {
    let paid = 0;
    const exps = asObj(state.expenses);
    for (const id in exps){
      const e = asObj(exps[id]);
      if (e.category === 'Backlog' && e.backlog_ref === bl.name) paid += num(e.amount);
    }
    base = num(bl.total_amount) - paid;
  }
  // Subtract queued (unsynced) payments the server snapshot can't know about.
  for (const q of asArr(queue)){
    if (q.action === 'saveExpense' && q.payload.category === 'Backlog' && q.payload.backlogRef === bl.name){
      if (bl.balance != null && bl.balance !== '') base -= num(q.payload.amount);
    }
  }
  return base;
}

/* ============================================================
   Shared chrome — status pill, demo banner, toast, tabs
   ============================================================ */
let activeTab = 'benta';
const $ = id => document.getElementById(id);

function updateStatus(){
  const pill = $('statusPill');
  ensureShape();
  // "Synced" is a promise that the sheet has everything. While anything is on
  // the needs-attention list that promise is false, so the pill never goes
  // green. Only a day the server REFUSED is actually missing money and says so
  // in red; a dropped sku and a legacy GCash split are notes about days the
  // sheet already holds, so they are amber — informational, never an alarm.
  const needs = asArr(attention).length;
  const missing = asArr(attention).filter(a => a.kind === 'rejected').length;
  if (!config.apiUrl){ pill.className = 'pill demo'; pill.textContent = 'Demo'; }
  else if (!navigator.onLine){ pill.className = 'pill off'; pill.textContent = 'Offline'; }
  else if (syncing){ pill.className = 'pill pending'; pill.textContent = 'Syncing…'; }
  else if (queue.length){ pill.className = 'pill pending'; pill.textContent = queue.length + ' waiting'; }
  else if (missing){ pill.className = 'pill attn'; pill.textContent = missing === 1 ? '1 not saved' : missing + ' not saved'; }
  else if (needs){ pill.className = 'pill pending'; pill.textContent = needs === 1 ? '1 to check' : needs + ' to check'; }
  else { pill.className = 'pill ok'; pill.textContent = 'Synced'; }
  $('demoBanner').hidden = !!config.apiUrl;
  $('brandBranch').textContent = asObj(state.settings).branch ? state.settings.branch : 'Takoyaki tracker';
}

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

const TABS = ['benta','gastos','cutoff','ibapa'];
function showTab(name){
  activeTab = name;
  for (const t of TABS){
    $('panel-' + t).hidden = t !== name;
    $('tab-' + t).setAttribute('aria-selected', String(t === name));
  }
  renderPanel(name);
  updateDayStrip();
  window.scrollTo(0, 0);
}

/* A re-render replaces the whole Sales panel, which on a phone means the field
   she is typing in is destroyed: focus gone, keyboard closed, half a figure
   lost. A background bootstrap must never do that — hold the re-render while a
   field inside the panel has focus and flush it the moment she is out of it. */
let bentaRenderPending = false;
function bentaIsEditing(){
  const p = $('panel-benta'), a = document.activeElement;
  if (!p || !a || !p.contains(a)) return false;
  const tag = (a.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select';
}
function flushBentaRender(){
  if (!bentaRenderPending || bentaIsEditing()) return;
  bentaRenderPending = false;
  if (activeTab === 'benta') renderPanel('benta');
}

function renderPanel(name){
  ensureShape();
  try{
    if (name === 'benta'){
      if (bentaIsEditing()){ bentaRenderPending = true; return; }
      bentaRenderPending = false;
      renderBenta();
    }
    else if (name === 'gastos') renderGastos();
    else if (name === 'cutoff') renderCutoff();
    else renderIbapa();
  }catch(err){
    // A blank screen with no explanation is the worst outcome for a
    // non-technical user — always leave something readable on screen.
    console.error(err);
    const panel = $('panel-' + name);
    if (panel) panel.innerHTML = '<div class="card"><p class="err">This screen could not be shown.</p>' +
      '<p class="hint" style="margin-top:6px;">Close the app and open it again. Your saved data is still on this phone.</p></div>';
  }
}

/* ============================================================
   SALES (benta panel) — daily entry screen with the live receipt strip
   ============================================================ */
let benta = null;

function loadBentaForm(date){
  ensureShape();
  const d = isDateStr(date) ? date : todayStr();
  const hasDay = isObj(state.days[d]);
  const day = asObj(state.days[d]);
  const counts = asArr(state.counts[d]).filter(isObj);
  const staff = staffList();
  const prev = isObj(benta) ? benta : {};
  // Rows = union of currently-active SKUs and SKUs already recorded for
  // this date, so editing an old day after a SKU is deactivated still
  // round-trips that SKU's counts instead of silently erasing them.
  const rows = [];
  const seen = Object.create(null);   // keyed by sku — sheet data, prototype-free
  const rowOf = (sku, c) => ({
    sku,
    sod:num(c.sod), eod:num(c.eod),
    // The three ENTERED buckets. regular_qty is not loaded: it is always
    // re-derived, so it can never fall out of step with the other three.
    cheese:num(c.cheese_qty), gcash:num(c.gcash_qty), gcashCheese:num(c.gcash_cheese_qty),
    // Boxes the special order used from this sku (v2.7.0), loaded from the same
    // snapshot the sheet stores. 0 on every row saved before the column existed.
    custom:num(c.custom_qty)
  });
  for (const pr of activePrices()){
    rows.push(rowOf(pr.sku, counts.find(x => x.sku === pr.sku) || {}));
    seen[pr.sku] = true;
  }
  for (const c of counts){
    if (!c.sku || seen[c.sku]) continue;
    seen[c.sku] = true;
    rows.push(rowOf(c.sku, c));
  }
  // Opening = previous close (v2.7.0): a date with NO saved counts pre-fills
  // each box sku's SOD from that sku's EOD on the latest saved day strictly
  // before it. A prefill, never a lock — she edits it like anything typed — and
  // a day that already has saved counts always loads its own figures above.
  if (!counts.length){
    for (const r of rows){
      if (!isBoxSku(r.sku)) continue;
      const prevEod = prevEodFor(r.sku, d);
      if (prevEod !== '') r.sod = prevEod;
    }
  }
  const stock = bentaStockRows(d);
  benta = {
    date: d,
    closed: !!day.closed,
    staff: txt(day.staff) || (staff[0] || ''),
    custom: num(day.custom_amount),
    customGcash: num(day.custom_gcash),
    // The v2.7.0 figures, loaded back like the custom order: 0 on a fresh date
    // and on every day saved before the columns existed. The conversion is
    // SIGNED in the sheet (v2.7.3: negative = GCash cashed out of the tin);
    // the form holds its size and its direction separately, so nobody ever
    // types or reads a minus sign.
    gcashConverted: Math.abs(num(day.gcash_converted)),
    convDir: num(day.gcash_converted) < 0 ? 'in' : 'out',
    lidBoxes: num(day.lid_boxes),
    // The day's WAGE. A saved day shows the figure it was saved with (so history
    // never moves when the rate changes); a new day starts at today's rate, and
    // it can be lowered for a half day. A CLOSED day stores 0 and hides the
    // field, so it shows the usual rate instead — otherwise turning "Closed
    // today" back off would leave a silent ₱0 wage on a day that was worked.
    salary: (hasDay && !day.closed) ? daySalary(day) : dailySalary(),
    notes: txt(day.notes),
    rows,
    stock,
    // Open a card that already has entries so an edited day shows everything it
    // holds; otherwise remember whatever the user had open.
    stockOpen: !!prev.stockOpen || stock.some(s => num(s.qty) > 0),
    // Same rule for the wage: collapsed when it is simply the usual rate (which
    // is almost every night), open whenever the day carries a different figure —
    // a half day, or a day nobody was paid. Set below, once `benta` exists.
    wageOpen: !!prev.wageOpen,
    // The "Sold with GCash" card (v2.7.0) follows the same collapsible rule:
    // closed on an all-cash night (every figure 0), open the moment it holds
    // anything — nothing already entered is ever hidden. Set below.
    gcashOpen: !!prev.gcashOpen,
    saved: hasDay,
    dirty: false,       // set on any user edit; cleared on load/save
    fromDraft: false    // true when unsaved typing was restored for this date
  };
  if (wageIsCustom()) benta.wageOpen = true;
  if (gcashHeld()) benta.gcashOpen = true;
  // Unsaved typing for this date always wins over what is stored: changing the
  // date, backgrounding the app or a reload must not cost her the numbers she
  // has already read out of the notebook.
  applyBentaDraft(drafts[d]);
}

/** ONE sku's EOD on the latest saved day strictly before `date`, from local
 *  state — or '' when this phone holds no prior day for it. What is left on the
 *  shelf at close is what the stall opens with, so a fresh date's SOD pre-fills
 *  from here (v2.7.0). A prefill only: 0 stays a legitimate answer, and '' means
 *  "say nothing" rather than "say 0". */
function prevEodFor(sku, date){
  let bestDate = '', best = '';
  const byDate = asObj(state.counts);
  for (const d in byDate){
    if (!isDateStr(d) || !(d < txt(date)) || d < bestDate) continue;
    for (const r of asArr(byDate[d])){
      if (txt(asObj(r).sku) !== txt(sku)) continue;
      bestDate = d;
      best = num(asObj(r).eod);
      break;
    }
  }
  return bestDate ? best : '';
}

/** Whether the form holds ANY GCash figure tonight — the one rule for whether
 *  the "Sold with GCash" card may start closed, read at load and after a draft
 *  is restored so the two can never disagree. */
function gcashHeld(){
  return asArr(asObj(benta).rows).some(r => num(asObj(r).gcash) > 0 || num(asObj(r).gcashCheese) > 0) ||
    num(asObj(benta).gcashConverted) > 0;
}

// Put a stashed draft back on the form. Rows/items are matched BY NAME, and a
// name the form does not have (a sku or picklist item removed since) is
// appended, so nothing typed is ever dropped on the floor.
function applyBentaDraft(dr){
  if (!isObj(dr)) return;
  benta.closed = !!dr.closed;
  benta.staff = txt(dr.staff) || benta.staff;
  benta.custom = dr.custom;
  benta.customGcash = dr.customGcash;
  // A draft from the old build has no salary in it: keep the loaded figure rather
  // than blanking a wage nobody chose to change. The v2.7.0 fields get the same
  // guard for the same reason — a pre-2.7.0 draft says nothing about them.
  if (dr.salary !== '' && dr.salary != null) benta.salary = dr.salary;
  if (dr.gcashConverted !== '' && dr.gcashConverted != null) benta.gcashConverted = dr.gcashConverted;
  // A pre-v2.7.3 draft has no direction: keep the form's (cash → GCash).
  if (dr.convDir === 'in' || dr.convDir === 'out') benta.convDir = dr.convDir;
  if (dr.lidBoxes !== '' && dr.lidBoxes != null) benta.lidBoxes = dr.lidBoxes;
  benta.notes = txt(dr.notes);
  for (const d of asArr(dr.rows)){
    const row = benta.rows.find(r => r.sku === d.sku);
    if (row){
      row.sod = d.sod; row.eod = d.eod; row.cheese = d.cheese; row.gcash = d.gcash; row.gcashCheese = d.gcashCheese;
      if (d.custom !== '' && d.custom != null) row.custom = d.custom;
    }
    else benta.rows.push({ sku:d.sku, sod:d.sod, eod:d.eod, cheese:d.cheese, gcash:d.gcash, gcashCheese:d.gcashCheese, custom:raw1(d.custom) });
  }
  for (const d of asArr(dr.stock)){
    const row = benta.stock.find(r => r.product === d.product);
    if (row) row.qty = d.qty;
    else benta.stock.push({ product:d.product, unit:d.unit, qty:d.qty });
  }
  if (benta.stock.some(s => num(s.qty) > 0)) benta.stockOpen = true;
  // A restored draft must show everything it holds, the wage included —
  // and any GCash figure it carries.
  if (wageIsCustom()) benta.wageOpen = true;
  if (gcashHeld()) benta.gcashOpen = true;
  benta.dirty = true;      // it is still unsent work
  benta.fromDraft = true;
}

// Keep whatever is half-typed for the date currently on the form. Called before
// the date changes, and when the app is backgrounded or closed.
function stashBentaDraft(){
  if (!isObj(benta) || !benta.dirty || !isDateStr(benta.date)) return;
  drafts[benta.date] = {
    date: benta.date, closed: !!benta.closed, staff: txt(benta.staff),
    custom: raw1(benta.custom), customGcash: raw1(benta.customGcash),
    gcashConverted: raw1(benta.gcashConverted), convDir: txt(benta.convDir), lidBoxes: raw1(benta.lidBoxes),
    salary: raw1(benta.salary), notes: txt(benta.notes),
    rows: asArr(benta.rows).map(r => ({
      sku: txt(r.sku), sod: raw1(r.sod), eod: raw1(r.eod),
      cheese: raw1(r.cheese), gcash: raw1(r.gcash), gcashCheese: raw1(r.gcashCheese),
      custom: raw1(r.custom)
    })),
    stock: asArr(benta.stock).map(s => ({ product: txt(s.product), unit: txt(s.unit), qty: raw1(s.qty) }))
  };
  persistDrafts();
}
function clearBentaDraft(date){
  if (drafts[date] != null){ delete drafts[date]; persistDrafts(); }
}

// The stock picklist follows the SKU rule: every active product, plus any product
// this date already has a figure for, so editing an old day cannot silently erase
// an entry whose row was later deactivated or renamed.
// A blank (not 0) quantity means "nothing opened" — nicer to read than a column
// of zeroes, and it is what keeps the row out of the payload entirely.
function bentaStockRows(d){
  const saved = asArr(asObj(state.stockUsage)[d]).filter(isObj);
  const rows = [], seen = Object.create(null);   // keyed by product name — prototype-free
  for (const it of activeStockItems()){
    if (seen[it.product]) continue;
    seen[it.product] = true;
    const hit = saved.find(r => r.product === it.product);
    rows.push({ product:it.product, unit:txt(it.unit), qty: hit ? num(hit.qty) : '' });
  }
  for (const r of saved){
    if (!r.product || seen[r.product]) continue;
    seen[r.product] = true;
    const it = asArr(state.stockItems).find(x => isObj(x) && x.product === r.product);
    rows.push({ product:r.product, unit:txt(it && it.unit), qty:num(r.qty) });
  }
  return rows;
}

/**
 * The three bucket figures one row SENDS — the same values validateBenta
 * judges, so the phone can never refuse a figure it was not going to send, or
 * send a figure it never showed.
 *
 * A group=simple sku IN the cutoff has no cheese version, no cheese stepper and
 * nothing to fix, so a stray cheese figure is sent as 0 (the silent-zero rule —
 * the server enforces the real guard). An EXCLUDED sku sends its buckets
 * EXACTLY AS THE ROW HOLDS THEM: on every night entered since the sku was
 * excluded they are 0, and a non-zero one — an old day from before the flag
 * flipped — is money she has already read, so it must be seen and zeroed on
 * purpose. Its stepper renders (renderBenta's oldBuckets), validateBenta
 * refuses the save in the server's own words, and nothing is zeroed behind her
 * back. Sending 0 while validating the raw figure was the dead end: the save
 * was refused over a number that was neither sent nor fixable.
 */
/** Whether a sku's money counts for the day ON THE FORM: the loaded row's own
 *  snapshot first, else the live flag — cutoffOnDay over the form's date, so the
 *  card, the receipt, the validator and the payload all answer with one voice
 *  (v2.5.1). A sku with no price row and no snapshot counts IN, as always. */
function bentaRowInCutoff(sku){
  const pr = asArr(state.prices).find(p => isObj(p) && p.sku === txt(sku));
  return cutoffOnDay(storedPricesFor(asObj(benta).date), pr || { sku: txt(sku), in_cutoff: true });
}

function sentBuckets(r){
  const row = asObj(r);
  if (!bentaRowInCutoff(row.sku)){
    return { cheeseQty: num(row.cheese), gcashQty: num(row.gcash), gcashCheeseQty: num(row.gcashCheese) };
  }
  const cheeseSent = isBoxSku(row.sku);
  return {
    cheeseQty: cheeseSent ? num(row.cheese) : 0,
    gcashQty: num(row.gcash),
    gcashCheeseQty: cheeseSent ? num(row.gcashCheese) : 0
  };
}

function bentaPayload(){
  const closed = !!benta.closed;
  // Clamp here so the queued payload always matches what applyLocalDay /
  // computeDay stored locally — and so it can never breach a server rule.
  const custom = closed ? 0 : Math.max(0, num(benta.custom));
  // The date's stored snapshots, read ONCE for every row below.
  const snap = storedPricesFor(benta.date);
  return {
    date: benta.date,
    closed,
    staff: benta.staff,
    customAmount: custom,
    customGcash: closed ? 0 : Math.min(custom, Math.max(0, num(benta.customGcash))),
    // Tin cash swapped for GCash and the lid-box count (v2.7.0). Closed day
    // sends 0 for both, exactly as the server forces. The conversion is NOT
    // clamped to the day's cash here: validateBenta refuses that state in the
    // server's own sentence, so an over-large figure never queues at all.
    // SIGNED on the wire (v2.7.3): the direction chip carries the sign, the
    // typed amount never does. 'in' = GCash cashed out of the tin = negative.
    gcashConverted: closed ? 0
      : (benta.convDir === 'in' ? -1 : 1) * Math.max(0, num(benta.gcashConverted)),
    lidBoxes: closed ? 0 : Math.max(0, num(benta.lidBoxes)),
    // Boxes the special order used, per sku (v2.7.0) — only rows that actually
    // hold one travel, exactly as only opened stock travels. Sent as the row
    // holds them: a figure validateBenta refuses (an excluded sku's, a fraction)
    // blocks the save, so nothing here can queue what the server refuses.
    customBoxes: closed ? [] : asArr(benta.rows)
      .filter(r => num(r.custom) > 0)
      .map(r => ({ sku: r.sku, qty: num(r.custom) })),
    // The wage for this day. Sent as a figure so the sheet snapshots exactly what
    // is on screen; left OUT when the field is empty, which tells the server to
    // use the current rate. A closed day costs nothing and the server forces 0.
    salary: closed ? 0
      : (benta.salary === '' || benta.salary == null ? '' : Math.max(0, num(benta.salary))),
    notes: benta.notes,
    // REQUEST keys are camelCase. `gcash` is deliberately NOT sent: the server
    // computes it from these buckets and ignores a typed figure.
    // The buckets are sentBuckets(r) — the ONE reading shared with validateBenta,
    // so the validator only ever complains about figures that would really be
    // sent, and every figure sent was on the screen (see sentBuckets for the
    // excluded-sku rule that broke this symmetry once).
    // Each row also carries the price/cheesePrice/inCutoff the screen DISPLAYED
    // (v2.5.1) — the same effective values computeDay priced the receipt with.
    // The server uses them for a sku's FIRST row on the date, so a save queued
    // offline lands at the money the receipt and the tin showed, never at
    // whatever the price list says when it finally syncs. On a re-save the
    // sheet's own stored snapshots win, so a stale queued value cannot re-price
    // a night either. A sku with no price row sends none (the server drops its
    // counts and says so — there is nothing truthful to send).
    counts: closed ? [] : asArr(benta.rows).map(r => {
      const b = sentBuckets(r);
      const out = {
        sku:r.sku, sod:num(r.sod), eod:num(r.eod),
        cheeseQty: b.cheeseQty,
        gcashQty: b.gcashQty,
        gcashCheeseQty: b.gcashCheeseQty
      };
      const pr = asArr(state.prices).find(p => isObj(p) && p.sku === r.sku);
      if (pr){
        const eff = priceOnDay(snap, pr);
        out.price = num(eff.price);
        out.cheesePrice = num(eff.cheese_price);
        out.inCutoff = cutoffOnDay(snap, pr);
      }
      return out;
    }),
    // Only what was actually opened travels: the server writes non-zero rows
    // only, and a 0 for a product that has since left the sheet's list would be
    // rejected as unknown for no reason.
    // (No `supplies` array any more — that card is retired. Purchases go under
    // Expenses, which is now the only place they can live.)
    stock: closed ? [] : asArr(benta.stock)
      .filter(s => num(s.qty) > 0).map(s => ({ product:s.product, qty:num(s.qty) }))
  };
}

// SKU list to render: active prices plus any SKU already on the form
// (deactivated-but-recorded, or activated after the form was loaded).
function bentaSkuList(){
  const list = activePrices().slice();
  const seen = Object.create(null);   // keyed by sku — sheet data, prototype-free
  for (const pr of list) seen[pr.sku] = true;
  for (const r of asArr(benta.rows)){
    if (seen[r.sku]) continue;
    seen[r.sku] = true;
    const pr = asArr(state.prices).find(p => p.sku === r.sku);
    // A sku that has LEFT the Prices tab still has to render every figure it
    // already holds, so the placeholder is group:'box' — otherwise no cheese
    // stepper appears while a loaded cheese count still fails validation, and
    // the day can never be saved again. It cannot be priced, so the server
    // drops it (and says so); the card says that too.
    // in_cutoff true on the placeholder for the same reason a blank cell is true:
    // a sku nobody can look up must never lose its money silently.
    list.push(pr || { sku:r.sku, label:skuLabel(r.sku), group:'box', size:'', price:0, cheese_price:'', active:false, in_cutoff:true, missing:true });
  }
  return list;
}

// Plain-English breakdown of one sku row: how the boxes that sold split across
// the four buckets, and what the row is worth. Every bucket is a SUBSET of sold
// (same container — a dearer filling, or a different way of paying), so raising
// one only ever moves a box from one bucket to another. Spelling all of them out
// is what stops a stepper looking like it did nothing.
function skuSplitText(pr, row){
  const sold = Math.max(0, num(row.sod) - num(row.eod));
  if (!sold) return 'Enter the start and end counts to see the total.';
  const isBox = pr.group === 'box';
  const price = num(pr.price), cheesePrice = num(pr.cheese_price);
  // An EXCLUDED sku has no cheese and no payment split, so there is one figure to
  // show — and the line says out loud that it is not in the day's total.
  if (!inCutoffFlag(pr.in_cutoff)){
    return sold + ' × ' + peso(price) + ' = ' + peso(r2(sold * price)) + '  ·  not in the day’s total';
  }
  // Clamped in sequence, the same way computeDay clamps for the receipt, so
  // this line never spells out more boxes than were sold.
  const cheese = isBox ? clampQty(row.cheese, sold) : 0;
  const gcash = clampQty(row.gcash, sold - cheese);
  const gcashCheese = isBox ? clampQty(row.gcashCheese, sold - cheese - gcash) : 0;
  const regular = Math.max(0, sold - cheese - gcash - gcashCheese);
  const amount = (regular + gcash) * price + (cheese + gcashCheese) * cheesePrice;
  // Read in the same two groups the steppers are arranged in, and show each
  // group's peso subtotal — those are exactly the Cash and GCash figures on the
  // receipt, so this line explains where the receipt's split comes from.

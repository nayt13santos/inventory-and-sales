      ' Take the old count on its card back to 0.';
  }
  const held = [];
  if (num(r.cheese) !== 0) held.push('cheese');
  if (num(r.gcash) !== 0) held.push('GCash');
  if (num(r.gcashCheese) !== 0) held.push('GCash cheese');
  if (held.length){
    return label + ' is kept out of the cutoff, so its money is not split into cash and GCash: its ' +
      listPhrase(held) + ' count' + (held.length > 1 ? 's' : '') +
      ' must be 0. Its total is shown on its own line.' +
      ' Take the old count' + (held.length > 1 ? 's' : '') + ' on its card back to 0 — or, if ' + label +
      ' should still count in the cutoff, turn “Counts in the cutoff” back on under More → Maintenance.';
  }
  // An excluded sku must be `group=simple`: one plain quantity at one price. A box
  // kept out of the cutoff is a sheet that contradicts the app — savePrices refuses
  // to create it, and saveDay refuses to save a day against one made by hand — so
  // say the same thing here instead of queueing a day that cannot land.
  if (isBoxSku(sku)){
    return label + ' is kept out of the cutoff, but it is still set up as a box with a cheese ' +
      'version. An item kept out must be a simple item: one price, no cheese and no GCash. ' +
      'Turn “Counts in the cutoff” back on for it in Maintenance, or change its group to simple ' +
      'in the Prices tab of the sheet.';
  }
  return '';
}

/* Every rule apiSaveDay() enforces is mirrored here, in the same order and with
   the same plain-English wording, so the phone never queues work the server will
   refuse. Error keys are NAMESPACED ('sku:', 'supply:', 'stock:') so a sku or an
   item literally named 'custom' cannot collide with a fixed slot — and a name
   like '__proto__' cannot touch the prototype (the accumulator has none). */
/* ============================================================
   "DOES THIS NIGHT LOOK RIGHT?" (v2.10.0)
   ------------------------------------------------------------
   Every other guard in this app judges tonight against ITSELF — the arithmetic
   has to hold, a start count needs an end count, a bucket cannot exceed what
   sold. None of them can see the one failure this week actually produced twice:
   a figure that is perfectly consistent and simply WRONG. nori read "nothing
   sold" for weeks because its start count was stuck at 0, and every internal
   check was satisfied the whole time. A ten-pack delivery logged as one passed
   every rule too.

   So this judges tonight against the OTHER NIGHTS. It is the plain version of
   what stock systems call exception reporting, and the textbook signal is
   exactly the one we hit: an item that normally sells, suddenly selling none,
   while the stock says it was there.

   THREE RULES, chosen so it stays quiet:
     - it never refuses anything and never changes a figure — Save day is
       untouched, and this is a question, not a verdict;
     - it says nothing at all until there are NIGHT_MIN_HISTORY real nights to
       compare against, because an opinion from thin history is a guess;
     - it only appears once the night is otherwise ready to save, so it cannot
       nag her halfway through typing.
   A blank is never evidence: a night is only comparable when BOTH of that
   sku's figures were actually entered.
   ============================================================ */
const NIGHT_MIN_HISTORY = 6;    // nights of real history before it has an opinion
const NIGHT_USUAL_SHARE = 0.7;  // "usually sells" = sold on this share of them
const NIGHT_LOW_BAND = 0.4;     // flag a total under this share of the usual
const NIGHT_HIGH_BAND = 2.5;    // ...or over this multiple of it

/** Dates in local state strictly before `date`, newest first. */
function nightsBefore(date, bag){
  return Object.keys(asObj(bag)).filter(d => isDateStr(d) && d < txt(date)).sort().reverse();
}

/** The most recent nights that really counted `sku`, newest first. */
function soldHistory(sku, date, want, dates){
  const out = [];
  for (const d of (dates || nightsBefore(date, state.counts))){
    if (out.length >= want) break;
    const row = asArr(asObj(state.counts)[d]).find(r => txt(asObj(r).sku) === txt(sku));
    if (!row) continue;
    // Neither figure may be missing: a night nobody finished counting says
    // nothing about whether this sku normally sells.
    if (isBlankVal(row.sod) || isBlankVal(row.eod)) continue;
    out.push({ date: d, sold: Math.max(0, num(row.sod) - num(row.eod)) });
  }
  return out;
}

/** The most recent OPEN nights' totals, newest first. A closed night is not a
 *  slow night and must not drag the usual figure down. */
function totalHistory(date, want){
  const out = [];
  for (const d of nightsBefore(date, state.days)){
    if (out.length >= want) break;
    const day = asObj(asObj(state.days)[d]);
    if (truthy(day.closed)) continue;
    const t = num(day.total);
    if (!(t > 0)) continue;
    out.push(t);
  }
  return out;
}

function medianOf(list){
  const a = asArr(list).slice().sort((x, y) => x - y);
  if (!a.length) return 0;
  const mid = a.length >> 1;
  return a.length % 2 ? a[mid] : r2((a[mid - 1] + a[mid]) / 2);
}

/** Plain sentences about how tonight sits against the nights before it. Empty
 *  when there is nothing worth saying — which should be most nights. */
function nightChecks(){
  const out = [];
  if (!isObj(benta) || benta.closed) return out;
  const date = txt(benta.date);
  if (!isDateStr(date)) return out;
  const countDates = nightsBefore(date, state.counts);
  const WANT = 10;

  for (const r of asArr(benta.rows)){
    const sku = txt(r.sku);
    const hist = soldHistory(sku, date, WANT, countDates);
    if (hist.length < NIGHT_MIN_HISTORY) continue;
    const soldNights = hist.filter(h => h.sold > 0).length;
    const usually = soldNights >= Math.ceil(NIGHT_USUAL_SHARE * hist.length);
    if (!usually) continue;
    const label = skuLabel(sku);

    // (1) NOT COUNTED AT ALL tonight, though it is normally counted. Both
    // figures blank is a legitimate "we did not sell it" — so this asks.
    if (isBlankVal(r.sod) && isBlankVal(r.eod)){
      out.push(label + ' has no counts tonight, though it was counted on ' + hist.length +
        ' of the last nights and sold on ' + soldNights + ' of them. If it really was not out tonight, leave it.');
      continue;
    }

    // (2) THE nori SIGNATURE: the stock was there, and none of it moved.
    const sod = num(r.sod), eod = num(r.eod);
    if (!isBlankVal(r.sod) && !isBlankVal(r.eod) && sod > 0 && sod - eod === 0){
      out.push(label + ': nothing sold tonight, though it sold on ' + soldNights + ' of the last ' +
        hist.length + ' nights. The end count says all ' + fmt(sod) +
        ' are still there — if that is right, leave it; if not, the end count is the figure to check.');
    }
  }

  // (3) A NIGHT'S TAKE far from the usual. Wide bands on purpose: this should
  // speak for a night that is genuinely unlike the others, not a quiet one.
  const totals = totalHistory(date, WANT);
  if (totals.length >= NIGHT_MIN_HISTORY){
    const usual = medianOf(totals);
    const c = computeDay(bentaPayload());
    const tonight = num(asObj(c).total);
    if (usual > 0 && tonight > 0){
      if (tonight < NIGHT_LOW_BAND * usual){
        out.push('Tonight comes to ' + peso(tonight) + ', where your last ' + totals.length +
          ' nights ran about ' + peso(usual) + '. That can simply be a slow night — but it is also what a ' +
          'missed count looks like.');
      } else if (tonight > NIGHT_HIGH_BAND * usual){
        out.push('Tonight comes to ' + peso(tonight) + ', well above the ' + peso(usual) +
          ' your last ' + totals.length + ' nights ran. Worth one look at the counts before saving.');
      }
    }
  }
  return out;
}

/** The card. Rendered ONLY when the night is otherwise ready to save, so it is
 *  the last thing read before Save day rather than a nag during entry. */
function nightCheckHTML(){
  const errs = validateBenta();
  if (Object.keys(errs).some(k => txt(errs[k]) !== '')) return '';
  const said = nightChecks();
  if (!said.length) return '';
  let h = '<div class="card attn-card"><p class="attn-head">' +
    (said.length === 1 ? 'One thing to check' : 'A few things to check') + '</p>';
  for (const line of said) h += '<p style="margin-top:8px;">' + esc(line) + '</p>';
  h += '<p class="hint" style="margin-top:10px;">Nothing here stops you saving — if the night really went like this, tap Save day.</p></div>';
  return h;
}

function validateBenta(){
  const errs = Object.create(null);
  // The DATE first, and before the closed-day return: the server refuses a
  // future or pre-2020 date on a closed day too (reqEntryDate runs before
  // anything else), and a partial year must never be committed either way.
  const dateBad = entryDateError(asObj(benta).date);
  if (dateBad) errs.date = dateBad;
  if (benta.closed) return errs;   // a closed day sends nothing else to validate

  for (const r of asArr(benta.rows)){
    // A sku that has left the Prices tab counts as a box here, exactly as it
    // renders: otherwise a loaded cheese count produces a complaint with no
    // stepper to fix it, and the day can never be saved again.
    const isBox = isBoxSku(r.sku);
    // The DAY's effective flag (the loaded row's snapshot, else the live flag) —
    // the same reading the card, the receipt and the payload use, and the same
    // precedence the server applies on a re-save. Judging by the live flag here
    // let the phone refuse a day the server accepts (a night saved while the
    // sku counted IN, reopened after it was excluded) and vice versa.
    const inCut = bentaRowInCutoff(r.sku);
    const key = 'sku:' + r.sku;
    const sod = num(r.sod), eod = num(r.eod);
    // The buckets AS SENT — sentBuckets(r), the same reading bentaPayload uses,
    // so this only ever complains about a figure that would really be sent. A
    // group=simple sku's cheese figure is not sent and has no stepper, so it is
    // not judged (the silent-zero rule); an EXCLUDED sku's buckets ARE sent
    // exactly as the row holds them, so a non-zero one — old money from before
    // the flag flipped — is refused below in the server's words, with the
    // stepper to fix it now on the card.
    const b = sentBuckets(r);
    const cheese = b.cheeseQty;
    const gcash = b.gcashQty;
    const gcashCheese = b.gcashCheeseQty;
    const sold = sod - eod;
    // The special order's boxes for this sku (v2.7.0), in the server's own
    // sentences and its own order: whole units, never negative, only from a box
    // sku that counts in the cutoff, and at most what sold. Its error slot is on
    // the custom-order card, where the stepper is.
    const label = skuLabel(r.sku);
    const cq = num(r.custom);
    const cboxKey = 'cbox:' + r.sku;
    if (!isWhole(cq)){
      errs[cboxKey] = label + ' special-order boxes must be a whole number (got "' + txt(r.custom) + '").';
    } else if (cq < 0){
      errs[cboxKey] = label + ': special-order boxes cannot be negative.';
    } else if (cq > 0){
      if (!inCut){
        errs[cboxKey] = label + ' is kept out of the cutoff and its money is settled separately, so a special order cannot use its boxes.';
      } else if (!isBox){
        errs[cboxKey] = label + ' is not a box, so a special order cannot use boxes from it.';
      } else if (cq > Math.max(0, sold)){
        errs[cboxKey] = label + ': the special order used ' + cq + ', but only ' + Math.max(0, sold) + ' were sold.';
      }
    }
    // The bound below judges PRICED sales only, so a valid special order shrinks
    // it — exactly apiSaveDay's guard, which never sees an invalid customQty
    // because it throws on those first.
    const customQty = (!errs[cboxKey] && cq > 0) ? cq : 0;
    // Given away or ruined (v2.10.1), in the server's own sentences and its own
    // order. Its error slot is on the sku card, under its own stepper.
    const fq = num(r.free);
    const freeKey = 'free:' + r.sku;
    if (!isWhole(fq)){
      errs[freeKey] = label + ': given away or ruined must be a whole number (got "' + txt(r.free) + '").';
    } else if (fq < 0){
      errs[freeKey] = label + ': given away or ruined cannot be negative.';
    } else if (fq > Math.max(0, sold) - customQty){
      errs[freeKey] = label + ': ' + fq + ' given away or ruined, but only ' +
        (Math.max(0, sold) - customQty) + ' left the tray' +
        (customQty > 0 ? ' after the special order took ' + customQty : '') +
        '. Lower it, or check the counts.';
    }
    const freeQty = (!errs[freeKey] && fq > 0) ? fq : 0;
    if (!isWhole(sod) || !isWhole(eod) || !isWhole(cheese) || !isWhole(gcash) || !isWhole(gcashCheese)){
      errs[key] = 'Use whole numbers only — half a box cannot be sold.';
    } else if (sod < 0 || eod < 0){
      errs[key] = 'The counts cannot be less than zero.';
    } else if (sold < 0){
      errs[key] = 'End of day is bigger than start of day. Please check.';
    } else if (cheese < 0 || gcash < 0 || gcashCheese < 0){
      errs[key] = 'The cheese and GCash counts cannot be less than zero.';
    // (There is no "this has no cheese version" complaint any more: on a
    // group=simple sku the cheese figures above are 0 by construction, because
    // nothing on the card can set them and the payload does not carry them.
    // The server still enforces the rule, which is where it belongs.)
    } else if (sold === 0 && (cheese > 0 || gcash > 0 || gcashCheese > 0)){
      // Nothing sold yet, so there is nothing to split. Blaming the buckets
      // ("can only go up to 0") points at the wrong field entirely.
      errs[key] = 'Enter Start of day and End of day first, then split the boxes.';
    } else if (cheese + gcash + gcashCheese > sold - customQty - freeQty){
      // The buckets describe PAID sales only, so the bound is sold minus the
      // special order's boxes (v2.7.0) and minus what was given away or ruined
      // (v2.10.1) — with neither, this is the guard it always was, word for
      // word, with the server's own clauses appended when there are any.
      const why = [];
      if (customQty > 0) why.push('the special order used ' + customQty);
      if (freeQty > 0) why.push(freeQty + ' were given away or ruined');
      errs[key] = 'Cheese (' + cheese + ') + GCash (' + gcash + ') + GCash cheese (' + gcashCheese +
        ') adds up to ' + (cheese + gcash + gcashCheese) + ', but only ' +
        (sold - customQty - freeQty) + ' were sold' +
        (why.length ? ' at menu price (' + why.join(', ') + ')' : '') +
        '. Lower one of them.';
    }
    // The two excluded-sku rules the server enforces, in the server's own words.
    // Checked last so an ordinary counting mistake is still reported first, but
    // never skipped: the server refuses the whole day over either of them, so a
    // phone that stayed quiet would queue work that cannot land.
    if (!errs[key] && !inCut){
      const bad = excludedRowError(r.sku, r);
      if (bad) errs[key] = bad;
    }
    // AN EMPTY END COUNT IS NOT A ZERO, and it is the one blank that INVENTS
    // money: every sum reads it as 0, so a start count of 55 with nothing in
    // the end box prices all 55 as sold — a night inflated by thousands while
    // the screen looks perfectly ordinary. The photo reader makes it reachable
    // (an unread figure is deliberately left blank), but typing reaches it too,
    // and the gate proved the paper card's warning is both dismissible and not
    // persisted — so the refusal has to live HERE, where Save day cannot get
    // past it. Checked LAST, so an ordinary counting mistake is still named
    // first; 0 is a real answer and always accepted (v2.9.0).
    if (!errs[key] && isBlankVal(r.eod) && !isBlankVal(r.sod) && num(r.sod) > 0){
      errs[key] = skuLabel(r.sku) + ': the end count is empty, so all ' + fmt(num(r.sod)) +
        ' would count as sold. Type what was left — 0 if the tray emptied.';
    }
  }

  const custom = num(benta.custom), customGcash = num(benta.customGcash);
  if (custom < 0) errs.custom = 'The custom order cannot be less than zero.';
  if (customGcash < 0) errs.customGcash = 'The GCash part cannot be less than zero.';
  else if (customGcash > custom){
    errs.customGcash = 'The GCash part (' + peso(customGcash) +
      ') cannot be more than the custom order (' + peso(custom) + ').';
  }

  // The conversion, in the server's own sentences. Each direction's bound is
  // the day's figure BEFORE the conversion — apiSaveDay checks after the
  // roll-up, so it is measured here the same way: the whole day recomputed
  // with the conversion at 0, whose cash/gcash are exactly those figures.
  const conv = num(benta.gcashConverted);
  if (conv < 0){
    errs.gcashConverted = 'The converted amount cannot be negative — pick the direction with the two buttons instead.';
  } else if (conv > 0){
    const base = computeDay(Object.assign(bentaPayload(), { gcashConverted: 0 }));
    if (benta.convDir === 'in'){
      if (conv > num(base.gcash)){
        errs.gcashConverted = 'The GCash taken out as cash (' + fmt(conv) +
          ") cannot be more than the day's GCash (" + fmt(base.gcash) + ').';
      }
    } else if (conv > num(base.cash)){
      errs.gcashConverted = 'The cash converted to GCash (' + fmt(conv) +
        ") cannot be more than the day's cash (" + fmt(base.cash) + ').';
    }
  }

  // Lid boxes (v2.7.0): a whole count, never negative — the server's words for
  // both. Blank means none and is fine.
  if (benta.lidBoxes !== '' && benta.lidBoxes != null){
    const lid = num(benta.lidBoxes);
    if (!isWhole(lid)) errs.lidBoxes = 'Lid boxes used must be a whole number (got "' + txt(benta.lidBoxes) + '").';
    else if (lid < 0) errs.lidBoxes = 'Lid boxes used cannot be negative.';
  }

  // The wage. Blank is fine (it means "the usual rate"); a negative one is not.
  if (benta.salary !== '' && benta.salary != null && num(benta.salary) < 0){
    errs.salary = 'The wage cannot be less than zero.';
  }

  for (const s of asArr(benta.stock)){
    const qty = num(s.qty);
    if (qty < 0) errs['stock:' + s.product] = 'This cannot be less than zero.';
    else if (!isWhole(qty)){
      // The server says the same thing in the same words: you open whole units.
      errs['stock:' + s.product] = s.product + ': count whole units opened (1, 2, 3), so "' +
        txt(s.qty) + '" is not a whole unit.';
    }
  }
  return errs;
}

/** 'sku:box4' -> 'err-sku-box4'; 'customGcash' -> 'err-customGcash'. One place,
 *  so the inline slots and the scroll-to-first-error always agree. */
function errSlotId(key){
  const i = String(key).indexOf(':');
  return i === -1 ? 'err-' + key : 'err-' + key.slice(0, i) + '-' + key.slice(i + 1);
}
function setErr(id, msg){
  const el = $(id);
  if (!el) return;
  if (msg){ el.textContent = msg; el.hidden = false; }
  else { el.hidden = true; }
}

function validateBentaLive(){
  const errs = validateBenta();
  setErr('err-date', errs.date);
  const daySnap = storedPricesFor(benta.date);
  for (const r of asArr(benta.rows)){
    setErr('err-sku-' + r.sku, errs['sku:' + r.sku]);
    setErr('err-cbox-' + r.sku, errs['cbox:' + r.sku]);
    setErr('err-free-' + r.sku, errs['free:' + r.sku]);
    const sold = num(r.sod) - num(r.eod);
    const badge = $('soldbadge-' + r.sku);
    if (badge) badge.classList.toggle('neg', sold < 0);
    const isBox = isBoxSku(r.sku);
    const split = $('split-' + r.sku);
    if (split){
      // Fall back to the same placeholder renderBenta drew the card from, so a
      // sku that has left the Prices tab keeps a line consistent with its own
      // Sold and Regular figures instead of freezing at stale numbers — and
      // priced at THIS DAY's stored prices AND classified by THIS DAY's stored
      // flag, same as the card itself.
      const pr = asArr(state.prices).find(p => isObj(p) && p.sku === r.sku)
        || { sku: r.sku, label: r.sku, group: isBox ? 'box' : 'simple', price: 0, cheese_price: 0 };
      split.textContent = skuSplitText(Object.assign({}, pr, priceOnDay(daySnap, pr),
        { in_cutoff: cutoffOnDay(daySnap, pr) }), r);
    }
  }
  setErr('err-custom', errs.custom);
  setErr('err-customGcash', errs.customGcash);
  setErr('err-gcashConverted', errs.gcashConverted);
  setErr('err-lidBoxes', errs.lidBoxes);
  setErr('err-salary', errs.salary);
  for (const s of asArr(benta.stock)) setErr('err-stock-' + s.product, errs['stock:' + s.product]);
  // "Does this night look right?" (v2.10.0) — recomputed as she types, and it
  // draws nothing at all while any complaint above is still outstanding.
  const nc = $('nightCheck');
  if (nc){
    try{ nc.innerHTML = nightCheckHTML(); }
    catch(err){ console.error(err); nc.innerHTML = ''; }
  }
  // THE CROSS-CHECK follows the figures (v2.9.0). It compares what the form now
  // adds up to against the total in Mama's own hand, so it has to be recomputed
  // on every edit — a gap he has just closed must stop saying it is open.
  updatePaperCross(errs);
  return errs;
}

function saveBenta(){
  const errs = validateBentaLive();
  if (Object.keys(errs).length){
    toast('Please fix the errors first.');
    const keys = Object.keys(errs);
    // EVERY collapsed card holding an error opens itself before the scroll — not
    // just the first error's card. A message inside a closed card is invisible,
    // and finding a second one only after fixing the first is a treasure hunt.
    if (keys.some(k => k.indexOf('stock:') === 0) && !benta.stockOpen) toggleCollapse('stock');
    if (errs.salary && !benta.wageOpen) toggleCollapse('wage');
    // The GCash card holds its own field (the converted cash) and the steppers
    // that fix any sku error involving a GCash figure — open it for either.
    if (!benta.gcashOpen && (errs.gcashConverted ||
        asArr(benta.rows).some(r => errs['sku:' + r.sku] && (num(r.gcash) > 0 || num(r.gcashCheese) > 0)))){
      toggleCollapse('gcash');
    }
    const el = $(errSlotId(keys[0]));
    if (el) el.scrollIntoView({ block:'center', behavior: prefersReduced() ? 'auto' : 'smooth' });
    return;
  }
  const p = bentaPayload();
  // A day with NO money on it still books that day's wage at the cutoff, and it
  // is usually a slip — Save day tapped before the counts went in, or a closed
  // day not marked closed. One plain question, then her word is final.
  if (!p.closed){
    const c = computeDay(p);
    if (c.total === 0 && c.excluded === 0){
      const wage = (p.salary === '' || p.salary == null) ? dailySalary() : Math.max(0, num(p.salary));
      const ask = wage > 0
        ? 'No sales are entered for ' + fmtShort(p.date) + ' yet, but saving it still adds the ' +
          peso(wage) + ' wage for the day. Save it anyway? If the stall did not open, use “Closed today” instead.'
        : 'No sales are entered for ' + fmtShort(p.date) + ' yet. Save it anyway?';
      if (!confirm(ask)) return;
    }
  }
  p.entryId = uuid();
  applyLocalDay(p);
  enqueue('saveDay', p);
  // The typed work is in the queue now, so the draft for this date has done its
  // job. (If the server refuses it, the needs-attention list takes over.)
  clearBentaDraft(p.date);
  // The reading described the figures BEFORE this save, and its card says in so
  // many words that nothing is saved yet — which stops being true here. The
  // photo LINK stays (it is on the day now, and the day says so); the review
  // card and the unconfirmed marker go (v2.9.0).
  paperClear(p.date);
  benta.fromPaper = false;
  // ...and the form holds nothing unsaved any more. Anything typed FROM HERE ON
  // — the tear-off runs ~450ms and the form stays fully editable under it —
  // flips this back to true, and the callback below then leaves the form alone.
  benta.dirty = false;
  persistState();
  const savedDate = p.date;
  tearReceipt(() => {
    // The receipt strip animated itself invisible; whichever branch runs, it
    // must come back.
    const wrap = $('receiptWrap');
    if (wrap) wrap.classList.remove('tearing');
    if (isObj(benta) && benta.date === savedDate && !benta.dirty){
      loadBentaForm(savedDate);
      renderPanel('benta');   // defers itself if she is typing in a field
    } else {
      // She kept working while the receipt tore off. Re-rendering now would
      // throw that typing away, so the form stays exactly as she has it.
      updateReceipt();
    }
    // The drain may already have come back with a refusal while the receipt was
    // tearing off, so ask before speaking — never let "Saved" be the last word
    // about a day the sheet does not have.
    const msg = daySavedMessage(savedDate);
    if (msg) toast(msg);
  });
  drainQueue().then(() => {
    // The day is safely away — a held-back update can go in now.
    if (typeof applyUpdateIfSafe === 'function') applyUpdateIfSafe();
  });
}

function prefersReduced(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function tearReceipt(done){
  const wrap = $('receiptWrap');
  if (!wrap || prefersReduced()){ done(); return; }
  let fired = false;
  const fin = () => { if (fired) return; fired = true; done(); };
  wrap.classList.add('tearing');
  wrap.addEventListener('animationend', fin, { once:true });
  setTimeout(fin, 650);
}

function bentaStep(sku, field, dir){
  const r = benta.rows.find(x => x.sku === sku);
  if (!r) return;
  // The v2.7.0 presentation steppers edit the buckets through their own map.
  if (UI_FIELDS[field]){ uiStep(r, field, dir); return; }
  const key = ROW_FIELDS[field];
  if (!key) return;
  let v = num(r[key]) + dir;
  if (v < 0) v = 0;
  // The special order's boxes come off what sold and only off what the buckets
  // have not already claimed — the server's bound, mirrored as a clamp here so
  // the stepper can never show a figure the save is about to refuse.
  if (key === 'custom'){
    const sold = Math.max(0, num(r.sod) - num(r.eod));
    const b = sentBuckets(r);
    const paid = b.cheeseQty + b.gcashQty + b.gcashCheeseQty;
    const room = Math.max(0, sold - paid);
    if (dir > 0 && sold === 0){
      toast('Enter Start of day and End of day first — the order’s boxes come off what sold.');
      v = 0;
    } else if (v > room){
      toast(room === sold
        ? 'The special order can only use up to ' + sold + ' — that is how many were sold.'
        : 'The special order can only use up to ' + room + ' — the other ' + (sold - room) +
          ' of the ' + sold + ' sold are already counted as cheese or GCash.');
      v = room;
    }
  }
  const bucket = BUCKETS.find(b => b.field === key);
  if (bucket){
    // A bucket can never claim more boxes than are still unlabelled: the three
    // of them plus the derived regular remainder must add up to sold, which is
    // exactly what the server enforces.
    const sold = Math.max(0, num(r.sod) - num(r.eod));
    const room = bucketRoom(r, sold, key, isBoxSku(sku));
    if (sold === 0){
      // The stepper looks broken here because nothing has sold yet. Say what to
      // do instead of blaming the bucket for a limit of 0.
      toast('Enter Start of day and End of day first, then split the boxes.');
      v = 0;
    } else if (v > room){
      toast(room === sold
        ? bucket.label + ' can only go up to ' + sold + ' — that is how many were sold.'
        : bucket.label + ' can only go up to ' + room + ' — the other ' + (sold - room) + ' of the ' + sold + ' sold are already counted.');
      v = room;
    }
  }
  r[key] = v;
  benta.dirty = true;
  const input = $('in-' + sku + '-' + field);
  if (input) input.value = v;
  afterCountChange(sku);
}

function afterCountChange(sku){
  const r = benta.rows.find(x => x.sku === sku);
  const soldEl = $('sold-' + sku);
  // soldVal, the same reading renderBenta drew the badge with, so the two can
  // never disagree about a row that is only half read (v2.9.0).
  if (soldEl && r) soldEl.textContent = soldVal(r);
  updateReceipt();
  validateBentaLive();   // also refreshes the derived "Regular (cash)" figure
}

/* ============================================================
   EXPENSES (gastos panel) — expenses for the current cutoff
   ============================================================ */
// An expense is MONEY ONLY (v2.6.0). The old optional "What arrived?" fields
// are gone: goods arriving are their own event — "Stock came in" under More →
// Stock on hand — because suppliers deliver on credit and the flour is not
// paid yet. Legacy rows that carry a quantity still display it in the list.
// `pick` is the one choice this form takes (v2.7.1, owner: "just retain the
// category"): 'Octopus' or 'Other' (the two category buckets entered here),
// or a picklist name (files as Supplies with that name as the item), or ''
// while nothing is chosen. The free-text "what did you buy" is GONE —
// quantities already enter under Stock on hand, so an expense needs only its
// bucket, amount and date. Mama, Electric and backlog payments keep their own
// doors on the Cutoff screen; the server still accepts every category.
/* PAID FROM (v2.12.0). Defaults to the tin because that is what actually
   happens on this screen — Mama buys the veggies and the octopus out of the
   same tin the night's cash goes into. One tap changes it, and the choice is
   remembered for the next entry so a run of tin purchases is one tap each. */
const PAID_FROM_CHOICES = [
  { key:'tin',   label:'From the tin' },
  { key:'gcash', label:'GCash' },
  { key:'own',   label:'My own money' }
];
let gx = { open:false, pick:'', amount:'', date:todayStr(), paidFrom:'tin' };
// The last expense that was dated OUTSIDE the cutoff being listed. It saved
// correctly but it cannot appear in this list, so it is named here instead of
// seeming to vanish. { label, item, amount, date }
let gxElsewhere = null;

// "July 16–31", with the year when it is not the current one.
function periodLabel(per){
  const s = d2parts(per.start), e = d2parts(per.end);
  const sameYear = s.y === d2parts(todayStr()).y;
  return monthName(per.start) + ' ' + s.d + '–' + e.d + (sameYear ? '' : ', ' + s.y);
}

function renderGastos(){
  const per = currentPeriod(todayStr());
  const items = Object.values(asObj(state.expenses)).filter(isObj)
    .filter(e => inPeriod(e.date, per))
    .sort((a,b) => (b.date + (b.updated_at||'')).localeCompare(a.date + (a.updated_at||'')));

  let h = '<div class="section-title" style="margin-top:4px;">Expenses this cutoff <span class="hint" style="font-weight:600;">(' +
    periodLabel(per) + ')</span></div>';

  // An expense dated into an earlier cutoff saves fine but cannot show up in
  // this list. Name it here so it never looks like it disappeared.
  if (gxElsewhere){
    h += '<div class="card" style="border-color:var(--accent);">' +
      '<p style="font-weight:600;">Saved to ' + esc(gxElsewhere.label) + '</p>' +
      '<p class="hint" style="margin-top:4px;">' + esc(gxElsewhere.item) + ' · ' + peso(gxElsewhere.amount) +
        ' on ' + esc(fmtShort(gxElsewhere.date)) + '. It belongs to that cutoff, so it is not in the list below.</p>' +
    '</div>';
  }

  // Add form (collapsible)
  if (!gx.open){
    h += '<button type="button" class="btn block" data-act="gastos-open">+ Add an expense</button>';
  } else {
    // ONE row of buckets (v2.7.1, owner: "just retain the category — octopus,
    // veggies, eggs, flour, box, other"). Octopus and Other are the two
    // category buckets entered on this screen; between them sit the usual
    // supplies from the Maintenance-editable picklist, each filing as
    // Supplies with its name as the item. No free text and no category chips:
    // the bucket IS the whole choice. A picklist name that collides with a
    // bucket name is not offered — the tap must map to exactly one thing.
    const plist = supplyPicklist().filter(n => n !== 'Octopus' && n !== 'Other');
    h += '<div class="card">';
    h += '<div class="field"><label>What is this money for?</label><div class="chips" role="group" aria-label="Expense bucket">';
    for (const b of ['Octopus', ...plist, 'Other']){
      // A picklist name is sheet data — escaped exactly once, everywhere it
      // lands in the markup (the attribute and the text).
      h += '<button type="button" class="chip" data-act="gastos-pick" data-pick="' + esc(b) + '" aria-pressed="' + String(gx.pick === b) + '">' + esc(b) + '</button>';
    }
    h += '</div>' +
      (gx.pick && gx.pick !== 'Octopus' && gx.pick !== 'Other'
        ? '<p class="hint" style="margin-top:8px;">Filed under Supplies.</p>' : '') +
      '<p class="hint" style="margin-top:8px;">Edit this list under More → Maintenance.</p>' +
      '<p class="err" id="err-gx-pick" hidden></p></div>';
    h += '<div class="field"><label for="gxAmount">How much? (₱)</label>' +
      '<input class="input money" id="gxAmount" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(gx.amount) + '">' +
      '<p class="err" id="err-gx-amount" hidden></p></div>';
    h += '<div class="field"><label>Where did the money come from?</label>' +
      '<div class="chips" role="group" aria-label="Where the money came from">';
    for (const c of PAID_FROM_CHOICES){
      h += '<button type="button" class="chip" data-act="gastos-paid" data-paid="' + c.key +
        '" aria-pressed="' + String(gx.paidFrom === c.key) + '">' + esc(c.label) + '</button>';
    }
    h += '</div><p class="hint" style="margin-top:8px;">The tin is what the night’s cash goes into. ' +
      'Marking it here is what lets the Cutoff screen say what should be left in it.</p></div>';
    h += '<div class="field"><label for="gxDate">Date</label>' +
      '<input class="input" type="date" id="gxDate" value="' + esc(gx.date) + '" max="' + todayStr() + '">' +
      '<p class="err" id="err-gx-date" hidden></p></div>';

    // The old "What arrived?" fields are GONE (v2.6.0): a delivery is not an
    // expense — it is goods arriving on credit, logged under More → Stock on
    // hand → "Stock came in". This form carries money only.
    h += '<p class="hint" style="margin-top:2px;">For a delivery arriving, use “Stock came in” under More → Stock on hand. This screen is for money leaving.</p>';

    h += '<div class="btn-row"><button type="button" class="btn" data-act="gastos-cancel">Close</button>' +
      '<button type="button" class="btn primary" data-act="gastos-submit">Add</button></div>';
    h += '</div>';
  }

  // Grouped list
  if (!items.length){
    h += '<div class="card" style="margin-top:14px;"><p class="hint" style="text-align:center; padding:8px 0;">No expenses yet this cutoff. Tap + to add one.</p></div>';
  } else {
    const groups = {};
    for (const e of items) (groups[e.date] = groups[e.date] || []).push(e);
    const dates = Object.keys(groups).sort().reverse();
    h += '<div style="margin-top:16px;">';
    for (const d of dates){
      const dayTotal = groups[d].reduce((s,e) => s + num(e.amount), 0);
      h += '<div class="gx-group"><div class="gx-group-head"><span class="d">' + fmtShort(d) + '</span><span class="t">' + peso(dayTotal) + '</span></div>';
      for (const e of groups[d]){
        h += '<div class="gx-item">' +
          '<span class="gx-cat">' + esc(e.category) + '</span>' +
          '<div class="gx-main"><div class="gx-name">' + esc(e.item || e.category) + '</div>' +
            (e.backlog_ref ? '<div class="gx-ref">→ ' + esc(e.backlog_ref) + '</div>' : '') +
            // A delivery says what arrived, so the quantity is never invisible.
            (e.stock_product && num(e.stock_qty) > 0
              ? '<div class="gx-ref">+ ' + esc(qtyWithUnit(e.stock_qty, stockUnitOf(e.stock_product))) +
                ' of ' + esc(e.stock_product) + '</div>' : '') + '</div>' +
          '<span class="gx-amt">' + peso(e.amount) + '</span>' +
          '<button type="button" class="icon-btn" data-act="gastos-del" data-id="' + esc(e.entry_id) + '" aria-label="Delete: ' + esc(e.item || e.category) + ' ' + peso(e.amount) + '">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 4h4M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg>' +
          '</button>' +
        '</div>';
      }
      h += '</div>';
    }
    h += '</div>';
  }
  $('panel-gastos').innerHTML = h;
}

function submitGasto(){
  let ok = true;
  // The bucket is the whole choice — nothing saves without one.
  const pickEl = $('err-gx-pick');
  if (!gx.pick){
    if (pickEl){ pickEl.textContent = 'Choose what this money was for.'; pickEl.hidden = false; }
    ok = false;
  } else if (pickEl) pickEl.hidden = true;
  // 'Octopus'/'Other' are category buckets with no item; any other pick is a
  // supply, filed as Supplies with the picked name as the item (v2.7.1).
  const isBucket = gx.pick === 'Octopus' || gx.pick === 'Other';
  // The DATE, in the server's own words: a half-edited year (a future day, or
  // "0002-…") files real money where nobody looks, so it is refused here the
  // same way the change handler refuses it — never only one of the two.
  const dateBad = entryDateError(gx.date);
  const dateEl = $('err-gx-date');
  if (dateBad){
    if (dateEl){ dateEl.textContent = dateBad; dateEl.hidden = false; }
    ok = false;
  } else if (dateEl) dateEl.hidden = true;
  const amtEl = $('err-gx-amount');
  if (!(num(gx.amount) > 0)){
    if (amtEl){ amtEl.textContent = 'Enter the amount.'; amtEl.hidden = false; }
    ok = false;
  } else if (amtEl) amtEl.hidden = true;
  if (!ok) return;
  // MONEY ONLY (v2.6.0): no stockProduct/stockQty on this payload, ever — the
  // server refuses an expense that names stock, pointing at "Stock came in".
  const payload = {
    date: gx.date || todayStr(),
    category: isBucket ? gx.pick : 'Supplies',
    item: isBucket ? '' : gx.pick,
    amount: num(gx.amount),
    backlogRef: '',
    notes: '',
    // Where the money came from (v2.12.0) — always sent from this screen, so
    // the tin figure never has to guess about a row SHE entered.
    paidFrom: gx.paidFrom === 'gcash' || gx.paidFrom === 'own' ? gx.paidFrom : 'tin',
    entryId: uuid()
  };
  applyLocalExpense(payload);
  enqueue('saveExpense', payload);
  persistState();
  const here = currentPeriod(todayStr());
  const itsPeriod = currentPeriod(payload.date);
  const elsewhere = !inPeriod(payload.date, here);
  // An earlier date belongs to an earlier cutoff, so it will not appear in the
  // list on this screen. Say exactly where it went instead of leaving her with
  // "No expenses yet this cutoff".
  gxElsewhere = elsewhere
    ? { label: periodLabel(itsPeriod), item: payload.item || payload.category, amount: payload.amount, date: payload.date }
    : null;
  // `pick` clears so the next tap is a fresh choice; the date is remembered so
  // a run of same-day entries types it once.
  gx = { open:true, pick:'', amount:'', date:gx.date, paidFrom:gx.paidFrom };
  renderGastos();
  toast(elsewhere ? 'Saved to ' + periodLabel(itsPeriod) + '.' : 'Expense added.');
  drainQueue();
}

function deleteGasto(id){
  const e = asObj(state.expenses)[id];
  if (!e) return;
  if (!confirm('Delete "' + (e.item || e.category) + '" (' + peso(e.amount) + ')?')) return;
  applyLocalDeleteExpense({ entryId:id });
  enqueue('deleteExpense', { entryId:id });
  persistState();
  renderGastos();
  toast('Expense deleted.');
  drainQueue();
}

/* ============================================================
   CUTOFF — period preview + note generation (API or demo-local)
   ============================================================ */
let cutoffPer = null;
let lastNote = null; // { key, text, demo }
// A backlog payment being entered on this screen: { ref, amount }.
let payBl = { ref:'', amount:'' };
// periodKey(), splitEdits, splitFieldAmount(), liveCutoff() and pendingSplit()
// all live with the period maths above — the cutoff FIGURES need them to find
// the split entered for a period, not just this screen.

// Days in this period that this phone has but the SHEET does not. The preview
// below counts them (they are real money she entered); a note generated by the
// server would not. Say so rather than letting the two disagree in silence.
// ONLY a refused saveDay counts: a 'gcash' entry is a day the sheet HOLDS whose
// split needs re-entering — informational, so it neither claims "not in the
// sheet" nor blocks the note — 'dropped' is a note about one sku, and a
// refused expense/stocktake/delivery is not a day at all (v2.6.0: a refused
// DELIVERY carries no money, yet it blocked the note with "the note would be
// short" while the server's own dryRun matched the preview to the peso).
function cutoffMissingDays(per){
  return asArr(attention).filter(a => a.kind === 'rejected' && a.action === 'saveDay' &&
    isDateStr(a.date) && inPeriod(a.date, per));
}
// MONEY in this period the phone and the sheet disagree about: a refused
// expense (the preview shows money the sheet lacks) or a refused deletion
// (the sheet still holds money the preview dropped). Either way the server's
// note and the figures above it would tell two stories, so the note waits.
// Stock actions are NEVER here — a delivery or a stocktake carries no money,
// so its refusal cannot make the note wrong; its red card is the whole story.
function cutoffMissingMoney(per){
  return asArr(attention).filter(a => a.kind === 'rejected' &&
    (a.action === 'saveExpense' || a.action === 'deleteExpense') &&
    isDateStr(a.date) && inPeriod(a.date, per));
}

/** Days in this period with NO entry at all — not saved, not marked closed,
 *  simply never opened (v2.7.6). This is the quiet way a cutoff comes out
 *  short: the note is built from the days that exist, so nine unlogged nights
 *  read as a lean fortnight rather than as missing work. A day marked CLOSED
 *  is entered — it says "the stall was dark", which is an answer. Never looks
 *  past today (the rest of the current period has not happened), and says
 *  nothing at all for a period this phone cannot fully see: guessing there
 *  would invent gaps out of history it simply does not hold. Advisory only —
 *  an unlogged day may be perfectly deliberate, so it never blocks the note.
 */
function missingDaysInPeriod(per){
  const p = asObj(per);
  if (!isDateStr(p.start) || !isDateStr(p.end)) return [];
  if (previewIncomplete(per)) return [];
  const today = todayStr();
  const last = p.end < today ? p.end : today;
  const out = [];
  for (let d = p.start; d <= last; d = addDays(d, 1)){
    if (!asObj(state.days)[d]) out.push(d);
  }
  return out;
}

/** Whether this phone can even SEE the whole of a period. The bootstrap
 *  snapshot covers a stated window; a period that starts before it may have
 *  days this phone has never held (or pruned), so the preview cannot promise
 *  to be the whole story — the note the SERVER generates always is, because it
 *  is computed from the full sheet. Demo mode has no window: the phone is the
 *  whole archive there. */
function previewIncomplete(per){
  const ws = txt(asObj(state).window_start);
  return !!config.apiUrl && isDateStr(ws) && txt(asObj(per).start) < ws;
}

/** The date a Cutoff-screen expense (a one-tap chip, a backlog payment) lands
 *  on: today when today is inside the period shown, the period's LAST day for
 *  an earlier cutoff — and NOTHING for a future one, because that would date
 *  real money into a day that has not happened and the server refuses it. */
function cutoffExpenseDate(per){
  const t = todayStr();
  if (inPeriod(t, per)) return t;
  if (txt(asObj(per).end) < t) return asObj(per).end;
  return '';
}

/** What the line under the Split field says. Saying plainly that the figure on
 *  screen is not the one saved is the whole reason the note refuses to be made
 *  while it differs — the user should never have to guess which figure counts. */
function splitHintText(per, f){
  if (pendingSplit(per)) return 'Not saved yet. Tap “Save this split” — the note is made from the saved amount.';
  return asObj(f).splitEntered
    ? 'Saved for this cutoff.'
    : 'The usual amount (' + peso(splitDefault()) + '). Change it for this cutoff only.';
}
/** What the residual MEANS, in words, under the figure. */
function residualNote(remaining){
  const r = num(remaining);
  if (r < 0) return 'This cutoff came up short. Nothing is left for the backlogs.';
  if (r === 0) return 'Nothing left over this cutoff.';
  return 'Left in the business — this is what backlog payments come out of.';
}

function renderCutoff(){
  if (!cutoffPer) cutoffPer = currentPeriod(todayStr());
  const per = cutoffPer;
  const f = computeCutoff(per);
  const s = d2parts(per.start), e = d2parts(per.end);
  const isCurrent = periodKey(per) === periodKey(currentPeriod(todayStr()));
  let h = '';
  const missingDays = cutoffMissingDays(per);
  if (missingDays.length){
    h += '<div class="card attn-card"><p class="attn-head">' +
      (missingDays.length === 1 ? '1 day is not in the sheet yet' : missingDays.length + ' days are not in the sheet yet') +
      '</p><p>' + esc(missingDays.map(a => fmtShort(a.date)).join(', ')) +
      '. The figures below include ' + (missingDays.length === 1 ? 'it' : 'them') +
      ', but the sheet does not — so fix ' + (missingDays.length === 1 ? 'it' : 'them') +
      ' on the Sales screen before you make the note.</p></div>';
  }
  const missingMoney = cutoffMissingMoney(per);
  if (missingMoney.length){
    const one = missingMoney.length === 1;
    h += '<div class="card attn-card"><p class="attn-head">' +
      (one ? 'An expense needs attention first' : missingMoney.length + ' expenses need attention first') +
      '</p><p>' + esc(missingMoney.map(a => fmtShort(a.date)).join(', ')) +
      '. The figures below and the sheet do not agree about ' + (one ? 'it' : 'them') +
      ' — fix ' + (one ? 'it' : 'them') + ' from the red card under More before you make the note.</p></div>';
  }

  // Days with nothing in them, and a period with no purchases at all: the two
  // silences that make a note wrong without anything looking wrong (v2.7.6).
  // TONIGHT IS NOT A GAP. It is separated out because saying "1 day has nothing
  // entered" about tonight, every single evening, is how the card stops being
  // read on the evening a night really IS missing — and because the server's
  // own costing already draws this line at yesterday (v2.9.2). Tonight keeps
  // both buttons: on the last night of a cutoff, "Was closed" is exactly the
  // tap he needs.
  const allBlanks = missingDaysInPeriod(per);
  const today = todayStr();
  const blanks = allBlanks.filter(d => d < today);
  const tonight = allBlanks.indexOf(today) !== -1 ? today : '';
  if (blanks.length){
    const one = blanks.length === 1;
    h += '<div class="card" style="border-color:var(--accent);">' +
      '<p style="font-weight:600;">' + (one ? '1 day has nothing entered' : blanks.length + ' days have nothing entered') + '</p>' +
      '<p class="hint" style="margin-top:4px;">The figures below are built from the days that ARE entered, so ' +
        (one ? 'this day is' : 'these days are') + ' simply missing from them. Enter ' + (one ? 'it' : 'them') +
        ', or say the stall was closed — either way the note stops guessing.</p>';
    for (const d of blanks.slice(0, 12)){
      h += '<div class="gx-item"><div class="gx-main"><div class="gx-name">' + esc(fmtShort(d)) + '</div></div>' +
        '<button type="button" class="btn small" data-act="cut-open-day" data-date="' + esc(d) + '">Enter it</button>' +
        '<button type="button" class="btn small" data-act="cut-closed-day" data-date="' + esc(d) + '">Was closed</button>' +
      '</div>';
    }
    if (blanks.length > 12) h += '<p class="hint" style="margin-top:8px;">…and ' + (blanks.length - 12) + ' more.</p>';
    h += '</div>';
  }
  if (tonight){
    // A reminder, in a different register from the warning above: nothing is
    // wrong yet, the night simply has not been entered.
    h += '<div class="card"><p class="hint">Tonight is not entered yet, so it is not in the figures below.</p>' +
      '<div class="gx-item"><div class="gx-main"><div class="gx-name">' + esc(fmtShort(tonight)) + '</div></div>' +
        '<button type="button" class="btn small" data-act="cut-open-day" data-date="' + esc(tonight) + '">Enter it</button>' +
        '<button type="button" class="btn small" data-act="cut-closed-day" data-date="' + esc(tonight) + '">Was closed</button>' +
      '</div></div>';
  }
  // The two categories that are PURCHASES. Mama's share and the electric bill
  // have their own one-tap chips a few cards down, and gating this on them let
  // one tap on a chip THIS SCREEN OFFERS switch off a warning about supplies and
  // octopus while both were still ₱0 (v2.9.2).
  if (!num(f.supplies) && !num(f.octopus)){
    h += '<div class="card"><p class="hint">No supplies and no octopus are logged in this cutoff yet. If that money has gone out, it is missing from every figure below.</p></div>';
  }

  h += '<div class="card"><div class="period-nav">' +
    '<button type="button" class="nav-btn" data-act="cutoff-prev" aria-label="Previous cutoff">‹</button>' +
    '<div class="p-label">' + monthName(per.start) + ' ' + s.d + ' – ' + e.d +
      '<span class="p-sub">' + (isCurrent ? 'This cutoff' : s.y) + '</span></div>' +
    '<button type="button" class="nav-btn" data-act="cutoff-next" aria-label="Next cutoff">›</button>' +
  '</div></div>';

  // A period that reaches further back than this phone can see. The preview
  // below is built from the days on this phone, so it may be missing money —
  // say so plainly, and say which figure to trust: the generated note is
  // computed by the server from the whole sheet, so it is the complete one.
  if (previewIncomplete(per)){
    h += '<div class="card" style="border-color:var(--accent);">' +
      '<p style="font-weight:600;">This phone cannot see the whole of this cutoff.</p>' +
      '<p class="hint" style="margin-top:4px;">It only keeps days from ' + esc(fmtShort(state.window_start)) +
        ', so the figures below may be missing earlier days. The note made with “Generate cutoff note” is ' +
        'worked out from the whole Google Sheet, so it is the complete one.</p>' +
    '</div>';
  }

  // The SPLIT is an entered amount now, so it gets a field of its own — pre-filled
  // with this period's saved figure, or the usual one when nothing is saved yet.
  // The residual below updates as it is typed.
  const key = periodKey(per);
  // What the field shows: whatever is being typed for this period, else the saved
  // figure. What the FIGURES show: liveCutoff, which reads a blank field as the
  // usual amount exactly as saveSplit() does — never as ₱0, which would swing
  // the residual by the whole split and flip its label.
  const typed = Object.prototype.hasOwnProperty.call(splitEdits, key) ? splitEdits[key] : null;
  const splitVal = typed == null ? f.split : typed;
  const live = liveCutoff(per);

  /* WHAT SHOULD BE IN THE TIN (v2.12.0). Its own card, below the settlement
     figures, because it answers a different question: not "how do we divide
     this" but "is the cash actually there before we divide it". Shown only once
     something has been marked as coming from the tin — until then it would be
     the day's cash restated under a new heading, which teaches nothing. */
  if (num(f.tinOut) > 0 || num(f.tinUnknown) > 0){
    h += '<div class="card">' +
      '<div class="pay-intro">What should be in the tin</div>' +
      '<div class="co-row"><span>Cash taken in</span><span class="v">' + peso(f.cash) + '</span></div>' +
      '<div class="co-row"><span>Paid out of the tin</span><span class="v">−' + peso(f.tinOut) + '</span></div>' +
      '<div class="r-sep" role="presentation"></div>' +
      '<div class="co-row big"><span>Should be left</span><span class="v">' + peso(f.tinExpected) + '</span></div>';
    if (num(f.tinUnknown) > 0){
      h += '<p class="hint" style="margin-top:8px;">' + esc(peso(f.tinUnknown)) +
        ' of this cutoff\'s payments do not say where the money came from, so it is NOT ' +
        'subtracted above. If any of it came out of the tin, the real figure is lower by that much. ' +
        'Payments entered on the Expenses screen say where they came from; the one-tap chips here do not yet.</p>';
    }
    h += '<p class="hint" style="margin-top:8px;">Count the tin before you collect it. ' +
      'A figure that does not match is worth finding tonight rather than next fortnight.</p>' +
    '</div>';
  }

  // Live local preview
  h += '<div class="card">' +
    '<div class="co-row big"><span>Total</span><span class="v">' + peso(f.total) + '</span></div>' +
    '<div class="co-sub">' + f.daysWithSales + (f.daysWithSales === 1 ? ' day with sales' : ' days with sales') +
      ' · ' + f.openDays + (f.openDays === 1 ? ' day open' : ' days open') + '</div>' +
    '<div class="r-sep" role="presentation"></div>' +
    '<div class="co-row"><span>Cash</span><span class="v">' + peso(f.cash) + '</span></div>' +
    '<div class="co-row gcash"><span>GCash</span><span class="v">' + peso(f.gcash) + '</span></div>' +
    '<div class="r-sep" role="presentation"></div>' +
    '<div class="co-row"><span>Mama</span><span class="v">' + peso(f.mama) + '</span></div>' +
    '<div class="co-row"><span>Split</span><span class="v" id="coSplit">' + peso(live.split) + '</span></div>' +
    '<div class="co-row"><span>Supplies</span><span class="v">' + peso(f.supplies) + '</span></div>' +
    '<div class="co-row"><span>Octopus</span><span class="v">' + peso(f.octopus) + '</span></div>' +
    '<div class="co-row"><span>Salary</span><span class="v">' + peso(f.salary) + '</span></div>' +
    '<div class="co-row"><span>Other payments</span><span class="v">' + peso(f.other) + '</span></div>' +
    '<div class="co-row"><span>Electric bill</span><span class="v">' + peso(f.electric) + '</span></div>' +
    '<div class="r-sep" role="presentation"></div>' +
    // The RESIDUAL: what is left in the business after everything, and what
    // backlog payments are paid out of. Its LABEL carries the sign, exactly like
    // the note — "Remaining" when there is something left, "Short" when there is
    // not. Never clamped to zero.
    '<div class="co-row split' + (live.remaining < 0 ? ' neg' : '') + '" id="coResidualRow">' +
      '<span id="coResidualLabel">' + (live.remaining < 0 ? 'Short' : 'Remaining') + '</span>' +
      '<span class="v" id="coResidual">' + peso(Math.abs(live.remaining)) + '</span></div>' +
    '<div class="co-sub" id="coResidualNote">' + esc(residualNote(live.remaining)) + '</div>' +
  '</div>';

  // The editable Split.
  h += '<div class="card">' +
    '<div class="field" style="margin-bottom:0;">' +
      '<label for="coSplitIn">Split for this cutoff (₱)</label>' +
      '<div class="split-row">' +
        '<input class="input money" id="coSplitIn" inputmode="decimal" autocomplete="off" placeholder="' +
          esc(fmt(splitDefault())) + '" value="' + esc(splitVal === '' ? '' : splitVal) + '">' +
        '<span class="split-each" id="coEach">' + peso(live.perPartner) + ' each</span>' +
      '</div>' +
      '<p class="hint" style="margin-top:8px;" id="coSplitHint">' + esc(splitHintText(per, f)) + '</p>' +
      '<p class="err" id="err-split" hidden></p>' +
      '<button type="button" class="btn block" data-act="split-save" id="splitBtn" style="margin-top:10px;">Save this split</button>' +
    '</div>' +
  '</div>';

  // Paying a backlog out of what is left. It is an ordinary Backlog expense —
  // that is what "Other payments" on the note is made of — but it belongs here,
  // beside the figure it comes out of.
  const activeBl = asArr(state.backlogs).filter(b => isObj(b) && truthy(b.active));
  h += '<div class="section-title">Pay a backlog</div><div class="card">';
  if (!activeBl.length){
    h += '<p class="hint">No active backlogs. Add them in the Backlogs tab of the Google Sheet.</p>';
  } else {
    h += '<p class="hint" style="margin-bottom:12px;">Paid out of what is left (' +
      esc(live.remaining < 0 ? 'nothing this cutoff — it is short ' + peso(-live.remaining)
                             : peso(live.remaining) + ' remaining') +
      '). It is logged as an expense and shows on the note under “Other payments”.</p>' +
      '<div class="field"><label for="payBlRef">Which backlog?</label><select class="input" id="payBlRef">' +
        '<option value=""' + (payBl.ref === '' ? ' selected' : '') + '>Choose…</option>' +
        activeBl.map(b => '<option value="' + esc(b.name) + '"' + (payBl.ref === b.name ? ' selected' : '') + '>' +
          esc(b.name) + ' — balance ' + peso(backlogBalance(b)) + '</option>').join('') +
      '</select></div>' +
      '<div class="field"><label for="payBlAmount">How much? (₱)</label>' +
        '<input class="input money" id="payBlAmount" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(payBl.amount) + '">' +
        '<p class="err" id="err-paybl" hidden></p></div>' +
      '<button type="button" class="btn block" data-act="pay-backlog">Log this payment</button>';
  }
  h += '</div>';

  // Suggested fixed expenses (one tap)
  const mamaAmt = num(asObj(state.settings).mama_per_cutoff);
  const elecAmt = num(asObj(state.settings).electric_per_cutoff);
  const sugg = [];
  if (f.mama === 0 && mamaAmt > 0) sugg.push({ cat:'Mama', item:'Mama', amount:mamaAmt });
  if (f.electric === 0 && elecAmt > 0) sugg.push({ cat:'Electric', item:'Electric bill', amount:elecAmt });
  if (sugg.length){
    h += '<div class="card"><p style="font-weight:600; margin-bottom:10px;">These fixed expenses are not logged yet:</p><div class="chips">';
    for (const sg of sugg){
      h += '<button type="button" class="chip" data-act="cutoff-suggest" data-cat="' + sg.cat + '" data-item="' + esc(sg.item) + '" data-amt="' + sg.amount + '">+ ' + sg.cat + ' ' + peso(sg.amount) + '</button>';
    }
    h += '</div></div>';
  }

  h += '<button type="button" class="btn primary block" data-act="cutoff-generate" id="genBtn">Generate cutoff note</button>';

  if (lastNote && lastNote.key === periodKey(per)){
    // Hidden the moment the Split field stops agreeing with what is saved: this
    // note was built from the SAVED figure, so leaving it on screen under a
    // preview that now says something else is the same contradiction generateNote
    // refuses to create. updateSplitLive un-hides it if she types the figure back.
    h += '<div id="noteBlock" style="margin-top:14px;"' + (pendingSplit(per) ? ' hidden' : '') + '>' +
      (lastNote.demo ? '<p class="hint" style="margin-bottom:8px;">Demo — this was not saved to the sheet.</p>'
                     : '<p class="ok-note" style="margin-bottom:8px;">✓ Saved to the Cutoffs tab of the sheet.</p>') +
      '<pre class="note-pre" id="notePre">' + esc(lastNote.text) + '</pre>' +
      '<div class="btn-row">' +
        '<button type="button" class="btn" data-act="copy-note">Copy</button>' +
        (navigator.share ? '<button type="button" class="btn" data-act="share-note">Share</button>' : '') +
      '</div>' +
    '</div>';
  }

  // BELOW the note, and outside it in every sense: the money this cutoff does not
  // count. Nothing above depends on it and the note does not mention it.
  h += excludedBlockHTML(f);

  // And the period's stock movements — the owner's paper "Last Cutoff supplies
  // count", computed instead of counted by hand (v2.7.4). No money, no figure
  // above depends on it.
  h += stockCutoffHTML(per);

  $('panel-cutoff').innerHTML = h;
}

/** The period's stock story, per product: what came in, what was opened, and
 *  the latest stocktake inside the period — all from rows this phone holds
 *  (deliveries, legacy expense-attached arrivals, usage, counts). Display
 *  only. A period this phone cannot fully see (older than window_start) shows
 *  NOTHING rather than partial sums dressed as truth — same rule the money
 *  preview follows. Products with no movement are left out, not zero-padded. */
function stockCutoffHTML(per){
  if (previewIncomplete(per)) return '';
  const items = activeStockItems();
  if (!items.length) return '';
  const rows = [];
  for (const it of items){
    const product = txt(asObj(it).product);
    let arrived = 0, opened = 0, counted = null;
    const dlv = asObj(state.stockDeliveries);
    for (const d in dlv){
      if (!inPeriod(d, per)) continue;
      for (const r of asArr(dlv[d])) if (txt(asObj(r).product) === product) arrived += num(asObj(r).qty);
    }
    const exps = asObj(state.expenses);
    for (const id in exps){
      const e = asObj(exps[id]);
      if (txt(e.stock_product) === product && inPeriod(txt(e.date), per)) arrived += num(e.stock_qty);
    }
    const usage = asObj(state.stockUsage);
    for (const d in usage){
      if (!inPeriod(d, per)) continue;
      for (const r of asArr(usage[d])) if (txt(asObj(r).product) === product) opened += num(asObj(r).qty);
    }
    const cnts = asObj(state.stockCounts);
    for (const d in cnts){
      if (!inPeriod(d, per)) continue;
      for (const r of asArr(cnts[d])){
        const c = asObj(r);
        if (txt(c.product) !== product) continue;
        if (!counted || d > counted.date ||
            (d === counted.date && txt(c.updated_at) >= counted.updated_at)){
          counted = { date: d, qty: num(c.counted_qty), updated_at: txt(c.updated_at) };
        }
      }
    }
    if (arrived || opened || counted) rows.push({ product, unit: txt(asObj(it).unit), arrived, opened, counted });
  }
  if (!rows.length) return '';
  let h = '<div class="section-title">Stock this cutoff</div><div class="card">' +
    '<p class="hint" style="margin-bottom:10px;">Counted from what was logged — the paper supplies count, done for you. No money in it, and it is in no figure above.</p>';
  for (const r of rows){
    const bits = [];
    if (r.arrived) bits.push(qtyWithUnit(r.arrived, r.unit) + ' came in');
    if (r.opened) bits.push(qtyWithUnit(r.opened, r.unit) + ' opened');
    h += '<div class="co-row"><span>' + esc(r.product) +
      (r.counted ? '<span class="hint"> · counted ' + esc(qtyWithUnit(r.counted.qty, r.unit)) +
        ' on ' + esc(fmtShort(r.counted.date)) + '</span>' : '') + '</span>' +
      '<span class="v">' + esc(bits.join(', ') || '—') + '</span></div>';
  }
  return h + '</div>';
}

/** The period's EXCLUDED money — nori, and anything else the owner keeps out of
 *  the cutoff. Its own block, below the note, labelled so it cannot be mistaken
 *  for part of either: it is in NO figure above it and in NO line of the note.
 *  Nothing sold, nothing shown — a block of zeroes would only be noise. */
function excludedBlockHTML(f){
  const lines = asArr(asObj(f).excludedLines);
  if (!lines.length) return '';
  let h = '<div class="section-title">Not part of this cutoff</div>' +
    '<div class="card excl-card">' +
    '<p class="hint" style="margin-bottom:10px;">This money is NOT in the figures above and NOT in the note. ' +
      'It is sold and counted, and you settle it yourself.</p>';
  for (const l of lines){
    h += '<div class="co-row"><span>' + esc(txt(l.label) || txt(l.sku)) + ' × ' + num(l.qty) +
      '</span><span class="v">' + peso(l.amount) + '</span></div>';
  }
  h += '<div class="sum-row"><span>Total kept out</span><b>' + peso(asObj(f).excluded) + '</b></div>' +
  '</div>';
  return h;
}

async function generateNote(){
  const per = cutoffPer;
  const btn = $('genBtn');
  // A Split typed but not saved is NOT in the note: the note is built from the
  // saved figure (the server reads CutoffInputs, and buildNote reads the same
  // row), so generating one now would print a Split — and a residual — that
  // contradict the figures printed directly above it. Refuse, and say what to
  // tap. Checked before either path: the offline copy is built the same way.
  const pend = pendingSplit(per);
  if (pend){
    setErr('err-split', 'This split is not saved yet. Tap “Save this split”, then make the note.');
    toast('Save the split first (' + peso(pend.amount) + '), then make the note.');
    const el = $('err-split');
    if (el) el.scrollIntoView({ block:'center', behavior: prefersReduced() ? 'auto' : 'smooth' });
    return;
  }
  if (btn){ btn.disabled = true; btn.textContent = 'Generating…'; }
  if (config.apiUrl && navigator.onLine){
    try{
      await drainQueue(); // make sure the note covers everything we've entered
      // drainQueue no-ops when a drain is already running and leaves items
      // queued after a failure — never archive an incomplete note.
      if (queue.length || syncing){
        toast('Some entries are not synced yet. Sync first, then make the note.');
        renderCutoff(); // restores the Generate button
        return;
      }
      // A day the server REFUSED is not in the queue any more, so the queue
      // check above cannot see it — and the note the server builds would be
      // short by that whole day. Never archive money that is missing.
      const missing = cutoffMissingDays(per);
      if (missing.length){
        toast(fmtShort(missing[0].date) + ' is not in the sheet, so the note would be short. Fix it on the Sales screen first.');
        renderCutoff();
        return;
      }
      // Same stop for money the sheet and the preview disagree about — a
      // refused expense or deletion. NOT for refused stock work: a delivery
      // or a stocktake carries no money, so the note is provably unaffected.
      const missingMoney = cutoffMissingMoney(per);
      if (missingMoney.length){
        toast('An expense from ' + fmtShort(missingMoney[0].date) + ' has not reached the sheet, so the note would be wrong. Fix it from the red card under More first.');
        renderCutoff();
        return;
      }
      // Request keys stay camelCase (dryRun); the reply is snake_case
      // (note_text) — older deployments answered noteText, so accept both.
      const data = await api('cutoff', { start:per.start, end:per.end, dryRun:false });
      const served = isObj(data) ? txt(pick(data, 'note_text', 'noteText')) : '';
      lastNote = { key:periodKey(per), text: served || buildNote(computeCutoff(per), per), demo:false };
      renderCutoff();
      return;
    }catch(err){
      console.error(err);
      // The server REFUSED the note (a negative category, an unsaved split —
      // things that make the note itself a lie). Show its sentence and STOP
      // (v2.5.1): the phone's own copy would contain exactly the line the
      // refusal exists to prevent, so "falling back" to it converts the
      // refusal into the bad artifact. No note, no Copy, no Share.
      if (err && err.server){
        toast(err.message);
        renderCutoff();
        return;
      }
      // The phone's own copy of a period it cannot fully see would be SHORT —
      // real money missing from a note that looks finished. Refuse it; only the
      // server can build this one.
      if (previewIncomplete(per)){
        toast(friendlyError(err, 'Please try again in a moment.') +
          ' This phone cannot see the whole of this cutoff, so the note must come from the sheet.');
        renderCutoff();
        return;
      }
      toast(friendlyError(err, 'Please try again in a moment.') + ' Showing the copy from this phone.');
    }
  }
  // Offline (or no API yet) with an incomplete view: same refusal, same reason.
  if (previewIncomplete(per)){
    toast('This phone cannot see the whole of this cutoff. Connect to the internet and try again — the note must be made from the whole sheet.');
    renderCutoff();
    return;
  }
  // Every locally-built note — demo mode, or the copy shown after a network
  // failure — applies the refusals the server would apply, in its words
  // (v2.5.1). A negative category refuses the local note exactly as it refuses
  // the real one; without this, demo mode happily printed "Supplies - -400".
  const refused = noteRefusal(per);
  if (refused){
    toast(refused);
    renderCutoff();
    return;
  }
  lastNote = { key:periodKey(per), text:buildNote(computeCutoff(per), per), demo:true };
  renderCutoff();
}

async function copyNote(){
  if (!lastNote) return;
  try{
    await navigator.clipboard.writeText(lastNote.text);
    toast('Note copied.');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = lastNote.text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); toast('Note copied.'); }
    catch(e2){ toast('Could not copy. Select the text instead.'); }
    ta.remove();
  }
}
async function shareNote(){
  if (!lastNote || !navigator.share) return;
  try{ await navigator.share({ text:lastNote.text }); }catch(e){ /* user cancelled */ }
}

/* ---- The editable Split: live residual, then a queued save ---- */
// Only the four figures the split moves are touched, so the keyboard stays up
// and nothing else on the screen flickers while she types.
function updateSplitLive(){
  if (!cutoffPer) return;
  const key = periodKey(cutoffPer);
  const raw = Object.prototype.hasOwnProperty.call(splitEdits, key) ? splitEdits[key] : '';
  // The one reading of the field, shared with renderCutoff and the note guard:
  // blank means the usual amount, so what is shown is what a save would write.
  const f = computeCutoff(cutoffPer);
  const live = liveCutoff(cutoffPer);
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set('coSplit', peso(live.split));
  set('coEach', peso(live.perPartner) + ' each');
  set('coResidualLabel', live.remaining < 0 ? 'Short' : 'Remaining');
  set('coResidual', peso(Math.abs(live.remaining)));
  set('coResidualNote', residualNote(live.remaining));
  set('coSplitHint', splitHintText(cutoffPer, f));
  const row = $('coResidualRow');
  if (row) row.classList.toggle('neg', live.remaining < 0);
  // A note already on screen was built from the SAVED split. While the field
  // disagrees with it, take it off the screen rather than let it sit under
  // figures that now say something else. (Hidden, not re-rendered: a re-render
  // here would close the keyboard mid-figure.)
  const block = $('noteBlock');
  if (block) block.hidden = !!pendingSplit(cutoffPer);
  setErr('err-split', num(raw) < 0 ? 'The split cannot be less than zero.' : '');
}

function saveSplit(){
  const per = cutoffPer;
  const key = periodKey(per);
  const raw = Object.prototype.hasOwnProperty.call(splitEdits, key) ? splitEdits[key] : '';
  // The same reading the preview uses, so the figure saved is the figure shown.
  const amount = splitFieldAmount(raw);
  if (amount < 0){ setErr('err-split', 'The split cannot be less than zero.'); return; }
  // Re-use the entry_id of the row already saved for this period, so re-entering
  // the figure rewrites ONE row (the sheet upserts by (start, end) as well) and
  // the queue keeps just one item for it.
  const existing = asObj(state.cutoffInputs)[key];
  const payload = {
    start: per.start, end: per.end, amount: r2(amount),
    entryId: txt(asObj(existing).entry_id) || uuid()
  };
  applyLocalCutoffSplit(payload);
  enqueue('saveCutoffSplit', payload);
  delete splitEdits[key];
  persistState();
  renderCutoff();
  toast('Split saved: ' + peso(amount) + ' (' + peso(r2(amount / 2)) + ' each).');
  drainQueue();
}

/* ---- Paying a backlog, from the screen that shows what is left to pay it with.
   It is an ordinary Expenses row of category Backlog — the same thing the
   Expenses screen writes — so "Other payments" on the note picks it up. ---- */
function payBacklog(){
  const amount = num(payBl.amount);
  const err = $('err-paybl');
  if (!payBl.ref){
    if (err){ err.textContent = 'Choose which backlog you paid.'; err.hidden = false; }
    return;
  }
  if (!(amount > 0)){
    if (err){ err.textContent = 'Enter how much you paid.'; err.hidden = false; }
    return;
  }
  const bl = asArr(state.backlogs).find(b => isObj(b) && b.name === payBl.ref);
  const balance = bl ? backlogBalance(bl) : 0;
  if (bl && amount > balance &&
      !confirm('That is more than the ' + peso(balance) + ' still owed on ' + payBl.ref + '. Log it anyway?')) return;
  if (err) err.hidden = true;
  // Dated today when today is inside the period being shown, else the period's
  // last day, so the payment lands in the cutoff it is being paid for. A FUTURE
  // cutoff has no valid day yet — dating money into a day that has not happened
  // is exactly what the server refuses.
  const date = cutoffExpenseDate(cutoffPer);
  if (!date){
    toast('This cutoff has not started yet, so a payment cannot be dated into it. Go back to the current cutoff first.');
    return;
  }
  const payload = { date, category:'Backlog', item:'Backlog payment', amount:r2(amount),
    backlogRef: payBl.ref, notes:'', entryId: uuid() };
  applyLocalExpense(payload);
  enqueue('saveExpense', payload);
  persistState();
  const name = payBl.ref;
  payBl = { ref:'', amount:'' };
  renderCutoff();
  toast('Paid ' + peso(amount) + ' on ' + name + '.');
  drainQueue();
}

function addSuggestedExpense(cat, item, amount){
  // Same date rule as payBacklog: today inside the period, the last day of an
  // earlier one — and NEVER a day that has not happened yet. The one-tap chip
  // used to date Mama/Electric into the future when the arrows sat on a
  // not-yet-started cutoff, and the server refuses a future date outright.
  const date = cutoffExpenseDate(cutoffPer);
  if (!date){
    toast('This cutoff has not started yet, so this cannot be added to it now.');
    return;
  }
  const payload = { date, category:cat, item, amount:num(amount), backlogRef:'', notes:'',
    entryId:uuid() };
  applyLocalExpense(payload);
  enqueue('saveExpense', payload);
  persistState();
  renderCutoff();
  toast('Added: ' + cat + ' ' + peso(amount));
  drainQueue();
}

    (config.apiUrl

    '<div class="field"><label for="cfgUrl">Apps Script Web App URL</label>' +

  '</div>';

  // The photo reader (v2.9.0) — its OWN section, deliberately not squeezed in
  // beside the sheet's URL and token. It is a DIFFERENT deployment holding a
  // DIFFERENT secret, and the one mistake worth designing against here is
  // pasting the sheet's token into it: that token writes money, and a

  const visionHalf = !visionReady() && !!(txt(config.visionUrl) || txt(config.visionToken));
  h += '<div class="section-title">Read it from the paper</div><div class="card">' +
    '<p class="hint" style="margin-bottom:12px;">A second Apps Script deployment — “Octogo Vision” — reads a photo of the night’s page and fills the Sales form in for you to check. It has its own web app URL and its own token. Leave these blank and the feature does not appear.</p>' +
    '<div class="field"><label for="cfgVisionUrl">Photo reader Web App URL</label>' +
      '<input class="input" id="cfgVisionUrl" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(config.visionUrl) + '"></div>' +
    '<div class="field"><label for="cfgVisionToken">Photo reader token — its own, never the sheet’s</label>' +
      '<input class="input" id="cfgVisionToken" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(config.visionToken) + '">' +
      '<p class="hint" style="margin-top:6px;">This is the VISION_TOKEN from the Octogo Vision project, not the token above.</p></div>' +
    (visionHalf ? '<p class="hint" style="margin-bottom:10px;">Both the URL and the token are needed before the button appears on the Sales screen.</p>' : '') +

    '<p class="hint" style="margin-top:8px;">Testing costs nothing — it asks the reader whether it is set up and never sends a photo.</p>' +

  '</div>';

  // Backlogs
  h += '<div class="section-title">Backlogs</div><div class="card">';

    h += '<p class="hint">No active backlogs. Add them in the Backlogs tab of the Google Sheet.</p>';

    const owed = bls.reduce((s, b) => s + backlogBalance(b), 0);

  h += maintenanceHTML();
